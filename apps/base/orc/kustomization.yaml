# ORC — openstack-resource-controller v2.4.0 (install.yaml upstream, vendu tel quel).
#
# DÉPENDANCE DURE de CAPO ≥ v0.11 : le contrôleur OpenStack watch les ressources
# openstack.k-orc.cloud (kind Image en particulier) et refuse de démarrer ses
# watchers sans ces CRDs ("no matches for kind Image in version
# openstack.k-orc.cloud/v1alpha1") → aucun OpenStackCluster ne provisionne.
# Version épinglée sur celle du go.mod de CAPO v0.14.4 (k-orc/…/v2 v2.4.0).
# Régénérer : curl -sL https://github.com/k-orc/openstack-resource-controller/releases/download/v2.4.0/install.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - install.yaml
