apiVersion: v1
kind: Namespace
metadata:
  name: foundation-databases
  labels:
    # PAS de istio.io/dataplane-mode: ambient — couche données (CNPG).
    # En ambient, ztunnel reprend les probes du kubelet et les ré-émet depuis
    # 169.254.7.127 vers le port instance-manager CNPG (:8000) → bloqué par la
    # CiliumNetworkPolicy → startup probe timeout → l'instance Postgres ne passe
    # jamais Ready ("Waiting for instances to become active"), alors que la DB
    # tourne. Un opérateur de DB (réplication propre, accès direct/CNPG) n'a pas
    # sa place dans le mesh. Même raison que la fondation PKI/secrets.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "cnpg"
