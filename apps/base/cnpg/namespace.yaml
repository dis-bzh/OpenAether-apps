apiVersion: v1
kind: Namespace
metadata:
  name: foundation-databases
  labels:
    # NO istio.io/dataplane-mode: ambient — the data layer (CNPG).
    # Under ambient, ztunnel takes over the kubelet probes and re-emits them
    # from 169.254.7.127 to CNPG's instance-manager port (:8000) → blocked by
    # CiliumNetworkPolicy → startup probe timeout → l'instance Postgres ne passe
    # never Ready ("Waiting for instances to become active") while the DB is
    # running. A DB operator (its own replication, direct/CNPG access) has no
    # place in the mesh. Same reason as the PKI/secrets foundation.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "cnpg"
