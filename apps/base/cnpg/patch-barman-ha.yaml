# Two Barman Cloud plugin replicas, spread over hosts and zones (lab 25, D3). The CNPG operator asks the plugin for its
# identity at every reconcile of a Cluster that uses it, and while the plugin is unreachable it never reaches the
# failover: one plugin pod in the zone that was powered off left every plugin-backed database without a primary for
# 388-402 s (zero acknowledged commit lost), 81-89 s with a second pod outside the zone. The binary elects a leader
# (--leader-elect) and both pods answer on :9090 behind the Service, so the standby is usable at once. RollingUpdate,
# not the vendored Recreate: a rollout must not take both pods away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: barman-cloud
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: barman-cloud
      # Same 30 s as the database pods: the 300 s default would keep a dead node's plugin pod "running" for 5 minutes.
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
