# S3 credentials for the CNPG PITR store (Barman Cloud plugin).
#
# The same destination as the restic repositories and the Longhorn volume
# backups (`secret/backup/s3-primary` in OpenBao, seeded by the operator — see
# docs/admin-access.md § 3). One destination to seed for all three backup
# mechanisms.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
---
# The replica store's own key pair (backup/s3-replica, infra #368), read by the replica ObjectStores for a recovery from
# the replica store. Never the primary pair: a leak of one store's key must not open the other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3-replica
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backup-s3-replica
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: backup/s3-replica, property: access_key }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: backup/s3-replica, property: secret_key }
