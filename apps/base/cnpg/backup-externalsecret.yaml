# Credentials S3 du PITR CNPG (barmanObjectStore).
#
# Même destination que les dépôts restic et les backups de volumes Longhorn
# (`secret/backup/s3-primary` dans OpenBao, seedée par l'opérateur — cf.
# docs/admin-access.md § 3). Une seule destination à seeder pour les trois
# mécanismes de sauvegarde.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
