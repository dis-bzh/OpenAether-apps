# S3 credentials for the CNPG PITR store (barmanObjectStore).
#
# The same destination as the restic repositories and the Longhorn volume
# backups (`secret/backup/s3-primary` in OpenBao, seeded by the operator — see
# docs/admin-access.md § 3). One destination to seed for all three backup
# mechanisms.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
