# BASE backups, the indispensable complement to WAL archiving.
#
# `barmanObjectStore` archives WAL continuously, but a WAL can only be replayed
# from a base backup: without these ScheduledBackups the destination fills up
# with unusable archives. It is the pair that delivers PITR.
#
# ⚠️ CNPG's `schedule` IS NOT a Kubernetes cron: it carries a leading SECONDS
# field (robfig/cron format, 6 fields). Verified in the vendored CRD
# (cnpg-1.23.1.yaml). Written with 5 fields it would shift by one — the hour read
# comme des minutes.
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-daily
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  # 03:10, offset from the restic CronJobs (02:17 / 02:47) so as not to stack S3
  # writes or disk load at the same moment.
  schedule: "0 10 3 * * *"
  backupOwnerReference: self
  cluster:
    name: zitadel-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-db-daily
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  schedule: "0 25 3 * * *"
  backupOwnerReference: self
  cluster:
    name: grafana-db
