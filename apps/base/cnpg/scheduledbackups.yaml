# BASE backups, the indispensable complement to WAL archiving.
#
# The Barman Cloud plugin archives WAL continuously, but a WAL can only be replayed
# from a base backup: without these ScheduledBackups the destination fills up
# with unusable archives. It is the pair that delivers PITR.
#
# ⚠️ CNPG's `schedule` IS NOT a Kubernetes cron: it carries a leading SECONDS
# field (robfig/cron format, 6 fields). Verified in the vendored CRD
# (cnpg-1.30.1.yaml). Written with 5 fields it would shift by one — the hour read
# as minutes.
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-daily
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  # 03:10, offset from the restic CronJobs (02:17 / 02:47) so as not to stack S3
  # writes or disk load at the same moment.
  # `immediate: true`: one base backup when the object is CREATED, not on an update of an existing one
  # (docs/forgejo.md, "taken at enablement"); the cron schedule is unchanged and this stays the only ScheduledBackup.
  immediate: true
  schedule: "0 10 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: zitadel-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-db-daily
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cnpg
spec:
  immediate: true
  schedule: "0 25 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: grafana-db
