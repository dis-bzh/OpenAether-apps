# OpenAether 0.5.0 Sprint C — ExternalSecret grafana-db-credentials (foundation-databases)
# CNPG's bootstrap.initdb.secret must be in the same namespace as the Cluster.
# The services-observability version lives in apps/base/observability/externalsecrets-grafana.yaml.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
    template:
      data:
        username: "grafana"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana/db
        property: password
