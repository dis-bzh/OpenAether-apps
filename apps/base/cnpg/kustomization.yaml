apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether 0.5.0 P0 sync fix: the real ns is foundation-databases for cluster.yaml.
# WARNING: do NOT apply namespace: to the vendored CNPG install
# (it defines its own `cnpg-system` namespace for the operator).
# Solution: let the install create the operator in cnpg-system, and
# override cluster.yaml only.
# Both Clusters archive WAL and take their base backups through the Barman Cloud plugin (ObjectStore objects), not the
# in-tree `barmanObjectStore` that CNPG 1.31 removes (apps #114). The plugin needs cert-manager (its mTLS certificates).
# `monitoring.enablePodMonitor` is deprecated since 1.2x and will go too.
resources:
  - namespace.yaml
  - cnpg-1.30.1.yaml  # vendored from v1.30.1 — avoids a remote fetch (DNS/IPv6)
  - barman-cloud-plugin-0.16.0.yaml  # vendored from v0.16.0, installs into cnpg-system next to the operator
  - networkpolicy.yaml
  - pdb.yaml
  - networkpolicy-db-restricted.yaml
  - cluster.yaml
  - secret.yaml
  - grafana-db-cluster.yaml
  - grafana-db-externalsecret.yaml
  - backup-externalsecret.yaml
  - objectstores.yaml
  - scheduledbackups.yaml
  - restore-scratch.yaml  # the scratch namespace of the restore tests (backup/databases)

# Every Cluster shuts down within 5 s of smart shutdown (lab 27, FI): one shared component.
components:
  - ../../components/cnpg-bounded-shutdown

# The vendored operator sets runAsNonRoot on the pod only; Kyverno require-security-context reads the container (#47).
patches:
  - path: patch-ha.yaml
  - path: patch-barman-ha.yaml
  - target:
      kind: Deployment
      name: cnpg-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: true

# One PostgreSQL Cluster rolls at a time (owner decision 2026-11-11: restarts of multi-instance components go one after
# the other). The operator keeps ONE rollout slot for the whole process and, by default, waits 0 s between Clusters, so
# every Cluster that needs a pod rollout (a new PostgreSQL image, a changed sidecar image, a restart annotation) starts
# in the same second. One lab run of the 0.4.4 to 0.4.5 move (3 control planes + 6 workers, Scaleway, NOMINAL) had
# zitadel-db and grafana-db start rolling 0.4 s apart and both sit at 2 of 3 instances for about 2.5 minutes.
# CLUSTERS_ROLLOUT_DELAY is that wait, in seconds (CloudNativePG 1.30.1, read in the source: internal/configuration and
# internal/controller/rollout): a Cluster whose turn comes right after ANOTHER Cluster's last step is refused until D
# seconds have passed since that step, and asked again 15 s later. What it does and does not touch:
# - Only the rollout path asks the slot. A failover after a failure, and the planned switchover that the operator makes
#   when the node of a primary is cordoned, are not delayed. INSTANCES_ROLLOUT_DELAY (the wait between the pods of ONE
#   Cluster) is a different setting and stays at its default 0: inside a Cluster it already goes replicas first, one
#   pod at a time, primary last by a planned switchover.
# - D must exceed the worst gap between two steps of ONE Cluster, or the steps of two Clusters interleave and both stay
#   at 2 of 3: 12 to 29 s in quiet labs, 124 to 133 s while Longhorn was replacing its images at the same time. 150 s.
# - The cost: a delayed Cluster has the phase "Cluster upgrade delayed", the event RolloutDelayed and Ready=False, so
#   the Flux Kustomizations `cnpg` and `forgejo-db` (wait: true, Cluster Ready gate, timeout 15m) wait while a Cluster
#   is delayed. Three Clusters in series come to about 8.5 minutes by arithmetic on quiet-lab figures (an estimate,
#   never run), under the 15 minutes; a slower roll makes the Kustomization fail its health check and be retried every
#   2 minutes, nothing is rolled back. A move takes about 3 minutes longer per additional Cluster; no outage gets
#   shorter.
# - The operator reads this ONCE, at start (the environment first, then the ConfigMap/Secret named in the args, none
#   shipped here: a key of the same name there would win), so it protects the NEXT rollout. It does not protect the move
#   that introduces it when the sidecar change arrives in the same Flux sync: the operator pods restart in that sync and
#   the slot is lost whenever the operator restarts (the next Cluster then starts at once).
# - A value that is not an integer is logged ("Skipping invalid integer value parsing configuration") and ignored: the
#   delay silently falls back to 0. scripts/dev/test-cnpg-barman-plugin.py pins a positive integer of at least 134.
# UNVERIFIED on a cluster: no run has yet shown the phase or the event with this value.
  - target:
      kind: Deployment
      name: cnpg-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cnpg-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: CLUSTERS_ROLLOUT_DELAY
                    value: "150"

# The plugin ships no resources, debug logging and no per-container runAsNonRoot (Kyverno reads the container).
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: true
      # No `--leader-elect` (lab 26, B1). In v0.15.1 the gRPC server is a controller-runtime runnable that only starts
      # on the pod holding the lease, so the second replica never opened :9090 and stayed 0/1 for ever. Without the
      # flag every replica serves. v0.16.0 has the upstream fix (PR 1105) and keeps this args layout; the flag stays OFF
      # on purpose in 0.4.5 (the shape proven in labs 25 to 36). Args 0-4: operator, TLS and address flags; 5:
      # --leader-elect; 6: the log level.
      - op: remove
        path: /spec/template/spec/containers/0/args/5
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --log-level=info
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }

# The plugin's mTLS leaves come without a rotation policy; the repository names one on every Certificate (cert-manager
# 1.18 changed the unwritten default). Always, like the other leaves: a new key at each renewal (90 days, 15 before).
  - target:
      kind: Certificate
      name: barman-cloud-(client|server)
    patch: |-
      - op: add
        path: /spec/privateKey
        value:
          rotationPolicy: Always

# CNPG 1.30 CRD descriptions quote the operator's own placeholder syntax (`${podselector:NAME}`, `${`image_root`}`,
# `$${...}`).
# Flux's post-build envsubst fails on them ("unable to parse variable name") and the whole brick never applies (lab 12).
# Only the CRDs opt out: cluster.yaml and the other files still need ${BACKUP_S3_*} from cluster-identity.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1substitute
        value: disabled
