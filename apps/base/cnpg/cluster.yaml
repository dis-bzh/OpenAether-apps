# OpenAether — CNPG PostgreSQL cluster for Zitadel (identity).
# Replaces the former keycloak-db: the decision taken was Zitadel (Go, natively
# multi-tenant) over Keycloak. The CNPG Cluster (3 HA instances) is Zitadel's
# Postgres backend (apps/base/identity/zitadel/).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: cnpg-zitadel-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  # A rolling update (operator or image upgrade, restart-needing parameter) restarts the PRIMARY in place by default
  # ("restart"): lab 15c measured 195 s without a write per operator hop. "switchover" updates the replicas first
  # and then
  # promotes one, so the write gap is a failover, not a restart of the only writer.
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  # HA Configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"
    # Class A data (identity): a commit is acknowledged only after ONE replica has it (quorum, any 1 of the 2), and a
    # failover refuses a replica that cannot prove it holds every acknowledged commit (failoverQuorum). With both replicas
    # gone writes BLOCK instead of being acknowledged unreplicated (CnpgSyncReplicaMissing). docs/resilience.md, "Data classes".
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true

  # Storage Configuration
  # local-path-retain: CNPG handles HA itself (3 instances, streaming
  # replication + transaction-aware failover). No Longhorn under CNPG
  # (anti-pattern: block+transaction double replication → write amplification,
  # faulted volumes). Retain: data kept if the PVC is deleted. See grafana-db-cluster.yaml.
  storage:
    size: 5Gi
    storageClass: local-path-retain

  # Memory limit for every container of the instance pod, the CNPG init container included (Kyverno require-limits, apps #47).
  # Measured on a lab cluster: the primary uses about 255Mi, a replica about 80Mi. No CPU limit (throttling), a small
  # request like grafana-db.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Bootstrap from SQL (create DB/User if needed)
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      # CNPG requires the bootstrap Secret to be in the SAME namespace as the
      # Cluster → zitadel-db-app ExternalSecret in foundation-databases
      # (apps/base/cnpg/secret.yaml), mirroring secret/zitadel/db in OpenBao.
      secret:
        name: zitadel-db-app

  # Managed roles: `zitadel init` (admin==user==zitadel, no CNPG superuser) runs
  # a `CREATE DATABASE` even when the DB already exists (created by initdb) →
  # it fails with `permission denied to create database (SQLSTATE 42501)` if the
  # role lacks CREATEDB. We grant CREATEDB declaratively (idempotent: since the
  # DB already exists, init detects it and moves on to schema bootstrap, owner-only).
  # Survives DR/rebuild (unlike a manual ALTER ROLE). enableSuperuserAccess stays
  # false: we grant only the strict minimum (no superuser, no createrole).
  managed:
    roles:
      - name: zitadel
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: zitadel-db-app

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Affinity: preferred anti-affinity to spread the 3 instances across nodes
  # (same config as grafana-db-cluster.yaml)
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    # Lab 21: both grafana-db instances and both CNPG operators landed in ONE zone (hostname spread only), so losing
    # that zone took the whole database. A second, zone-level preference keeps the instances in different zones when
    # the cluster has them; it never blocks scheduling (a lost zone leaves fewer zones than instances).
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                cnpg.io/cluster: zitadel-db
    # Lab 21: a primary on a lost node was failed over only when the TaintManager evicted its pod, after the default
    # 300 s toleration (write gaps of 328 and 333 s, target 30 s, apps #154). 30 s is the liveness probe of the instance
    # manager (period 10 s x 3 failures): an isolated-but-alive primary shuts itself down by then, so the evicted pod
    # and the promoted replica do not both take writes. Docs: docs/resilience.md.
    tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30

  # ── PITR (Point-In-Time Recovery) ───────────────────────────────────────────
  # The Barman Cloud plugin archives WAL continuously (an RPO of minutes) and takes the base backups
  # (scheduledbackups.yaml). Where and how is the ObjectStore `zitadel-db-primary` (objectstores.yaml); the second copy
  # on the replica store is shipped by the backup brick (backup/databases, cnpg-store-replicate).
  # The WAL archive name (serverName) is the Cluster name plus the archive generation suffix: empty on an install,
  # and "-g2", "-g3"... on a cluster REBUILT from a store (task dr-restore-plan writes the ConfigMap
  # cnpg-archive-generation in flux-system, Flux substitutes it here). A rebuilt cluster must not archive into the
  # dead one's path: barman refuses a non-empty archive ("Expected empty archive", issue #153). Never edit this by
  # hand on a running cluster; docs/traps.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: zitadel-db-primary
        serverName: "zitadel-db${CNPG_ARCHIVE_SUFFIX:=}"
