# OpenAether — CNPG PostgreSQL cluster for Zitadel (identity).
# Replaces the former keycloak-db: the decision taken was Zitadel (Go, natively
# multi-tenant) over Keycloak. The CNPG Cluster (3 HA instances) is Zitadel's
# Postgres backend (apps/base/identity/zitadel/).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: cnpg-zitadel-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  # HA Configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"

  # Storage Configuration
  # local-path-retain: CNPG handles HA itself (3 instances, streaming
  # replication + transaction-aware failover). No Longhorn under CNPG
  # (anti-pattern: block+transaction double replication → write amplification,
  # faulted volumes). Retain: data kept if the PVC is deleted. See grafana-db-cluster.yaml.
  storage:
    size: 5Gi
    storageClass: local-path-retain

  # Bootstrap from SQL (create DB/User if needed)
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      # CNPG requires the bootstrap Secret to be in the SAME namespace as the
      # Cluster → zitadel-db-app ExternalSecret in foundation-databases
      # (apps/base/cnpg/secret.yaml), mirroring secret/zitadel/db in OpenBao.
      secret:
        name: zitadel-db-app

  # Managed roles: `zitadel init` (admin==user==zitadel, no CNPG superuser) runs
  # a `CREATE DATABASE` even when the DB already exists (created by initdb) →
  # it fails with `permission denied to create database (SQLSTATE 42501)` if the
  # role lacks CREATEDB. We grant CREATEDB declaratively (idempotent: since the
  # DB already exists, init detects it and moves on to schema bootstrap, owner-only).
  # Survives DR/rebuild (unlike a manual ALTER ROLE). enableSuperuserAccess stays
  # false: we grant only the strict minimum (no superuser, no createrole).
  managed:
    roles:
      - name: zitadel
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: zitadel-db-app

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Affinity: preferred anti-affinity to spread the 3 instances across nodes
  # (same config as grafana-db-cluster.yaml)
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  # ── PITR (Point-In-Time Recovery) ───────────────────────────────────────────
  # Before: the only net was the backup brick's daily `pg_dump`, i.e. a 24 h
  # RPO. barmanObjectStore archives WAL continuously → an RPO of a few minutes,
  # and restoration to a precise point in time.
  #
  # `${BACKUP_S3_*}` comes from the `cluster-identity` ConfigMap laid down at
  # bootstrap (substitution carried by the `cnpg` Kustomization). If the cluster
  # does not publish them, the destination is empty and the backup stays
  # inactive — no silent regression.
  #
  # The path includes the database name: both clusters share the bucket without
  # stepping on each other, like the restic repositories.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://${BACKUP_S3_BUCKET:=}/cnpg/zitadel-db"
      endpointURL: "${BACKUP_S3_ENDPOINT:=}"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        # WAL are bulky and S3 storage is billed by volume.
        compression: gzip
      data:
        compression: gzip
