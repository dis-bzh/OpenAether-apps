# OpenAether — Cluster CNPG PostgreSQL pour Zitadel (identité).
# Remplace l'ancien keycloak-db : décision actée = Zitadel (Go, multi-tenant
# natif) plutôt que Keycloak. Le Cluster CNPG (3 instances HA) sert de backend
# Postgres à Zitadel (apps/base/identity/zitadel/).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: cnpg-zitadel-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1

  # HA Configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"

  # Storage Configuration
  # local-path-retain: CNPG gère la HA (3 instances, streaming replication +
  # failover transaction-aware). Pas de Longhorn sous CNPG (anti-pattern: double
  # réplication bloc+transaction → write amplification, volumes faulted). Retain:
  # données conservées si le PVC est supprimé. Cf. grafana-db-cluster.yaml.
  storage:
    size: 5Gi
    storageClass: local-path-retain

  # Bootstrap from SQL (create DB/User if needed)
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      # CNPG exige que le Secret bootstrap soit dans le MÊME namespace que le
      # Cluster → ExternalSecret zitadel-db-app dans foundation-databases
      # (apps/base/cnpg/secret.yaml), miroir de secret/zitadel/db dans OpenBao.
      secret:
        name: zitadel-db-app

  # Managed roles : le `zitadel init` (admin==user==zitadel, pas de superuser CNPG)
  # exécute un `CREATE DATABASE` même si la DB existe déjà (créée par initdb) →
  # échec `permission denied to create database (SQLSTATE 42501)` si le rôle n'a
  # pas CREATEDB. On accorde CREATEDB de façon déclarative (idempotent : la DB
  # existant déjà, l'init la détecte et passe au bootstrap de schéma, owner-only).
  # Survit au DR/rebuild (vs un ALTER ROLE manuel). enableSuperuserAccess reste
  # false : on n'accorde que le strict nécessaire (pas superuser, pas createrole).
  managed:
    roles:
      - name: zitadel
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: zitadel-db-app

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Affinity: anti-affinité préférée pour répartir les 3 instances sur les nœuds
  # (même config que grafana-db-cluster.yaml)
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  # ── PITR (Point-In-Time Recovery) ───────────────────────────────────────────
  # Avant : le seul filet était le `pg_dump` quotidien de la brique backup, soit
  # un RPO de 24 h. barmanObjectStore archive les WAL en continu → RPO de
  # quelques minutes, et restauration à un instant précis.
  #
  # `${BACKUP_S3_*}` vient du ConfigMap `cluster-identity` posé au bootstrap
  # (substitution portée par la Kustomization `cnpg`). Si le cluster ne les
  # publie pas, la destination est vide et le backup reste inactif — pas de
  # régression silencieuse.
  #
  # Le chemin inclut le nom de la base : les deux clusters partagent le bucket
  # sans se marcher dessus, comme les dépôts restic.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://${BACKUP_S3_BUCKET:=}/cnpg/zitadel-db"
      endpointURL: "${BACKUP_S3_ENDPOINT:=}"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        # Les WAL sont volumineux et le stockage S3 se paie au volume.
        compression: gzip
      data:
        compression: gzip
