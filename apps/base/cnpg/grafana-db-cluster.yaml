# CNPG PostgreSQL Cluster for Grafana
# ──────────────────────────────────────────────────────────────────
# Grafana HA (2 replicas) requires a shared DB backend for the session,
# dashboards, users and alerts.
# PostgreSQL CNPG: 2 instances (streaming replication) on local-path storage.
# CNPG handles ALL the HA (transaction-aware WAL replication + failover).
# Stacking Longhorn (block replication, blind to transactions) = anti-pattern:
# amplification and concurrent double failover (the cause of the "faulted" volumes, 06/2026),
# and x1-rwo brings no storage HA anyway. See openbao-workload, which already
# applies this principle (raft replicates → local storage is enough).
#
# Namespace: foundation-databases (the same existing CNPG cluster).
# ExternalSecret: grafana-db-credentials (externalsecrets-grafana.yaml)
# → OpenBao secret/grafana/db.password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  primaryUpdateStrategy: unsupervised
  # See cluster.yaml: replicas first, then a switchover, instead of restarting the only writer in place.
  primaryUpdateMethod: switchover
  storage:
    # local-path-retain: node-local storage, immediate mount (no CSI
    # attach/detach), Retain (data kept if the PVC is deleted).
    # HA comes from the 2 CNPG instances, not from the storage.
    storageClass: local-path-retain
    size: 5Gi
  # Connexion Grafana: user grafana, base grafana.
  # The postgres superuser is managed by CNPG (auto-generated secret).
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-credentials
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  affinity:
    # CNPG AffinityConfiguration (not the standard K8s type)
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    # Lab 21: both grafana-db instances and both CNPG operators landed in ONE zone (hostname spread only), so losing
    # that zone took the whole database. A second, zone-level preference keeps the instances in different zones when
    # the cluster has them; it never blocks scheduling (a lost zone leaves fewer zones than instances).
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                cnpg.io/cluster: grafana-db
  monitoring:
    enablePodMonitor: false

  # ── PITR (Point-In-Time Recovery) ───────────────────────────────────────────
  # The Barman Cloud plugin archives WAL continuously (an RPO of minutes) and takes the base backups
  # (scheduledbackups.yaml). Where and how is the ObjectStore `grafana-db-primary` (objectstores.yaml); the second copy
  # on the replica store is shipped by the backup brick (backup/databases, cnpg-store-replicate).
  # The WAL archive name (serverName) is the Cluster name plus the archive generation suffix: empty on an install,
  # and "-g2", "-g3"... on a cluster REBUILT from a store (task dr-restore-plan writes the ConfigMap
  # cnpg-archive-generation in flux-system, Flux substitutes it here). A rebuilt cluster must not archive into the
  # dead one's path: barman refuses a non-empty archive ("Expected empty archive", issue #153). Never edit this by
  # hand on a running cluster; docs/traps.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: grafana-db-primary
        serverName: "grafana-db${CNPG_ARCHIVE_SUFFIX:=}"
