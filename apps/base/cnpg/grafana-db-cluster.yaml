# OpenAether 0.5.0 Sprint C — CNPG Cluster PostgreSQL pour Grafana
# ──────────────────────────────────────────────────────────────────
# Grafana HA (2 répliques) requiert un backend DB partagé pour la session,
# les dashboards, les utilisateurs, les alertes.
# PostgreSQL CNPG: 2 instances (streaming replication) sur stockage local-path.
# CNPG gère TOUTE la HA (réplication WAL transaction-aware + failover). Empiler
# Longhorn (réplication bloc, aveugle aux transactions) = anti-pattern: write
# amplification, double failover concurrent (cause des volumes "faulted" 06/2026),
# et x1-rwo n'apporte aucune HA stockage de toute façon. Voir openbao-workload qui
# applique déjà ce principe (raft réplique → stockage local suffit).
#
# Namespace: foundation-databases (même cluster CNPG existant).
# ExternalSecret: grafana-db-credentials (externalsecrets-grafana.yaml)
# → OpenBao secret/grafana/db.password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  primaryUpdateStrategy: unsupervised
  storage:
    # local-path-retain: stockage node-local, montage immédiat (pas de CSI
    # attach/detach), Retain (données conservées si le PVC est supprimé).
    # La HA vient des 2 instances CNPG, pas du stockage.
    storageClass: local-path-retain
    size: 5Gi
  # Connexion Grafana: user grafana, base grafana.
  # Le superuser postgres est géré par CNPG (secret auto-généré).
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-credentials
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity:
    # CNPG AffinityConfiguration (pas le type standard K8s)
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false

  # ── PITR (Point-In-Time Recovery) ───────────────────────────────────────────
  # Avant : le seul filet était le `pg_dump` quotidien de la brique backup, soit
  # un RPO de 24 h. barmanObjectStore archive les WAL en continu → RPO de
  # quelques minutes, et restauration à un instant précis.
  #
  # `${BACKUP_S3_*}` vient du ConfigMap `cluster-identity` posé au bootstrap
  # (substitution portée par la Kustomization `cnpg`). Si le cluster ne les
  # publie pas, la destination est vide et le backup reste inactif — pas de
  # régression silencieuse.
  #
  # Le chemin inclut le nom de la base : les deux clusters partagent le bucket
  # sans se marcher dessus, comme les dépôts restic.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://${BACKUP_S3_BUCKET:=}/cnpg/grafana-db"
      endpointURL: "${BACKUP_S3_ENDPOINT:=}"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        # Les WAL sont volumineux et le stockage S3 se paie au volume.
        compression: gzip
      data:
        compression: gzip
