# CNPG PostgreSQL Cluster for Grafana
# ──────────────────────────────────────────────────────────────────
# Grafana HA (2 replicas) requires a shared DB backend for the session,
# dashboards, users and alerts.
# PostgreSQL CNPG: 2 instances (streaming replication) sur stockage local-path.
# CNPG handles ALL the HA (transaction-aware WAL replication + failover).
# Stacking Longhorn (block replication, blind to transactions) = anti-pattern:
# amplification and concurrent double failover (the cause of the "faulted" volumes, 06/2026),
# and x1-rwo brings no storage HA anyway. See openbao-workload, which already
# applies this principle (raft replicates → local storage is enough).
#
# Namespace: foundation-databases (the same existing CNPG cluster).
# ExternalSecret: grafana-db-credentials (externalsecrets-grafana.yaml)
# → OpenBao secret/grafana/db.password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  primaryUpdateStrategy: unsupervised
  storage:
    # local-path-retain: node-local storage, immediate mount (no CSI
    # attach/detach), Retain (data kept if the PVC is deleted).
    # HA comes from the 2 CNPG instances, not from the storage.
    storageClass: local-path-retain
    size: 5Gi
  # Connexion Grafana: user grafana, base grafana.
  # The postgres superuser is managed by CNPG (auto-generated secret).
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-credentials
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity:
    # CNPG AffinityConfiguration (not the standard K8s type)
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false

  # ── PITR (Point-In-Time Recovery) ───────────────────────────────────────────
  # Before: the only net was the backup brick's daily `pg_dump`, i.e. a 24 h
  # RPO. barmanObjectStore archives WAL continuously → an RPO of a few minutes,
  # and restoration to a precise point in time.
  #
  # `${BACKUP_S3_*}` comes from the `cluster-identity` ConfigMap laid down at
  # bootstrap (substitution carried by the `cnpg` Kustomization). If the cluster
  # does not publish them, the destination is empty and the backup stays
  # inactive — no silent regression.
  #
  # The path includes the database name: both clusters share the bucket without
  # stepping on each other, like the restic repositories.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://${BACKUP_S3_BUCKET:=}/cnpg/grafana-db"
      endpointURL: "${BACKUP_S3_ENDPOINT:=}"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        # WAL are bulky and S3 storage is billed by volume.
        compression: gzip
      data:
        compression: gzip
