# ExternalSecret dédié pour CNPG — namespace foundation-databases.
# CNPG ne peut pas référencer un Secret cross-namespace pour le bootstrap.
# Ce miroir lit les mêmes credentials depuis OpenBao et les place dans
# foundation-databases où le Cluster CNPG peut les consommer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-app
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: cnpg-zitadel-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-db-app
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: zitadel/db
      property: username
  - secretKey: password
    remoteRef:
      key: zitadel/db
      property: password
