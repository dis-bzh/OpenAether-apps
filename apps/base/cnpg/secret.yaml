# A dedicated ExternalSecret for CNPG — namespace foundation-databases.
# CNPG cannot reference a cross-namespace Secret for the bootstrap.
# This mirror reads the same credentials from OpenBao and places them in
# foundation-databases, where the CNPG Cluster can consume them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-app
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: cnpg-zitadel-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-db-app
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: zitadel/db
      property: username
  - secretKey: password
    remoteRef:
      key: zitadel/db
      property: password
