# OpenAether 0.5.0 — CNPG (CloudNativePG) NetworkPolicy
# L'opérateur CNPG tourne dans cnpg-system (pas foundation-databases).
# Le webhook (9443) est appelé par kube-apiserver lors de tout Cluster/Backup CRD apply.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "cnpg"
spec:
  description: "CNPG operator (cnpg-system): ingress webhook kube-apiserver + egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    # kube-apiserver → webhook CNPG (MutatingWebhook + ValidatingWebhook)
    # Le Service cnpg-webhook-service expose 443 → 9443.
    # remote-node: le static pod kube-apiserver est identifié comme node par Cilium (kubeadm/Talos).
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (watch Cluster/Backup/ScheduledBackup CRDs)
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver