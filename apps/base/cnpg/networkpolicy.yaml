# OpenAether 0.5.0 — CNPG (CloudNativePG) NetworkPolicy
# The CNPG operator runs in cnpg-system (not foundation-databases).
# The webhook (9443) is called by kube-apiserver on any Cluster/Backup CRD apply.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "cnpg"
spec:
  description: "CNPG operator (cnpg-system): ingress webhook kube-apiserver + egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    # kube-apiserver → webhook CNPG (MutatingWebhook + ValidatingWebhook)
    # The cnpg-webhook-service Service exposes 443 → 9443.
    # remote-node: the static kube-apiserver pod is identified as a node by Cilium (kubeadm/Talos).
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (watch Cluster/Backup/ScheduledBackup CRDs)
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Barman Cloud plugin (same namespace): the operator asks it to archive, back up and restore.
    - toEndpoints:
        - matchLabels:
            app: barman-cloud
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Postgres instances, in ANY namespace: the operator polls status through the instance-manager (:8000 /pg/status)
    # and runs the SQL (:5432). Without this egress rule the operator cannot get out ("Instance Status Extraction
    # Error: i/o timeout") and the Cluster is never healthy. It covers foundation-databases, the scratch instances
    # of the restore tests (restore-scratch.yaml) and the customer database profiles (docs/database-profiles.md):
    # lab 23 found a profile of another namespace stuck on 1 of 3 instances with the two namespace-pinned rules this
    # replaces. The ingress side is each database's own policy (networkpolicy-db-restricted.yaml rule 5, the
    # profile's common policy): a namespace without that rule still refuses the operator.
    - toEndpoints:
        - matchLabels:
            cnpg.io/podRole: instance
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
---
# Barman Cloud plugin (cnpg-system): the operator calls it on 9090 (mTLS from cert-manager certificates); it reads the
# ObjectStore objects and the Cluster through the API server. It never talks to the store: the sidecar in each
# instance does.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: barman-cloud-plugin
  namespace: cnpg-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "cnpg"
spec:
  description: "Barman Cloud plugin: ingress 9090 from the CNPG operator, egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app: barman-cloud
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
