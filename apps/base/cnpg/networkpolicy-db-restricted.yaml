# OpenAether 0.5.0 — CNPG Database Ingress Restricted (Zero Trust)
# Replaces networkpolicy-db.yaml (which allowed the whole foundation-databases namespace)
# Allows ONLY the legitimate consumers:
# - Grafana (monitoring) from services-observability
# - VictoriaMetrics (metrics scraping) from services-observability
# - Backup jobs (CNPG backups) from foundation-databases
# - CNPG internal replication (instances + operator)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-database-ingress-restricted
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Restrict CNPG ingress to legitimate consumers only"
  endpointSelector:
    matchExpressions:
      - key: "cnpg.io/cluster"
        operator: Exists
  ingress:
    # 1. Grafana (datasource PostgreSQL) - services-observability namespace
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": grafana
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # 2. VictoriaMetrics / vmagent (scraping metrics) - services-observability
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": vmagent
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": victoriametrics-single
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
        - ports:
            - port: "9187"
              protocol: TCP  # PG exporter metrics
    # 2b. Zitadel (identity) → the zitadel-db Postgres backend, from services-identity.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-identity
            "app.kubernetes.io/name": zitadel
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # 3+4. INTERNAL foundation-databases traffic: streaming replication between
    # instances, "join" pods (pg_basebackup of a new replica), instance-manager
    # peer (:8000), backup jobs. Selector NAMESPACE-ONLY volontaire.
    # BEWARE (the cause of the June 2026 deadlock): `cnpg.io/cluster: ""` in
    # matchLabels means an EMPTY-VALUED label, NOT "Exists". The instances carry
    # cnpg.io/cluster=<name> (non-empty) → the old rule matched NOTHING →
    # cross-node replication (join→primary:5432) was dropped → the Cluster stuck
    # at 1/2 with "Instance Status Extraction Error". So we allow intra-ns
    # traffic without a label (pods of the same DB cluster legitimately talk).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": foundation-databases
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # 5. CNPG Operator (gestion cluster + extraction status :8000/pg/status).
    # The operator runs in cnpg-system (NOT foundation-databases) and carries the
    # label app.kubernetes.io/name=cloudnative-pg. L'ancien selector
    # (ns foundation-databases + name cnpg-cloudnative-pg) ne matchait RIEN →
    # operator→instance:8000 dropped → "Instance Status Extraction Error:
    # i/o timeout" → the Cluster is never "healthy" (visible once the ns is out of the mesh).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
            "app.kubernetes.io/name": cloudnative-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
  # EGRESS — this CNP applies to the Postgres instances (cnpg.io/cluster Exists);
  # as soon as one rule exists, Cilium turns on default-deny EGRESS on those pods.
  # Without explicit egress an instance can emit NOTHING: no streaming
  # replication to the primary (:5432), no status/instance-manager peer (:8000),
  # no DNS (peer resolution), no kube-api (the instance-manager watches the API).
  # Symptom observed outside the mesh: replica join dropped on cross-node egress
  # :5432, Cluster stuck on "Instance Status Extraction Error".
  egress:
    # DNS — rules.dns is MANDATORY for the toFQDNs rule below to match (DNS
    # proxy), cf. backup/databases/networkpolicy.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (instance-manager watch Cluster/config)
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Cloud S3 (HTTPS) — barmanObjectStore continuous archiving (WAL push from
    # the primary, WAL/history restore for a joining replica). Missing this
    # silently degrades: a single-instance cluster never notices (no
    # restore_command calls), and archive-push failures don't block Ready —
    # only a replica JOIN actually blocks on it, hanging on restore_command
    # instead of failing fast. Found live on edge-3 2026-07-30 (zitadel-db/
    # grafana-db replicas stuck "Waiting for the instances to become active"
    # for 15+ minutes; same gap as backup/databases/networkpolicy.yaml,
    # narrowed to FQDNs, no toEntities:world).
    - toFQDNs:
        - matchName: s3.fr-par.scw.cloud          # Scaleway Object Storage
        - matchName: s3.eu-west-par.io.cloud.ovh.net  # OVH (aligned with the eu-west-par tfvars)
        - matchName: oos.eu-west-2.outscale.com   # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # INTERNAL foundation-databases traffic (streaming replication +
    # instance-manager peer + join pods). Namespace-only selector — same reason as
    # ingress #3+4: `cnpg.io/cluster: ""` does not match the instances (non-empty
    # label). Without it the join pod (pg_basebackup) cannot reach primary:5432 →
    # the replica is never formed. Its ingress counterpart is above.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": foundation-databases
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
