# OpenAether 0.5.0 — CNPG Database Ingress Restricted (Zero Trust)
# Remplace networkpolicy-db.yaml (autorisait tout le namespace foundation-databases)
# Autorise UNIQUEMENT les consommateurs légitimes:
# - Grafana (monitoring) depuis services-observability
# - VictoriaMetrics (metrics scraping) depuis services-observability
# - Backup jobs (CNPG backups) depuis foundation-databases
# - Réplication interne CNPG (instances + operator)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-database-ingress-restricted
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Restrict CNPG ingress to legitimate consumers only"
  endpointSelector:
    matchExpressions:
      - key: "cnpg.io/cluster"
        operator: Exists
  ingress:
    # 1. Grafana (datasource PostgreSQL) - services-observability namespace
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": grafana
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # 2. VictoriaMetrics / vmagent (scraping metrics) - services-observability
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": vmagent
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": victoriametrics-single
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
        - ports:
            - port: "9187"
              protocol: TCP  # PG exporter metrics
    # 2b. Zitadel (identité) → backend Postgres zitadel-db, depuis services-identity.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-identity
            "app.kubernetes.io/name": zitadel
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # 3+4. Trafic INTERNE foundation-databases : réplication streaming entre
    # instances, pods "join" (pg_basebackup d'un nouveau replica), instance-manager
    # peer (:8000), backup jobs. Selector NAMESPACE-ONLY volontaire.
    # ATTENTION PIÈGE (cause du blocage juin 2026) : `cnpg.io/cluster: ""` en
    # matchLabels = label de VALEUR VIDE, PAS "Exists". Les instances ont
    # cnpg.io/cluster=<nom> (non vide) → l'ancienne règle ne matchait RIEN → la
    # réplication cross-node (join→primary:5432) était droppée → Cluster bloqué
    # en 1/2 "Instance Status Extraction Error". On autorise donc le trafic
    # intra-ns sans label (les pods d'un même cluster DB se parlent légitimement).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": foundation-databases
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # 5. CNPG Operator (gestion cluster + extraction status :8000/pg/status).
    # L'operator tourne dans cnpg-system (PAS foundation-databases) et porte le
    # label app.kubernetes.io/name=cloudnative-pg. L'ancien selector
    # (ns foundation-databases + name cnpg-cloudnative-pg) ne matchait RIEN →
    # operator→instance:8000 droppé → "Instance Status Extraction Error:
    # i/o timeout" → Cluster jamais "healthy" (visible une fois le ns hors mesh).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
            "app.kubernetes.io/name": cloudnative-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
  # EGRESS — cette CNP s'applique aux instances Postgres (cnpg.io/cluster Exists) ;
  # dès qu'une règle existe, Cilium active le default-deny EGRESS sur ces pods.
  # Sans egress explicite, une instance ne peut RIEN émettre : ni réplication
  # streaming vers le primary (:5432), ni status/instance-manager peer (:8000),
  # ni DNS (résolution des peers), ni kube-api (l'instance-manager watch l'API).
  # Symptôme observé hors-mesh : replica join droppé en egress :5432 cross-node,
  # Cluster bloqué "Instance Status Extraction Error". Cf. [[cilium-ambient-debug]].
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (instance-manager watch Cluster/config)
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Trafic INTERNE foundation-databases (réplication streaming + instance-manager
    # peer + join pods). Selector namespace-only — même raison que l'ingress #3+4 :
    # `cnpg.io/cluster: ""` ne matche pas les instances (label non vide). Sans ça,
    # le join pod (pg_basebackup) ne sort pas vers le primary:5432 → replica jamais
    # formé. Le pendant ingress est ci-dessus.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": foundation-databases
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
