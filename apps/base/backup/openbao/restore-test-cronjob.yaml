# Monthly RESTORE test — the only proof that a backup is usable.
#
# `restic check` (run on every backup) only reads the METADATA: it says the index
# is consistent, not that the data is readable or decryptable.
# A repository can pass `check` green and still be unrecoverable (bit-rot on the
# packs, wrong RESTIC_PASSWORD, truncated S3 objects).
#
# Ce Job, sur CHACUNE des 2 destinations :
#   1. `restic check --read-data-subset` — actually re-reads and decrypts a
#      fraction of the data (5 %, naturally rotating month over month);
#   2. `restic restore latest` into a throwaway volume, then checks that the
#      result is NOT EMPTY — that is the end-to-end test.
# A failure here is as serious as a missing backup: it shows through the alert
# BackupJobFailed (apps/base/observability/vm-customresources/vmrule-backup.yaml).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot-restore-test
  namespace: foundation-vault
  labels:
    app: openbao-snapshot-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "23 4 1 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            # ⚠️ ALSO carries `app: openbao-snapshot`: that is the label selected by the
            # CiliumNetworkPolicy qui ouvre l'egress S3 (networkpolicy.yaml).
            # Without it the pod has no egress and the test fails on timeout.
            app: openbao-snapshot
            component: restore-test
            openaether.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: restore-test
              image: docker.io/restic/restic:0.18.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  if [ -z "${CLUSTER_NAME:-}" ]; then
                    echo "ERREUR: CLUSTER_NAME vide — ConfigMap cluster-identity absent."
                    exit 1
                  fi
                  export RESTIC_CACHE_DIR=/tmp/restic-cache
                  verify() {
                    ep="$1"; bucket="$2"; label="$3"
                    export RESTIC_REPOSITORY="s3:${ep}/${bucket}/${CLUSTER_NAME}/openbao"
                    echo "── dépôt ${label}: ${RESTIC_REPOSITORY}"
                    # A real re-read of a fraction of the data (decryption included).
                    restic check --read-data-subset=5%
                    target="/tmp/restore-${label}"
                    rm -rf "$target"; mkdir -p "$target"
                    restic restore latest --host openbao --target "$target"
                    # A "successful" but empty restore = an unusable repository.
                    if [ -z "$(find "$target" -type f -print -quit)" ]; then
                      echo "ERREUR: restauration VIDE depuis le dépôt ${label} —"
                      echo "        le backup n'est PAS exploitable."
                      exit 1
                    fi
                    echo "   ✓ ${label} : $(find "$target" -type f | wc -l) fichier(s) restauré(s)"
                    rm -rf "$target"
                  }
                  AWS_ACCESS_KEY_ID="$PRIMARY_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$PRIMARY_SECRET_KEY" \
                    verify "$PRIMARY_ENDPOINT" "$PRIMARY_BUCKET" primary
                  AWS_ACCESS_KEY_ID="$REPLICA_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$REPLICA_SECRET_KEY" \
                    verify "$REPLICA_ENDPOINT" "$REPLICA_BUCKET" replica
                  echo "✅ le snapshot raft OpenBao : restauration vérifiée sur les 2 destinations"
              envFrom:
                - secretRef:
                    name: backup-restic-env
                - configMapRef:
                    name: cluster-identity
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Required PER CONTAINER by the require-security-context policy.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
          volumes:
            # Throwaway: the restore must leave NOTHING behind.
            - name: tmp
              emptyDir: { sizeLimit: 2Gi }
