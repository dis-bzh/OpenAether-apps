# Env restic + destinations S3 pour le backup OpenBao.
# Sources OpenBao (KV v2 secret/) :
#   backup/restic     : password        — seedé par openbao-vault-bootstrap,
#                                         ESCROW OFFLINE OBLIGATOIRE (Bitwarden EU)
#   backup/s3-primary : endpoint (avec schéma), bucket, access_key, secret_key
#   backup/s3-replica : idem, AUTRE destination (autre provider — ou MinIO local)
# Les deux secrets s3-* sont seedés PAR L'OPÉRATEUR (creds provider inconnues
# in-cluster) — cf. apps/base/backup/README.md. Tant qu'ils sont absents,
# cet ExternalSecret reste NotReady et le CronJob ne démarre pas (by design).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-restic-env
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backup-restic-env
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef: { key: backup/restic, property: password }
    - secretKey: PRIMARY_ENDPOINT
      remoteRef: { key: backup/s3-primary, property: endpoint }
    - secretKey: PRIMARY_BUCKET
      remoteRef: { key: backup/s3-primary, property: bucket }
    - secretKey: PRIMARY_ACCESS_KEY
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: PRIMARY_SECRET_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
    - secretKey: REPLICA_ENDPOINT
      remoteRef: { key: backup/s3-replica, property: endpoint }
    - secretKey: REPLICA_BUCKET
      remoteRef: { key: backup/s3-replica, property: bucket }
    - secretKey: REPLICA_ACCESS_KEY
      remoteRef: { key: backup/s3-replica, property: access_key }
    - secretKey: REPLICA_SECRET_KEY
      remoteRef: { key: backup/s3-replica, property: secret_key }
