# Egress of the OpenBao backup pod (default-deny posture).
# - DNS (kube-dns)
# - OpenBao :8200 (sys/leader, k8s login, snapshot — the leader is reached
#   pod-to-pod through leader_address)
# - S3 :443 narrowed to the providers' FQDNs (the observability pattern);
#   local MinIO :9000 for tests.
# The matching ingress on the OpenBao side is rule 9 of
# foundation/vault/networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-snapshot
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "Backup OpenBao: egress DNS + OpenBao 8200 + S3 providers/MinIO"
  endpointSelector:
    matchLabels:
      app: openbao-snapshot
  egress:
    # DNS — rules.dns is MANDATORY: without it the Cilium DNS proxy does not see
    # the resolutions and the toFQDNs below NEVER match (the allow-dns CCNP is
    # L4-only). Required pattern for any pod with toFQDNs egress.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # OpenBao (same namespace)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Cloud S3 (HTTPS) — narrowed to the providers' FQDNs (no toEntities:world).
    - toFQDNs:
        - matchName: s3.fr-par.scw.cloud          # Scaleway Object Storage
        - matchName: s3.eu-west-par.io.cloud.ovh.net  # OVH (aligned with the eu-west-par tfvars)
        - matchName: oos.eu-west-2.outscale.com   # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # MinIO S3 (local only). ⚠️ the minio 5.2.0 chart sets the legacy label
    # `app: minio` (NOT app.kubernetes.io/name) — verified in a local e2e run:
    # the canonical selector alone matches nothing → restic hangs. Both forms.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app: minio
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
