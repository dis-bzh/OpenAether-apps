# SA of the OpenBao raft snapshot — used for the auth/kubernetes login
# (backup-snapshot role, read-only sys/storage/raft/snapshot policy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: foundation-vault
  labels:
    app: openbao-snapshot
    openaether.io/managed: "true"
    openaether.io/component: backup
