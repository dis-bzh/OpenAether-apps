# SA du snapshot raft OpenBao — utilisé pour le login auth/kubernetes
# (rôle backup-snapshot, policy sys/storage/raft/snapshot read-only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: foundation-vault
  labels:
    app: openbao-snapshot
    openaether.io/managed: "true"
    openaether.io/component: backup
