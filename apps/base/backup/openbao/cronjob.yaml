# Daily OpenBao backup: raft snapshot → restic → 2 S3 repositories.
#
# Chiffrement CLIENT fort : restic chiffre AVANT upload (AES-256-CTR +
# Poly1305-AES, key derived from RESTIC_PASSWORD by scrypt). The buckets never
# see plaintext data. The password lives in OpenBao (backup/restic) AND MUST
# be escrowed offline (Bitwarden EU): it is what makes the backups restorable
# when OpenBao itself is lost.
#
# Multi-destination: the same snapshot is pushed to 2 independent restic
# repositories (s3-primary / s3-replica — different providers in production).
# A failure of EITHER fails the Job (the contract is 2 copies).
#
# Retention (per repository): 14 daily, 8 weekly, 12 monthly + `restic check`
# (metadata integrity) on every run.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: foundation-vault
  labels:
    app: openbao-snapshot
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: openbao-snapshot
            openaether.io/component: backup
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # OpenBao's internal CA — the snapshot goes through its API over TLS.
            - name: openbao-tls
              secret:
                secretName: openbao-server-tls
                items:
                  - { key: ca.crt, path: ca.crt }
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
          initContainers:
            # 1) Raft snapshot — auth/kubernetes login (backup-snapshot role),
            #    leader resolution (the snapshot must target the active node),
            #    saved into the shared emptyDir.
            - name: snapshot
              image: docker.io/openbao/openbao:2.5.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export BAO_ADDR="https://openbao.foundation-vault.svc.cluster.local:8200"
                  # The OpenBao listener's internal CA (see foundation/vault/tls.yaml).
                  export BAO_CACERT="/bao/tls/ca.crt"
                  export VAULT_CACERT="$BAO_CACERT"
                  export VAULT_ADDR="$BAO_ADDR"
                  LEADER="$(bao read -field=leader_address sys/leader)"
                  [ -n "$LEADER" ] || { echo "ERROR: raft leader not found"; exit 1; }
                  export BAO_ADDR="${LEADER%/}" VAULT_ADDR="${LEADER%/}"
                  echo "leader raft: $BAO_ADDR"
                  # No set -x: the token must never be logged.
                  BAO_TOKEN="$(bao write -field=token auth/kubernetes/login \
                    role=backup-snapshot \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)"
                  export BAO_TOKEN VAULT_TOKEN="$BAO_TOKEN"
                  bao operator raft snapshot save /backup/openbao-raft.snap
                  ls -l /backup/openbao-raft.snap
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Required PER CONTAINER by the require-security-context policy
                # (inheriting from the pod is not enough) — otherwise the Job is
                # rejected at admission as soon as Kyverno is active.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: openbao-tls, mountPath: /bao/tls, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          containers:
            # 2) restic push to both repositories (client encryption + retention).
            - name: restic-push
              image: docker.io/restic/restic:0.18.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Repository prefix: without it, two clusters sharing a
                  # bucket se bloquent mutuellement (« already initialized »,
                  # since RESTIC_PASSWORD is not shared). `set -u` would be
                  # enough to fail, but not to explain why.
                  if [ -z "${CLUSTER_NAME:-}" ]; then
                    echo "ERROR: CLUSTER_NAME empty — the ConfigMap cluster-identity"
                    echo "        of the namespace is missing or unsubstituted"
                    echo "        (cf. apps/flux/base/22a-backup-identity.yaml)."
                    exit 1
                  fi
                  export RESTIC_CACHE_DIR=/tmp/restic-cache
                  push() {
                    ep="$1"; bucket="$2"; label="$3"
                    export RESTIC_REPOSITORY="s3:${ep}/${bucket}/${CLUSTER_NAME}/openbao"
                    echo "── repository ${label}: ${ep}/${bucket}/${CLUSTER_NAME}/openbao"
                    # ⚠️ restic does NOT create the bucket (it MUST pre-exist —
                    # ensure-buckets on the infra side, the minio chart locally)
                    # and retries a NoSuchBucket for ~15 min silently → bounded probe.
                    if ! timeout 60 restic cat config >/dev/null 2>&1; then
                      # Two very different failures hide here:
                      #  • repository MISSING     → a legitimate init;
                      #  • repository PRESENT but unreadable (another cluster's
                      #    password: repositories outlive clusters, their
                      #    RESTIC_PASSWORD does not) → init fails with
                      #    "already initialized" and a decision is needed: purge
                      #    the prefix, or point at a distinct bucket/path.
                      init_err="$(restic init 2>&1)" || {
                        case "$init_err" in
                          *"already initialized"*)
                            echo "ERROR: repository ${label} already exists but is NOT readable with this RESTIC_PASSWORD."
                            echo "  → it belongs to another cluster. Either purge s3://${bucket}/<prefix>,"
                            echo "    or give this cluster a bucket (or path) of its own." ;;
                          *)
                            echo "ERROR: cannot init repository ${label} — does bucket ${bucket} exist?"
                            echo "  $init_err" ;;
                        esac
                        exit 1
                      }
                    fi
                    restic unlock >/dev/null 2>&1 || true
                    restic backup /backup --host openbao --tag openbao-raft
                    restic forget --host openbao \
                      --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune
                    restic check
                  }
                  AWS_ACCESS_KEY_ID="$PRIMARY_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$PRIMARY_SECRET_KEY" \
                    push "$PRIMARY_ENDPOINT" "$PRIMARY_BUCKET" primary
                  AWS_ACCESS_KEY_ID="$REPLICA_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$REPLICA_SECRET_KEY" \
                    push "$REPLICA_ENDPOINT" "$REPLICA_BUCKET" replica
                  echo "✅ OpenBao snapshot pushed to both destinations"
              envFrom:
                - secretRef:
                    name: backup-restic-env
                # CLUSTER_NAME — restic repository prefix, so several clusters
                # can share a bucket without blocking each other.
                # Laid down by the backup-*-identity Kustomization (22a); read
                # here at RUNTIME, so no Flux substitution touches this file.
                - configMapRef:
                    name: cluster-identity
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Required PER CONTAINER by the require-security-context policy
                # (inheriting from the pod is not enough) — otherwise the Job is
                # rejected at admission as soon as Kyverno is active.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
