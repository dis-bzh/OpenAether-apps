# The grant: a Secret named like this object, holding a talosconfig whose ONLY role is os:etcd:backup (take an etcd
# snapshot), created by Talos in this namespace. It exists only when the control planes enable
# machine.features.kubernetesTalosAPIAccess with this role and this namespace (OpenAether-infra, variable
# etcd_snapshot_api_access, on by default); without it the CRD is absent and this brick stays not ready while
# everything else is unaffected, which is why it is its own Kustomization.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-snapshot-talos
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  roles:
    - os:etcd:backup
