# The identity of the etcd snapshot Job: LIST the control-plane nodes (their InternalIPs are the Talos API addresses) and
# nothing else. Nodes are cluster-scoped, hence a ClusterRole; it grants no Secret, no write, no other kind. Only the first init
# container mounts the token (the talosctl and restic containers never see it).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-snapshot
  namespace: foundation-databases
  labels:
    app: etcd-snapshot
    openaether.io/managed: "true"
    openaether.io/component: backup
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcd-snapshot-nodes
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcd-snapshot-nodes
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: etcd-snapshot-nodes }
subjects:
  - { kind: ServiceAccount, name: etcd-snapshot, namespace: foundation-databases }
