# The cluster identity, copied into foundation-databases so the backup CronJob
# prefixes its restic repositories ($CLUSTER_NAME).
#
# ⚠️ This file lives in a SEPARATE Kustomization (22a-backup-identity.yaml) and
# that is deliberate: it carries a `postBuild.substituteFrom`, and Flux
# substitution applies to the WHOLE render of a Kustomization. Merged into the
# backup brick it would blank the bare shell variables of its CronJobs
# ($PRIMARY_ENDPOINT, $LEADER, $init_err…). There is no script here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-identity
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
data:
  CLUSTER_NAME: ${CLUSTER_NAME}
  # Suffix of the CNPG archive serverName ("" on an install, "-g2" on a cluster rebuilt by the DR chain);
  # see cnpg/cluster.yaml.
  CNPG_ARCHIVE_SUFFIX: "${CNPG_ARCHIVE_SUFFIX:=}"
