# yamllint disable rule:line-length
# CNPG restore tests (0.4.0 M3): an unrestorable backup is useless, so each Cluster's archive is recovered on a schedule, with
# no human, into a throwaway one-instance Cluster in backup-restore-test (apps/base/cnpg/restore-scratch.yaml), compared with
# the live database (canary rows, see canary-cronjob.yaml) and deleted. Both stores are tested every time: the primary the
# platform archives to, and the replica copy a disaster would recover from. The result is a metric (oa_restore_test_*,
# restore/restore_cnpg.py) and a failed Job; the alerts are in the observability brick (vmrule-restore-test.yaml).
#   cnpg-recovery-restore-test  daily, the latest backup plus all archived WAL
#   cnpg-pitr-restore-test      weekly, point in time recovery to the time of a canary row; must end at exactly that row
# Names end in -restore-test: the M1 alert RestoreTestNotSucceeding (kube-state-metrics, 37 days) watches them as well.
# What bounds them: activeDeadlineSeconds, the quota of the scratch namespace, a Role in that namespace only, and the guard
# in the script and in the Kyverno policy restrict-restore-test-clusters.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-restore-test
  namespace: foundation-databases
  labels:
    app: cnpg-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oa-restore-test-metrics
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  placeholder: "# no restore test has run yet"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-recovery-restore-test
  namespace: foundation-databases
  labels:
    app: cnpg-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "20 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app: cnpg-restore-test
            openaether.io/component: backup
        spec:
          serviceAccountName: cnpg-restore-test
          automountServiceAccountToken: false
          restartPolicy: Never
          # The restore container removes its scratch Cluster when it is told to stop (up to DELETE_TIMEOUT 300 s).
          terminationGracePeriodSeconds: 360
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap: { name: backup-restore-scripts, defaultMode: 0555 }
            - name: work
              emptyDir: { sizeLimit: 64Mi }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
            - name: zitadel-db-creds
              secret: { secretName: zitadel-db-app }
            - name: grafana-db-creds
              secret: { secretName: grafana-db-credentials }
            - name: token
              projected:
                sources:
                  - serviceAccountToken: { path: token, expirationSeconds: 7200 }
                  - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
                  - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
          initContainers:
            # Stage 1: the live side of the comparison, read before anything is restored. Only this container holds the
            # database credentials, and only the next one holds the ServiceAccount token (apps #74).
            - name: source
              image: ghcr.io/cloudnative-pg/postgresql:18.6
              command: ["/bin/sh", "/scripts/source-snapshot.sh"]
              env:
                - { name: HOME, value: /tmp }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: zitadel-db-creds, mountPath: /creds/zitadel, readOnly: true }
                - { name: grafana-db-creds, mountPath: /creds/grafana, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          containers:
            # Stage 2: recover each Cluster from each store, compare, clean up, publish the metrics.
            - name: restore
              image: docker.io/alpine/k8s:1.36.5
              command: ["python3", "/scripts/restore_cnpg.py", "--mode", "latest", "--publish"]
              env:
                - { name: HOME, value: /tmp }
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: work, mountPath: /work, readOnly: true }
                - { name: tmp, mountPath: /tmp }
                - { name: token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-pitr-restore-test
  namespace: foundation-databases
  labels:
    app: cnpg-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "20 6 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app: cnpg-restore-test
            openaether.io/component: backup
        spec:
          serviceAccountName: cnpg-restore-test
          automountServiceAccountToken: false
          restartPolicy: Never
          # The restore container removes its scratch Cluster when it is told to stop (up to DELETE_TIMEOUT 300 s).
          terminationGracePeriodSeconds: 360
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap: { name: backup-restore-scripts, defaultMode: 0555 }
            - name: work
              emptyDir: { sizeLimit: 64Mi }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
            - name: zitadel-db-creds
              secret: { secretName: zitadel-db-app }
            - name: grafana-db-creds
              secret: { secretName: grafana-db-credentials }
            - name: token
              projected:
                sources:
                  - serviceAccountToken: { path: token, expirationSeconds: 7200 }
                  - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
                  - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
          initContainers:
            # Stage 1: the live side of the comparison, read before anything is restored. Only this container holds the
            # database credentials, and only the next one holds the ServiceAccount token (apps #74).
            - name: source
              image: ghcr.io/cloudnative-pg/postgresql:18.6
              command: ["/bin/sh", "/scripts/source-snapshot.sh"]
              env:
                - { name: HOME, value: /tmp }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: zitadel-db-creds, mountPath: /creds/zitadel, readOnly: true }
                - { name: grafana-db-creds, mountPath: /creds/grafana, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          containers:
            # Stage 2: the same with a recovery target: the time of one canary row; the copy must end at exactly that row.
            - name: restore
              image: docker.io/alpine/k8s:1.36.5
              command: ["python3", "/scripts/restore_cnpg.py", "--mode", "pitr", "--publish"]
              env:
                - { name: HOME, value: /tmp }
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: work, mountPath: /work, readOnly: true }
                - { name: tmp, mountPath: /tmp }
                - { name: token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
