# yamllint disable rule:line-length
# Dump restore test (0.4.0 M3): the logical dump is the one copy that does not depend on the CNPG archive, the Barman plugin or a
# CNPG version, so it is LOADED, not only listed (cnpg-dump-restore-test, monthly, stays as the shallow check). Daily, for each
# restic repository (primary and replica): restore the latest snapshot, load each dump into a private throwaway PostgreSQL
# (no network, deleted after), and judge it with the canary rows it carries (tables present, hash chain intact, newest row less than
# 26 h old). Metrics oa_restore_test_* with kind="dump", published like the CNPG recovery test; a failure fails the Job.
#   stage 1  restic image      restore the latest cnpg snapshot of each repository
#   stage 2  PostgreSQL image  user postgres: initdb, pg_restore, snapshot.sql, judge (dump_load.py)
#   stage 3  kubectl image     publish; the only container with the ServiceAccount token, which may patch one ConfigMap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-dump-restore-test
  namespace: foundation-databases
  labels:
    app: cnpg-dump-load-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-dump-restore-test
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["oa-restore-test-metrics"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-dump-restore-test
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cnpg-dump-restore-test }
subjects:
  - { kind: ServiceAccount, name: cnpg-dump-restore-test, namespace: foundation-databases }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-dump-load-restore-test
  namespace: foundation-databases
  labels:
    app: cnpg-dump-load-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "40 5 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: cnpg-dump-load-restore-test
            openaether.io/component: backup
        spec:
          serviceAccountName: cnpg-dump-restore-test
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap: { name: backup-restore-scripts, defaultMode: 0555 }
            - name: restore
              emptyDir: { sizeLimit: 2Gi }
            - name: results
              emptyDir: { sizeLimit: 8Mi }
            - name: tmp
              emptyDir: { sizeLimit: 3Gi }
            - name: token
              projected:
                sources:
                  - serviceAccountToken: { path: token, expirationSeconds: 3600 }
                  - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
                  - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
          initContainers:
            - name: restic
              image: docker.io/restic/restic:0.19.1
              command: ["/bin/sh", "/scripts/restic-dump.sh"]
              envFrom:
                - secretRef: { name: backup-restic-env }
                - configMapRef: { name: cluster-identity }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
            # User postgres (26) of the CNPG image: initdb needs a passwd entry. It reads what stage 1 made world-readable.
            - name: load
              image: ghcr.io/cloudnative-pg/postgresql:18.6
              command: ["python3", "-I", "/scripts/dump_load.py"]
              env:
                - { name: HOME, value: /tmp }
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 26
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore, readOnly: true }
                - { name: results, mountPath: /results }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 768Mi }
          containers:
            - name: publish
              image: docker.io/alpine/k8s:1.36.5
              command: ["python3", "/scripts/restore_cnpg.py", "--mode", "dump", "--publish"]
              env:
                - { name: HOME, value: /tmp }
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: results, mountPath: /results, readOnly: true }
                - { name: tmp, mountPath: /tmp }
                - { name: token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
