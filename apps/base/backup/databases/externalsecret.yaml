# The same material as backup/openbao/externalsecret.yaml, materialised in
# foundation-databases (Secrets do not cross namespaces).
# Sources : backup/restic + backup/s3-primary + backup/s3-replica (KV v2).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-restic-env
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backup-restic-env
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef: { key: backup/restic, property: password }
    - secretKey: PRIMARY_ENDPOINT
      remoteRef: { key: backup/s3-primary, property: endpoint }
    - secretKey: PRIMARY_BUCKET
      remoteRef: { key: backup/s3-primary, property: bucket }
    - secretKey: PRIMARY_ACCESS_KEY
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: PRIMARY_SECRET_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
    - secretKey: REPLICA_ENDPOINT
      remoteRef: { key: backup/s3-replica, property: endpoint }
    - secretKey: REPLICA_BUCKET
      remoteRef: { key: backup/s3-replica, property: bucket }
    - secretKey: REPLICA_ACCESS_KEY
      remoteRef: { key: backup/s3-replica, property: access_key }
    - secretKey: REPLICA_SECRET_KEY
      remoteRef: { key: backup/s3-replica, property: secret_key }
---
# The verifier's own key pairs, READ-ONLY (apps #148): it reads both stores and writes nothing (restic runs --no-lock).
# Sources: backup/s3-verify-primary + backup/s3-verify-replica (access_key, secret_key), seeded by the operator
# (OpenAether-infra backup-key-recipe.sh verify-primary|verify-replica). Only the two pairs: the endpoints, buckets and
# restic password still come from backup-restic-env. The verifier mounts this Secret as OPTIONAL after it,
# so a cluster without these paths keeps running on the write-capable pair (and says so in its log); the ExternalSecret
# stays NotReady there, nothing waits for it (the Kustomization has no health gate).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-verify-env
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backup-verify-env
    creationPolicy: Owner
    template:
      data:
        VERIFY_KEYS: read-only
        PRIMARY_ACCESS_KEY: "{{ .primary_access_key }}"
        PRIMARY_SECRET_KEY: "{{ .primary_secret_key }}"
        REPLICA_ACCESS_KEY: "{{ .replica_access_key }}"
        REPLICA_SECRET_KEY: "{{ .replica_secret_key }}"
  data:
    - secretKey: primary_access_key
      remoteRef: { key: backup/s3-verify-primary, property: access_key }
    - secretKey: primary_secret_key
      remoteRef: { key: backup/s3-verify-primary, property: secret_key }
    - secretKey: replica_access_key
      remoteRef: { key: backup/s3-verify-replica, property: access_key }
    - secretKey: replica_secret_key
      remoteRef: { key: backup/s3-verify-replica, property: secret_key }
