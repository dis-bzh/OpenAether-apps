# Backup quotidien des bases CNPG : pg_dump -Fc (zitadel-db, grafana-db)
# → restic → 2 S3 repositories (client encryption, see backup/openbao/cronjob.yaml).
#
# LOGICAL dumps (consistent, restorable cross-version through pg_restore),
# provider-agnostic — no PITR. barmanObjectStore PITR remains the documented
# cloud upgrade (apps/base/cnpg/cluster.yaml, commented block).
#
# DB creds: the ESO bootstrap Secrets (zitadel-db-app,
# grafana-db-credentials) carry ONLY username/password (verified e2e locally —
# NOT host/port/dbname like CNPG's auto-generated secrets). Host/db are pinned
# here: `<cluster>-rw` services and dbnames defined in the same brick
# (apps/base/cnpg/*.yaml). The owner is enough to dump its own database.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    app: cnpg-dump
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "47 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: cnpg-dump
            openaether.io/component: backup
        spec:
          serviceAccountName: cnpg-dump
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: zitadel-db-creds
              secret:
                secretName: zitadel-db-app
            - name: grafana-db-creds
              secret:
                secretName: grafana-db-credentials
          initContainers:
            # 1) Logical dumps — image aligned with the newer of the two
            #    Clusters (pg_dump 16.x dumpe les serveurs 16.x plus anciens).
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:16.3
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  dump() { # <nom> <host> <dbname> <credsdir>
                    name="$1"; PGHOST="$2"; PGDATABASE="$3"; creds="$4"
                    PGPORT=5432
                    PGUSER="$(cat "$creds/username")"
                    PGPASSWORD="$(cat "$creds/password")"
                    export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
                    echo "── dump ${name} (${PGHOST}/${PGDATABASE})"
                    pg_dump -Fc -f "/backup/${name}.dump"
                  }
                  dump zitadel-db zitadel-db-rw.foundation-databases.svc.cluster.local zitadel /creds/zitadel
                  dump grafana-db grafana-db-rw.foundation-databases.svc.cluster.local grafana /creds/grafana
                  ls -l /backup/
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Exigé PAR CONTENEUR par la policy require-security-context
                # (l'hériter du pod ne suffit pas) — sinon le Job est rejeté
                # à l'admission dès que Kyverno est actif.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
                - { name: zitadel-db-creds, mountPath: /creds/zitadel, readOnly: true }
                - { name: grafana-db-creds, mountPath: /creds/grafana, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
          containers:
            # 2) restic push to both repositories.
            - name: restic-push
              image: docker.io/restic/restic:0.18.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Repository prefix: without it, two clusters sharing a
                  # bucket se bloquent mutuellement (« already initialized »,
                  # since RESTIC_PASSWORD is not shared). `set -u` would be
                  # enough to fail, but not to explain why.
                  if [ -z "${CLUSTER_NAME:-}" ]; then
                    echo "ERREUR: CLUSTER_NAME vide — le ConfigMap cluster-identity"
                    echo "        du namespace est absent ou non substitué"
                    echo "        (cf. apps/flux/base/22a-backup-identity.yaml)."
                    exit 1
                  fi
                  export RESTIC_CACHE_DIR=/tmp/restic-cache
                  push() {
                    ep="$1"; bucket="$2"; label="$3"
                    export RESTIC_REPOSITORY="s3:${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    echo "── dépôt ${label}: ${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    # ⚠️ restic does NOT create the bucket (it MUST pre-exist —
                    # ensure-buckets on the infra side, the minio chart locally)
                    # and retries a NoSuchBucket for ~15 min silently → bounded probe.
                    if ! timeout 60 restic cat config >/dev/null 2>&1; then
                      # Two very different failures hide here:
                      #  • repository MISSING     → a legitimate init;
                      #  • repository PRESENT but unreadable (another cluster's
                      #    password: repositories outlive clusters, their
                      #    RESTIC_PASSWORD does not) → init fails with
                      #    "already initialized" and a decision is needed: purge
                      #    the prefix, or point at a distinct bucket/path.
                      init_err="$(restic init 2>&1)" || {
                        case "$init_err" in
                          *"already initialized"*)
                            echo "ERREUR: le dépôt ${label} existe déjà mais n'est PAS lisible avec ce RESTIC_PASSWORD."
                            echo "  → il appartient à un autre cluster. Soit purger s3://${bucket}/<préfixe>,"
                            echo "    soit donner à ce cluster un bucket (ou un chemin) qui lui est propre." ;;
                          *)
                            echo "ERREUR: init du dépôt ${label} impossible — le bucket ${bucket} existe-t-il ?"
                            echo "  $init_err" ;;
                        esac
                        exit 1
                      }
                    fi
                    restic unlock >/dev/null 2>&1 || true
                    restic backup /backup --host cnpg --tag cnpg-dump
                    restic forget --host cnpg \
                      --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune
                    restic check
                  }
                  AWS_ACCESS_KEY_ID="$PRIMARY_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$PRIMARY_SECRET_KEY" \
                    push "$PRIMARY_ENDPOINT" "$PRIMARY_BUCKET" primary
                  AWS_ACCESS_KEY_ID="$REPLICA_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$REPLICA_SECRET_KEY" \
                    push "$REPLICA_ENDPOINT" "$REPLICA_BUCKET" replica
                  echo "✅ dumps CNPG poussés vers 2 destinations"
              envFrom:
                - secretRef:
                    name: backup-restic-env
                # CLUSTER_NAME — restic repository prefix, so several clusters
                # can share a bucket without blocking each other.
                # Laid down by the backup-*-identity Kustomization (22a); read
                # here at RUNTIME, so no Flux substitution touches this file.
                - configMapRef:
                    name: cluster-identity
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Exigé PAR CONTENEUR par la policy require-security-context
                # (l'hériter du pod ne suffit pas) — sinon le Job est rejeté
                # à l'admission dès que Kyverno est actif.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
