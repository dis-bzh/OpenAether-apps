# Daily backup of the CNPG databases: pg_dump -Fc (zitadel-db, grafana-db)
# → restic → 2 S3 repositories (client encryption, see backup/openbao/cronjob.yaml).
#
# LOGICAL dumps (consistent, restorable cross-version through pg_restore),
# provider-agnostic — no PITR. barmanObjectStore PITR (active block of
# apps/base/cnpg/*cluster.yaml) lives next to this engine, it does not replace it.
#
# DB creds: the ESO bootstrap Secrets (zitadel-db-app,
# grafana-db-credentials) carry ONLY username/password (verified e2e locally —
# NOT host/port/dbname like CNPG's auto-generated secrets). Host/db are pinned
# here: `<cluster>-rw` services and dbnames defined in the same brick
# (apps/base/cnpg/*.yaml). The owner is enough to dump its own database.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    app: cnpg-dump
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "47 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: cnpg-dump
            openaether.io/component: backup
        spec:
          serviceAccountName: cnpg-dump
          automountServiceAccountToken: false
          # Never, not OnFailure: with OnFailure the Job controller deletes the pod when the backoff limit is reached, and the
          # log that says why the backup failed goes with it (lab 27 part B, D13: a table the dump role could not read, no pod,
          # no log). With Never every failed attempt stays as a Failed pod, up to failedJobsHistoryLimit Jobs.
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: zitadel-db-creds
              secret:
                secretName: zitadel-db-app
            - name: grafana-db-creds
              secret:
                secretName: grafana-db-credentials
          initContainers:
            # 1) Logical dumps. pg_dump refuses a server NEWER than itself, so
            #    this image must be >= the highest Cluster major (zitadel-db is
            #    on 18); an 18 client also dumps the 16 server (grafana-db).
            #    scripts/dev/check-pg-dump-version.sh enforces it in CI.
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  dump() { # <name> <host> <dbname> <credsdir>
                    name="$1"; PGHOST="$2"; PGDATABASE="$3"; creds="$4"
                    PGPORT=5432
                    PGUSER="$(cat "$creds/username")"
                    PGPASSWORD="$(cat "$creds/password")"
                    export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
                    echo "── dump ${name} (${PGHOST}/${PGDATABASE})"
                    pg_dump -Fc -f "/backup/${name}.dump"
                  }
                  dump zitadel-db zitadel-db-rw.foundation-databases.svc.cluster.local zitadel /creds/zitadel
                  dump grafana-db grafana-db-rw.foundation-databases.svc.cluster.local grafana /creds/grafana
                  ls -l /backup/
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Required PER CONTAINER by the require-security-context policy
                # (inheriting from the pod is not enough) — otherwise the Job is
                # rejected at admission as soon as Kyverno is active.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
                - { name: zitadel-db-creds, mountPath: /creds/zitadel, readOnly: true }
                - { name: grafana-db-creds, mountPath: /creds/grafana, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
          containers:
            # 2) restic push to both repositories.
            - name: restic-push
              image: docker.io/restic/restic:0.19.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Repository prefix: without it, two clusters sharing a
                  # bucket se bloquent mutuellement (« already initialized »,
                  # since RESTIC_PASSWORD is not shared). `set -u` would be
                  # enough to fail, but not to explain why.
                  if [ -z "${CLUSTER_NAME:-}" ]; then
                    echo "ERROR: CLUSTER_NAME empty — the ConfigMap cluster-identity"
                    echo "        of the namespace is missing or unsubstituted"
                    echo "        (cf. apps/flux/base/22a-backup-identity.yaml)."
                    exit 1
                  fi
                  export RESTIC_CACHE_DIR=/tmp/restic-cache
                  retention_failed=0
                  # A destination that fails must not keep the other from receiving its copy (the replica exists for the day
                  # the primary store is down): failures are recorded and fail the Job last.
                  dest_failed=0
                  push() {
                    ep="$1"; bucket="$2"; label="$3"
                    export RESTIC_REPOSITORY="s3:${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    echo "── repository ${label}: ${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    # ⚠️ restic does NOT create the bucket (it MUST pre-exist —
                    # ensure-buckets on the infra side, the minio chart locally)
                    # and retries a NoSuchBucket for ~15 min silently → bounded probe.
                    # a stale lock (a pod killed during forget --prune) makes `cat config` fail and would pass for a foreign repository: unlock removes stale locks only
                    restic unlock >/dev/null 2>&1 || true
                    if ! timeout 60 restic cat config >/dev/null 2>&1; then
                      # Two very different failures hide here:
                      #  • repository MISSING     → a legitimate init;
                      #  • repository PRESENT but unreadable (another cluster's
                      #    password: repositories outlive clusters, their
                      #    RESTIC_PASSWORD does not) → init fails with
                      #    "already initialized" and a decision is needed: purge
                      #    the prefix, or point at a distinct bucket/path.
                      init_err="$(restic init 2>&1)" || {
                        case "$init_err" in
                          *"already initialized"*)
                            echo "ERROR: repository ${label} already exists but is NOT readable with this RESTIC_PASSWORD."
                            echo "  → it belongs to another cluster. Either purge s3://${bucket}/<prefix>,"
                            echo "    or give this cluster a bucket (or path) of its own." ;;
                          *)
                            echo "ERROR: cannot init repository ${label} — does bucket ${bucket} exist?"
                            echo "  $init_err" ;;
                        esac
                        dest_failed=1; return 0
                      }
                    fi
                    restic unlock >/dev/null 2>&1 || true
                    # restic 0.19 exit codes: 3 = the snapshot is incomplete (a source path is missing
                    # or unreadable), or `forget` could not remove snapshots; 130 = SIGINT. A missing or
                    # partial snapshot must fail the Job; a failed retention must not stop the other
                    # repository from receiving its snapshot, so it is only recorded and fails the Job last.
                    rc=0
                    restic backup /backup --host cnpg --tag cnpg-dump || rc=$?
                    if [ "$rc" -ne 0 ]; then
                      echo "ERROR: restic backup exited $rc on ${label} (3 = incomplete snapshot, 130 = interrupted)"
                      [ "$rc" -eq 130 ] && exit 130
                      dest_failed=1; return 0
                    fi
                    rc=0
                    restic forget --host cnpg \
                      --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune || rc=$?
                    if [ "$rc" -ne 0 ]; then
                      echo "ERROR: retention (forget --prune) exited $rc on ${label}; the new snapshot is written"
                      [ "$rc" -eq 130 ] && exit 130
                      retention_failed=1
                    fi
                    restic check || { echo "ERROR: restic check failed on ${label}"; dest_failed=1; }
                  }
                  AWS_ACCESS_KEY_ID="$PRIMARY_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$PRIMARY_SECRET_KEY" \
                    push "$PRIMARY_ENDPOINT" "$PRIMARY_BUCKET" primary
                  AWS_ACCESS_KEY_ID="$REPLICA_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$REPLICA_SECRET_KEY" \
                    push "$REPLICA_ENDPOINT" "$REPLICA_BUCKET" replica
                  [ "$dest_failed" -eq 0 ] || { echo "ERROR: at least one destination did not get its snapshot or failed its check"; exit 1; }
                  [ "$retention_failed" -eq 0 ] || { echo "ERROR: retention failed on at least one repository"; exit 1; }
                  echo "✅ CNPG dumps pushed to both destinations"
              envFrom:
                - secretRef:
                    name: backup-restic-env
                # CLUSTER_NAME — restic repository prefix, so several clusters
                # can share a bucket without blocking each other.
                # Laid down by the backup-*-identity Kustomization (22a); read
                # here at RUNTIME, so no Flux substitution touches this file.
                - configMapRef:
                    name: cluster-identity
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Required PER CONTAINER by the require-security-context policy
                # (inheriting from the pod is not enough) — otherwise the Job is
                # rejected at admission as soon as Kyverno is active.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
