# Backup quotidien des bases CNPG : pg_dump -Fc (zitadel-db, grafana-db)
# → restic → 2 dépôts S3 (chiffrement client, cf. backup/openbao/cronjob.yaml).
#
# Dumps LOGIQUES (cohérents, restaurables cross-version via pg_restore),
# provider-agnostiques — pas de PITR. Le PITR barmanObjectStore reste
# l'upgrade cloud documenté (apps/base/cnpg/cluster.yaml, bloc commenté).
#
# Creds DB : les Secrets de bootstrap ESO (zitadel-db-app,
# grafana-db-credentials) ne portent QUE username/password (vérifié e2e local
# — PAS host/port/dbname comme les secrets auto-générés CNPG). Host/db sont
# fixés ici : services `<cluster>-rw` et dbnames définis dans la même brique
# (apps/base/cnpg/*.yaml). L'owner suffit pour dumper sa base.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    app: cnpg-dump
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "47 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: cnpg-dump
            openaether.io/component: backup
        spec:
          serviceAccountName: cnpg-dump
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: zitadel-db-creds
              secret:
                secretName: zitadel-db-app
            - name: grafana-db-creds
              secret:
                secretName: grafana-db-credentials
          initContainers:
            # 1) Dumps logiques — image alignée sur la plus récente des deux
            #    Clusters (pg_dump 16.x dumpe les serveurs 16.x plus anciens).
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:16.3
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  dump() { # <nom> <host> <dbname> <credsdir>
                    name="$1"; PGHOST="$2"; PGDATABASE="$3"; creds="$4"
                    PGPORT=5432
                    PGUSER="$(cat "$creds/username")"
                    PGPASSWORD="$(cat "$creds/password")"
                    export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
                    echo "── dump ${name} (${PGHOST}/${PGDATABASE})"
                    pg_dump -Fc -f "/backup/${name}.dump"
                  }
                  dump zitadel-db zitadel-db-rw.foundation-databases.svc.cluster.local zitadel /creds/zitadel
                  dump grafana-db grafana-db-rw.foundation-databases.svc.cluster.local grafana /creds/grafana
                  ls -l /backup/
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Exigé PAR CONTENEUR par la policy require-security-context
                # (l'hériter du pod ne suffit pas) — sinon le Job est rejeté
                # à l'admission dès que Kyverno est actif.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
                - { name: zitadel-db-creds, mountPath: /creds/zitadel, readOnly: true }
                - { name: grafana-db-creds, mountPath: /creds/grafana, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
          containers:
            # 2) Push restic vers les 2 dépôts.
            - name: restic-push
              image: docker.io/restic/restic:0.18.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Préfixe de dépôt : sans lui, deux clusters partageant un
                  # bucket se bloquent mutuellement (« already initialized »,
                  # le RESTIC_PASSWORD n'étant pas partagé). `set -u` suffirait
                  # à échouer, mais pas à expliquer pourquoi.
                  if [ -z "${CLUSTER_NAME:-}" ]; then
                    echo "ERREUR: CLUSTER_NAME vide — le ConfigMap cluster-identity"
                    echo "        du namespace est absent ou non substitué"
                    echo "        (cf. apps/flux/base/22a-backup-identity.yaml)."
                    exit 1
                  fi
                  export RESTIC_CACHE_DIR=/tmp/restic-cache
                  push() {
                    ep="$1"; bucket="$2"; label="$3"
                    export RESTIC_REPOSITORY="s3:${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    echo "── dépôt ${label}: ${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    # ⚠️ restic ne crée PAS le bucket (il DOIT préexister —
                    # ensure-buckets côté infra, chart minio en local) et retry
                    # un NoSuchBucket ~15 min en silence → probe borné.
                    if ! timeout 60 restic cat config >/dev/null 2>&1; then
                      # Deux échecs très différents se cachent ici :
                      #  • dépôt ABSENT           → init légitime ;
                      #  • dépôt EXISTANT mais illisible (mot de passe d'un
                      #    AUTRE cluster : les dépôts survivent aux clusters,
                      #    pas leur RESTIC_PASSWORD) → init échoue avec
                      #    "already initialized" et il faut trancher : purger
                      #    le préfixe, ou pointer un bucket/chemin distinct.
                      init_err="$(restic init 2>&1)" || {
                        case "$init_err" in
                          *"already initialized"*)
                            echo "ERREUR: le dépôt ${label} existe déjà mais n'est PAS lisible avec ce RESTIC_PASSWORD."
                            echo "  → il appartient à un autre cluster. Soit purger s3://${bucket}/<préfixe>,"
                            echo "    soit donner à ce cluster un bucket (ou un chemin) qui lui est propre." ;;
                          *)
                            echo "ERREUR: init du dépôt ${label} impossible — le bucket ${bucket} existe-t-il ?"
                            echo "  $init_err" ;;
                        esac
                        exit 1
                      }
                    fi
                    restic unlock >/dev/null 2>&1 || true
                    restic backup /backup --host cnpg --tag cnpg-dump
                    restic forget --host cnpg \
                      --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune
                    restic check
                  }
                  AWS_ACCESS_KEY_ID="$PRIMARY_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$PRIMARY_SECRET_KEY" \
                    push "$PRIMARY_ENDPOINT" "$PRIMARY_BUCKET" primary
                  AWS_ACCESS_KEY_ID="$REPLICA_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$REPLICA_SECRET_KEY" \
                    push "$REPLICA_ENDPOINT" "$REPLICA_BUCKET" replica
                  echo "✅ dumps CNPG poussés vers 2 destinations"
              envFrom:
                - secretRef:
                    name: backup-restic-env
                # CLUSTER_NAME — préfixe des dépôts restic, pour que plusieurs
                # clusters puissent partager un bucket sans se bloquer.
                # Posé par la Kustomization backup-*-identity (22a) ; lu ici au
                # RUNTIME, donc aucune substitution Flux ne touche ce fichier.
                - configMapRef:
                    name: cluster-identity
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Exigé PAR CONTENEUR par la policy require-security-context
                # (l'hériter du pod ne suffit pas) — sinon le Job est rejeté
                # à l'admission dès que Kyverno est actif.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
