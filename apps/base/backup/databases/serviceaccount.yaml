# SA of the CNPG dumps — no k8s API nor OpenBao access (credentials come from mounted Secrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    app: cnpg-dump
    openaether.io/managed: "true"
    openaether.io/component: backup
automountServiceAccountToken: false
