# SA des dumps CNPG — aucun accès API k8s ni OpenBao (creds via Secrets montés).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    app: cnpg-dump
    openaether.io/managed: "true"
    openaether.io/component: backup
automountServiceAccountToken: false
