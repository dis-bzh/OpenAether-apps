# Egress of the CNPG dump pod (default-deny posture).
# DB ingress :5432 is already covered by the intra-namespace rule of
# cnpg/networkpolicy-db-restricted.yaml (selector namespace-only).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "Backup CNPG: egress DNS + Postgres 5432 + S3 providers/MinIO"
  endpointSelector:
    matchLabels:
      app: cnpg-dump
  egress:
    # DNS — rules.dns is MANDATORY for the toFQDNs to match (DNS proxy),
    # cf. backup/openbao/networkpolicy.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Postgres instances (same namespace)
    - toEndpoints:
        - matchExpressions:
            - key: "cnpg.io/cluster"
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Cloud S3 (HTTPS) — narrowed to the providers' FQDNs (no toEntities:world).
    - toFQDNs:
        - matchName: s3.fr-par.scw.cloud          # Scaleway Object Storage
        - matchName: s3.eu-west-par.io.cloud.ovh.net  # OVH (aligné tfvars eu-west-par)
        - matchName: oos.eu-west-2.outscale.com   # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # MinIO S3 (local uniquement). ⚠️ chart minio 5.2.0 = label legacy
    # `app: minio` (see backup/openbao/networkpolicy.yaml) — both forms.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app: minio
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
