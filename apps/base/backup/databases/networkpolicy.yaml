# Egress of the CNPG dump pod (default-deny posture).
# DB ingress :5432 is already covered by the intra-namespace rule of
# cnpg/networkpolicy-db-restricted.yaml (selector namespace-only).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-dump
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "Backup CNPG: egress DNS + Postgres 5432 + S3 providers/MinIO"
  endpointSelector:
    matchLabels:
      app: cnpg-dump
  egress:
    # DNS — rules.dns is MANDATORY for the toFQDNs to match (DNS proxy),
    # cf. backup/openbao/networkpolicy.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Postgres instances (same namespace)
    - toEndpoints:
        - matchExpressions:
            - key: "cnpg.io/cluster"
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Cloud S3 (HTTPS) — narrowed to the providers' FQDNs (no toEntities:world).
    - toFQDNs:
        # Every region of the provider, not one host: a real OVH config uses s3.gra.io.cloud.ovh.net, which the
        # former single-host rule dropped (apps #53, seen on a real OVH cluster). `*` stays inside one DNS label.
        - matchPattern: "s3.*.scw.cloud"          # Scaleway Object Storage
        - matchPattern: "s3.*.io.cloud.ovh.net"   # OVH Object Storage (standard class)
        - matchPattern: "oos.*.outscale.com"      # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # MinIO S3 (local only). ⚠️ minio chart 5.2.0 = legacy label
    # `app: minio` (see backup/openbao/networkpolicy.yaml) — both forms.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app: minio
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# cnpg-store-replicate: reads the primary store, writes the replica store, nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-store-replicate
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "CNPG store replication: egress DNS + the provider S3 endpoints (443)"
  endpointSelector:
    matchLabels:
      app: cnpg-store-replicate
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchPattern: "s3.*.scw.cloud"          # Scaleway Object Storage
        - matchPattern: "s3.*.io.cloud.ovh.net"   # OVH Object Storage (standard class)
        - matchPattern: "oos.*.outscale.com"      # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# backup-verify: reads both stores and the Kubernetes API (stage 3 patches one ConfigMap, reads Longhorn backups).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-verify
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "Backup verifier: egress DNS + the provider S3 endpoints (443) + kube-apiserver"
  endpointSelector:
    matchLabels:
      app: backup-verify
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchPattern: "s3.*.scw.cloud"          # Scaleway Object Storage
        - matchPattern: "s3.*.io.cloud.ovh.net"   # OVH Object Storage (standard class)
        - matchPattern: "oos.*.outscale.com"      # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The exporter: vmagent scrapes 9101, nobody else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-verify-exporter
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "Backup verifier exporter: ingress 9101 from vmagent only"
  endpointSelector:
    matchLabels:
      app: backup-verify-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": services-observability
            "app.kubernetes.io/name": vmagent
      toPorts:
        - ports:
            - port: "9101"
              protocol: TCP
---
# cnpg-canary: writes one row into the two databases and talks to nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-canary
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  description: "CNPG canary writer: egress DNS + Postgres 5432 of the two clusters"
  endpointSelector:
    matchLabels:
      app: cnpg-canary
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchExpressions:
            - key: "cnpg.io/cluster"
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
