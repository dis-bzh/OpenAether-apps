apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - externalsecret.yaml
  - cronjob.yaml
  - restore-test-cronjob.yaml
  - cnpg-store-replicate-cronjob.yaml
  - canary-cronjob.yaml
  - verify-rbac.yaml
  - verify-cronjob.yaml
  - verify-exporter.yaml
  - networkpolicy.yaml
# The verifier's scripts are files (tested as such), mounted read-only; the hash suffix rolls the next run on a change.
configMapGenerator:
  - name: backup-verify-scripts
    # the Flux Kustomization has no targetNamespace: without this the apply fails (lab 19)
    namespace: foundation-databases
    files:
      - verify/restic-stage.sh
      - verify/barman_check.py
      - verify/collect.py
# The restore tests' scripts (0.4.0 M3): the canary writer, the two stages of the CNPG restore test, and the exporter.
  - name: backup-restore-scripts
    namespace: foundation-databases
    files:
      - restore/canary-write.sh
      - restore/source-snapshot.sh
      - restore/snapshot.sql
      - restore/restore_cnpg.py
      - restore/serve_metrics.py
