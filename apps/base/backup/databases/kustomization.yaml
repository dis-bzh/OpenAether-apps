apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - externalsecret.yaml
  - cronjob.yaml
  - restore-test-cronjob.yaml
  - cnpg-store-replicate-cronjob.yaml
  - verify-rbac.yaml
  - verify-cronjob.yaml
  - verify-exporter.yaml
  - networkpolicy.yaml
# The verifier's scripts are files (tested as such), mounted read-only; the hash suffix rolls the next run on a change.
configMapGenerator:
  - name: backup-verify-scripts
    namespace: foundation-databases   # the Flux Kustomization has no targetNamespace: without this the apply fails (lab 19)
    files:
      - verify/restic-stage.sh
      - verify/barman_check.py
      - verify/collect.py
