# Monthly RESTORE test — the only proof that a backup is usable.
#
# `restic check` (run on every backup) only reads the METADATA: it says the index
# is consistent, not that the data is readable or decryptable.
# A repository can pass `check` green and still be unrecoverable (bit-rot on the
# packs, wrong RESTIC_PASSWORD, truncated S3 objects).
#
# This Job, against EACH of the 2 destinations:
#   1. `restic check --read-data-subset` — actually re-reads and decrypts a
#      fraction of the data (5 %, naturally rotating month over month);
#   2. `restic restore latest` into a throwaway volume (init container), then
#      checks that the result is NOT EMPTY — that is the end-to-end test;
#   3. `pg_restore --list` on every restored dump (main container, Postgres
#      image): a dump that restic hands back byte for byte but that Postgres
#      cannot read is as lost as a missing one. It reads the archive TOC only;
#      the data itself is never loaded into a database (nothing in this Job
#      holds a database credential).
# A failure here is as serious as a missing backup: it shows through the alert
# BackupJobFailed (apps/base/observability/vm-customresources/vmrule-backup.yaml).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-dump-restore-test
  namespace: foundation-databases
  labels:
    app: cnpg-dump-restore-test
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  schedule: "53 4 1 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            # ⚠️ ALSO carries `app: cnpg-dump`: that is the label selected by the
            # CiliumNetworkPolicy that opens S3 egress (networkpolicy.yaml).
            # Without it the pod has no egress and the test fails on timeout.
            app: cnpg-dump
            component: restore-test
            openaether.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            # 1) restic: check + restore of BOTH repositories into /restore.
            - name: restic-restore
              image: docker.io/restic/restic:0.18.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  if [ -z "${CLUSTER_NAME:-}" ]; then
                    echo "ERROR: CLUSTER_NAME empty — ConfigMap cluster-identity is missing."
                    exit 1
                  fi
                  export RESTIC_CACHE_DIR=/tmp/restic-cache
                  # Both restores stay on the `restore` volume (the next container reads them), whose
                  # sizeLimit is 2Gi: past it kubelet evicts the pod with no message. Say it instead.
                  limit_mib=1800; used_mib=0
                  verify() {
                    ep="$1"; bucket="$2"; label="$3"
                    export RESTIC_REPOSITORY="s3:${ep}/${bucket}/${CLUSTER_NAME}/cnpg"
                    echo "── repository ${label}: ${RESTIC_REPOSITORY}"
                    # A real re-read of a fraction of the data (decryption included).
                    restic check --read-data-subset=5%
                    bytes="$(restic stats --json --host cnpg latest | sed -n 's/.*"total_size":\([0-9][0-9]*\).*/\1/p')"
                    if [ -z "$bytes" ]; then
                      echo "ERROR: could not read the size of the latest snapshot of repository ${label}."
                      exit 1
                    fi
                    used_mib=$((used_mib + bytes / 1048576 + 1))
                    if [ "$used_mib" -gt "$limit_mib" ]; then
                      echo "ERROR: the restores need ${used_mib} MiB, the volume holds ${limit_mib}:"
                      echo "        raise the sizeLimit of the restore volume and limit_mib together."
                      exit 1
                    fi
                    target="/restore/${label}"
                    rm -rf "$target"; mkdir -p "$target"
                    restic restore latest --host cnpg --target "$target"
                    # A "successful" but empty restore = an unusable repository.
                    if [ -z "$(find "$target" -type f -print -quit)" ]; then
                      echo "ERROR: EMPTY restore from repository ${label} —"
                      echo "        the backup is NOT usable."
                      exit 1
                    fi
                    echo "   ✓ ${label}: $(find "$target" -type f | wc -l) file(s) restored"
                  }
                  AWS_ACCESS_KEY_ID="$PRIMARY_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$PRIMARY_SECRET_KEY" \
                    verify "$PRIMARY_ENDPOINT" "$PRIMARY_BUCKET" primary
                  AWS_ACCESS_KEY_ID="$REPLICA_ACCESS_KEY" \
                    AWS_SECRET_ACCESS_KEY="$REPLICA_SECRET_KEY" \
                    verify "$REPLICA_ENDPOINT" "$REPLICA_BUCKET" replica
              envFrom:
                - secretRef:
                    name: backup-restic-env
                - configMapRef:
                    name: cluster-identity
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                # Required PER CONTAINER by the require-security-context policy.
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: restore, mountPath: /restore }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
          containers:
            # 2) Postgres: every restored dump must be readable by pg_restore.
            #    The client major must be >= the one that wrote the dump (same
            #    rule as cronjob.yaml, enforced by scripts/dev/check-pg-dump-version.sh).
            - name: pg-restore-list
              image: ghcr.io/cloudnative-pg/postgresql:18.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  for label in primary replica; do
                    for db in zitadel-db grafana-db; do
                      f="$(find "/restore/${label}" -type f -name "${db}.dump" | head -n 1)"
                      if [ -z "$f" ]; then
                        echo "ERROR: ${db}.dump is missing from repository ${label}:"
                        echo "        the latest snapshot is incomplete."
                        exit 1
                      fi
                      # Archive TOC only: fails on a truncated or corrupt dump,
                      # and on a dump newer than this pg_restore.
                      pg_restore --list "$f" > /tmp/toc
                      n="$(grep -c '^[0-9][0-9]*;' /tmp/toc || true)"
                      if [ "$n" -lt 1 ]; then
                        echo "ERROR: ${db}.dump from ${label} lists no entry."
                        exit 1
                      fi
                      echo "   ✓ ${label}/${db}: pg_restore reads the archive (${n} TOC entries)"
                    done
                  done
                  echo "✅ CNPG dumps: restore verified on both destinations"
              securityContext:
                capabilities: { drop: ["ALL"] }
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: restore, mountPath: /restore, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
          volumes:
            # Throwaway: the restore must leave NOTHING behind.
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
            # Both repositories' restores at once; the script refuses past 1800 MiB (limit_mib).
            - name: restore
              emptyDir: { sizeLimit: 2Gi }
