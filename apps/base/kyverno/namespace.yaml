apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    # NO istio.io/dataplane-mode: ambient — an admission webhook control plane.
    # The kube-apiserver calls kyverno-svc:443 (mutate/validate). In ambient mode,
    # ztunnel wants HBONE/15008, blocked by CiliumNetworkPolicy → Cilium DROP =
    # "operation not permitted" (EPERM) → every object creation subject to the
    # webhook fails (dry-run included). An admission webhook MUST be reachable
    # by the apiserver outside the mesh. Same reason as cert-manager/external-secrets.
    # baseline: the Kyverno background-controller uses hostPID for some operations.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "kyverno"
