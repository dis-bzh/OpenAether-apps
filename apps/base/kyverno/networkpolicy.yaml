# OpenAether 0.5.0 — Kyverno NetworkPolicy
# The Kyverno webhook listens on port 9443 (kubebuilder standard).
# Le Service kyverno-webhook expose 443 → 9443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "kyverno"
spec:
  description: "Kyverno webhook: ingress kube-apiserver sur webhook:9443,
    egress DNS + kube-api."
  endpointSelector:
    # The kyverno v1.12 chart does NOT set app.kubernetes.io/name — the pods
    # portent app.kubernetes.io/part-of=kyverno (+ /component=<role>). Un
    # a selector on /name matched NO pod → the CNP never applied →
    # apiserver→webhook:9443 dropped by the default-deny (policymutate timeout).
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  ingress:
    # kube-apiserver → webhook Kyverno (ValidatingWebhookConfiguration / MutatingWebhookConfiguration)
    # Port standard kubebuilder 9443.
    # remote-node: on Talos the static kube-apiserver pod is identified by Cilium
    # as a node (node identity), not as the kube-apiserver entity.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # intra-namespace: controller → webhook (cert rotation)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kyverno
            app.kubernetes.io/name: kyverno
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver