apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-runasnonroot
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - capi-operator-system
              - cnpg-system
              - cert-manager
              # Mesh Istio : charts upstream (istiod, ztunnel) qui ne posent pas
              # runAsNonRoot:true explicitement et requièrent des privilèges réseau.
              - istio-system
              - foundation-service-mesh
              # Gateway Istio : istiod génère AUTO le Deployment Envoy
              # (openaether-gateway-istio) qui ne pose pas runAsNonRoot:true → bloqué
              # → Gateway jamais Programmed (pas d'Envoy/LB), constaté Scaleway juin 2026.
              - services-gateway
              # Observability : charts upstream Grafana/Loki/Alloy/KSM/node-exporter/
              # vm-operator. node-exporter (hostPath/hostNetwork) tourne légitimement
              # root ; les autres ne posent pas tous runAsNonRoot:true explicitement →
              # rejet à l'admission (6 HelmReleases bloquées en "Helm install failed",
              # constaté Scaleway juin 2026). Exclusion large pour débloquer le monitoring.
              # Passe 2 (durcissement) : resserrer via les securityContext Helm là où
              # le chart le permet (Grafana peut tourner non-root) plutôt que l'exclusion.
              - services-observability
      validate:
        message: "Running as root is not allowed."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
            - securityContext:
                runAsNonRoot: true
