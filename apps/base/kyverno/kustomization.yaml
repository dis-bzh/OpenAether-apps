apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
  - pdb.yaml
  # VENDORED install.yaml of Kyverno v1.19.1, unmodified (the dump is replaced whole on re-vendoring, every local
  # change is a patch below):
  #   https://github.com/kyverno/kyverno/releases/download/v1.19.1/install.yaml
  #   sha256 of the vendored file: d3322cb346d3d42dd0f41e230b0d1d7bc5619960e1c36fdac4d9151d724b88e6
  #
  # Same shape as `cnpg-*.yaml`: no remote fetch, a render reproducible offline, a hash recorded in
  # apps/vendored-dumps.sha256. 1.19 is the last line that serves kyverno.io/v1 ClusterPolicy (removed in 1.20): the
  # repo's policies must move to policies.kyverno.io before the next minor.
  #
  # To upgrade: download the new install.yaml, replace this file, update the sha256 above and in the lock
  # (scripts/dev/check-vendored-lock.sh --update), re-run scripts/dev/test-kyverno-policies.sh with the matching CLI.
  - kyverno-1.19.1.yaml

patches:
  # CPU limits for the four controllers (the vendored file bounds memory, not CPU). FT082-R10.
  # NOT measured on a cluster: 1 CPU for the admission webhook (a throttled webhook times out the API server's
  # requests), 500m for the others. Tighten from `kubectl top pod -n kyverno` (LAB-CHECKLIST B21).
  - path: patch-cpu-limits.yaml
  - path: patch-ha.yaml
  # The kyverno Namespace is ALREADY declared by install.yaml (vendored file).
  # Redeclaring it under resources: causes "may not add resource with an
  # already registered id: Namespace/kyverno". Our labels (Istio ambient + PSS
  # + openaether.io/*) are therefore applied with a strategic-merge patch on the
  # existing namespace — namespace.yaml is no longer a resource.
  - path: namespace.yaml
    target:
      kind: Namespace
      name: kyverno
  # PolicyException is off in the dump (--enablePolicyException=false) and no PolicyException is shipped. If it is ever
  # switched on, exceptions are accepted in this namespace only: the upstream default for an empty value is "none
  # configured", and "*" would let any namespace's owner exempt itself from a policy (CVE-2024-48921, fixed in 1.13).
  - target:
      kind: Deployment
      name: kyverno-admission-controller
    patch: &exception-ns |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --exceptionNamespace=kyverno
  - target:
      kind: Deployment
      name: kyverno-background-controller
    patch: *exception-ns
  - target:
      kind: Deployment
      name: kyverno-reports-controller
    patch: *exception-ns
