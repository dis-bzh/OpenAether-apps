apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
  # v1.12.1: fix upstream du panic reports-controller backReconcile
  # "index out of range [0] with length 0" (kyverno#10123, PR #10148).
  # v1.12.0 → CrashLoop du reports-controller (agrégation cpolr seulement,
  # admission/enforce non impacté, mais bruit + reports cluster manquants).
  - https://github.com/kyverno/kyverno/releases/download/v1.12.1/install.yaml
  - policies.yaml

patches:
  # Le Namespace kyverno est DÉJÀ déclaré par install.yaml (base distante).
  # Le re-déclarer dans resources: provoque "may not add resource with an
  # already registered id: Namespace/kyverno". On applique donc nos labels
  # (Istio ambient + PSS + openaether.io/*) via un strategic-merge patch sur
  # le namespace existant — namespace.yaml n'est plus une resource.
  - path: namespace.yaml
    target:
      kind: Namespace
      name: kyverno
  - target:
      kind: CronJob
      name: kyverno-cleanup-admission-reports
      namespace: kyverno
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: alpine:3.19
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/2
        value: |
          wget -qO /tmp/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl && \
          chmod +x /tmp/kubectl && \
          export PATH=/tmp:$PATH && \
          COUNT=$(kubectl get admissionreports.kyverno.io -A | wc -l)
          if [ "$COUNT" -gt 10000 ]; then
            echo "too many reports found ($COUNT), cleaning up..."
            kubectl delete admissionreports.kyverno.io -A -l='!audit.kyverno.io/report.aggregate'
          else
            echo "($COUNT) reports found, no clean up needed"
          fi
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/securityContext/runAsUser
        value: 65534
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts
        value:
          - mountPath: /tmp
            name: tmp
  - target:
      kind: CronJob
      name: kyverno-cleanup-cluster-admission-reports
      namespace: kyverno
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: alpine:3.19
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/2
        value: |
          wget -qO /tmp/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl && \
          chmod +x /tmp/kubectl && \
          export PATH=/tmp:$PATH && \
          COUNT=$(kubectl get clusteradmissionreports.kyverno.io -A | wc -l)
          if [ "$COUNT" -gt 10000 ]; then
            echo "too many reports found ($COUNT), cleaning up..."
            kubectl delete clusteradmissionreports.kyverno.io -A -l='!audit.kyverno.io/report.aggregate'
          else
            echo "($COUNT) reports found, no clean up needed"
          fi
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/securityContext/runAsUser
        value: 65534
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts
        value:
          - mountPath: /tmp
            name: tmp
