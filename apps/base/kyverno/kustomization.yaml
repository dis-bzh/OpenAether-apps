apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
  # VENDORED from https://github.com/kyverno/kyverno/releases/download/v1.18.2/install.yaml
  #   sha256 888e26a13fa34b72d6fc321e4b29af4857539f46f89b606f624fddb518db4ebf
  #
  # This resource was a remote URL until 2026-07-27: Flux reconciliation then
  # depended on GitHub's availability, the render was not reproducible offline,
  # and nothing verified the downloaded artifact's integrity. Same reason — and
  # same shape — as the vendoring of `cnpg-1.23.1.yaml` ("avoids a remote fetch
  # (DNS/IPv6)"), of `cilium.yaml` and of `flux-install.yaml` on the infra side.
  # The render was verified IDENTICAL before and after the switch.
  #
  #
  # v1.12.1 : fix upstream du panic reports-controller backReconcile
  # "index out of range [0] with length 0" (kyverno#10123, PR #10148).
  # v1.12.0 → reports-controller CrashLoop (cpolr aggregation only,
  # admission/enforce unaffected, but noisy and cluster reports missing).
  #
  # To upgrade: download the new install.yaml, replace this file, update the
  # sha256 above, and replay the render diff.
  - kyverno-1.12.1.yaml

patches:
  # The kyverno Namespace is ALREADY declared by install.yaml (vendored file).
  # Redeclaring it under resources: causes "may not add resource with an
  # already registered id: Namespace/kyverno". Our labels (Istio ambient + PSS
  # + openaether.io/*) are therefore applied with a strategic-merge patch on the
  # existing namespace — namespace.yaml is no longer a resource.
  - path: namespace.yaml
    target:
      kind: Namespace
      name: kyverno
  - target:
      kind: CronJob
      name: kyverno-cleanup-admission-reports
      namespace: kyverno
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: alpine:3.19
      # The vendored manifest's image (bitnami/kubectl) has bash; alpine
      # doesn't ship it by default. The script below is plain POSIX sh
      # (no bashisms) — just needed the interpreter swapped to match.
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/0
        value: /bin/sh
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/2
        value: |
          wget -qO /tmp/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl && \
          chmod +x /tmp/kubectl && \
          export PATH=/tmp:$PATH && \
          COUNT=$(kubectl get admissionreports.kyverno.io -A | wc -l)
          if [ "$COUNT" -gt 10000 ]; then
            echo "too many reports found ($COUNT), cleaning up..."
            kubectl delete admissionreports.kyverno.io -A -l='!audit.kyverno.io/report.aggregate'
          else
            echo "($COUNT) reports found, no clean up needed"
          fi
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/securityContext/runAsUser
        value: 65534
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts
        value:
          - mountPath: /tmp
            name: tmp
  - target:
      kind: CronJob
      name: kyverno-cleanup-cluster-admission-reports
      namespace: kyverno
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: alpine:3.19
      # The vendored manifest's image (bitnami/kubectl) has bash; alpine
      # doesn't ship it by default. The script below is plain POSIX sh
      # (no bashisms) — just needed the interpreter swapped to match.
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/0
        value: /bin/sh
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/2
        value: |
          wget -qO /tmp/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl && \
          chmod +x /tmp/kubectl && \
          export PATH=/tmp:$PATH && \
          COUNT=$(kubectl get clusteradmissionreports.kyverno.io -A | wc -l)
          if [ "$COUNT" -gt 10000 ]; then
            echo "too many reports found ($COUNT), cleaning up..."
            kubectl delete clusteradmissionreports.kyverno.io -A -l='!audit.kyverno.io/report.aggregate'
          else
            echo "($COUNT) reports found, no clean up needed"
          fi
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/securityContext/runAsUser
        value: 65534
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts
        value:
          - mountPath: /tmp
            name: tmp
