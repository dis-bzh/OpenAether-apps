# Lab 22: with 500m the background and reports controllers were throttled 89-97% of the CPU periods once a few hundred
# PolicyReport results existed (after node losses), missed their lease renewal ("client rate limiter Wait returned an
# error", "leadership lost") and restarted in a loop (kyverno-reports-controller already in lab 21). They get 2 CPUs;
# usage stays near 0.3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
spec:
  template:
    spec:
      containers:
        - name: kyverno
          resources:
            limits:
              cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-background-controller
  namespace: kyverno
spec:
  template:
    spec:
      containers:
        - name: controller
          resources:
            limits:
              cpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-cleanup-controller
  namespace: kyverno
spec:
  template:
    spec:
      containers:
        - name: controller
          resources:
            limits:
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-reports-controller
  namespace: kyverno
spec:
  template:
    spec:
      containers:
        - name: controller
          resources:
            limits:
              cpu: "2"
