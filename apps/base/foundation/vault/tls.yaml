# Certificat TLS du listener OpenBao.
#
# La CHAÎNE DE CA vit dans `apps/base/foundation/vault-ca` (brique séparée,
# namespace `cert-manager`) — voir l'explication détaillée là-bas. Elle ne peut
# pas rester ici : le `namespace: foundation-vault` de ce kustomization
# écraserait son namespace et le ClusterIssuer openbao ne la trouverait plus.
#
# ⚠️ Les SANs couvrent TROIS familles de noms, et il en manque une = le cluster
# ne monte pas :
#   1. le Service stable  → clients (ESO, cert-manager, backup) ;
#   2. les noms PAR POD du headless → `retry_join` entre réplicas raft ;
#   3. `127.0.0.1` / `localhost` → probes et scripts du conteneur.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-tls
  namespace: foundation-vault
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  secretName: openbao-server-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: openbao-ca
    kind: ClusterIssuer
  commonName: openbao.foundation-vault.svc.cluster.local
  dnsNames:
  - openbao
  - openbao.foundation-vault
  - openbao.foundation-vault.svc
  - openbao.foundation-vault.svc.cluster.local
  - openbao-0.openbao.foundation-vault.svc.cluster.local
  - openbao-1.openbao.foundation-vault.svc.cluster.local
  - openbao-2.openbao.foundation-vault.svc.cluster.local
  # ⚠️ Service SÉPARÉ `openbao-ui`, visé par le DestinationRule de la gateway.
  # Sans ces noms, la vérification TLS échoue dès qu'on sort de
  # `insecureSkipVerify` : le SNI ne matche aucun SAN et l'UI casse. Constaté
  # avant livraison le 2026-07-28 — l'ancienne version ne vérifiait rien, donc
  # l'absence ne se voyait pas.
  - openbao-ui
  - openbao-ui.foundation-vault
  - openbao-ui.foundation-vault.svc
  - openbao-ui.foundation-vault.svc.cluster.local
  - localhost
  ipAddresses:
  - 127.0.0.1
