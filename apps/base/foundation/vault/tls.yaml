# Certificat TLS du listener OpenBao.
#
# The CA CHAIN lives in `apps/base/foundation/vault-ca` (a separate brick, in
# the `cert-manager` namespace) — see the detailed explanation there. It cannot
# stay here: this kustomization's `namespace: foundation-vault` would override
# its namespace and the openbao ClusterIssuer would no longer find it.
#
# ⚠️ The SANs cover THREE families of names, and missing one means the cluster
# does not come up:
#   1. le Service stable  → clients (ESO, cert-manager, backup) ;
#   2. the headless PER-POD names → `retry_join` between raft replicas;
#   3. `127.0.0.1` / `localhost` → probes et scripts du conteneur.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-tls
  namespace: foundation-vault
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  secretName: openbao-server-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: openbao-ca
    kind: ClusterIssuer
  commonName: openbao.foundation-vault.svc.cluster.local
  dnsNames:
  - openbao
  - openbao.foundation-vault
  - openbao.foundation-vault.svc
  - openbao.foundation-vault.svc.cluster.local
  - openbao-0.openbao.foundation-vault.svc.cluster.local
  - openbao-1.openbao.foundation-vault.svc.cluster.local
  - openbao-2.openbao.foundation-vault.svc.cluster.local
  # ⚠️ A SEPARATE `openbao-ui` Service, targeted by the gateway's DestinationRule.
  # Without these names, TLS verification fails as soon as you leave
  # `insecureSkipVerify`: the SNI matches no SAN and the UI breaks. Caught
  # before shipping on 2026-07-28 — the old version verified nothing, so the
  # omission was invisible.
  - openbao-ui
  - openbao-ui.foundation-vault
  - openbao-ui.foundation-vault.svc
  - openbao-ui.foundation-vault.svc.cluster.local
  - localhost
  ipAddresses:
  - 127.0.0.1
