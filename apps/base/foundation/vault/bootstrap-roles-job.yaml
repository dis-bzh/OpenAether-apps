# OpenAether 0.5.0 — Roles ESO + cert-manager sur OpenBao (Job idempotent)
# ───────────────────────────────────────────────────────────────────────────────────
# PostSync vault — s'exécute après que le StatefulSet openbao soit Healthy (3/3).
# BeforeHookCreation: supprimé + recréé à chaque sync → idempotent sur bootstrap,
# DRP (perte PVCs), config change, montée de version.
#
# Ce Job était l'ancien "step 8" de pki-root/bootstrap/00-bootstrap-job.yaml.
# Extrait ici car il dépend du OpenBao (pas du root) et doit s'exécuter
# APRÈS la Healthy du, pas juste après le root.
#
# Sécurité: set +x partout où des secrets transitent; aucune clé/token loggé.
#
# SA: openbao-vault-bootstrap (ns foundation-vault) — droits lecture-seule Secret
# openbao-recovery (root_token) + accès API OpenBao.
# RBAC défini dans ce fichier (même kustomization → même namespace).
# ───────────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    app: openbao-vault-bootstrap
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-vault-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-vault-bootstrap
rules:
  # Lire le root_token pour configurer auth/policies/roles.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["openbao-recovery"]
  # Attendre que les pods soient Ready avant d'appeler l'API.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: openbao-vault-bootstrap
    namespace: foundation-vault
roleRef:
  kind: Role
  name: openbao-vault-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    app: openbao-vault-bootstrap
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-vault-bootstrap
  annotations: {}
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: openbao-vault-bootstrap
        openaether.io/component: openbao-vault-bootstrap
    spec:
      serviceAccountName: openbao-vault-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: bootstrap-roles
          image: alpine/k8s:1.31.1
          env:
            - name: VAULT_NS
              value: "foundation-vault"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              WL_ADDR="http://openbao.${VAULT_NS}.svc.cluster.local:8200"

              # ── helper API ─────────────────────────────────────────
              # Résultat dans /tmp/wlbody; code HTTP dans /tmp/wlhttp.
              wlapi() {
                local m="$1" p="$2" d="${3:-}" t="${4:-}"
                local a=(-s -o /tmp/wlbody -w '%{http_code}' -X "$m")
                [ -n "$t" ] && a+=(-H "X-Vault-Token: $t")
                [ -n "$d" ] && a+=(-d "$d")
                curl "${a[@]}" "${WL_ADDR}${p}" > /tmp/wlhttp
                cat /tmp/wlbody
              }
              WH() { cat /tmp/wlhttp 2>/dev/null || echo "000"; }

              # ── 1) Récupérer root_token ───────────────────────────
              set +x
              echo "════ Lecture root_token ════"
              if ! kubectl get secret openbao-recovery -n "$VAULT_NS" >/dev/null 2>&1; then
                echo "⚠ Secret openbao-recovery absent — non initialisé."
                echo "  Ce Job sera re-exécuté au prochain sync Flux."
                echo "  Pour forcer: kubectl delete job openbao-vault-bootstrap -n $VAULT_NS"
                exit 1
              fi
              WL_TOKEN="$(kubectl get secret openbao-recovery -n "$VAULT_NS" \
                -o jsonpath='{.data.root_token}' | base64 -d 2>/dev/null)"
              if [ -z "$WL_TOKEN" ]; then
                echo "ERREUR: root_token vide dans le Secret"; exit 1
              fi
              echo "  root_token récupéré"
              set -x; set +x

              # ── 2) Attente API ─────────────────────────────────────
              echo "════ Attente API ($WL_ADDR) ════"
              for i in $(seq 1 60); do
                c="$(curl -s -o /dev/null -w '%{http_code}' \
                  "${WL_ADDR}/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true" || true)"
                [ "$c" != "000" ] && [ -n "$c" ] && { echo "  API up (health=$c)"; break; }
                echo "  waiting API... ${i}/60 (code=$c)"; sleep 5
              done

              # ── 3) Résolution leader raft via /v1/sys/leader ──────────────
              # Le service headless round-robin vers tous les pods (standby inclus).
              # /v1/sys/leader donne l'URL du nœud actif → on y pointe toutes les
              # écritures. Si le nœud actuel répond avec redirect_addr, on suit.
              echo "════ Résolution leader raft ════"
              set +x
              LEADER_URL=""
              for i in $(seq 1 24); do
                LEADER_JSON="$(curl -s "${WL_ADDR}/v1/sys/leader" || true)"
                LEADER_URL="$(echo "$LEADER_JSON" | jq -r '.leader_address // empty' 2>/dev/null || true)"
                IS_SELF="$(echo "$LEADER_JSON" | jq -r '.is_self // "false"' 2>/dev/null || echo "false")"
                if [ -n "$LEADER_URL" ] && [ "$LEADER_URL" != "null" ]; then
                  echo "  leader trouvé: $LEADER_URL (is_self=${IS_SELF})"
                  # Pointer wlapi vers le leader directement
                  WL_ADDR="$LEADER_URL"
                  # Retirer le trailing slash si présent
                  WL_ADDR="${WL_ADDR%/}"
                  break
                fi
                echo "  waiting leader... ${i}/24 (leader_address=${LEADER_URL:-vide})"
                sleep 5
              done
              if [ -z "$LEADER_URL" ] || [ "$LEADER_URL" = "null" ]; then
                echo "ERREUR: impossible de déterminer le leader raft après 2min"; exit 1
              fi
              set -x; set +x

              # ── 4) PKI engine (idempotent) ──────────────────────────────────
              echo "════ PKI + auth kubernetes ════"
              set +x

              # 4a. monter le PKI (intermediate CA) au chemin EXACT attendu
              #     par l'issuer openbao : pki.
              #     NE PAS monter `pki/` à la racine : ça occuperait le préfixe et
              #     empêcherait le mount imbriqué pki (conflit → HTTP 400,
              #     puis 404 sur pki/intermediate/...). max_lease_ttl long
              #     pour couvrir la durée de l'intermediate (17520h).
              wlapi POST /v1/sys/mounts/pki \
                '{"type":"pki","config":{"max_lease_ttl":"87600h"}}' "$WL_TOKEN" >/dev/null || true
              echo "  pki mount: HTTP=$(WH) (204=créé, 400=déjà)"

              # 4c. Intermediate CA — génère le CSR si absent, l'AFFICHE, NE BLOQUE PAS.
              #     L'import du certificat signé est une étape MANUELLE (root offline) :
              #     signer le CSR hors-ligne avec la ROOT CA (Bitwarden EU) puis
              #     `bao write pki/intermediate/set-signed certificate=@signed.pem`.
              #     Voir pki-root-offline-runbook.md. Tant que set-signed n'est pas fait,
              #     la PKI ne signe pas de leaf (issuers NotReady) — PAR DESIGN.
              #     (Avant: un `read -r` bloquant faisait timeout le Job en GitOps.)
              echo "════ Intermediate CA (génération CSR — import = étape manuelle) ════"
              set +x
              INT_CERT="$(wlapi GET /v1/pki/cert/ca | jq -r '.data.certificate // empty' 2>/dev/null || true)"
              if [ -n "$INT_CERT" ]; then
                echo "  intermediate CA déjà présente (signée + importée) → no-op"
              else
                echo "  génération du CSR intermediate..."
                CSR_RESP="$(wlapi POST /v1/pki/intermediate/generate/internal \
                  '{"common_name":"OpenAether Workload Intermediate CA","ttl":"17520h"}' "$WL_TOKEN")"
                CSR="$(echo "$CSR_RESP" | jq -r '.data.csr // empty')"
                if [ -z "$CSR" ]; then
                  echo "  ⚠ génération CSR échouée (HTTP=$(WH)) — sera re-tentée au prochain sync"
                  echo "$CSR_RESP"
                else
                  echo ""
                  echo "  >>> ÉTAPE MANUELLE (runbook PKI root-offline) :"
                  echo "  >>> 1. Signer ce CSR avec la ROOT CA hors-ligne (clé dans Bitwarden EU)"
                  echo "  >>> 2. Importer le signé : bao write pki/intermediate/set-signed \\"
                  echo "  >>>      certificate=@intermediate-signed.pem"
                  echo "  ----- BEGIN INTERMEDIATE CSR -----"
                  echo "$CSR"
                  echo "  ----- END INTERMEDIATE CSR -----"
                fi
              fi
              set -x; set +x

              # 4d. Rôle PKI leaf — utilisé par l'issuer openbao pour signer
              #     les certs via pki/sign/openaether. Le rôle est de la
              #     config (indépendant de la CA) → créable avant l'import de
              #     l'intermediate signé ; la signature EFFECTIVE nécessitera la CA.
              #     Domaines dérivés du Certificate openaether-tls (openaether.local + *).
              wlapi POST /v1/pki/roles/openaether \
                '{"allowed_domains":["openaether.local"],"allow_subdomains":true,"allow_bare_domains":true,"allow_localhost":false,"max_ttl":"2160h","key_type":"rsa","key_bits":2048,"server_flag":true,"client_flag":true}' \
                "$WL_TOKEN" >/dev/null || true
              echo "  pki role openaether: HTTP=$(WH) (204=créé/maj)"

              # 4c. enable KV v2 engine (secret/) — chemin pour ESO + seeder
              wlapi POST /v1/sys/mounts/secret '{"type":"kv","options":{"version":"2"}}' "$WL_TOKEN" >/dev/null || true
              echo "  kv v2 secret/ mount: HTTP=$(WH) (204=créé, 400=déjà)"

              # ── 5) Policies (ESO + secret-seeder + cert-manager) ──────────
              # Les policies n'ont pas besoin d'auth/kubernetes, on les crée d'abord.
              ESO_POLICY="$(printf 'path "secret/data/*" {\n  capabilities = ["read"]\n}\npath "secret/metadata/*" {\n  capabilities = ["read", "list"]\n}\n')"
              wlapi PUT /v1/sys/policies/acl/external-secrets-read \
                "$(jq -nc --arg p "$ESO_POLICY" '{policy:$p}')" "$WL_TOKEN" >/dev/null
              echo "  policy external-secrets-read: HTTP=$(WH)"

              SEEDER_POLICY="$(printf 'path "secret/data/grafana/*" {\n  capabilities = ["create","update","read"]\n}\npath "secret/data/minio/*" {\n  capabilities = ["create","update","read"]\n}\npath "secret/data/longhorn/*" {\n  capabilities = ["create","update","read"]\n}\npath "secret/data/zitadel/*" {\n  capabilities = ["create","update","read"]\n}\npath "secret/metadata/*" {\n  capabilities = ["read","list"]\n}\n')"
              wlapi PUT /v1/sys/policies/acl/secret-seeder \
                "$(jq -nc --arg p "$SEEDER_POLICY" '{policy:$p}')" "$WL_TOKEN" >/dev/null
              echo "  policy secret-seeder: HTTP=$(WH)"

              CM_POLICY="$(printf 'path "pki/sign/*" {\n  capabilities = ["create", "update"]\n}\npath "pki/cert/*" {\n  capabilities = ["read"]\n}\n')"
              wlapi PUT /v1/sys/policies/acl/cert-manager-pki \
                "$(jq -nc --arg p "$CM_POLICY" '{policy:$p}')" "$WL_TOKEN" >/dev/null
              echo "  policy cert-manager-pki: HTTP=$(WH)"

              # ── 6) Auth Kubernetes sur ────────────────────────────
              # Doit être activé + configuré AVANT de créer les rôles : les rôles
              # vivent sous /v1/auth/kubernetes/role/* → 404 si le backend n'est pas monté.
              wlapi POST /v1/sys/auth/kubernetes '{"type":"kubernetes"}' "$WL_TOKEN" >/dev/null || true
              echo "  auth kubernetes: HTTP=$(WH) (204=activé, 400=déjà)"

              CA_CRT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)"
              wlapi POST /v1/auth/kubernetes/config \
                "$(jq -nc --arg ca "$CA_CRT" '{
                    kubernetes_host:"https://kubernetes.default.svc.cluster.local",
                    kubernetes_ca_cert:$ca,
                    disable_iss_validation:true}')" "$WL_TOKEN" >/dev/null
              CODE="$(WH)"
              echo "  config auth k8s: HTTP=$CODE"
              case "$CODE" in 200|204) : ;; *)
                echo "ERREUR: config auth k8s a échoué (HTTP=$CODE)"; cat /tmp/wlbody; exit 1 ;; esac

              # ── 7) Rôles (ESO + cert-manager) — APRÈS auth/kubernetes ───────
              wlapi POST /v1/auth/kubernetes/role/external-secrets-operator \
                "$(jq -nc '{
                    bound_service_account_names:"external-secrets",
                    bound_service_account_namespaces:"foundation-pki-management",
                    token_policies:"external-secrets-read",
                    token_ttl:"1h",
                    token_max_ttl:"4h"}')" "$WL_TOKEN" >/dev/null
              CODE="$(WH)"
              echo "  role external-secrets-operator: HTTP=$CODE"
              case "$CODE" in 200|204) : ;; *)
                echo "ERREUR: role external-secrets-operator échoué (HTTP=$CODE)"; cat /tmp/wlbody; exit 1 ;; esac

              wlapi POST /v1/auth/kubernetes/role/cert-manager-issuer \
                "$(jq -nc '{
                    bound_service_account_names:"cert-manager",
                    bound_service_account_namespaces:"cert-manager",
                    token_policies:"cert-manager-pki",
                    token_ttl:"1h",
                    token_max_ttl:"4h"}')" "$WL_TOKEN" >/dev/null
              CODE="$(WH)"
              echo "  role cert-manager-issuer: HTTP=$CODE"
              case "$CODE" in 200|204) : ;; *)
                echo "ERREUR: role cert-manager-issuer échoué (HTTP=$CODE)"; cat /tmp/wlbody; exit 1 ;; esac
              set -x; set +x

              # ── 10) Seed secrets Sprint C (grafana, minio, longhorn) ────────
              # Idempotent: GET kv → HTTP 404 → générer + PUT ; HTTP 200 → no-op.
              # Utilise le root_token déjà chargé (WL_TOKEN).
              # set +x déjà actif depuis le début de ce bloc secret.
              echo ""
              echo "════ 10) Seed secrets (grafana, minio, longhorn, zitadel/db, zitadel/masterkey) ════"

              kv_seed() {
                local path="$1"
                local payload="$2"
                wlapi GET "/v1/secret/data/${path}" '' "$WL_TOKEN" >/dev/null 2>&1
                local code
                code="$(WH)"
                if [ "$code" = "200" ]; then
                  echo "  secret/${path}: déjà présent → no-op"
                  return 0
                fi
                echo "  secret/${path}: absent (HTTP=$code) → génération + seed"
                wlapi POST "/v1/secret/data/${path}" \
                  "$(jq -nc --argjson d "$payload" '{"data":$d}')" \
                  "$WL_TOKEN" >/dev/null
                local wcode
                wcode="$(WH)"
                echo "    → HTTP=$wcode"
                case "$wcode" in 200|204) : ;; *)
                  echo "ERREUR: write secret/${path} échoué (HTTP=$wcode)"; cat /tmp/wlbody; exit 1 ;; esac
              }

              # Générer les valeurs aléatoires AVANT le kv_seed (set +x actif).
              GRAFANA_PASS="$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | tr -d '/+=' | head -c 32)"
              GRAFANA_DB_PASS="$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | tr -d '/+=' | head -c 32)"
              MINIO_SECRET="$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | tr -d '/+=' | head -c 32)"
              LONGHORN_PASS="$(dd if=/dev/urandom bs=48 count=1 2>/dev/null | base64 | tr -d '/+=')"
              ZITADEL_DB_PASS="$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | tr -d '/+=' | head -c 32)"
              # Masterkey Zitadel: DOIT faire EXACTEMENT 32 octets (chiffrement interne).
              ZITADEL_MASTERKEY="$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 | tr -d '/+=' | head -c 32)"

              kv_seed "grafana/admin" \
                "$(jq -nc --arg p "$GRAFANA_PASS" '{username:"admin",password:$p}')"
              kv_seed "grafana/db" \
                "$(jq -nc --arg p "$GRAFANA_DB_PASS" '{password:$p}')"
              kv_seed "minio/root" \
                "$(jq -nc --arg s "$MINIO_SECRET" '{accessKey:"minio",secretKey:$s}')"
              kv_seed "longhorn/encryption" \
                "$(jq -nc --arg p "$LONGHORN_PASS" '{passphrase:$p}')"
              kv_seed "zitadel/db" \
                "$(jq -nc --arg p "$ZITADEL_DB_PASS" '{username:"zitadel",password:$p}')"
              kv_seed "zitadel/masterkey" \
                "$(jq -nc --arg k "$ZITADEL_MASTERKEY" '{masterkey:$k}')"

              echo "  ✅ Secrets Sprint C seedés (idempotents)"
              set -x; set +x

              echo ""
              echo "✅ Roles ESO + cert-manager configurés + secrets Sprint C seedés"
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
