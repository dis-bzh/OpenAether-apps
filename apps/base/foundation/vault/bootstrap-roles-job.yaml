# OpenBao configuration — idempotent Job, recreated by Flux on every sync (scripts/configure.sh).
#
# Runs as ServiceAccount openbao-vault-bootstrap and logs in to OpenBao with it (Kubernetes auth role
# `openbao-bootstrap`, created by openbao-init before it revoked the root token). It needs NO Kubernetes API access
# and no Secret: the only credential it ever holds is a 15 minute OpenBao token, in a memory-backed file.
# It mounts the engines and the PKI, writes the policies, the Kubernetes auth roles and the application
# secrets (create-only), and prints no secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    app: openbao-vault-bootstrap
    openaether.io/managed: "true"
    openaether.io/component: openbao-vault-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    app: openbao-vault-bootstrap
    openaether.io/managed: "true"
    openaether.io/component: openbao-vault-bootstrap
spec:
  backoffLimit: 5
  # 30 minutes: the wait for openbao-init can legitimately spend 15, and a deadline shorter than the wait turns
  # a slow start into a hard failure.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: openbao-vault-bootstrap
        openaether.io/component: openbao-vault-bootstrap
    spec:
      serviceAccountName: openbao-vault-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        # OpenBao's internal CA: every call in this Job goes over TLS.
        - name: tls
          secret:
            secretName: openbao-server-tls
            defaultMode: 0444
        - name: scripts
          configMap:
            name: openbao-bootstrap-scripts
            defaultMode: 0555
      containers:
        - name: bootstrap-roles
          image: docker.io/alpine/k8s:1.31.1
          env:
            - name: VAULT_NS
              value: "foundation-vault"
            - name: OA_TMP
              value: "/tmp"
          command: ["/bin/bash", "/scripts/configure.sh"]
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /bao/tls
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
