# OpenBao configuration — idempotent Job (scripts/configure.sh). Flux re-creates it when the script ConfigMap hash changes, or
# once ttlSecondsAfterFinished has removed it (about 70 minutes after it ends, Complete or Failed: ttl + one sync).
#
# Runs as ServiceAccount openbao-vault-bootstrap and logs in to OpenBao with it (Kubernetes auth role
# `openbao-bootstrap`, created by openbao-init before it revoked the root token). It needs NO Kubernetes API access
# and no Secret: the only credential it ever holds is a 15 minute OpenBao token, in a memory-backed file.
# It mounts the engines and the PKI, writes the policies, the Kubernetes auth roles and the application
# secrets (create-only), and prints no secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    app: openbao-vault-bootstrap
    openaether.io/managed: "true"
    openaether.io/component: openbao-vault-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-vault-bootstrap
  namespace: foundation-vault
  labels:
    app: openbao-vault-bootstrap
    openaether.io/managed: "true"
    openaether.io/component: openbao-vault-bootstrap
spec:
  # No activeDeadlineSeconds (#34): a deadline is terminal and spans the waits for openbao-init, so a slow first start ended
  # the Job Failed for about 70 minutes. The waits are bounded in the script (wait_api 15 minutes, login_bootstrap 15) and the
  # pod restarts in place with a growing delay: eight retries, then Failed, then re-created after the ttl. Every step is
  # idempotent (create-only secrets, check-and-set 0).
  backoffLimit: 8
  # Without a ttl a Failed Job stays Failed: Flux does not re-apply an unchanged object (#34). Kept for an hour so the
  # first run's PKI CSR can be read from its log (README: PKI intermediate).
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: openbao-vault-bootstrap
        openaether.io/component: openbao-vault-bootstrap
    spec:
      serviceAccountName: openbao-vault-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        # OpenBao's internal CA: every call in this Job goes over TLS.
        - name: tls
          secret:
            secretName: openbao-server-tls
            defaultMode: 0444
        - name: scripts
          configMap:
            name: openbao-bootstrap-scripts
            defaultMode: 0555
      containers:
        - name: bootstrap-roles
          image: docker.io/alpine/k8s:1.36.5
          env:
            - name: VAULT_NS
              value: "foundation-vault"
            - name: OA_TMP
              value: "/tmp"
            # PKI key type (ec | rsa) and whether a newly imported intermediate becomes the default issuer: README, "PKI".
            - name: OA_PKI_KEY_TYPE
              value: "ec"
            - name: OA_PKI_DEFAULT_FOLLOWS_LATEST
              value: "false"
          command: ["/bin/bash", "/scripts/configure.sh"]
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /bao/tls
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
