# OpenAether 0.5.0 — OpenBao config (Shamir seal + raft 3)
# Seal: Shamir 5/3 (OpenBao's default when no seal is configured)
# - The 5 Shamir shares are handled by the HA unsealer (apps/base/foundation/vault/unsealer.yaml)
# - The unsealer loads the 3 required shares RAM-only and calls /v1/sys/unseal
# - Raft, 3 replicas: retry_join across the 3 pods through the headless openbao svc.
# - Listener TLS: a cert-manager certificate (tls.yaml), DEDICATED selfSigned CA.
#   Definitely not OpenBao's own PKI — it would have to be reachable to issue
#   the certificate that makes it reachable.
#
# NB OpenBao 2.x:
#  - `disable_mlock` removed (obsolete).
#  - `api_addr`/`cluster_addr` via env BAO_API_ADDR/BAO_CLUSTER_ADDR (POD_IP).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
data:
  config.hcl: |
    ui = true

    listener "tcp" {
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_cert_file = "/bao/tls/tls.crt"
      tls_key_file  = "/bao/tls/tls.key"
      # ⚠️ `tls_client_ca_file` is NOT set: we do no mTLS here. TLS only
      # clients s'authentifient par token ou via auth/kubernetes ; TLS ne sert
      # encrypts the transport and authenticates the SERVER.
    }

    storage "raft" {
      path = "/bao/data"

      # ⚠️ https:// AND leader_ca_cert_file: without the CA each replica rejects
      # its peers' certificate and the raft cluster never forms — the pods stay
      # 0/1 with no explicit error on the Kubernetes side.
      retry_join {
        leader_api_addr = "https://openbao-0.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://openbao-1.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://openbao-2.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
    }

    # Seal = Shamir (default, no seal block needed)
    # The 3 required shares are supplied at runtime by the HA unsealer
  entrypoint.sh: |
    #!/bin/sh
    # Wrapper: Shamir seal — no transit token. The HA unsealer handles unsealing.
    # api_addr/cluster_addr via DNS stable (POD FQDN).
    set -e
    POD_FQDN="${HOSTNAME}.openbao.${POD_NAMESPACE}.svc.cluster.local"
    export BAO_API_ADDR="https://${POD_FQDN}:8200"
    export BAO_CLUSTER_ADDR="https://${POD_FQDN}:8201"
    echo "raft addr: ${POD_FQDN}"
    exec bao server -config=/bao/config/config.hcl
