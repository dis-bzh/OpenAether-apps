# OpenBao server configuration: raft x3, STATIC auto-unseal, audit device, TLS from cert-manager.
#
# Seal: `seal "static"`. The 32-byte key is the Secret `openbao-seal-key` (created once by openbao-init, never
# printed), mounted at /bao/seal. OpenBao unseals itself with it on every start: a restart, a drain or a
# rolling update needs no human and no extra component. There is NO unsealer, NO Shamir share and NO root
# token stored in the cluster any more. What the static key does and does not give you is in the README:
# it removes the secrets-in-logs and secrets-at-rest exposure of the former design, it does not separate the key
# from the cluster it protects. LOSS OF THE KEY = LOSS OF THE DATA, so it is escrowed by an operator (README).
#
# Audit: declared HERE and not through the API (OpenBao refuses `sys/audit` over the API on purpose, so that a
# compromised token can not switch the trail off). It goes to stdout, which Alloy ships to Loki.
#
# The server configuration is rendered at start by the entrypoint, which computes the seal key's id from the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: openbao
data:
  config.hcl.tpl: |
    ui = true

    listener "tcp" {
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_cert_file = "/bao/tls/tls.crt"
      tls_key_file  = "/bao/tls/tls.key"
      # No `tls_client_ca_file`: no mTLS here. TLS encrypts the transport and authenticates the SERVER;
      # clients authenticate with a token or through auth/kubernetes.
    }

    storage "raft" {
      path = "/bao/data"

      # https:// AND leader_ca_cert_file: without the CA each replica rejects its peers' certificate and the
      # raft cluster never forms (the pods stay 0/1 with no explicit error on the Kubernetes side).
      retry_join {
        leader_api_addr = "https://openbao-0.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://openbao-1.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://openbao-2.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
    }

    seal "static" {
      current_key_id = "@@CURRENT_KEY_ID@@"
      current_key    = "file:///bao/seal/key"
    @@PREVIOUS_KEY@@
    }

    audit "file" "stdout" {
      description = "Audit trail on stdout (shipped to Loki by Alloy). Secret values are HMAC-ed by OpenBao."
      options {
        file_path = "stdout"
      }
    }
  entrypoint.sh: |
    #!/bin/sh
    # Renders the server configuration (the seal key ids are computed from the keys, so they always match
    # the key material: OpenBao refuses a key whose id does not), then runs the server.
    # Rotating the key: add the new one as `key` and keep the old one as `previous-key` in the Secret
    # (README, section Seal key).
    set -e
    POD_FQDN="${HOSTNAME}.openbao.${POD_NAMESPACE}.svc.cluster.local"
    export BAO_API_ADDR="https://${POD_FQDN}:8200"
    export BAO_CLUSTER_ADDR="https://${POD_FQDN}:8201"
    [ -s /bao/seal/key ] || { echo "the seal key /bao/seal/key is missing or empty" >&2; exit 1; }
    id() { sha256sum "$1" | cut -c1-16; }
    PREVIOUS=""
    if [ -s /bao/seal/previous-key ]; then
      PREVIOUS="previous_key_id = \"$(id /bao/seal/previous-key)\"
      previous_key    = \"file:///bao/seal/previous-key\""
    fi
    # sed with a here-string for the multi-line value would need escaping: build the file in two steps.
    sed -e "s|@@CURRENT_KEY_ID@@|$(id /bao/seal/key)|" /bao/config/config.hcl.tpl > /tmp/config.stage
    awk -v prev="$PREVIOUS" '
      /@@PREVIOUS_KEY@@/ { if (prev != "") print prev; next }
      { print }' /tmp/config.stage > /tmp/config.hcl
    rm -f /tmp/config.stage
    echo "raft addr: ${POD_FQDN}"
    exec bao server -config=/tmp/config.hcl
