# OpenAether 0.5.0 — OpenBao config (Shamir seal + raft 3)
# Seal: Shamir 5/3 (défaut OpenBao quand aucun seal n'est configuré)
# - Les 5 parts Shamir sont gérées par l'unsealer HA (apps/base/foundation/vault/unsealer.yaml)
# - L'unsealer charge les 3 parts nécessaires en RAM-only et appelle /v1/sys/unseal
# - Raft 3 répl: retry_join sur les 3 pods via svc headless openbao.
# - TLS du listener : certificat cert-manager (tls.yaml), CA DÉDIÉE en selfSigned.
#   Surtout pas la PKI d'OpenBao — il devrait être joignable pour émettre le
#   certificat qui le rend joignable.
#
# NB OpenBao 2.x:
#  - `disable_mlock` retiré (obsolète, cf. pki-root/configmap.yaml).
#  - `api_addr`/`cluster_addr` via env BAO_API_ADDR/BAO_CLUSTER_ADDR (POD_IP).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
data:
  config.hcl: |
    ui = true

    listener "tcp" {
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_cert_file = "/bao/tls/tls.crt"
      tls_key_file  = "/bao/tls/tls.key"
      # ⚠️ `tls_client_ca_file` n'est PAS posé : on ne fait pas de mTLS ici. Les
      # clients s'authentifient par token ou via auth/kubernetes ; TLS ne sert
      # qu'à chiffrer le transport et à authentifier le SERVEUR.
    }

    storage "raft" {
      path = "/bao/data"

      # ⚠️ https:// ET leader_ca_cert_file : sans la CA, chaque réplica refuse
      # le certificat de ses pairs et le cluster raft ne se forme jamais — les
      # pods restent 0/1 sans erreur explicite côté Kubernetes.
      retry_join {
        leader_api_addr = "https://openbao-0.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://openbao-1.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://openbao-2.openbao.foundation-vault.svc.cluster.local:8200"
        leader_ca_cert_file = "/bao/tls/ca.crt"
      }
    }

    # Seal = Shamir (default, no seal block needed)
    # Les 3 parts nécessaires sont fournies à chaud par l'unsealer HA
  entrypoint.sh: |
    #!/bin/sh
    # Wrapper: Shamir seal — pas de transit token. L'unsealer HA gère l'unseal.
    # api_addr/cluster_addr via DNS stable (POD FQDN).
    set -e
    POD_FQDN="${HOSTNAME}.openbao.${POD_NAMESPACE}.svc.cluster.local"
    export BAO_API_ADDR="https://${POD_FQDN}:8200"
    export BAO_CLUSTER_ADDR="https://${POD_FQDN}:8201"
    echo "raft addr: ${POD_FQDN}"
    exec bao server -config=/bao/config/config.hcl
