# OpenBao INIT — one shot, idempotent (scripts/init.sh).
#
# Creates the static seal key (Secret openbao-seal-key), initialises OpenBao with RECOVERY shares (encrypted to the
# operators' PGP keys when the ConfigMap openbao-operator-keys exists, a single plaintext development share
# otherwise), lets the bootstrap identity take over and REVOKES the root token. It prints no secret. The full
# reasoning, the failure modes and the break-glass procedure are in the README.
#
# On an already initialised cluster it only checks that the bootstrap identity can still log in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: foundation-vault
  labels:
    app: openbao-init
    openaether.io/managed: "true"
    openaether.io/component: openbao-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: openbao-init
rules:
  # create can not be limited by name; it is CREATE, never update: an existing Secret is never overwritten.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["openbao-seal-key", "openbao-recovery-shares", "openbao-recovery-dev"]
  # label + annotate the development Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["patch"]
    resourceNames: ["openbao-recovery-dev"]
  # The operators' PGP public keys (public data). Optional: absent means a development bootstrap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["openbao-operator-keys", "openbao-init-state"]
  # The marker "this cluster has been initialised, a seal key is expected to exist" (create only, like the Secrets).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: openbao-init
subjects:
  - kind: ServiceAccount
    name: openbao-init
    namespace: foundation-vault
roleRef:
  kind: Role
  name: openbao-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: foundation-vault
  labels:
    app: openbao-init
    openaether.io/managed: "true"
    openaether.io/component: openbao-init
  annotations:
    # Re-created by Flux once ttlSecondsAfterFinished has removed it (the script is idempotent: on an initialised
    # cluster it checks and exits). The annotation only matters when a patch hits an immutable field.
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: openbao-init
        openaether.io/component: openbao-init
    spec:
      serviceAccountName: openbao-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Memory-backed: the root token and the recovery shares exist here for seconds and never touch a disk.
        - name: tmp
          emptyDir:
            medium: Memory
        - name: tls
          secret:
            secretName: openbao-server-tls
            defaultMode: 0444
        - name: scripts
          configMap:
            name: openbao-bootstrap-scripts
            defaultMode: 0555
      containers:
        - name: init
          # The `docker.io/` prefix is MANDATORY: an image without a registry matches NO pattern of the
          # restrict-image-registries policy.
          image: docker.io/alpine/k8s:1.36.5
          env:
            - name: VAULT_NS
              value: "foundation-vault"
            - name: OA_TMP
              value: "/tmp"
          command: ["/bin/bash", "/scripts/init.sh"]
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /bao/tls
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
