# OpenAether 0.5.0 Sprint B — HTTPRoute pour OpenBao
# Gateway Istio 'openaether-gateway' en ns services-gateway (GatewayClass istio).
# allowedRoutes from:All → no ReferenceGrant needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: openbao
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
      namespace: services-gateway
  hostnames:
    - "vault.openaether.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openbao-ui
          port: 8200
