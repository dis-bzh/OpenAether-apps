apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    app: openbao
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  clusterIP: None
  # CRITICAL: sealed pods are NotReady. Without this, raft retry_join cannot
  # resolve the peers at boot → deadlock (no pod ever becomes Ready).
  publishNotReadyAddresses: true
  ports:
    - name: api
      port: 8200
      targetPort: 8200
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: 8201
      protocol: TCP
  selector:
    app: openbao
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-ui
  namespace: foundation-vault
  labels:
    app: openbao
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  type: ClusterIP
  ports:
    - name: ui
      port: 8200
      targetPort: 8200
      protocol: TCP
  selector:
    app: openbao
