apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  description: "OpenBao (HA, 3 replicas, Shamir seal): ingress from Cilium
    Gateway (sprint 3), external-secrets, csi-driver, cert-manager, istiod, unsealer
    HA, init-Job, peers raft, bootstrap-roles. Egress: kube-dns, k8s API, peers raft."
  endpointSelector:
    matchLabels:
      app: openbao
  ingress:
    # 1. Istio Gateway (Gateway API) — vault.openaether.local
    #    ⚠️ Le pod Envoy Gateway-API porte `service.istio.io/canonical-name:
    #    openaether-gateway-istio`, PAS `k8s-app: cilium-gateway` (label legacy
    #    Cilium Gateway, never set here) → the old selector never matched
    #    → the vault UI timed out. We target the real Istio label.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
            service.istio.io/canonical-name: openaether-gateway-istio
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 2. ESO (pull ExternalSecret)
    #    NB: the external-secrets chart does NOT set a bare `app:` label — so
    #    utilise `app.kubernetes.io/name`. Un selector `app: external-secrets`
    #    it blocked ESO→OpenBao PERMANENTLY (cloud included), not just locally.
    #    Always select on the canonical label.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-pki-management
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 3. CSI driver (mounts OpenBao secrets into stateful pods)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: csi-secrets-store
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 4. cert-manager (sign certs via OpenBao PKI)
    #    The cert-manager chart sets app.kubernetes.io/instance (not a bare app:).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
            app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 5. Istiod (cert SPIFFE mesh)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 6. (removed) OpenBao root — no more foundation-pki-root (Shamir seal).
    # 6b. Backup (openbao-snapshot CronJob, same ns): sys/leader, login
    #     auth/kubernetes, raft snapshot. Mirrored egress in
    #     apps/base/backup/openbao/networkpolicy.yaml.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-snapshot
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 7. Prometheus scraper
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-prometheus
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 8. Raft peers (3 replicas): the join challenge goes through the 8200 API,
    #    cluster traffic through 8201. Without both ports in ingress AND egress,
    #    pods 1/2 never join the leader → they stay uninitialized.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP
    # 9. Job bootstrap-roles (configures auth/policies/roles ESO+cert-manager
    #    vault PostSync). Same namespace: the Job runs in foundation-vault.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-vault-bootstrap
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 10. HA unsealer (route A) → /v1/sys/unseal + /v1/sys/health on all 3 pods.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-unsealer
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 11. Init-Job (operator init one-time, cible openbao-0).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-init
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (auth kubernetes login → TokenReview + health).
    # ⚠️ toEntities:kube-apiserver, NOT toServices:kubernetes. The `kubernetes`
    # Service DNATs 443→6443: `toServices` only opens port 443, but Cilium
    # applies egress on the post-DNAT port (6443) → the packet is dropped.
    # Result: OpenBao cannot perform the TokenReview of the k8s-auth login
    # (ESO/cert-manager) → ClusterSecretStore InvalidProviderConfig.
    - toEntities:
        - kube-apiserver
    # (removed) egress to foundation-pki-root — no more root (Shamir seal).
    # Raft between the 3 replicas: join challenge on the 8200 API + cluster 8201.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP
---
# Egress policy for the bootstrap-roles Job (foundation-vault).
# Permet: DNS + kube-apiserver (kubectl) + API OpenBao.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-vault-bootstrap-job
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-vault-bootstrap
spec:
  description: "Job bootstrap-roles egress: DNS + k8s API + OpenBao API."
  endpointSelector:
    matchLabels:
      app: openbao-vault-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver through toEntities (NOT toServices:kubernetes): the
    # `kubernetes` Service DNATs 443→6443, and `toServices` only opens 443 → the
    # post-DNAT packet to 6443 is dropped. Breaks the Job's `kubectl apply`
    # (writing the seal Secrets) → unsealer deadlock. See the openbao block above.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# HA unsealer egress (route A): DNS (resolving the openbao-N FQDNs) + OpenBao API.
# Pas d'API k8s (automountServiceAccountToken=false). Bitwarden 443 = Wave 3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-unsealer
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-unsealer
spec:
  description: "Unsealer HA egress: DNS + OpenBao API (unseal des 3 pods)."
  endpointSelector:
    matchLabels:
      app: openbao-unsealer
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # TODO Wave 3 (UNSEAL_SOURCE=bitwarden) : egress 443 vers Bitwarden EU (FQDN/CIDR).
---
# Egress init-Job (one-shot) : DNS + kube-apiserver (kubectl) + API OpenBao (init).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-init
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-init
spec:
  description: "Init-Job egress: DNS + k8s API (kubectl) + OpenBao API."
  endpointSelector:
    matchLabels:
      app: openbao-init
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver through toEntities (NOT toServices:kubernetes): the
    # `kubernetes` Service DNATs 443→6443, and `toServices` only opens 443 → the
    # post-DNAT packet to 6443 is dropped. Breaks the Job's `kubectl apply`
    # (writing the seal Secrets) → unsealer deadlock. See the openbao block above.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
