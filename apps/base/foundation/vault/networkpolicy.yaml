apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  description: "OpenBao (HA 3 répl, seal Shamir): ingress depuis Cilium
    Gateway (sprint 3), external-secrets, csi-driver, cert-manager, istiod, unsealer
    HA, init-Job, peers raft, bootstrap-roles. Egress: kube-dns, k8s API, peers raft."
  endpointSelector:
    matchLabels:
      app: openbao
  ingress:
    # 1. Istio Gateway (Gateway API) — vault.openaether.local
    #    ⚠️ Le pod Envoy Gateway-API porte `service.istio.io/canonical-name:
    #    openaether-gateway-istio`, PAS `k8s-app: cilium-gateway` (label legacy
    #    Cilium Gateway, jamais posé ici) → l'ancien selector ne matchait jamais
    #    → vault UI en timeout. On cible le label Istio réel.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
            service.istio.io/canonical-name: openaether-gateway-istio
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 2. ESO (pull ExternalSecret)
    #    NB: le chart external-secrets ne pose PAS de label `app:` nu — il
    #    utilise `app.kubernetes.io/name`. Un selector `app: external-secrets`
    #    bloque donc ESO→OpenBao en PERMANENCE (cloud inclus), pas seulement
    #    en local. Toujours sélectionner sur le label canonique.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-pki-management
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 3. CSI driver (mount OpenBao secrets dans pods stateful sprint 1+)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: csi-secrets-store
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 4. cert-manager (sign certs via OpenBao PKI)
    #    Le chart cert-manager pose app.kubernetes.io/instance (pas app: nu).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
            app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 5. Istiod (cert SPIFFE mesh)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 6. (supprimé) Root OpenBao — plus de foundation-pki-root (seal Shamir).
    # 6b. Backup (CronJob openbao-snapshot, même ns) : sys/leader, login
    #     auth/kubernetes, snapshot raft. Egress miroir dans
    #     apps/base/backup/openbao/networkpolicy.yaml.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-snapshot
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 7. Prometheus scraper
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-prometheus
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 8. Peers raft (3 répliques): le join challenge passe par l'API 8200,
    #    le trafic cluster par 8201. Sans ces 2 ports en ingress ET egress,
    #    les pods 1/2 ne rejoignent jamais le leader → restent uninitialized.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP
    # 9. Job bootstrap-roles (configures auth/policies/roles ESO+cert-manager
    #    PostSync vault). Même namespace: le Job est en foundation-vault.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-vault-bootstrap
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 10. Unsealer HA (route A) → /v1/sys/unseal + /v1/sys/health sur les 3 pods.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-unsealer
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 11. Init-Job (operator init one-time, cible openbao-0).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-init
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (auth kubernetes login → TokenReview + health).
    # ⚠️ toEntities:kube-apiserver, PAS toServices:kubernetes. Le Service
    # `kubernetes` DNAT 443→6443 : `toServices` n'ouvre QUE le port 443, mais
    # Cilium applique l'egress sur le port post-DNAT (6443) → paquet droppé.
    # Résultat : OpenBao ne peut pas faire le TokenReview du login k8s-auth
    # (ESO/cert-manager) → ClusterSecretStore InvalidProviderConfig.
    - toEntities:
        - kube-apiserver
    # (supprimé) egress vers foundation-pki-root — plus de root (seal Shamir).
    # Raft entre les 3 répliques: join challenge sur l'API 8200 + cluster 8201.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP
---
# Politique egress pour le Job bootstrap-roles (foundation-vault).
# Permet: DNS + kube-apiserver (kubectl) + API OpenBao.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-vault-bootstrap-job
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-vault-bootstrap
spec:
  description: "Job bootstrap-roles egress: DNS + k8s API + OpenBao API."
  endpointSelector:
    matchLabels:
      app: openbao-vault-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver via toEntities (PAS toServices:kubernetes) : le Service
    # `kubernetes` DNAT 443→6443, et `toServices` n'ouvre que 443 → le paquet
    # post-DNAT vers 6443 est droppé. Casse le `kubectl apply` du Job (écriture
    # des Secrets de seal) → deadlock unsealer. Voir le bloc openbao ci-dessus.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# Egress unsealer HA (route A) : DNS (résolution des FQDN openbao-N) + API OpenBao.
# Pas d'API k8s (automountServiceAccountToken=false). Bitwarden 443 = Wave 3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-unsealer
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-unsealer
spec:
  description: "Unsealer HA egress: DNS + OpenBao API (unseal des 3 pods)."
  endpointSelector:
    matchLabels:
      app: openbao-unsealer
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # TODO Wave 3 (UNSEAL_SOURCE=bitwarden) : egress 443 vers Bitwarden EU (FQDN/CIDR).
---
# Egress init-Job (one-shot) : DNS + kube-apiserver (kubectl) + API OpenBao (init).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-init
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-init
spec:
  description: "Init-Job egress: DNS + k8s API (kubectl) + OpenBao API."
  endpointSelector:
    matchLabels:
      app: openbao-init
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver via toEntities (PAS toServices:kubernetes) : le Service
    # `kubernetes` DNAT 443→6443, et `toServices` n'ouvre que 443 → le paquet
    # post-DNAT vers 6443 est droppé. Casse le `kubectl apply` du Job (écriture
    # des Secrets de seal) → deadlock unsealer. Voir le bloc openbao ci-dessus.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
