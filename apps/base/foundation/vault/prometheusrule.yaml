apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  groups:
    - name: openbao
      interval: 30s
      rules:
        # Workload sealed > 2min = critical (unsealer HA fail)
        - alert: OpenBaoWorkloadSealed
          expr: openbao_core_unsealed == 0
          for: 2m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao sealed > 2min"
            description: "OpenBao (ns foundation-vault) is sealed. The HA unsealer is inoperative (Shamir shares not loaded, network policy, or unsealer down). Check the unsealer logs and the OpenBao status."
            runbook_url: "https://github.com/dis-bzh/OpenAether/blob/main/docs/runbooks/openbao-unseal.md"
        # Raft no leader = critical
        - alert: OpenBaoRaftNoLeader
          expr: openbao_raft_state != 1
          for: 1m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao raft cluster has no leader"
            description: "No raft instance is leader. The cluster cannot serve write requests."
        # High raft lag = warning
        - alert: OpenBaoRaftLagHigh
          expr: openbao_raft_commit_index - openbao_raft_last_log_index > 100
          for: 5m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "OpenBao raft commit lag > 100 entries"
            description: "A replica is lagging on commit. Possibly slow I/O or network."
