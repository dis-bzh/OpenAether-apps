# OpenAether 0.5.0 — OpenBao Unsealer HA (route A : image officielle, RAM-only)
# ─────────────────────────────────────────────────────────────────────────────
# Remplace l'ancien sidecar transit + le Secret openbao-seal-token.
#
# Architecture choice: we REUSE the official openbao/openbao:2.5.4 image
# (already on every node, pulled by the StatefulSet). NO custom binary, no
# registry, no digest to pin, no new dependency — aligned with the
# principe « fondation agnostique ».
#
# Security (answering the "shell + root" objection):
#   - Runs as uid 100 (openbao), runAsNonRoot, NEVER root.
#   - readOnlyRootFilesystem, drop ALL caps, allowPrivilegeEscalation=false,
#     seccomp RuntimeDefault.
#   - automountServiceAccountToken: false → no API token mounted (the unsealer
#     does NOT talk to the k8s API; it reads the shares from an RO volume).
#   - Surface = busybox sh + the official `bao` binary. No curl/wget: we use
#     `bao status` (code de sortie 2 = sealed) et `bao operator unseal`.
#
# RAM-only: the shares are NEVER written to disk by the unsealer; they come from
# a tmpfs (a mounted Secret is an in-memory tmpfs on the kubelet side) and stay
# in the process environment. Long-term target: human injection (stdin) instead
# of the file — see UNSEAL_SOURCE in the TODO block below.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-unsealer
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: openbao-unsealer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openbao-unsealer
  template:
    metadata:
      labels:
        app: openbao-unsealer
        openaether.io/component: openbao-unsealer
    spec:
      serviceAccountName: openbao-unsealer
      automountServiceAccountToken: false
      priorityClassName: platform-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unsealer
          image: docker.io/openbao/openbao:2.5.4
          env:
            - name: UNSEAL_KEYS_FILE
              value: "/unseal/keys.txt"
            - name: UNSEAL_THRESHOLD
              value: "3"
            - name: UNSEAL_INTERVAL
              value: "15"   # secondes entre deux passes de surveillance
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: "/tmp"
          # Watch loop: for each raft pod, if `bao status` reports sealed
          # (exit 2), we replay the shares up to the threshold. `bao` handles
          # the HTTP (BAO_ADDR), so no curl. Once unsealed (exit 0), it is a no-op.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              KEYS_FILE="${UNSEAL_KEYS_FILE:-/unseal/keys.txt}"
              INTERVAL="${UNSEAL_INTERVAL:-15}"
              NS="${POD_NAMESPACE:-foundation-vault}"
              PODS="openbao-0 openbao-1 openbao-2"

              if [ ! -s "$KEYS_FILE" ]; then
                echo "[unsealer] FATAL: fichier de parts vide/absent ($KEYS_FILE)"
                # We do not kill the pod in a tight loop: wait for the Secret to
                # be populated (init-Job) then retry.
              fi

              unseal_pod() {
                addr="$1"
                export BAO_ADDR="$addr"
                # OpenBao's internal CA: without it `bao status` fails and the
                # « x509: certificate signed by unknown authority » et l'unsealer
                # unsealer wrongly considers the pod unreachable — it never
                # unseals it and the cluster stays stuck.
                export BAO_CACERT="/bao/tls/ca.crt"
                # exit 0 = unsealed, 2 = sealed, autre = injoignable/erreur
                bao status >/dev/null 2>&1
                rc=$?
                if [ "$rc" = "0" ]; then
                  return 0                      # already unsealed
                fi
                if [ "$rc" != "2" ]; then
                  echo "[unsealer] $addr injoignable (rc=$rc) — skip"
                  return 1
                fi
                echo "[unsealer] $addr sealed → application des parts"
                # Replay the shares line by line; stop as soon as it is unsealed.
                while IFS= read -r key; do
                  [ -z "$key" ] && continue
                  bao operator unseal "$key" >/dev/null 2>&1 || true
                  if bao status >/dev/null 2>&1; then
                    echo "[unsealer] $addr UNSEALED"
                    return 0
                  fi
                done < "$KEYS_FILE"
                echo "[unsealer] $addr still sealed after replaying the available shares"
                return 1
              }

              echo "[unsealer] starting — watching every ${INTERVAL}s"
              while true; do
                for p in $PODS; do
                  unseal_pod "https://${p}.openbao.${NS}.svc.cluster.local:8200"
                done
                sleep "$INTERVAL"
              done
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: unseal-keys
              mountPath: /unseal
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # CA interne d'OpenBao (TLS du listener).
            - name: tls
              mountPath: /bao/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: openbao-server-tls
            defaultMode: 0444
        - name: unseal-keys
          secret:
            secretName: openbao-unseal-keys
            # optional: false → if the Secret does not exist yet (before the
            # init-Job created it), the pod waits in ContainerCreating then starts
            # WITH the file present (a clean read at mount time). Avoids the ~60s
            # kubelet propagation window of an optional secret appearing later.
            optional: false
            items:
              - key: unseal_keys
                path: keys.txt
        - name: tmp
          emptyDir:
            medium: Memory   # tmpfs : rien sur disque
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openbao-unsealer
              topologyKey: kubernetes.io/hostname
# ─────────────────────────────────────────────────────────────────────────────
# TODO (cible souveraine, Wave 3) : remplacer UNSEAL_KEYS_FILE (Secret en etcd)
# by a RAM-only human injection. Two options:
#   - UNSEAL_SOURCE=stdin: `kubectl attach` on the pod, the operator pastes the
#     shares → kept in the process's memory, never on disk nor in etcd.
#   - UNSEAL_SOURCE=bitwarden : fetch direct Bitwarden EU (token court) au boot.
# The openbao-unseal-keys Secret remains the DEV path (frequent destroy/rebuild).
