apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  # 3 raft replicas: minAvailable=2 (quorum preserved during a drain)
  minAvailable: 2
  selector:
    matchLabels:
      app: openbao
