# OpenBao StatefulSet (3 replicas, static auto-unseal)
# - Raft cluster 3/3
# - Seal: static key from the Secret openbao-seal-key (no unsealer, no Shamir share, no root token in the cluster)
# - PSS privileged (PKI system-level)
# - PriorityClass platform-critical
# - Storage: local-path-retain (local-path provisioner, Retain policy)
#   Raft replicates the data across the 3 nodes → storage replication is pointless.
#   local-path: immediate mount (no CSI attach/detach), no volume faults.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    app: openbao
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  serviceName: openbao
  replicas: 3
  # Parallel: raft needs all 3 pods to start together to bootstrap the cluster.
  # OrderedReady blocks pods 1/2 until pod-0 is Ready, but pod-0 cannot become
  # Ready without its raft peers → deadlock.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
        openaether.io/component: openbao
    spec:
      serviceAccountName: openbao
      # The cert-reload sidecar signals the bao process (SIGHUP) when cert-manager renews the listener certificate.
      shareProcessNamespace: true
      priorityClassName: platform-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # One replica per worker (#129, lab 15a: all three pods and their local-path volumes sat on ONE worker, so
      # replacing it
      # destroyed the quorum). DoNotSchedule, maxSkew 1: 2 workers hold 2+1, 3 workers 1+1+1; a single worker holds
      # all three
      # (skew 0, nothing stays Pending). nodeTaintsPolicy Ignore counts a worker that is registered but not Ready yet
      # as a domain,
      # so a pod waits for it instead of piling onto the first Ready worker (the cause in lab 15a). The control planes
      # are left
      # out of the count by the node affinity: otherwise their empty domains would cap every worker at one pod.
      # LIMIT: a node that has not registered at all is invisible to the scheduler; README "Placement" has the check
      # to run.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Ignore
          labelSelector:
            matchLabels:
              app: openbao
      containers:
        - name: openbao
          # 2.7.1 and not 2.5.x: advisories fixed in 2.6.3/2.6.4/2.7.x include the Kubernetes auth method (a revoked
          # token could still be renewed), which this deployment depends on.
          image: docker.io/openbao/openbao:2.7.1
          # Wrapper: renders the configuration from the seal key, then runs the server.
          # api_addr/cluster_addr via DNS stable (POD FQDN).
          command: ["/bin/sh", "/bao/config/entrypoint.sh"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Address of the `bao` CLI inside the pod (kubectl exec … bao status).
            # Does NOT affect `bao server` (which uses BAO_API_ADDR/BAO_CLUSTER_ADDR).
            - name: BAO_ADDR
              value: "https://127.0.0.1:8200"
            # The container's scripts (`bao` CLI) must trust the internal CA:
            # without it every local call fails with "x509: certificate
            # signed by unknown authority ».
            - name: BAO_CACERT
              value: "/bao/tls/ca.crt"
          ports:
            - containerPort: 8200
              name: api
              protocol: TCP
            - containerPort: 8201
              name: cluster
              protocol: TCP
            # Metrics listener (configmap.yaml): the only port that serves /v1/sys/metrics without a token.
            - containerPort: 8202
              name: metrics
              protocol: TCP
          securityContext:
            # IPC_LOCK removed: mlock was dropped in OpenBao 2.x.
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile: { type: RuntimeDefault }
          # Probes: startup tolerates uninit/sealed (first boot, before openbao-init has run).
          # readiness removes a sealed pod from the Service. liveness is strict.
          startupProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60  # 10 min: the pod waits for the seal key Secret, then boots and joins raft
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /bao/data
            - name: config
              mountPath: /bao/config
            - name: tls
              mountPath: /bao/tls
              readOnly: true
            - name: seal
              mountPath: /bao/seal
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Reloads the listener certificate on renewal (SIGHUP, cert-reload.sh). Same image (pidof, kill, sha256sum).
        - name: cert-reload
          image: docker.io/openbao/openbao:2.7.1
          command: ["/bin/sh", "/bao/config/cert-reload.sh"]
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /bao/config
              readOnly: true
            - name: tls
              mountPath: /bao/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openbao-config
        # Server certificate + CA, issued by cert-manager (tls.yaml).
        - name: tls
          secret:
            secretName: openbao-server-tls
            defaultMode: 0444
        # The static seal key. The pods wait (ContainerCreating) until openbao-init has created the Secret.
        - name: seal
          secret:
            secretName: openbao-seal-key
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          openaether.io/managed: "true"
          openaether.io/sprint: "0.5.0-sprint0"
          openaether.io/component: openbao
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 10Gi
