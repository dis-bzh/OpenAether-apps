# OpenAether 0.5.0 — OpenBao StatefulSet (3 replicas, Shamir seal + HA unsealer)
# - Raft cluster 3/3
# - Seal: Shamir 5/3 (auto-unseal through an external HA unsealer)
# - PSS privileged (PKI system-level)
# - PriorityClass platform-critical
# - Storage: local-path-retain (local-path provisioner, Retain policy)
#   Raft replicates the data across the 3 nodes → storage replication is pointless.
#   local-path: immediate mount (no CSI attach/detach), no volume faults.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    app: openbao
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
spec:
  serviceName: openbao
  replicas: 3
  # Parallel: raft needs all 3 pods to start together to bootstrap the cluster.
  # OrderedReady blocks pods 1/2 until pod-0 is Ready, but pod-0 cannot become
  # Ready without its raft peers → deadlock.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
        openaether.io/component: openbao
    spec:
      serviceAccountName: openbao
      priorityClassName: platform-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: openbao
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: openbao
      containers:
        - name: openbao
          image: docker.io/openbao/openbao:2.5.4
          # Wrapper: Shamir seal — no transit token. The HA unsealer handles unsealing.
          # api_addr/cluster_addr via DNS stable (POD FQDN).
          command: ["/bin/sh", "/bao/config/entrypoint.sh"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Address of the `bao` CLI inside the pod (kubectl exec … bao status).
            # The server listened in cleartext (tls_disable=1) → http://, otherwise
            # the CLI defaults to https:// ("HTTP response to HTTPS client").
            # Does NOT affect `bao server` (which uses BAO_API_ADDR/BAO_CLUSTER_ADDR).
            - name: BAO_ADDR
              value: "https://127.0.0.1:8200"
            # The container's scripts (`bao` CLI) must trust the internal CA:
            # without it every local call fails with "x509: certificate
            # signed by unknown authority ».
            - name: BAO_CACERT
              value: "/bao/tls/ca.crt"
          ports:
            - containerPort: 8200
              name: api
              protocol: TCP
            - containerPort: 8201
              name: cluster
              protocol: TCP
          securityContext:
            # IPC_LOCK removed: mlock was dropped in OpenBao 2.x.
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile: { type: RuntimeDefault }
          # Probes: startup tolerates uninit/sealed (while the HA unsealer works).
          # readiness removes a sealed pod from the Service. liveness is strict.
          startupProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60  # 10min: boot + attente unsealer + raft join
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /bao/data
            - name: config
              mountPath: /bao/config
            - name: tls
              mountPath: /bao/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-config
        # Server certificate + CA, issued by cert-manager (tls.yaml).
        - name: tls
          secret:
            secretName: openbao-server-tls
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          openaether.io/managed: "true"
          openaether.io/sprint: "0.5.0-sprint0"
          openaether.io/component: openbao
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 10Gi
