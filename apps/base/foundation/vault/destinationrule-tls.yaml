# TLS between the gateway and OpenBao (UI access).
#
# Since OpenBao's listener runs TLS, the Istio gateway must speak HTTPS to its
# backend — the HTTPRoute only describes L7 routing and would send cleartext,
# which yields a "TLS handshake error: client sent an HTTP request to an HTTPS
# server" on the OpenBao side and an unreachable UI.
#
# ── Why a DestinationRule rather than a BackendTLSPolicy ─────────────────────
# `BackendTLSPolicy` would be the Gateway-API-native way, but its CRD belongs to
# Gateway API's EXPERIMENTAL channel, which this foundation does not install
# (verified: the CRD is absent from the cluster). The DestinationRule is Istio's
# equivalent and works here even though `foundation-vault` is OUTSIDE the mesh:
# it configures the CLIENT (the gateway's Envoy), not the destination.
#
# ⚠️ NOT VALIDATED locally: Istio is not deployed on the Docker test cluster.
# The rest of the TLS chain was (raft, init, bootstrap, unsealer, ESO). To be
# checked on the first cloud deployment — a fallback is available meanwhile:
# `scripts/ops/local-admin-portforward.sh`, which bypasses the gateway.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: openbao-tls
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vault
spec:
  host: openbao-ui.foundation-vault.svc.cluster.local
  trafficPolicy:
    tls:
      # SIMPLE rather than MUTUAL: OpenBao requires no client certificate
      # (`tls_client_ca_file` is not set) — authentication happens through a
      # token or auth/kubernetes; TLS only authenticates the server.
      mode: SIMPLE
      sni: openbao-ui.foundation-vault.svc.cluster.local
      # Server certificate verification by the gateway's Envoy.
      #
      # `credentialName` reads a Secret in the CLIENT's namespace — so
      # `services-gateway`, not foundation-vault. The CA is materialised there by
      # le Certificate `openbao-ca-bundle`
      # (apps/base/services-gateway/openbao-ca-bundle.yaml), signed by the same
      # ClusterIssuer as the listener: only its `ca.crt` is consumed.
      #
      # Replaces an `insecureSkipVerify: true` that encrypted without
      # authenticating the server. `caCertificates` was unusable: it expects a
      # FILE PATH inside the Envoy, which Istio generates and where we mount
      # rien facilement.
      credentialName: openbao-ca-bundle
