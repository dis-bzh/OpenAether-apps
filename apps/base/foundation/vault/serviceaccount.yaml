apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-workload
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-workload
automountServiceAccountToken: true
---
# RBAC minimal: ce SA sera utilisé par l'auth kubernetes du root pour
# autoriser le transit wrap (cf. role workload-unseal sur root).
# Pas d'autres permissions nécessaires sur le workload.
# system:auth-delegator : permet à OpenBao de faire des TokenReview pour l'auth kubernetes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-workload-auth-delegator
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-workload
subjects:
  - kind: ServiceAccount
    name: openbao-workload
    namespace: foundation-vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-workload
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-workload
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-workload
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-workload
subjects:
  - kind: ServiceAccount
    name: openbao-workload
    namespace: foundation-vault
roleRef:
  kind: Role
  name: openbao-workload
  apiGroup: rbac.authorization.k8s.io
