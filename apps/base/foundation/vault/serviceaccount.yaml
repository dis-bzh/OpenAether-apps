apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
automountServiceAccountToken: true
---
# Minimal RBAC for the single OpenBao's SA (foundation-vault).
# system:auth-delegator: lets OpenBao perform TokenReviews for the kubernetes
# auth method (ESO + cert-manager authenticate through their SA). No other right.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: foundation-vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao
  namespace: foundation-vault
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: foundation-vault
roleRef:
  kind: Role
  name: openbao
  apiGroup: rbac.authorization.k8s.io
---
# Identities that only exist to log in to OpenBao through its Kubernetes auth method. No Pod runs as any of
# them but the bootstrap Job; a cluster administrator mints a short-lived token (`kubectl create token`) for the
# others, and each is bound to ONE OpenBao role and its policy (scripts/configure.sh). They get no RBAC and no
# API token mount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-seeder
  namespace: foundation-vault
  labels: {openaether.io/managed: "true", openaether.io/component: openbao}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openaether-admin
  namespace: foundation-vault
  labels: {openaether.io/managed: "true", openaether.io/component: openbao}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openaether-reader
  namespace: foundation-vault
  labels: {openaether.io/managed: "true", openaether.io/component: openbao}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-breakglass
  namespace: foundation-vault
  labels: {openaether.io/managed: "true", openaether.io/component: openbao}
automountServiceAccountToken: false
