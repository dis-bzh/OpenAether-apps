# OpenAether 0.5.0 — OpenBao (3 raft replicas, Shamir seal + HA unsealer)
# A refactor of the former apps/base/openbao/ — a single HA OpenBao, no root.
# Seal: Shamir 5/3 (auto-unseal via unsealer HA externe)
# HA unsealer: 2-3 RAM-only replicas, configurable source (file/bitwarden/manual).
# Removed: foundation-pki-root, transit seal, openbao-seal-token, openbao-root-recovery.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NB: the `foundation-vault` namespace is defined in
# apps/base/namespaces/namespaces.yaml. We do not (re)declare it here.
# The `namespace:` directive rewrites the resources' metadata.namespace
# ci-dessous vers foundation-vault.
namespace: foundation-vault

resources:
  - tls.yaml
  - destinationrule-tls.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - unsealer-sa.yaml
  - statefulset.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - httproute.yaml
  - openbao-init.yaml
  - bootstrap-roles-job.yaml
  - unsealer.yaml
  - bitwarden-unseal-creds.yaml
  # NB: the openbao-unseal-keys Secret is NOT managed by Flux (anti-drift):
  # the init-Job (openbao-init.yaml) creates it with the real Shamir shares.
  # Declaring it here would overwrite/prune the real shares on every reconcile.
  # bitwarden-unseal-creds.yaml reste placeholder (optionnel, source=bitwarden).

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprint0"
      openaether.io/component: openbao
