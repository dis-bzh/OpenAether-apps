# OpenBao: 3 raft replicas, static auto-unseal, audit device, no root token at rest (see README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NB: the `foundation-vault` namespace is defined in
# apps/base/namespaces/namespaces.yaml. We do not (re)declare it here.
# The `namespace:` directive rewrites the resources' metadata.namespace
# below to foundation-vault.
namespace: foundation-vault

resources:
  - tls.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - statefulset.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - httproute.yaml
  - openbao-init.yaml
  - bootstrap-roles-job.yaml
  - escrow-check.yaml
  # NB: the Secrets openbao-seal-key, openbao-recovery-shares and openbao-recovery-dev are NOT managed by Flux:
  # openbao-init creates them (create-only), and declaring them here would let a reconcile overwrite or prune
  # the real key material.

# The bootstrap scripts and the policy files they load, as ONE ConfigMap: the files are the source of truth
# (the harness scripts/dev/test-openbao-bootstrap.sh runs them against a real OpenBao). The name suffix hash is
# kept: a changed script recreates both Jobs.
configMapGenerator:
  - name: openbao-bootstrap-scripts
    files:
      - scripts/lib.sh
      - scripts/init.sh
      - scripts/configure.sh
      - scripts/policies/openaether-bootstrap.hcl
      - scripts/policies/openaether-breakglass.hcl
      - scripts/policies/external-secrets-read.hcl
      - scripts/policies/cert-manager-pki.hcl
      - scripts/policies/backup-snapshot.hcl
      - scripts/policies/secret-seeder.hcl
      - scripts/policies/openaether-admin.hcl
      - scripts/policies/openaether-reader.hcl

# A separate ConfigMap, so that editing this script does not change the hash of the one above and recreate the Jobs.
  - name: openbao-escrow-check-script
    files:
      - scripts/escrow-check.sh

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/component: openbao
