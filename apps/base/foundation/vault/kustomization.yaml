# OpenAether 0.5.0 — OpenBao (3 répl raft 3, Shamir seal + unsealer HA)
# Refacto de l'ancien apps/base/openbao/ — single OpenBao HA, pas de root.
# Seal: Shamir 5/3 (auto-unseal via unsealer HA externe)
# Unsealer HA: 2-3 répliques RAM-only, source configurable (file/bitwarden/manual).
# Removed: foundation-pki-root, transit seal, openbao-seal-token, openbao-root-recovery.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NB: le namespace `foundation-vault` est défini dans
# apps/base/namespaces/namespaces.yaml. On ne le (re)déclare pas ici.
# La directive `namespace:` réécrit les metadata.namespace des ressources
# ci-dessous vers foundation-vault.
namespace: foundation-vault

resources:
  - tls.yaml
  - destinationrule-tls.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - unsealer-sa.yaml
  - statefulset.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - httproute.yaml
  - openbao-init.yaml
  - bootstrap-roles-job.yaml
  - unsealer.yaml
  - bitwarden-unseal-creds.yaml
  # NB: le Secret openbao-unseal-keys n'est PAS géré par Flux (anti-drift) :
  # l'init-Job (openbao-init.yaml) le crée avec les vraies parts Shamir. Le
  # déclarer ici ferait écraser/pruner les vraies parts à chaque reconcile.
  # bitwarden-unseal-creds.yaml reste placeholder (optionnel, source=bitwarden).

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprint0"
      openaether.io/component: openbao
