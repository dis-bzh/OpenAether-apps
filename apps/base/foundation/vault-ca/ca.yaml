# OpenBao's internal CA — a SEPARATE brick, in the `cert-manager` namespace.
#
# ⚠️ It cannot live in the vault brick: that kustomization carries
# `namespace: foundation-vault`, and Kustomize's namespace transformer overrides
# EVERY resource, including a referenced base's. The CA then lands outside
# `cert-manager` — the only namespace where a ClusterIssuer resolves its
# `caBundleSecretRef` — and OpenBao's pods hang in ContainerCreating waiting for
# a certificate that is never issued (observed in the cloud, 2026-07-28).
# Missed locally because the test applied the file directly with `apply -f`,
# which bypasses the override: validating a file is not validating the brick.
#
# The CA is deliberately dedicated, not OpenBao's own PKI — that would need
# OpenBao reachable to issue the certificate that makes it reachable.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-selfsigned
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  namespace: cert-manager
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  isCA: true
  commonName: openaether-openbao-internal-ca
  secretName: openbao-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: openbao-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-ca
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  ca:
    secretName: openbao-ca
