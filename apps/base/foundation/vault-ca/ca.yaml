# OpenBao's internal CA — a SEPARATE brick, targeting the `cert-manager` namespace.
#
# ⚠️ WHY A SEPARATE DIRECTORY
# The vault brick's `kustomization.yaml` carries `namespace: foundation-vault`,
# and Kustomize's namespace transformer overrides the namespace declared on
# EVERY resource — including that of a referenced base. The CA therefore landed
# in `foundation-vault` instead of `cert-manager`, and the openbao
# `ClusterIssuer` (apps/base/cert-manager-issuers) could not read its
# `caBundleSecretRef`: a ClusterIssuer resolves its Secrets in the "cluster
# resource namespace » de cert-manager, nulle part ailleurs.
#
# Consequence observed in the cloud on 2026-07-28: `openbao-server-tls` stayed
# « Issuing certificate as Secret does not exist » et les 3 pods OpenBao
# bloquaient en ContainerCreating.
#
# ⚠️ This defect was NOT caught locally because the test applied `tls.yaml`
# DIRECTLY (`kubectl apply -f`), which bypasses the kustomization's override.
# Validating a file is not validating the brick.
#
# The CA is deliberately DEDICATED and has nothing to do with the PKI OpenBao
# serves: using that would create a cycle (it would have to be reachable to
# issue the certificate that makes it reachable).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-selfsigned
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  namespace: cert-manager
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  isCA: true
  commonName: openaether-openbao-internal-ca
  secretName: openbao-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: openbao-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-ca
  labels:
    openaether.io/managed: 'true'
    openaether.io/component: vault
spec:
  ca:
    secretName: openbao-ca
