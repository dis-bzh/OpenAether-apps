---
# CAPI Operator — manages CoreProvider / InfrastructureProvider / BootstrapProvider / ControlPlaneProvider CRDs
# https://github.com/kubernetes-sigs/cluster-api-operator
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  url: https://kubernetes-sigs.github.io/cluster-api-operator
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-api-operator
      version: "0.27.0"
      sourceRef:
        kind: HelmRepository
        name: capi-operator
        namespace: capi-operator-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      manager:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
