apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CAPI Operator — installs the operator that creates the Provider CRDs.
# Must be deployed BEFORE apps/base/cluster-api-providers (through a Flux dependsOn).
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintA"
      openaether.io/component: "cluster-api-operator"
