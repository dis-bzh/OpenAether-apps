# OpenAether 0.5.0 — Cluster API Operator NetworkPolicy
# CAPI operator webhook (si activé) écoute sur le port 9443 (standard kubebuilder).
# Le Service capi-operator-webhook expose 443 → 9443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-operator
  namespace: capi-operator-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintA"
    openaether.io/component: "cluster-api-operator"
spec:
  description: "CAPI operator webhook: ingress kube-apiserver sur webhook:9443,
    egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-api-operator
  ingress:
    # kube-apiserver → webhook CAPI operator (ValidatingWebhookConfiguration)
    # Port standard kubebuilder 9443.
    # remote-node: sur Talos, le static pod kube-apiserver est identifié
    # comme nœud (node identity) par Cilium, pas comme kube-apiserver entity.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # intra-namespace: controller → webhook (cert rotation)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: capi-operator-system
            app.kubernetes.io/name: cluster-api-operator
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # DNS — rules.dns requis pour que les toFQDNs matchent (proxy DNS Cilium).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Releases GitHub — l'operator TÉLÉCHARGE les manifests des providers
    # (CoreProvider/InfrastructureProvider…) depuis les releases GitHub.
    # Sans cet egress : "ComponentsFetchError … context deadline exceeded"
    # et AUCUN provider ne s'installe (constaté en cloud réel).
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: raw.githubusercontent.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP