# OpenAether 0.5.0 — Cluster API Operator NetworkPolicy
# The CAPI operator webhook (if enabled) listens on port 9443 (kubebuilder standard).
# Le Service capi-operator-webhook expose 443 → 9443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-operator
  namespace: capi-operator-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintA"
    openaether.io/component: "cluster-api-operator"
spec:
  description: "CAPI operator webhook: ingress kube-apiserver sur webhook:9443,
    egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-api-operator
  ingress:
    # kube-apiserver → webhook CAPI operator (ValidatingWebhookConfiguration)
    # Port standard kubebuilder 9443.
    # remote-node: on Talos the static kube-apiserver pod is identified by Cilium
    # as a node (node identity), not as the kube-apiserver entity.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # intra-namespace: controller → webhook (cert rotation)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: capi-operator-system
            app.kubernetes.io/name: cluster-api-operator
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # DNS — rules.dns is required for the toFQDNs to match (Cilium DNS proxy).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # GitHub releases — the operator DOWNLOADS the providers' manifests
    # (CoreProvider/InfrastructureProvider…) from GitHub releases.
    # Without this egress: "ComponentsFetchError … context deadline exceeded"
    # and NO provider installs (observed on real cloud).
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: raw.githubusercontent.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP