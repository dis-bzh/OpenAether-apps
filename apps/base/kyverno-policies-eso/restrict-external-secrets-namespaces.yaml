# Audit-only guard that complements the `conditions` of the openbao
# ClusterSecretStore (apps/base/external-secrets/stores): it REPORTS (PolicyReport)
# External Secrets objects created outside the platform namespaces. It blocks
# nothing; move to Enforce only after the reports are clean on a cluster.
# failurePolicy Ignore: Kyverno registers a webhook for these kinds even in Audit (default Fail, kyverno
# v1.12.1 pkg/controllers/webhook), so a Kyverno outage would block Flux and ESO writing them.
# Rules match CREATE and UPDATE only: on DELETE `request.object` is empty and a removal is no violation.
# The namespaces below MUST equal the store's `conditions[].namespaces`
# (scripts/check-externalsecret-namespaces.py checks it).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-external-secrets-namespaces
  annotations:
    policies.kyverno.io/title: Restrict External Secrets objects to platform namespaces
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: ExternalSecret
    policies.kyverno.io/description: >-
      ExternalSecret, PushSecret and SecretStore objects belong in the platform
      namespaces; ClusterExternalSecret, ClusterPushSecret and any
      ClusterSecretStore other than openbao are not used by the platform.
spec:
  validationFailureAction: Audit
  failurePolicy: Ignore
  background: false
  rules:
    - name: namespaced-objects-in-platform-namespaces
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
                - PushSecret
                - SecretStore
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - foundation-vault
                - foundation-databases
                - backup-restore-test
                - foundation-storage
                - longhorn-system
                - services-identity
                - services-observability
                - services-observability-audit-sink
      validate:
        message: "External Secrets objects are only allowed in the platform namespaces (they read OpenBao)."
        deny: {}
    - name: cluster-scoped-objects-not-used
      match:
        any:
          - resources:
              kinds:
                - ClusterExternalSecret
                - ClusterPushSecret
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          ClusterExternalSecret and ClusterPushSecret are not used by the platform;
          they copy OpenBao data across namespaces.
        deny: {}
    - name: only-the-openbao-store
      match:
        any:
          - resources:
              kinds:
                - ClusterSecretStore
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.metadata.name }}"
            operator: NotEquals
            value: openbao
      validate:
        message: "Only the openbao ClusterSecretStore (restricted to the platform namespaces) is allowed."
        deny: {}
