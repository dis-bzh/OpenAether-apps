# yamllint disable rule:line-length
# The canary volume's class: two replicas like the platform's usual one, and a recurring-job group so that the daily Longhorn backup
# (storage/backup-target/recurringjob.yaml) takes it. The group follows LONGHORN_BACKUP_GROUP like that job does.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-oa-canary
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: false
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
  recurringJobSelector: '[{"name":"${LONGHORN_BACKUP_GROUP:=oa-backup}","isGroup":true}]'
