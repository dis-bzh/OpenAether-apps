# yamllint disable rule:line-length
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: trust-manager
      version: "v0.26.0"
      sourceRef:
        kind: HelmRepository
        name: trust-manager
        namespace: cert-manager
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # The chart's own switch for its CRDs; kept on uninstall so a removal does not delete every Bundle.
    crds:
      enabled: true
      keep: true
    # Two replicas on different workers and a budget that lets a drain take one (scripts/check-ha.py). Leader election is on by default.
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: trust-manager
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: trust-manager
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Only the CA we publish: no Debian CA package (an extra image and init container), and no Secret targets (the chart
    # then has no right to write a Secret anywhere). The trust namespace is where the source Secret lives.
    defaultPackage:
      enabled: false
    secretTargets:
      enabled: false
    app:
      trust:
        namespace: cert-manager
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
