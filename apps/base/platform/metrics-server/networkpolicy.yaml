# OpenAether — CiliumNetworkPolicy Metrics Server
# ──────────────────────────────────────────────────────────────────
# metrics-server (kube-system) was covered by NO CNP, so it was governed only by
# the cluster-wide CCNPs with an empty selector:
#   default-deny-all-ingress {}  → ingress denied by default
#   allow-dns {} + allow-kube-api {} → egress deny sauf DNS + kube-apiserver
#
# Consequence (without this policy):
#   • EGRESS kubelet :10250 scraping allowed ONLY towards the IPs carrying the
#     kube-apiserver identity = the control-plane nodes (hostNetwork apiserver).
#     The WORKERS' kubelets (host/remote-node identity) are unreachable
#     → "Failed to scrape node ... 10250: i/o timeout".
#   • INGRESS apiserver → metrics-server blocked → the metrics.k8s.io APIService
#     goes FailedDiscoveryCheck → `kubectl top` fails ("Metrics API not available").
#   • The local readiness probe (host → local pod) still passes → the pod is
#     Ready but useless (a classic false positive with ambient/CNP).
#
# Fix = the same pattern as the vmagent CNP (observability/networkpolicy.yaml):
# autoriser explicitement host + remote-node sur :10250.
# The allow-dns/allow-kube-api CCNPs stay additive (Cilium ORs the policies).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: metrics-server
spec:
  description: "metrics-server: ingress apiserver + egress scrape kubelet :10250 (host+remote-node)."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  ingress:
    # apiserver → metrics-server (aggregated API: discovery + kubectl top queries).
    # L'apiserver tourne en hostNetwork sur les CP → source host/remote-node ;
    # kube-apiserver covers the dedicated reserved identity (Cilium ≥1.14).
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
  egress:
    # DNS (already covered by allow-dns; explicit for robustness, see the vmagent CNP).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Scrape kubelet/cadvisor :10250 on ALL nodes (host = the local node,
    # remote-node = the others). Without remote-node, only the CPs answer.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
