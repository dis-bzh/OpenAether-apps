# OpenAether — Metrics Server
# ──────────────────────────────────────────────────────────────────
# Enables the metrics API for kubectl top nodes/pods.
# On Talos, --kubelet-preferred-address-types=InternalIP
# and --kubelet-insecure-tls are required while Talos kubelets serve self-signed
# certificates. Once infra's kubelet_serving_cert_rotation is on, the opt-in component
# apps/flux/components/kubelet-verified-tls replaces the flag by a CA check.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: metrics-server
spec:
  url: https://kubernetes-sigs.github.io/metrics-server/
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: kube-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    args:
      - --kubelet-preferred-address-types=InternalIP
      - --kubelet-insecure-tls
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
