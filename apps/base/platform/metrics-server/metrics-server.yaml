# OpenAether — Metrics Server
# ──────────────────────────────────────────────────────────────────
# Enables the metrics API for kubectl top nodes/pods.
# On Talos, --kubelet-preferred-address-types=InternalIP
# and --kubelet-insecure-tls are required while Talos kubelets serve self-signed
# certificates. Once infra's kubelet_serving_cert_rotation is on, the opt-in component
# apps/flux/components/kubelet-verified-tls replaces the flag by a CA check.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: metrics-server
spec:
  url: https://kubernetes-sigs.github.io/metrics-server/
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: kube-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    args:
      - --kubelet-preferred-address-types=InternalIP
      - --kubelet-insecure-tls
    # Two replicas on two workers: the HorizontalPodAutoscaler of the Gateway reads its metrics here, and a lost worker
    # must not freeze it (0.4.0 M4, scripts/check-ha.py). Costs 50m of CPU requests.
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: metrics-server
            app.kubernetes.io/instance: metrics-server
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: metrics-server
            app.kubernetes.io/instance: metrics-server
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
