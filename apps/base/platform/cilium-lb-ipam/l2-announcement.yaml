# OpenAether — CiliumL2AnnouncementPolicy
# ─────────────────────────────────────────────────────────────────────────────
# Lets Cilium answer ARP requests for the LB-IPAM pool's VIPs on the private
# VPC network. Without this policy the VIPs are allocated but unreachable (no
# node announces the MAC for the virtual IP).
#
# externalIPs + loadBalancerIPs cover both use cases.
# Every node is eligible (no nodeSelector) — Cilium elects one leader per VIP
# to answer ARP (automatic failover if that node goes down).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: private-vpc-l2
spec:
  externalIPs: true
  loadBalancerIPs: true
