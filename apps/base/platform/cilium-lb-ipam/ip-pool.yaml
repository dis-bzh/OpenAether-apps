# OpenAether — CiliumLoadBalancerIPPool
# ─────────────────────────────────────────────────────────────────────────────
# A pool of virtual IPs for cluster-internal type=LoadBalancer Services.
# The range sits at the top of the private VPC subnet (172.16.12.0/22, Scaleway
# IPAM) to avoid clashing with the IPs auto-assigned to nodes (.2-.6).
#
# This pool is for the PRIVATE network (admin, observability). Public traffic
# arrive via le Scaleway LB externe (opentofu lb.tf → worker NodePorts).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: private-vpc
spec:
  blocks:
    - start: "172.16.12.240"
      stop: "172.16.12.254"
