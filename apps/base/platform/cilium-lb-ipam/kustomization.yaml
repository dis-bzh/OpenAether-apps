apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether — Cilium LB-IPAM (LoadBalancer IP allocation + L2 announcements)
# Provides a pool of virtual IPs on the private VPC network and an L2 policy so
# Cilium answers ARP for those VIPs. Without these resources every
# type=LoadBalancer Service stays <pending>.
resources:
  - ip-pool.yaml
  - l2-announcement.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "cilium-lb-ipam"
