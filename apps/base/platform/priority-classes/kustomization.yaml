# OpenAether 0.5.0 — priority classes (platform hierarchy)
# P0: platform-critical (OpenBao, cert-manager, ESO, CSI, Flux)
# P1: platform-medium (Keycloak/CNPG/Jetstack controllers)
# P2: platform-low (observability, demo, dashboards)
# P3: workload-batch (KEDA scaledobjects)
# NB: system-cluster-critical + system-node-critical are pre-installed by k8s;
# we do not (re)declare them (immutable preemptionPolicy + reserved name).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - platform-critical.yaml
  - platform-medium.yaml
  - platform-low.yaml
  - workload-batch.yaml
