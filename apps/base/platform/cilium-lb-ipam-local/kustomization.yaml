apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local overlay — cilium-lb-ipam on the Docker bridge (Talos-in-Docker).
# The base pool (172.16.12.240-254) targets the Scaleway private VPC, which is
# unreachable locally: the nodes live on the openaether-local-dev-net Docker
# bridge (10.5.0.0/24, see modules/talos). We only patch the pool's range;
# The CiliumL2AnnouncementPolicy (ARP, no nodeSelector) stays valid as is.
#
# A sibling of cilium-lb-ipam/ (not nested under it): an overlay placed under
# the directory it references through `../` creates a kustomize cycle.
resources:
  - ../cilium-lb-ipam

patches:
  - target:
      group: cilium.io
      kind: CiliumLoadBalancerIPPool
      name: private-vpc
    patch: |-
      - op: replace
        path: /spec/blocks
        value:
          - start: "10.5.0.240"
            stop: "10.5.0.254"
