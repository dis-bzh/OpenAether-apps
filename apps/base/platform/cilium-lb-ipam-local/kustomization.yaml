apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local overlay — cilium-lb-ipam sur le bridge Docker (Talos-in-Docker).
# Le pool base (172.16.12.240-254) cible le VPC privé Scaleway, injoignable
# en local : les nœuds vivent sur le bridge Docker openaether-local-dev-net
# (10.5.0.0/24, cf. modules/talos). On patch juste le range du pool ; le
# CiliumL2AnnouncementPolicy (ARP, sans nodeSelector) reste valide tel quel.
#
# Sibling de cilium-lb-ipam/ (pas nested dessous) : un overlay sous le
# dossier qu'il référence via `../` crée un cycle kustomize.
resources:
  - ../cilium-lb-ipam

patches:
  - target:
      group: cilium.io
      kind: CiliumLoadBalancerIPPool
      name: private-vpc
    patch: |-
      - op: replace
        path: /spec/blocks
        value:
          - start: "10.5.0.240"
            stop: "10.5.0.254"
