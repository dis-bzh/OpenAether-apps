apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether — Scaleway Cloud Controller Manager
# Provides public LoadBalancer services via Scaleway LB (instead of Cilium LB-IPAM).
# Coexists with Cilium LB-IPAM via loadBalancerClass="scaleway.com/loadbalancer".
# Secret seeded by bootstrap-roles-job from OpenBao secret/ccm/scaleway.
resources:
  - helmrelease.yaml
  - helmrepository.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/component: ccm-scaleway