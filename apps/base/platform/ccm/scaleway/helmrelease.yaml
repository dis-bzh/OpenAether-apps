apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scaleway-cloud-controller-manager
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: ccm-scaleway
spec:
  interval: 10m
  targetNamespace: kube-system
  chart:
    spec:
      chart: scaleway-cloud-controller-manager
      version: "1.1.0"
      sourceRef:
        kind: HelmRepository
        name: scaleway
        namespace: kube-system
      interval: 1h
  dependsOn:
    - name: cilium
  values:
    image:
      repository: scaleway/cloud-controller-manager
      tag: v0.5.0
      pullPolicy: IfNotPresent
    cloudProvider:
      clusterName: "openaether-dev"
      secretName: "scaleway-ccm-secret"
      loadBalancerClass: "scaleway.com/loadbalancer"
    # Force CCM to handle ALL LoadBalancer services (not just those with the class)
    # because Istio Gateway doesn't expose loadBalancerClass in its spec.
    # This means CCM and Cilium LB-IPAM will both try to handle the service.
    # To avoid conflict, we use --load-balancer-class to scope CCM.
    args:
      - --load-balancer-class=scaleway.com/loadbalancer
      - --v=4
    rbac:
      create: true
    serviceAccount:
      create: true
      name: scaleway-cloud-controller-manager
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    livenessProbe:
      httpGet:
        path: /healthz
        port: 10254
      initialDelaySeconds: 10
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /readyz
        port: 10254
      initialDelaySeconds: 5
      periodSeconds: 10