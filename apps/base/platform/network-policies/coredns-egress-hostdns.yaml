# OpenAether — CoreDNS egress to the HOST resolver (Talos hostDNS)
# ──────────────────────────────────────────────────────────────────────────
# TRAP (first full-stack cloud reconcile, June 2026): the `allow-dns` CCNP
# (allow-dns.yaml) has `endpointSelector: {}` → it ALSO selects the CoreDNS
# pods. As soon as an egress CNP/CCNP matches an endpoint, Cilium turns on
# default-deny EGRESS on it. CoreDNS is then allowed to egress ONLY to the
# kube-dns pods (allow-dns's rule) — yet with Talos `forwardKubeDNSToHost: true`
# CoreDNS forwards external queries to the HOST's resolver (link-local
# 169.254.x.x:53, the Cilium `host` entity).
# That CoreDNS→host traffic was DROPPED ("Policy denied ... ->host: ...:53 udp")
# → every external resolution timed out → the HelmRepositories (jetstack,
# longhorn, zitadel, grafana…) could no longer fetch their index → cert-manager,
# istio, identity and storage stuck in cascade.
#
# Image pulls (containerd, outside the pod network) were unaffected → only the
# Flux source-controller (fetching Helm indexes from a pod) fell over.
#
# Fix: explicitly allow CoreDNS egress → the `host` entity (+ remote-node in
# multi-node HA) on :53. The actual external resolution is done by the Talos
# host outside the pod network (not subject to Cilium policies).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-egress-hostdns
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "CoreDNS egress vers le résolveur hôte (Talos hostDNS) sur :53."
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    # The local host's resolver (Talos forwardKubeDNSToHost → 169.254.x.x:53).
    # remote-node covers the HA case where the forward would target another node.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
