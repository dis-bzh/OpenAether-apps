# OpenAether 0.5.0 — Allow Infrastructure Egress (Restricted / Zero Trust)
# Remplace allow-infra-egress.yaml (trop permissif: world)
# Each namespace has its own allowed FQDNs.
# DNS (53 UDP/TCP) to the cluster (CoreDNS) is allowed for everyone.
# Kube-API (443) is allowed for everyone through allow-kube-api.yaml (a separate CCNP).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-infra-egress-restricted
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Restricted egress per infrastructure namespace to specific FQDNs"
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - flux-system
          - cert-manager
          - capi-system
          - capi-operator-system
          - longhorn-system
          - kyverno
          - cnpg-system
  egress:
    # ===== COMMON: CoreDNS for everyone =====
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # ===== FLUX-SYSTEM =====
    - toFQDNs:
        - matchName: github.com
        - matchName: charts.jetstack.io
        - matchName: charts.longhorn.io
        - matchName: charts.min.io
        - matchName: istio-release.storage.googleapis.com
        - matchName: victoriametrics.github.io
        - matchName: grafana.github.io
        - matchName: prometheus-community.github.io
        - matchName: kubernetes-sigs.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # ===== CERT-MANAGER =====
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: acme-staging-v02.api.letsencrypt.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # ===== CAPI-SYSTEM (Cluster API controllers) =====
    # Cilium does not support toFQDNs + toCIDR in the same rule → separate rules
    - toFQDNs:
        - matchName: api.scaleway.com
        - matchName: api.ovh.com
        - matchName: api.outscale.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - "51.158.0.0/16"  # OVH cloud endpoints range
        - "54.38.0.0/16"   # OVH cloud endpoints range
        - "158.69.0.0/16"  # OVH cloud endpoints range
        - "147.135.0.0/16" # OVH cloud endpoints range
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # ===== CAPI-OPERATOR-SYSTEM (Cluster API Operator) =====
    # Same needs as capi-system for the providers
    - toFQDNs:
        - matchName: api.scaleway.com
        - matchName: api.ovh.com
        - matchName: api.outscale.com
        - matchName: github.com  # Pour installer CRDs/manifests
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - "51.158.0.0/16"  # OVH cloud endpoints range
        - "54.38.0.0/16"   # OVH cloud endpoints range
        - "158.69.0.0/16"  # OVH cloud endpoints range
        - "147.135.0.0/16" # OVH cloud endpoints range
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # ===== LONGHORN-SYSTEM =====
    # Longhorn needs its registry and possibly the cloud APIs for CSI
    - toFQDNs:
        - matchName: charts.longhorn.io
        - matchName: github.com
        - matchName: api.scaleway.com
        - matchName: api.ovh.com
        - matchName: api.outscale.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - "51.158.0.0/16"  # OVH cloud endpoints range
        - "54.38.0.0/16"   # OVH cloud endpoints range
        - "158.69.0.0/16"  # OVH cloud endpoints range
        - "147.135.0.0/16" # OVH cloud endpoints range
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # ===== KYVERNO =====
    # Kyverno needs GitHub for external policies and releases
    - toFQDNs:
        - matchName: github.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP