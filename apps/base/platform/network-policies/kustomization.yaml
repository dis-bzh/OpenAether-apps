# OpenAether 0.5.0 — NetworkPolicies (allow-list explicites)
# NB: Cilium ignore les NetworkPolicy k8s natives, on utilise UNIQUEMENT
# CiliumNetworkPolicy (L3/L4/L7 via cilium-envoy).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - allow-dns.yaml
  - allow-kube-api.yaml
  - allow-infra-egress-restricted.yaml
  - coredns-ingress-restricted.yaml
  - default-deny-all.yaml
