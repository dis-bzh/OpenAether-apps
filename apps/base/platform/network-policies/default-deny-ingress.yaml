# OpenAether 0.5.0 — Default Deny Ingress (K8s standard)
# Appliqué dans chaque namespace infra: ferme tout ingress par défaut.
# Chaque workload doit avoir sa NetworkPolicy explicite.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: flux-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
