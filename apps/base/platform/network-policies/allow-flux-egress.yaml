apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-flux-egress
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Allow flux-system to reach internet for Git and Helm repos"
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: flux-system
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"  # Optionnel, si certains charts sont en HTTP
              protocol: TCP
