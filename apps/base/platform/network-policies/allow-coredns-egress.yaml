# OpenAether 0.5.0 — Allow CoreDNS Egress
# Autorise les pods CoreDNS à interroger les serveurs DNS externes
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-egress-to-world
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Allow CoreDNS to forward queries to external DNS servers"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP