# OpenAether 0.5.0 — Allow Infrastructure Egress
# Autorise les namespaces critiques (Flux, Cert-Manager, CAPI, Longhorn, Kyverno)
# à sortir vers Internet (Helm repos, Git, Let's Encrypt, Cloud APIs).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-infra-egress
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Allow egress to world for infrastructure namespaces"
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - flux-system
          - cert-manager
          - capi-system
          - capi-operator-system
          - longhorn-system
          - kyverno
  egress:
    - toEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP