# OpenAether 0.5.0 — CoreDNS Ingress for Infrastructure (K8s standard)
# Autorise les namespaces d'infrastructure à interroger CoreDNS (kube-system)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns-ingress-allow-infra
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    # FLUX-SYSTEM: tous les pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # CERT-MANAGER
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # CAPI-SYSTEM
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: capi-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # CAPI-OPERATOR-SYSTEM
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: capi-operator-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # LONGHORN-SYSTEM
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # KYVERNO
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kyverno
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53