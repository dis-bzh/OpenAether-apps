# OpenAether 0.5.0 — Allow Kube API (TCP 443 vers API server)
# A CCNP allowing every pod to talk to the kube-apiserver.
# Required by: cert-manager webhooks, Kyverno webhooks, Flux,
# ESO, CNPG, OpenBao auth kubernetes, etc.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kube-api
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: platform
spec:
  description: "Allow egress TCP 443 vers kube-apiserver depuis tous les pods."
  endpointSelector: {}
  egress:
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Backend endpoints (kubelet API + service CIDR) for cilium-operator
    - toEntities:
        - kube-apiserver
