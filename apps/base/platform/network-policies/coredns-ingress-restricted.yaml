# OpenAether 0.5.0 — CoreDNS Ingress (Zero Trust)
# DNS is a universal infrastructure service: every pod in the cluster needs it.
# Restricting it per namespace would create a bootstrap deadlock (e.g. a component
# unable to resolve service names → OpenBao unreachable for the bootstrap Job).
# The meaningful restriction is on the PORT (53 UDP/TCP only), not on the source.
# The real security comes from:
#   - The EGRESS policies on the source pods (each pod can only reach what it
#     needs, DNS included, through the allow-dns CCNP or its own CNP)
#   - Cilium's network isolation between pods across namespaces
#
# Note Cilium: utiliser fromEntities: cluster (pas fromEndpoints: [{}])
# because Cilium 1.19 does not extend the empty selector to all pods on ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-ingress-restricted
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "CoreDNS ingress: autoriser tous les pods cluster sur port 53 UDP/TCP uniquement."
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    # Every pod in the cluster may use DNS (port 53 only).
    # The restriction happens on EGRESS (allow-dns CCNP + per-component CNP).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
