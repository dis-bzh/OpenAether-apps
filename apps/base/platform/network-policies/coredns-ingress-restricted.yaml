# OpenAether 0.5.0 — CoreDNS Ingress Restricted (Zero Trust)
# Remplace coredns-ingress-allow-infra.yaml (fromEndpoints sur namespaces entiers → trop permissif)
# Autorise UNIQUEMENT les pods spécifiques qui ont BESOIN de DNS:
# - flux-system: source-controller, helm-controller, kustomize-controller
# - cert-manager: cert-manager, cainjector, webhook
# - capi-system: capi-controller-manager
# - capi-operator-system: cluster-api-operator
# - longhorn-system: longhorn-manager, longhorn-driver-deployer
# - kyverno: kyverno, kyverno-background-controller
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-ingress-restricted
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Restrict CoreDNS ingress to specific infrastructure pods"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    # FLUX-SYSTEM: controllers qui font des requêtes DNS externes
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": flux-system
            "app.kubernetes.io/name": source-controller
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": flux-system
            "app.kubernetes.io/name": helm-controller
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": flux-system
            "app.kubernetes.io/name": kustomize-controller
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CERT-MANAGER: tous les composants font des requêtes DNS (ACME, webhook, etc.)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cert-manager
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CAPI-SYSTEM: controller manager
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": capi-system
            "app.kubernetes.io/name": capi-controller-manager
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CAPI-OPERATOR-SYSTEM
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": capi-operator-system
            "app.kubernetes.io/name": cluster-api-operator
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # LONGHORN-SYSTEM: manager + driver deployer
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": longhorn-system
            "app.kubernetes.io/name": longhorn-manager
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": longhorn-system
            "app.kubernetes.io/name": longhorn-driver-deployer
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # KYVERNO
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kyverno
            "app.kubernetes.io/name": kyverno
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kyverno
            "app.kubernetes.io/name": kyverno-background-controller
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP