# OpenAether 0.5.0 — CoreDNS Ingress Restricted (Zero Trust)
# Remplace coredns-ingress-allow-infra.yaml (fromEndpoints sur namespaces entiers → trop permissif)
# Autorise UNIQUEMENT les pods spécifiques qui ont BESOIN de DNS:
# - flux-system: source-controller, helm-controller, kustomize-controller
# - cert-manager: cert-manager, cainjector, webhook
# - capi-system: capi-controller-manager
# - capi-operator-system: cluster-api-operator
# - longhorn-system: longhorn-manager, longhorn-driver-deployer
# - kyverno: kyverno, kyverno-background-controller
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-ingress-restricted
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Restrict CoreDNS ingress to specific infrastructure pods"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    # FLUX-SYSTEM: tous les pods (namespace infra de confiance)
    # source-controller, helm-controller, kustomize-controller, notification-controller, image-automation-controller, image-reflector-controller
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": flux-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CERT-MANAGER: tous les composants font des requêtes DNS (ACME, webhook, etc.)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cert-manager
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CAPI-SYSTEM: namespace infra de confiance
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": capi-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CAPI-OPERATOR-SYSTEM
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": capi-operator-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # LONGHORN-SYSTEM
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": longhorn-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # KYVERNO
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kyverno
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CNPG-SYSTEM (opérateur CloudNativePG)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP