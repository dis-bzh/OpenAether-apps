# OpenAether 0.5.0 — CoreDNS Ingress (Zero Trust)
# DNS est un service d'infrastructure universel: tous les pods du cluster en ont besoin.
# Restricter par namespace créerait un deadlock de bootstrap (ex: foundation-pki-root
# ne pouvant pas résoudre les noms de service → OpenBao inaccessible au Job bootstrap).
# La restriction pertinente est sur le PORT (53 UDP/TCP uniquement), pas sur la source.
# La sécurité réelle est assurée par:
#   - Les policies EGRESS sur les pods sources (chaque pod ne peut contacter que ce
#     dont il a besoin, DNS compris via allow-dns CCNP ou sa propre CNP)
#   - L'isolation réseau Cilium entre pods dans les namespaces
#
# Note Cilium: utiliser fromEntities: cluster (pas fromEndpoints: [{}])
# car Cilium 1.19 n'étend pas le sélecteur vide à tous les pods en ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-ingress-restricted
  namespace: kube-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "CoreDNS ingress: autoriser tous les pods cluster sur port 53 UDP/TCP uniquement."
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    # Tous les pods du cluster peuvent utiliser DNS (port 53 uniquement).
    # La restriction se fait à l'EGRESS (allow-dns CCNP + CNP par composant).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
