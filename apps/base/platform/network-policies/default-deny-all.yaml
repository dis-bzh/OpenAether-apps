# OpenAether 0.5.0 — Default Deny All (Ingress)
# ──────────────────────────────────────────────────────────────────────────
# Closes INGRESS by default across the cluster.
# Every pod needs its own ingress CNP to be reachable.
#
# EGRESS POSTURE: no cluster-wide deny-all (see the explanation below).
# Egress is handled by the per-component CCNPs and CNPs:
#   CCNP allow-dns      → DNS :53 UDP/TCP to CoreDNS (all pods)
#   CCNP allow-kube-api → kube-apiserver :443 (tous pods)
#   CCNP allow-infra-egress-restricted → FQDNs/CIDRs par ns (Flux, CAPI, Longhorn…)
#   CNP par composant   → flux:registries, loki:MinIO, grafana:CNPG, gateway:backends…
#
# ⚠️ Why there is NO cluster-wide deny-all-egress (Cilium):
#   In Cilium, CCNPs with endpointSelector: {} INTERSECT. An
#   endpointSelector: {} + egress: [{}] creates a "deny all egress" that
#   OVERRIDES the allow-dns/allow-kube-api allows (intersection = nothing).
#   Result: DNS breaks (CoreDNS can no longer forward upstream),
#   kube-api inatteignable, cascade de blocages.
#   Egress security rests on the per-component CNPs (which are ADDITIVE with
#   each other and with the CCNPs). Namespaces without a dedicated egress CNP
#   have free egress — acceptable in the dev phase, to be hardened in
#   production with per-namespace CNPs (not with a cluster-wide CCNP).
# ──────────────────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-all-ingress
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Default deny all INGRESS traffic cluster-wide"
  endpointSelector: {}
  ingress:
    - {} # Empty ingress rule acts as a default deny