# Default-deny INGRESS, cluster-wide. Every pod needs its own ingress CNP.
#
# ⚠️ There is deliberately NO cluster-wide deny-all EGRESS: in Cilium, CCNPs
# with `endpointSelector: {}` INTERSECT, so one would override allow-dns and
# allow-kube-api (intersection = nothing) and break DNS across the cluster.
#
# Egress is handled additively instead: the allow-dns / allow-kube-api /
# allow-infra-egress-restricted CCNPs, plus a CNP per component. A namespace
# without its own egress CNP has free egress — acceptable in dev, to harden
# per namespace in production (never with a cluster-wide CCNP).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-all-ingress
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Default deny all INGRESS traffic cluster-wide"
  endpointSelector: {}
  ingress:
    - {} # Empty ingress rule acts as a default deny
