# OpenAether 0.5.0 — allow DNS (kube-system/CoreDNS) for every pod
# A CCNP allowing UDP/TCP 53 egress to kube-dns.
# This policy is ESSENTIAL: without DNS no service can start.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: platform
spec:
  description: "Allow egress DNS UDP/TCP 53 to kube-system/CoreDNS from every pod."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
