# OpenAether — Sondes cilium-health (rend `cilium-dbg status` exploitable)
# ──────────────────────────────────────────────────────────────────────────
# `default-deny-all-ingress` carries `endpointSelector: {}`, so it ALSO covers
# the special `cilium-health` endpoints, one per node, which the agents probe
# between each other (ICMP + TCP 4240). Without an explicit allow those probes
# are dropped and "Cluster health" permanently shows 1/N reachable — each node
# only seeing its own — on a perfectly healthy cluster.
#
# This is not cosmetic: on 2026-07-26 that false signal led to the wrong
# conclusion that a child cluster's inter-node datapath was "permanently
# broken", and motivated scrapping it. Verified on 2026-07-27: the management
# (32 green bricks, 6 nodes Ready) showed exactly the same 1/6 while inter-node
# pod-to-pod traffic worked (DNS resolved from a worker to the control plane's
# CoreDNS).
#
# The traffic allowed here is strictly that of the health endpoints between
# themselves and from the nodes: it opens nothing towards application workloads.
# ──────────────────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cilium-health
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Autorise les sondes cilium-health (ICMP + TCP 4240) entre nœuds"
  endpointSelector:
    matchLabels:
      "reserved:health": ""
  ingress:
    - fromEntities:
        - health
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP
    - fromEntities:
        - health
        - remote-node
        - host
      icmps:
        - fields:
            - type: 8
              family: IPv4
