apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether 0.5.0 — fix P0 sync:
# The vendored ESO install.yaml creates no Namespace; the kustomize rewrites
# the namespace of every object to `foundation-pki-management`
# (semantics: PKI/secret material; we keep a dedicated ns for ESO)
namespace: foundation-pki-management

resources:
  - namespace.yaml
  - install.yaml
  - rbac-cert-controller-create.yaml
  - networkpolicy.yaml

patches:
  - path: patch-cert-controller-ns.yaml
    target:
      kind: Deployment
      name: external-secrets-cert-controller
  - path: patch-webhook-dns.yaml
    target:
      kind: Deployment
      name: external-secrets-webhook

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprint0"
      openaether.io/component: external-secrets
