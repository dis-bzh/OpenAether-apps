apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: external-secrets
spec:
  # Only the platform namespaces may use this store: its OpenBao role reads every
  # secret/ path, so without this any ExternalSecret in any namespace could pull
  # the restic password or the Longhorn passphrase. Names, not a selector: a
  # label is set by whoever can label a namespace. A new brick in another
  # namespace must be added here (scripts/check-externalsecret-namespaces.py
  # fails CI otherwise), as well as to the Kyverno audit exclusion
  # (apps/base/kyverno-policies-eso). Tenants must get no RBAC on
  # ClusterExternalSecret, SecretStore or PushSecret either.
  conditions:
    - namespaces:
        - foundation-vault
        - foundation-databases
        - backup-restore-test
        - foundation-storage
        - longhorn-system
        - services-identity
        - services-observability
        - services-observability-audit-sink   # opt-in audit sink (infra #318): the namespace exists only with it
  provider:
    vault:
      # OpenAether 0.5.0 P0 sync fix: the real ns is foundation-vault (was 'security', nonexistent)
      server: "https://openbao.foundation-vault.svc.cluster.local:8200"
      # The OpenBao listener's internal CA. `namespace` is MANDATORY here: a
      # ClusterSecretStore has no namespace of its own, so there is nothing for a
      # relative reference to attach to. Without it ESO fails with "x509" and
      # EVERY ExternalSecret in the cluster stays NotReady.
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
        namespace: foundation-vault
      path: "secret"
      version: "v2"
      auth:
        # Using Kubernetes Auth (preferred for pod-to-vault)
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: external-secrets
            # OpenAether 0.5.0 P0 sync fix: aligned with ESO's real ns
            # (kustomization namespace: foundation-pki-management)
            namespace: foundation-pki-management
