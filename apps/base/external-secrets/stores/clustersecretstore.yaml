apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: external-secrets
spec:
  provider:
    vault:
      # OpenAether 0.5.0 P0 sync fix: the real ns is foundation-vault (was 'security', nonexistent)
      server: "https://openbao.foundation-vault.svc.cluster.local:8200"
      # The OpenBao listener's internal CA. `namespace` is MANDATORY here: a
      # ClusterSecretStore has no namespace of its own, so there is nothing for a
      # relative reference to attach to. Without it ESO fails with "x509" and
      # EVERY ExternalSecret in the cluster stays NotReady.
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
        namespace: foundation-vault
      path: "secret"
      version: "v2"
      auth:
        # Using Kubernetes Auth (preferred for pod-to-vault)
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: external-secrets
            # OpenAether 0.5.0 P0 sync fix: aligned with ESO's real ns
            # (kustomization namespace: foundation-pki-management)
            namespace: foundation-pki-management
