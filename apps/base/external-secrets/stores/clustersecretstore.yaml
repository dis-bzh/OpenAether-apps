apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: external-secrets
spec:
  provider:
    vault:
      # OpenAether 0.5.0 fix P0 sync: ns réel foundation-vault (était 'security', inexistant)
      server: "https://openbao.foundation-vault.svc.cluster.local:8200"
      # CA interne du listener OpenBao. Le `namespace` est OBLIGATOIRE ici : un
      # ClusterSecretStore n'a pas de namespace propre, donc rien à quoi
      # rattacher une référence relative. Sans ça, ESO échoue en « x509 » et
      # TOUS les ExternalSecrets du cluster restent NotReady.
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
        namespace: foundation-vault
      path: "secret"
      version: "v2"
      auth:
        # Using Kubernetes Auth (preferred for pod-to-vault)
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: external-secrets
            # OpenAether 0.5.0 fix P0 sync: aligné sur le ns réel d'ESO
            # (kustomization namespace: foundation-pki-management)
            namespace: foundation-pki-management
