apiVersion: v1
kind: Namespace
metadata:
  name: foundation-pki-management
  labels:
    # NO istio.io/dataplane-mode: ambient — the foundation layer (secrets).
    # external-secrets has a validating webhook called by the kube-apiserver
    # sur :443. En ambient, ztunnel veut tunneliser cet appel en HBONE/15008,
    # blocked by CiliumNetworkPolicy (443/10250 allow-list) → Cilium DROP =
    # "operation not permitted" (EPERM) → the ExternalSecret dry-run fails → cnpg
    # blocked. An admission/validating webhook must never depend on the mesh.
    # Same reason as cert-manager/foundation-vault.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "external-secrets"
