# Egress des managers providers CAPI (capi-system, posture default-deny).
# - APIs cloud pour provisionner les clusters clients (Scaleway aujourd'hui ;
#   ajouter les endpoints OpenStack/Outscale au moment de leur premier usage).
# - kube-apiserver : couvert par le CCNP allow-kube-api.
# - rules.dns : requis pour les toFQDNs (proxy DNS Cilium).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-providers-egress
  namespace: capi-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cluster-api-providers
spec:
  description: "Managers CAPI: egress DNS + API Scaleway (+ kubeconfig enfants :6443)"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.scaleway.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # CABPT/CACPPT parlent à l'apiserver des ENFANTS (LB public :6443) et le
    # bootstrap Talos aux nœuds :50000. Cibles inconnues d'avance (IP des LB
    # enfants) → world sur ces DEUX ports précis uniquement.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
