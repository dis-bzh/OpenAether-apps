# Egress for the CAPI provider managers (capi-system, default-deny posture).
# - Cloud APIs to provision the client clusters (Scaleway today; add the
#   OpenStack/Outscale endpoints when they are first used).
# - kube-apiserver : couvert par le CCNP allow-kube-api.
# - rules.dns: required for toFQDNs (the Cilium DNS proxy).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-providers-egress
  namespace: capi-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cluster-api-providers
spec:
  description: "CAPI managers: webhooks 9443 + egress DNS + Scaleway API (+ children :6443)"
  endpointSelector: {}
  ingress:
    # kube-apiserver → provider webhooks (core/CABPT/CACPPT/CAPS…, :9443).
    # remote-node: on Talos the static kube-apiserver is seen as a node.
    # Without it: "failed calling webhook … context deadline exceeded" when
    # creating the child CRs (observed on real cloud).
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.scaleway.com
        # OVH/OpenStack: Keystone is only the entry point — the catalogue
        # renvoie ensuite compute./network./image./lb.<region>.cloud.ovh.net.
        # ⚠️ Cilium's `*` matches ONLY ONE label: one pattern per depth is
        # needed. Seen for real: network.compute.eu-west-par.cloud.ovh.net
        # (3 levels) was dropped by "*.cloud.ovh.net" alone.
        - matchName: auth.cloud.ovh.net
        - matchPattern: "*.cloud.ovh.net"
        - matchPattern: "*.*.cloud.ovh.net"
        - matchPattern: "*.*.*.cloud.ovh.net"
        # Outscale (CAPOSC): API + regional endpoints.
        - matchPattern: "*.outscale.com"
        - matchPattern: "*.*.outscale.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # CABPT/CACPPT talk to the CHILDREN's apiserver (public LB :6443) and the
    # Talos bootstrap to the nodes :50000. Targets unknown in advance (the
    # children's LB IPs) → world on those TWO specific ports only.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
