# clusterctl inventory — required for `clusterctl move`.
#
# cluster-api-operator and clusterctl keep two different inventories: the
# operator uses operator.cluster.x-k8s.io, clusterctl only reads
# clusterctl.cluster.x-k8s.io/Provider, which it normally creates itself at
# `clusterctl init`. A cluster equipped by the operator therefore has the CRD
# but no entries, and `move` rejects it as a target while every controller runs.
# ⚠️ `--dry-run` does NOT perform that check: it passes, and only the real move
# fails.
#
# ⚠️ Versions MUST stay aligned with core-providers.yaml / infra-providers.yaml —
# clusterctl compares source and target.
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: cluster-api
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: cluster-api
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/core: inventory
providerName: cluster-api
type: CoreProvider
version: v1.13.2
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: bootstrap-talos
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: bootstrap-talos
    clusterctl.cluster.x-k8s.io: ""
providerName: talos
type: BootstrapProvider
version: v0.6.12
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: control-plane-talos
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: control-plane-talos
    clusterctl.cluster.x-k8s.io: ""
providerName: talos
type: ControlPlaneProvider
version: v0.5.13
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: infrastructure-scaleway
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-scaleway
    clusterctl.cluster.x-k8s.io: ""
providerName: scaleway
type: InfrastructureProvider
version: v0.2.1
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: infrastructure-openstack
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-openstack
    clusterctl.cluster.x-k8s.io: ""
providerName: openstack
type: InfrastructureProvider
version: v0.14.4
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: infrastructure-outscale
  namespace: capi-outscale-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-outscale
    clusterctl.cluster.x-k8s.io: ""
providerName: outscale
type: InfrastructureProvider
version: v1.5.0
