# clusterctl inventory — required for `clusterctl move`.
#
# WHY THIS FILE EXISTS
# cluster-api-operator and clusterctl keep TWO different inventories:
#   - the operator declares its providers under operator.cluster.x-k8s.io
#     (CoreProvider/BootstrapProvider/…, see core-providers.yaml);
#   - clusterctl only ever reads clusterctl.cluster.x-k8s.io/Provider, which it
#     normally creates itself during `clusterctl init`.
# A cluster equipped by the operator therefore has the CRD but NO entries, and
# `clusterctl move` rejects it as a target:
#   Error: failed to check providers in target cluster: [provider
#   bootstrap-talos not found in the target cluster, …]
# even though every controller is running. Aggravating factor: `--dry-run` does
# NOT perform this check — it passes, and the failure only surfaces on the real
# move (observed 2026-07-28 while pivoting a CAPI-bootstrapped management).
#
# ⚠️ Versions MUST stay aligned with core-providers.yaml and infra-providers.yaml
# — clusterctl compares source and target. Any provider version bump has to be
# mirrored here.
#
# Namespaces = where the operator actually installs the components (capi-system
# for all of them, except Outscale which has its own).
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: cluster-api
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: cluster-api
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/core: inventory
providerName: cluster-api
type: CoreProvider
version: v1.13.2
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: bootstrap-talos
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: bootstrap-talos
    clusterctl.cluster.x-k8s.io: ""
providerName: talos
type: BootstrapProvider
version: v0.6.12
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: control-plane-talos
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: control-plane-talos
    clusterctl.cluster.x-k8s.io: ""
providerName: talos
type: ControlPlaneProvider
version: v0.5.13
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: infrastructure-scaleway
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-scaleway
    clusterctl.cluster.x-k8s.io: ""
providerName: scaleway
type: InfrastructureProvider
version: v0.2.1
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: infrastructure-openstack
  namespace: capi-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-openstack
    clusterctl.cluster.x-k8s.io: ""
providerName: openstack
type: InfrastructureProvider
version: v0.14.4
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Provider
metadata:
  name: infrastructure-outscale
  namespace: capi-outscale-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-outscale
    clusterctl.cluster.x-k8s.io: ""
providerName: outscale
type: InfrastructureProvider
version: v1.5.0
