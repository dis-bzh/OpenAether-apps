apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inventaire clusterctl — brique SÉPARÉE de cluster-api-providers.
#
# Elle ne peut pas vivre dans la kustomization parente : la CRD
# `providers.clusterctl.cluster.x-k8s.io` arrive avec les composants du
# CoreProvider, que l'opérateur installe APRÈS avoir vu sa CR. Les deux dans
# le même bundle → rejet au dry-run (« no matches for kind Provider »). Même
# motif chicken-egg que partout ailleurs dans ce dépôt : opérateur d'un côté,
# CR de l'autre, reliés par un dependsOn.
resources:
  - inventory.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/component: "clusterctl-inventory"
