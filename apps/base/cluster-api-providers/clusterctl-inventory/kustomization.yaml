apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# clusterctl inventory — a brick SEPARATE from cluster-api-providers.
#
# It cannot live in the parent kustomization: the CRD
# `providers.clusterctl.cluster.x-k8s.io` ships with the CoreProvider
# components, which the operator installs AFTER seeing its CR. Both in the same
# bundle → rejected at dry-run ("no matches for kind Provider"). Same
# chicken-and-egg pattern as everywhere else in this repo: operator on one side,
# its CRs on the other, joined by a dependsOn.
resources:
  - inventory.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/component: "clusterctl-inventory"
