# A namespace dedicated to the Outscale provider (CAPOSC) — isolating the
# upstream name collisions with CAPS/CAPO (the webhook-server-cert Secret and
# the controller-leader-election-capo lease). See infra-providers.yaml's header.
# PSA aligned with capi-system.
apiVersion: v1
kind: Namespace
metadata:
  name: capi-outscale-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cluster-api-providers
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
