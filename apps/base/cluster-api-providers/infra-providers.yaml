---
# InfrastructureProvider — Scaleway (CAPS)
# https://github.com/scaleway/cluster-api-provider-scaleway
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: scaleway
  namespace: capi-system
spec:
  version: v0.2.1
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
---
# InfrastructureProvider — OVH / OpenStack (CAPO)
# https://github.com/kubernetes-sigs/cluster-api-provider-openstack
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: openstack
  namespace: capi-system
spec:
  version: v0.14.4
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
---
# InfrastructureProvider — Outscale / Numspot (CAPOSC)
# https://github.com/outscale/cluster-api-provider-outscale
#
# ⚠️ DEDICATED NAMESPACE (observed on real cloud 2026-07-25): CAPOSC's upstream
# manifests use UNPREFIXED names that collide with the other providers when
# they share capi-system:
#   1. The `webhook-server-cert` Secret — shared with CAPS (Scaleway). The last
#      Certificate applied wins; cert-manager then refuses to inject the loser's
#      caBundle ("secret not owned by certificate") → the loser's CRD CONVERSION
#      webhook is dead (~16 TLS rejections/s on the apiservers), reconcile
#      frozen and deletions stuck on finalizers.
#   2. The `controller-leader-election-capo` Lease — the SAME identifier as CAPO
#      (OpenStack): whoever gets it blocks the other in "attempting to acquire
#      leader lease", so an entire provider stops reconciling anything.
# The deployment namespace = the CR's metadata.namespace (there is no
# spec.deployment.namespace) → on isole Outscale ici.
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: outscale
  namespace: capi-outscale-system
spec:
  version: v1.5.0
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
