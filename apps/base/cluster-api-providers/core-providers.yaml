# Providers CAPI — versions ÉPINGLÉES ; l'operator va chercher les manifests de
# release correspondants sur GitHub.
#
# ⚠️ RATE-LIMIT GITHUB — le fetch est ANONYME, donc soumis à 60 requêtes/h/IP
# partagées par tout ce qui sort de la même IP publique. Avec 6 providers et des
# reconciles répétés (crashloop, upgrade, réinstallation), on peut l'atteindre :
# les providers restent alors en échec de fetch, sans rapport apparent avec la
# configuration. Deux parades, l'API a été vérifiée contre le schéma de la CRD
# `operator.cluster.x-k8s.io/v1alpha2` (champs `configSecret` et `fetchConfig`) :
#
#   1. Token GitHub (le plus simple) — le Secret NE VA PAS EN GIT :
#        kubectl -n capi-system create secret generic capi-github-token \
#          --from-literal=GITHUB_TOKEN=ghp_xxx
#      puis, sur CHAQUE provider :
#        spec:
#          configSecret:
#            name: capi-github-token
#            namespace: capi-system
#      (le slot `configSecret` est libre : aucun provider ne l'utilise ici.)
#
#   2. Miroir OCI — `spec.fetchConfig.oci: <ref>` : plus robuste (pas de
#      dépendance à GitHub au reconcile) mais suppose de pousser et maintenir
#      les artefacts.
#
# Volontairement NON activé par défaut : le token est un secret propre à
# l'opérateur, et un `configSecret` pointant un Secret absent CASSE le provider.
---
# CoreProvider — Cluster API core controllers
# https://github.com/kubernetes-sigs/cluster-api
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  version: v1.13.2
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
---
# BootstrapProvider — Talos bootstrap (generates Talos machine configs)
# https://github.com/siderolabs/cluster-api-bootstrap-provider-talos
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: talos
  namespace: capi-system
spec:
  version: v0.6.12
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
---
# ControlPlaneProvider — Talos control plane (manages Talos CP lifecycle)
# https://github.com/siderolabs/cluster-api-control-plane-provider-talos
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: talos
  namespace: capi-system
spec:
  version: v0.5.13
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
