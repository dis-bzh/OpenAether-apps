# CAPI providers — PINNED versions; the operator fetches each provider's
# release correspondants sur GitHub.
#
# ⚠️ GITHUB RATE LIMIT — the fetch is ANONYMOUS, hence subject to 60 requests/h/IP
# shared by everything egressing from the same public IP. With 6 providers and
# repeated reconciles (crashloop, upgrade, reinstall) you can hit it: the
# providers then stay stuck failing to fetch, with no apparent link to the
# configuration. Two remedies; the API was checked against the CRD schema
# `operator.cluster.x-k8s.io/v1alpha2` (champs `configSecret` et `fetchConfig`) :
#
#   1. A GitHub token (the simplest) — the Secret DOES NOT GO IN GIT:
#        kubectl -n capi-system create secret generic capi-github-token \
#          --from-literal=GITHUB_TOKEN=ghp_xxx
#      then, on EVERY provider:
#        spec:
#          configSecret:
#            name: capi-github-token
#            namespace: capi-system
#      (the `configSecret` slot is free: no provider uses it here.)
#
#   2. An OCI mirror — `spec.fetchConfig.oci: <ref>`: more robust (no
#      dependency on GitHub at reconcile time) but requires pushing and maintaining
#      les artefacts.
#
# Deliberately NOT enabled by default: the token is the operator's own secret,
# and a `configSecret` pointing at a missing Secret BREAKS the provider.
---
# CoreProvider — Cluster API core controllers
# https://github.com/kubernetes-sigs/cluster-api
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  version: v1.13.2
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
---
# BootstrapProvider — Talos bootstrap (generates Talos machine configs)
# https://github.com/siderolabs/cluster-api-bootstrap-provider-talos
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: talos
  namespace: capi-system
spec:
  version: v0.6.12
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
---
# ControlPlaneProvider — Talos control plane (manages Talos CP lifecycle)
# https://github.com/siderolabs/cluster-api-control-plane-provider-talos
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: talos
  namespace: capi-system
spec:
  version: v0.5.13
  deployment:
    containers:
      - name: manager
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
