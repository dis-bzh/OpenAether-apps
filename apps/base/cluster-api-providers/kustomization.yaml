apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Provider CRs — appliqués APRÈS que l'operator ait créé leurs CRDs.
# CoreProvider + CABPT + CACPPT + CAPS + CAPO + CAPOSC.
# Flux Kustomization 51-cluster-api-providers.yaml dépend de 50-cluster-api-operator.
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - networkpolicy-outscale.yaml
  - core-providers.yaml
  - infra-providers.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintA"
      openaether.io/component: "cluster-api-providers"
