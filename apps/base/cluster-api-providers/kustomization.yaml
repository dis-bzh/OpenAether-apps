apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Provider CRs — applied AFTER the operator has created their CRDs.
# CoreProvider + CABPT + CACPPT + CAPS + CAPO + CAPOSC.
# The 51-cluster-api-providers.yaml Flux Kustomization depends on 50-cluster-api-operator.
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - networkpolicy-outscale.yaml
  - core-providers.yaml
  - infra-providers.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintA"
      openaether.io/component: "cluster-api-providers"
