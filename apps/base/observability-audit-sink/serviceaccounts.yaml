# yamllint disable rule:line-length
# No Kubernetes API access at all: neither pod reads or writes an object (the shipper reads a file, the check lists an object store).
# Token not mounted, no Role, no ClusterRole.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-sink-shipper
  namespace: services-observability-audit-sink
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-sink-check
  namespace: services-observability-audit-sink
automountServiceAccountToken: false
