# Composants Flux épinglés (flux install --export, v2.4.0) appliqués À DISTANCE
# dans un cluster enfant CAPI via une Kustomization `spec.kubeConfig` côté
# management. Régénérer lors d'un bump Flux : flux install --export > gotk-components.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
