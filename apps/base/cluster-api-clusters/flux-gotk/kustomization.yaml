# Pinned Flux components (flux install --export, v2.4.0) applied REMOTELY into a
# CAPI child cluster through a `spec.kubeConfig` Kustomization on the management
# side. Regenerate on a Flux bump: flux install --export > gotk-components.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
