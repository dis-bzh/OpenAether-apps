# Wiring GitOps du cluster ENFANT (gitception) — appliqué à distance via
# kubeConfig par le management, puis le Flux de l'enfant devient autonome.
# Mêmes noms que le bootstrap parent (flux-bootstrap.yaml.tftpl côté infra) :
# GitRepository `openaether`, Kustomization racine `openaether-platform`.
#
# Variables (postBuild.substitute de la Kustomization management) :
#   ${CHILD_PROFILE} — profil Flux de l'enfant, ex: workload (défaut) ou un
#                      profil généré par scripts/pick.py (apps/flux/<profil>)
#   ${CHILD_BRANCH}  — branche git suivie par l'enfant (défaut main ;
#                      utile pour tester une branche de bout en bout)
#   ${CHILD_NAME}    — identité UNIQUE de l'enfant (ex: edge-2), qui sert de
#                      préfixe à ses dépôts restic
---
# Identité du cluster enfant — pendant exact du ConfigMap posé par le bootstrap
# du parent (flux-bootstrap.yaml.tftpl côté infra). Les briques qui doivent se
# distinguer d'un AUTRE cluster le consomment via `postBuild.substituteFrom`,
# aujourd'hui le chemin des dépôts restic : plusieurs clusters partagent des
# buckets, et un dépôt n'est lisible qu'avec le RESTIC_PASSWORD de celui qui
# l'a créé — même chemin = blocage mutuel (« already initialized »).
#
# Le nom CAPI de l'enfant est déjà unique dans la flotte : pas besoin d'y
# ajouter le provider, contrairement au parent (« openaether-dev » partout).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-identity
  namespace: flux-system
  labels:
    openaether.io/managed: "true"
data:
  CLUSTER_NAME: ${CHILD_NAME}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openaether
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/dis-bzh/OpenAether-apps.git
  ref:
    branch: ${CHILD_BRANCH:=main}
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openaether-platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/flux/${CHILD_PROFILE:=workload}
  prune: true
  wait: false
  # Gitception niveau 2 : le profil de l'enfant ré-applique son propre
  # GitRepository (${GIT_BRANCH:=main} dans la base). Sans ce postBuild,
  # l'enfant retomberait sur main au premier reconcile. ${CHILD_BRANCH} est
  # substitué CÔTÉ MANAGEMENT à l'injection → valeur littérale ici.
  postBuild:
    substitute:
      GIT_BRANCH: ${CHILD_BRANCH:=main}
