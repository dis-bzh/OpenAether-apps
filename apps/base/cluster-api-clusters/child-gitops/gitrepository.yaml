# GitOps wiring of the CHILD cluster (gitception) — applied remotely through
# kubeConfig by the management, after which the child's Flux is autonomous.
# Same names as the parent bootstrap (flux-bootstrap.yaml.tftpl on the infra side):
# GitRepository `openaether`, Kustomization racine `openaether-platform`.
#
# Variables (postBuild.substitute of the management Kustomization):
#   ${CHILD_PROFILE} — the child's Flux profile, e.g. workload (default) or a
#                      profile generated by scripts/pick.py (apps/flux/<profile>)
#   ${CHILD_BRANCH}  — the git branch the child follows (default main;
#                      useful to test a branch end to end)
#   ${CHILD_NAME}    — the child's UNIQUE identity (e.g. edge-2), used as the
#                      prefix of its restic repositories
---
# The child cluster's identity — the exact counterpart of the ConfigMap laid
# down by the parent's bootstrap (flux-bootstrap.yaml.tftpl, infra side). The
# bricks that must distinguish themselves from ANOTHER cluster consume it
# through `postBuild.substituteFrom`, today the restic repository path: several
# clusters share buckets, and a repository is only readable with the
# RESTIC_PASSWORD of its creator — same path = mutual deadlock ("already initialized").
#
# The child's CAPI name is already unique across the fleet: no need to add the
# provider, unlike the parent ("openaether-dev" everywhere).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-identity
  namespace: flux-system
  labels:
    openaether.io/managed: "true"
data:
  CLUSTER_NAME: ${CHILD_NAME}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openaether
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/dis-bzh/OpenAether-apps.git
  ref:
    branch: ${CHILD_BRANCH:=main}
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openaether-platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/flux/${CHILD_PROFILE:=workload}
  prune: true
  wait: false
  # Gitception level 2: the child's profile reapplies its own GitRepository
  # (${GIT_BRANCH:=main} in the base). Without this postBuild the child would
  # fall back to main on the first reconcile. ${CHILD_BRANCH} is substituted
  # ON THE MANAGEMENT SIDE at injection time → a literal value here.
  postBuild:
    substitute:
      GIT_BRANCH: ${CHILD_BRANCH:=main}
