# GitOps wiring of the CHILD cluster (gitception) — applied remotely through
# kubeConfig by the management, after which the child's Flux is autonomous.
# Same names as the parent bootstrap (flux-bootstrap.yaml.tftpl on the infra side):
# GitRepository `openaether`, root Kustomization `openaether-platform`.
#
# Variables (postBuild.substitute of the management Kustomization):
#   ${CHILD_PROFILE} — the child's Flux profile, e.g. workload (default) or a
#                      profile generated by scripts/pick.py (apps/flux/<profile>)
#   ${CHILD_REF}     — the git ref the child follows, refs/heads/<b> or
#                      refs/tags/<v> (default refs/heads/main;
#                      useful to test a branch end to end)
#   ${CHILD_NAME}    — the child's UNIQUE identity (e.g. edge-2), used as the
#                      prefix of its restic repositories
#   ${CHILD_BACKUP_S3_BUCKET} / ${CHILD_BACKUP_S3_ENDPOINT} — REQUIRED if the
#                      child picks the cnpg brick. Found live (2026-07-30,
#                      edge-2): CNPG's Cluster.spec.backup.barmanObjectStore.
#                      endpointURL is written as `"${BACKUP_S3_ENDPOINT:=}"` —
#                      the WHOLE field is just the substitution, and when the
#                      variable resolves to an EMPTY string (undefined, no
#                      real default), Flux/kustomize renders the field as YAML
#                      `null`, not `""` — CNPG's CRD then rejects the Cluster
#                      outright (dry-run fails), unlike destinationPath, where
#                      the same empty substitution lands INSIDE a larger
#                      string and stays a valid (if bucket-less) string. No
#                      empty default here on purpose — better a clear
#                      "variable not found" than this silent-until-CRD-
#                      validation failure mode. See docs/backlog.md if this
#                      needs a NOT-a-required-Postgres-backup-yet path later.
#   ${CHILD_BACKUP_TARGET_URL} — REQUIRED if the child picks the storage
#                      (Longhorn) brick, same failure mode as above but for
#                      Longhorn's BackupTarget.spec.backupTargetURL (also
#                      found live 2026-07-30, same "whole field is the bare
#                      substitution" shape). Distinct from BACKUP_S3_* above —
#                      Longhorn wants its own `s3://bucket@region/` URL, not
#                      an endpoint+bucket pair.
#
# Whichever cluster (management or gitception child) picks cnpg and/or
# storage needs its OWN backup destination seeded into ITS OWN OpenBao too
# (`bao kv put secret/backup/s3-primary ...`, docs/admin-access.md step 3 on
# the infra side) — the ConfigMap here only wires the URL/endpoint into the
# manifests, not the S3 credentials the ExternalSecret actually reads.
---
# The child cluster's identity — the exact counterpart of the ConfigMap laid
# down by the parent's bootstrap (flux-bootstrap.yaml.tftpl, infra side). The
# bricks that must distinguish themselves from ANOTHER cluster consume it
# through `postBuild.substituteFrom`, today the restic repository path: several
# clusters share buckets, and a repository is only readable with the
# RESTIC_PASSWORD of its creator — same path = mutual deadlock ("already initialized").
#
# The child's CAPI name is already unique across the fleet: no need to add the
# provider, unlike the parent ("openaether-dev" everywhere).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-identity
  namespace: flux-system
  labels:
    openaether.io/managed: "true"
data:
  CLUSTER_NAME: ${CHILD_NAME}
  BACKUP_S3_BUCKET: ${CHILD_BACKUP_S3_BUCKET}
  BACKUP_S3_ENDPOINT: ${CHILD_BACKUP_S3_ENDPOINT}
  BACKUP_TARGET_URL: ${CHILD_BACKUP_TARGET_URL}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openaether
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/dis-bzh/OpenAether-apps.git
  ref:
    name: ${CHILD_REF:=refs/heads/main}
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openaether-platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/flux/${CHILD_PROFILE:=workload}
  prune: true
  wait: false
  # Gitception level 2: the child's profile reapplies its own GitRepository
  # (${GIT_REF:=refs/heads/main} in the base). Without this postBuild the child
  # would fall back to main on the first reconcile. ${CHILD_REF} is substituted
  # ON THE MANAGEMENT SIDE at injection time → a literal value here.
  postBuild:
    substitute:
      GIT_REF: ${CHILD_REF:=refs/heads/main}
