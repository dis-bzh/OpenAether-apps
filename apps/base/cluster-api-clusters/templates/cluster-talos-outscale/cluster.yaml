# Cluster client Talos sur Outscale via CAPOSC v1.5.0 — namespace capi-clusters.
#
# apiVersions verified against the installed CRDs: osc*.infrastructure.cluster.x-k8s.io
# en v1beta1 (unique version servie) ; CAPI v1.13.2 → refs v1beta2 {apiGroup,kind,name} ;
# CACPPT/CABPT v1alpha3 (infrastructureTemplate = ObjectReference pleine).
#
# PREREQUISITES outside git:
#   - Secret capi-clusters/outscale-capi-credentials, **lowercase** keys
#     `access_key`, `secret_key`, `region` (≠ convention SCW_* de Scaleway) ;
#   - keypair Outscale `openaether-capi` (node.vm.keypairName est requis ET
#     immutable, even though Talos has no SSH);
#   - OMI Talos construite en variante **aws** (cf. modules/talos-image/outscale) :
#     only it reads the EC2 IMDS, so it ingests the CAPI user-data and puts the
#     public IP (1:1 NAT) into the apid certificate SANs — without which CACPPT
#     can neither bootstrap etcd nor fetch the kubeconfig.
#
# ⚠️ An OscMachineTemplate's spec.template.spec is IMMUTABLE (voscmachinetemplate
# webhook): changing vmType/image/disk requires a NEW name, hence
# ${MACHINE_REV} — bumping it (v2, v3…) makes CAPI roll the machines.
#
# ⚠️ The CAPOSC LBU creates ONLY ONE listener (6443): the Talos port 50000
# cannot go through the load balancer → the control planes carry a public IP
# (`publicIp: true`) and a dedicated SG rule.

apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OscCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  credentials:
    fromSecret: outscale-capi-credentials
  network:
    # TRAP #2 — CIDR. The CAPOSC default is 10.0.0.0/16 … which is EXACTLY the
    # net du management Outscale (modules/providers/outscale/network.tf:
    # outscale_net.this.ip_range = 10.0.0.0/16, private 10.0.0.0/24, public
    # 10.0.1.0/24). Keeping the default would forbid any future netPeering and
    # make diagnosis ambiguous => we force a free /16.
    net:
      name: ${CLUSTER_NAME}-net
      ipRange: ${OSC_NET_CIDR}

    # Single-subnet LBU (CreateLoadBalancer takes only ONE subnetId) => single-AZ.
    subregions:
      - ${OSC_SUBREGION}

    # PIEGE #3 — layout des subnets.
    # If subnets is empty, CAPOSC generates 3 per AZ from the net:
    # x.y.2.0/24 (loadbalancer+bastion+nat), x.y.3.0/24 (worker),
    # x.y.4.0/24 (controlplane) — cf. ClusterScope.GetSubnets().
    # We declare them explicitly to control both the ranges AND the roles:
    # SubnetIsPublic() == "a le role bastion, loadbalancer ou nat".
    # DO NOT add loadbalancer/bastion/nat to the controlplane subnet to make it
    # "public": getAutomaticSecurityGroups() does a `continue` on public subnets
    # BEFORE filling allSNCP => the LB->CP:6443, worker<-CP:1024-65535 and etcd
    # 2378-2380 rules would end up with an EMPTY ipRanges list. The CP subnet
    # stays "private" in terms of roles; it is the ROUTE TABLE that makes it
    # reachable (trap #4).
    subnets:
      - name: ${CLUSTER_NAME}-public
        ipSubnetRange: ${OSC_SUBNET_PUBLIC}
        subregionName: ${OSC_SUBREGION}
        roles: [loadbalancer, bastion, nat]
      - name: ${CLUSTER_NAME}-worker
        ipSubnetRange: ${OSC_SUBNET_WORKER}
        subregionName: ${OSC_SUBREGION}
        roles: [worker]
      - name: ${CLUSTER_NAME}-cp
        ipSubnetRange: ${OSC_SUBNET_CP}
        subregionName: ${OSC_SUBREGION}
        roles: [controlplane]

    # TRAP #4 — the control plane must be reachable on 50000 (Talos API).
    # The CAPOSC LBU creates only ONE listener (load_balancer.go:
    # `Listeners: []osc.ListenerForCreation{first_listener}`) => 6443 OU 50000,
    # never both. And the cluster endpoint is that LBU's DnsName.
    # (osccluster_loadbalancer.go: SetControlPlaneEndpoint{Host: DnsName,
    # Port: listener.loadbalancerport}).
    # CACPPT does NOT go through the endpoint: it opens a Talos session on
    # machine.Status.Addresses (ExternalIP *ou* InternalIP), port 50000
    # (controllers/configs.go::talosconfigFromMachines). Le management etant sur
    # ANOTHER cloud, where the 10.30.x InternalIP is unreachable => the CPs MUST
    # have a public IP (node.vm.publicIp, see OscMachineTemplate).
    # But on Outscale (VPC/AWS model) a public IP works ONLY if the subnet's
    # route table points 0.0.0.0/0 at the Internet Service. The auto-generated
    # route tables send every non-public subnet to the NAT (GetRouteTables())
    # => we declare them by hand to route the CP subnet to the gateway.
    # GetRouteTables() returns spec.network.routeTables as soon as it is
    # non-empty: declaring a single table replaces them ALL.
    routeTables:
      - name: ${CLUSTER_NAME}-public-rt
        role: loadbalancer
        subregionName: ${OSC_SUBREGION}
        subnets:
          - ${CLUSTER_NAME}-public

        routes:
          - name: ${CLUSTER_NAME}-public-default
            destination: 0.0.0.0/0
            targetType: gateway
      - name: ${CLUSTER_NAME}-cp-rt
        role: controlplane
        subregionName: ${OSC_SUBREGION}
        subnets:
          - ${CLUSTER_NAME}-cp

        routes:
          # gateway (not nat): without this the CP's public IP is inert
          # (asymmetric return traffic) and CACPPT never reaches :50000.
          - name: ${CLUSTER_NAME}-cp-default
            destination: 0.0.0.0/0
            targetType: gateway
      - name: ${CLUSTER_NAME}-worker-rt
        role: worker
        subregionName: ${OSC_SUBREGION}
        subnets:
          - ${CLUSTER_NAME}-worker

        routes:
          # workers without a public IP => egress through the NAT service. An
          # empty targetName = the cluster's single NAT service (GetNatService("", az)).
          - name: ${CLUSTER_NAME}-worker-default
            destination: 0.0.0.0/0
            targetType: nat

    # natServices volontairement OMIS : GetNatServices() derive automatiquement
    # one NAT service per subnet carrying the "nat" role (here ${CLUSTER_NAME}-public).

    loadBalancer:
      # <=32 car., [0-9A-Za-z espace -] uniquement. Immuable apres creation
      # (osccluster_webhook.go ValidateUpdate).
      loadbalancername: ${CLUSTER_NAME}-k8s
      loadbalancertype: internet-facing
      # Valeurs = defauts explicites (APIPort=6443, protocole TCP).
      listener:
        loadbalancerport: 6443
        loadbalancerprotocol: TCP
        backendport: 6443
        backendprotocol: TCP
      healthCheck:
        port: 6443
        protocol: TCP
        checkinterval: 10
        timeout: 5
        healthythreshold: 2
        unhealthythreshold: 3
      # securitygroupname / subnetname are DEPRECATED: the LBU is placed through
      # les roles (subnet role=loadbalancer, SG role=loadbalancer).

    # PIEGE #5 — les security groups automatiques n'ouvrent NI 50000 NI 50001.
    # getAutomaticSecurityGroups() only knows 6443 / 2378-2380 / 10250-10252
    # / 179 / 4240 / 4244 / 8472 / 51820-51821 / 51871 / 30000-32767. Talos a
    # besoin de apid:50000 (management -> CP, et node -> node) et trustd:50001
    # (worker join). We add them through additionalSecurityRules.
    # ATTENTION : getAdditionalRules() matche avec slices.Equal(roles, ar.Roles)
    # => the `roles` list must be IDENTICAL AND IN THE SAME ORDER as the target
    # SG's: [controlplane] for the "-controlplane" SG, [worker] for the
    # "-worker" SG, [controlplane, worker] (that order) for the "-node" SG,
    # [loadbalancer] for the "-lb" SG, [bastion] for the "-bastion" SG.
    # A [worker, controlplane] list would match NOTHING, silently.
    additionalSecurityRules:
      - roles: [controlplane]
        rules:
          - name: talos-api-from-management
            flow: Inbound
            ipProtocol: tcp
            fromPortRange: 50000
            toPortRange: 50000
            ipRanges:
              - ${MGMT_EGRESS_CIDR}
              - ${ADMIN_CIDR}
      - roles: [controlplane, worker]
        rules:
          # apid (50000) + trustd (50001) intra-cluster : join des workers et
          # routing of Talos calls between nodes.
          - name: talos-apid-trustd-intra
            flow: Inbound
            ipProtocol: tcp
            fromPortRange: 50000
            toPortRange: 50001
            ipRanges:
              - ${OSC_NET_CIDR}
          # KubePrism (7445) est en loopback -> rien a ouvrir. Cilium WireGuard
          # 51871/udp and health 4240 are already in the "-node" SG by default.

    # allowFromIPRanges volontairement NON positionne : il restreint l'inbound
    # the "-lb" SG's 6443 (and the bastion's 22) and defaults to 0.0.0.0/0.
    # restreindre casserait l'acces des noeuds eux-memes a l'endpoint public
    # (they egress through the NAT service's IP, unknown in advance). Hardening
    # happens on 50000 (above), not on 6443 (mTLS / k8s authn).

    bastion:
      enable: false

---
# -----------------------------------------------------------------------------
# Cluster — cluster.x-k8s.io/v1beta2 (CAPI v1.13.2).
# TRAP #7 — in v1beta2 refs are {apiGroup, kind, name}: NO apiVersion,
# NO namespace (the object must live in the same namespace as the Cluster).
# This is the opposite of TalosControlPlane.spec.infrastructureTemplate (v1alpha3),
# which is a FULL ObjectReference (apiVersion + kind + name + namespace).
# spec.controlPlaneEndpoint is deliberately absent: CAPOSC fills it with the
# LBU's DnsName once it is created, and CAPI copies it over.
# -----------------------------------------------------------------------------
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-clusters
  labels:
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - ${POD_CIDR}

    services:
      cidrBlocks:
        - ${SVC_CIDR}

  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: ${CLUSTER_NAME}-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OscCluster
    name: ${CLUSTER_NAME}

---
# -----------------------------------------------------------------------------
# OscMachineTemplate (control plane).
# Champs reellement obligatoires (webhook voscmachinetemplate.kb.io ->
# ValidateOscMachineSpec) : node.vm.keypairName (Required) et node.vm.vmType
# (Required : ValidateVmType renvoie Required sur chaine vide — le "defaut
# tinav7.c4r8p1" from the CRD comment is only applied AFTER admission, on the
# reconcile side). The CRD schema itself only marks template and
# template.spec as required (+ volumes[].device if a volume is declared).
# spec.template.spec is IMMUTABLE (ValidateUpdate) => any change = a new
# template + nouveau nom (versionner le nom si CP_REPLICAS/vmType/image bougent).
# -----------------------------------------------------------------------------
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OscMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-cp-${MACHINE_REV:=v1}
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  template:
    spec:
      node:
        vm:
          # role: worker par defaut (OscVm.GetRole()). Sans "controlplane" :
          # mauvais subnet, mauvais SG, et surtout AUCUN enregistrement en
          # LBU backend (oscmachine_vm.go only calls
          # LinkLoadBalancerBackendMachines when role==controlplane).
          role: controlplane
          # TRAP #8 — the image: node.vm.imageId (ami-…) OR node.image.name.
          # getImageId() gives PRIORITY to node.image.name: if both are set,
          # imageId is ignored. We use the ID (deterministic). By name instead
          # needs accountId, or CAPOSC logs
          # "[security] It is recommended to set the image account":
          #   image:
          #     name: ${OSC_IMAGE_NAME}
          #     accountId: ${OSC_IMAGE_ACCOUNT_ID}
          imageId: ${OSC_IMAGE_ID}
          # TRAP #9 — keypairName is MANDATORY and must EXIST on the Outscale
          # side (CreateVm fails otherwise), even though Talos has no SSH. The
          # tofu foundation creates no outscale_keypair => to be provisioned
          # fois, hors CAPI. Champ IMMUABLE sur OscMachine.
          keypairName: ${OSC_KEYPAIR_NAME}
          # tinavX.cVCPUrRAMpPERF — regexp
          # ^tinav([3-9]|[1-9][0-9]).c[1-9][0-9]*r[1-9][0-9]*p[1-3]$
          # tinav6.c4r8p2 = 4 vCPU / 8 GiB (equivalent DEV1-L / b3-8).
          # < 8 GiB => the Talos OOMController SIGKILLs the cgroups (see the
          # cascade observee sur DEV1-M 4 GB cote Scaleway).
          vmType: ${OSC_VM_TYPE}
          # PIEGE #6 — IP publique + certSANs.
          # publicIp:true allocates an EIP and attaches it through a tag
          # userdata (section "-----BEGIN OUTSCALE SECTION-----" prependee au
          # bootstrap data, with filter_private_section=true: Outscale strips it
          # before exposing it to the instance, so the Talos machine config
          # stays intact — see cloud/utils/utils.go + cloud/services/
          # compute/vm.go).
          # publicIpPool = a pool of PRE-ALLOCATED IPs: essential here, because
          # the public IP is 1:1 NAT (the NIC only sees the 10.30.x) and the
          # Talos image is a "nocloud" build -> apid will NEVER put the public
          # IP into its certificate SANs. We therefore need to know the IPs IN
          # ADVANCE to inject them as machine.certSANs (see the TalosControlPlane
          # patch). Without this: x509 "certificate is valid for
          # 10.30.3.x, not <public IP>" and CACPPT never bootstraps etcd.
          publicIp: true
          rootDisk:
            rootDiskType: io1
            rootDiskSize: 60
            rootDiskIops: 1500
          subregionNames:
            - ${OSC_SUBREGION}
          tags:
            openaether.io/cluster: ${CLUSTER_NAME}
            openaether.io/role: controlplane

---
# -----------------------------------------------------------------------------
# TalosControlPlane — controlplane.cluster.x-k8s.io/v1alpha3 (CACPPT v0.5.13).
# -----------------------------------------------------------------------------
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: ${CLUSTER_NAME}-cp
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  version: ${K8S_VERSION}
  replicas: ${CP_REPLICAS}
  # ObjectReference PLEIN (v1alpha3) : apiVersion ET namespace obligatoires ici,
  # unlike the v1beta2 Cluster refs.
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OscMachineTemplate
    name: ${CLUSTER_NAME}-cp-${MACHINE_REV:=v1}
    namespace: capi-clusters
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  controlPlaneConfig:
    # spec.controlPlaneConfig.init is deliberately ABSENT: deprecated since
    # cacppt v0.4.0, and if present its generateType sub-field becomes required
    # (leaving it empty fails CRD validation).
    controlplane:
      generateType: controlplane
      # Talos major.minor contract ("v1.13"), NOT the patch version.
      talosVersion: ${TALOS_CONTRACT}
      # PIEGE #10 — CABPT >= 0.6 / Talos v1.13 : strategicPatches (YAML) et
      # DEFINITELY NOT configPatches (JSON6902), which fails with
      # "not supported for multi-document machine configuration".
      strategicPatches:
        - |
          cluster:
            network:
              cni:
                name: none
            proxy:
              disabled: true

---
# -----------------------------------------------------------------------------
# OscMachineTemplate (workers).
# -----------------------------------------------------------------------------
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OscMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-workers-${MACHINE_REV:=v1}
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  template:
    spec:
      node:
        vm:
          role: worker
          imageId: ${OSC_IMAGE_ID}
          keypairName: ${OSC_KEYPAIR_NAME}
          vmType: ${OSC_VM_TYPE}
          # No public IP: egress through the public subnet's NAT service.
          publicIp: false
          rootDisk:
            rootDiskType: io1
            rootDiskSize: 60
            rootDiskIops: 1500
          subregionNames:
            - ${OSC_SUBREGION}
          # repulseServer is already set by default to the name of the
          # MachineDeployment (anti-affinite serveur best-effort).
          tags:
            openaether.io/cluster: ${CLUSTER_NAME}
            openaether.io/role: worker
        # Dedicated data disk (the equivalent of worker_storage in the tfvars):
        # partitionne ensuite en user volumes Talos chiffres (local-path +
        # longhorn). device DOIT matcher ^(/dev/sda1|/dev/sd[a-z]|/dev/xvd[a-z])$
        # et iops/size doit rester <= 300.
        volumes:
          - name: ${CLUSTER_NAME}-data
            device: /dev/xvdb
            size: ${WORKER_DATA_DISK_GB}
            volumeType: gp2

---
# -----------------------------------------------------------------------------
# TalosConfigTemplate (workers) — bootstrap.cluster.x-k8s.io/v1alpha3.
# -----------------------------------------------------------------------------
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  template:
    spec:
      generateType: join
      talosVersion: ${TALOS_CONTRACT}
      strategicPatches:
        - |
          cluster:
            network:
              cni:
                name: none
            proxy:
              disabled: true

---
# -----------------------------------------------------------------------------
# MachineDeployment — cluster.x-k8s.io/v1beta2.
# Refs {apiGroup, kind, name}; in v1beta2 the rollout strategy lives under
# spec.rollout.strategy (et non plus spec.strategy).
# -----------------------------------------------------------------------------
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    openaether.io/component: capi-clusters
    openaether.io/managed: "true"
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_REPLICAS}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
      cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-workers
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
        cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-workers
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${K8S_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: ${CLUSTER_NAME}-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OscMachineTemplate
        name: ${CLUSTER_NAME}-workers-${MACHINE_REV:=v1}
