# Cluster client Talos sur OVH (OpenStack) via CAPO — namespace capi-clusters.
#
# apiVersions aligned with the CRDs ACTUALLY installed (verified 2026-07-25):
#   CAPI   v1.13.2 → cluster.x-k8s.io/v1beta2: refs are {apiGroup, kind,
#                    name} — plus d'apiVersion ni de namespace.
#   CAPO   v0.14.4 → infrastructure.cluster.x-k8s.io/v1beta1 (seule version servie)
#   CACPPT v0.5.13 → controlplane…/v1alpha3: infrastructureTemplate is still a
#                    ObjectReference PLEINE (apiVersion + namespace).
#   CABPT  v0.6.12 → bootstrap…/v1alpha3
#
# PREREQUISITE outside git — an Opaque Secret in capi-clusters (the SAME ns as
# the cluster), key `clouds.yaml`; the REGION lives in clouds.yaml (region_name),
# definitely NOT in identityRef (see the trap below):
#   kubectl -n capi-clusters create secret generic ovh-capi-credentials \
#     --from-file=clouds.yaml=./clouds.yaml
#
# Variables (postBuild.substitute) :
#   ${CLUSTER_NAME} ${CP_REPLICAS:=1} ${WORKER_REPLICAS:=1}
#   ${K8S_VERSION:=v1.35.3} ${TALOS_VERSION:=v1.13}
#   ${OS_CREDENTIALS_SECRET:=ovh-capi-credentials} ${OS_CLOUD_NAME:=ovh}
#   ${OS_EXTERNAL_NETWORK:=Ext-Net} ${OS_NODE_CIDR:=10.20.0.0/24}
#   ${OS_FLAVOR:=b3-8} ${OS_IMAGE_NAME}
#   ${MACHINE_REV:=v1} — bump (v2, v3…) pour faire tourner les machines sans
#   toucher au FloatingIPPool ni à l'IP pré-allouée (même pattern que le
#   template Outscale). Trouvé en marche 2026-07-30 : sans ceci, changer
#   OS_IMAGE_NAME nécessitait task edge-down + recréation complète.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-clusters
  labels:
    openaether.io/managed: "true"
    openaether.io/component: capi-clusters
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  # No controlPlaneEndpoint: CAPO fills it from the Octavia LB's FIP.
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: ${CLUSTER_NAME}-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-clusters
spec:
  # The spec's only required field (cloudName/name required inside identityRef).
  identityRef:
    type: Secret
    name: ${OS_CREDENTIALS_SECRET:=ovh-capi-credentials}
    cloudName: ${OS_CLOUD_NAME:=ovh}
    # ⚠️ DO NOT put `region` here: CAPO would build a providerID
    # openstack://<REGION>/<uuid> while Talos writes openstack:///<uuid>
    # → the nodeRef would NEVER resolve (machines stuck in Provisioned).
    # The region is declared in clouds.yaml (region_name).
  externalNetwork:
    filter:
      name: ${OS_EXTERNAL_NETWORK:=Ext-Net}
  # CAPO creates network + subnet + router (gw = externalNetwork) — the
  # modules/providers/ovh/network.tf. CIDR distinct du management.
  managedSubnets:
    - cidr: ${OS_NODE_CIDR:=10.20.0.0/24}
      dnsNameservers: ["1.1.1.1", "8.8.8.8"]
  apiServerLoadBalancer:
    enabled: true
    # ⚠️ MANDATORY with Talos: CACPPT bootstraps etcd and fetches the kubeconfig
    # through the Talos API (50000). The nodes have no FIP (private subnet) →
    # without this listener the control plane stays stuck indefinitely.
    # CAPO also opens the matching security group rule.
    additionalPorts: [50000]
  managedSecurityGroups:
    allowAllInClusterTraffic: true   # required as soon as the block is declared
  tags: ["openaether", "${CLUSTER_NAME}"]
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: ${CLUSTER_NAME}-cp
  namespace: capi-clusters
spec:
  replicas: ${CP_REPLICAS:=1}
  version: ${K8S_VERSION:=v1.35.3}
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackMachineTemplate
    # ⚠️ IMMUTABLE spec: to change the template (flavor, image…), a NEW name
    # is required — ${MACHINE_REV} (bump v2, v3…) makes CAPI roll the control
    # planes, same pattern as the Outscale template. Decoupled from the
    # OpenStackFloatingIPPool's OWN name below (${CLUSTER_NAME}-cp-fip3,
    # stable): the pre-allocated FIP must survive a machine-template rev.
    name: ${CLUSTER_NAME}-cp-${MACHINE_REV:=v1}
    namespace: capi-clusters
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: ${TALOS_VERSION:=v1.13}
      # strategicPatches (YAML) and NOT configPatches: JSON6902 is rejected on
      # multi-document machine configs (Talos ≥ 1.13).
      strategicPatches:
        - |
          machine:
            # ⚠️ The OpenStack IMDS does NOT expose the floating IP (Neutron-side
            # NAT): without this SAN the apid certificate is only valid for the
            # private IP and CACPPT fails TLS on <FIP>:50000 ("certificate is
            # valid for 10.x, not <FIP>") → control plane stuck. The IPs are
            # therefore PRE-ALLOCATED (preAllocatedFloatingIPs pool) and listed here.
            certSANs:
              - ${OS_CP_FLOATING_IPS}
          cluster:
            network:
              cni:
                name: none
            proxy:
              disabled: true
        # providerID: Talos sets none, so CAPI never resolves nodeRef and
        # MachineHealthCheck is dead. The CCM (apps/clusters/*.yaml) fills it
        # in, but only for nodes the kubelet hands it via the `uninitialized`
        # taint — and it reads the metadata over the Talos API from kube-system.
        # ⚠️ Never ship this flag without that CCM: the nodes stay tainted.
        - |
          machine:
            kubelet:
              extraArgs:
                cloud-provider: external
            features:
              kubernetesTalosAPIAccess:
                enabled: true
                allowedRoles:
                  - os:reader
                allowedKubernetesNamespaces:
                  - kube-system
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
spec:
  template:
    spec:
      generateType: join
      talosVersion: ${TALOS_VERSION:=v1.13}
      # Same kubelet flag as the control plane (see cluster.yaml above);
      # kubernetesTalosAPIAccess is control-plane only.
      strategicPatches:
        - |
          machine:
            kubelet:
              extraArgs:
                cloud-provider: external
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_REPLICAS:=1}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${K8S_VERSION:=v1.35.3}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: ${CLUSTER_NAME}-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: ${CLUSTER_NAME}-workers-${MACHINE_REV:=v1}
---
# ⚠️ CACPPT (etcd bootstrap + kubeconfig retrieval) connects to the Talos API
# on the MACHINE ADDRESSES (machine.Status.Addresses), NOT on the
# controlPlaneEndpoint: the LB's 50000 listener is therefore not enough. On a
# private subnet the CPs must carry a floating IP, otherwise the control plane
# stays stuck in WaitingForTalosBoot (observed for real on edge-2).
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: OpenStackFloatingIPPool
metadata:
  name: ${CLUSTER_NAME}-cp-fip3
  namespace: capi-clusters
spec:
  identityRef:
    name: ${OS_CREDENTIALS_SECRET:=ovh-capi-credentials}
    cloudName: ${OS_CLOUD_NAME:=ovh}
  floatingIPNetwork:
    filter:
      name: ${OS_EXTERNAL_NETWORK:=Ext-Net}
  # Pre-allocated IPs: they must be known BEFORE boot to enter the certSANs
  # (see TalosControlPlane). Retain = we keep the anchor stable.
  preAllocatedFloatingIPs:
    - ${OS_CP_FLOATING_IPS}
  reclaimPolicy: Retain
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-cp-${MACHINE_REV:=v1}
  namespace: capi-clusters
spec:
  template:
    spec:
      # `image` is the ONLY required field. An **openstack** platform image
      # (CAPO delivers the Talos machine config as Nova user_data), not nocloud.
      image:
        filter:
          name: ${OS_IMAGE_NAME}
      flavor: ${OS_FLAVOR:=b3-8}
      # A floating IP = ExternalIP in machine.Status.Addresses → CACPPT can
      # reach the Talos API :50000 (see the pool comment above).
      floatingIPPoolRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackFloatingIPPool
        name: ${CLUSTER_NAME}-cp-fip3
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-workers-${MACHINE_REV:=v1}
  namespace: capi-clusters
spec:
  template:
    spec:
      image:
        filter:
          name: ${OS_IMAGE_NAME}
      flavor: ${OS_FLAVOR:=b3-8}
