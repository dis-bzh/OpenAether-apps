# Talos client cluster on Scaleway through CAPI.
# apiVersions validated against the pinned providers (2026-07-25):
#   - CAPS v0.2.1  → infrastructure.cluster.x-k8s.io/v1alpha2 (v1alpha1 deprecated)
#   - CACPPT v0.5.13 → controlplane.cluster.x-k8s.io/v1alpha3
#   - CABPT  v0.6.12 → bootstrap.cluster.x-k8s.io/v1alpha3
# Exercised for real on edge-1 and mgmt-capi (2026-07-28).
#
# Prerequisite: the `scaleway-capi-credentials` Secret in capi-clusters
# (SCW_ACCESS_KEY/SCW_SECRET_KEY/SCW_DEFAULT_PROJECT_ID — through ESO, OpenBao
# key secret/capi/scaleway, to be seeded by the operator).
#
# Variables (postBuild.substitute, see apps/clusters/README.md):
#   ${CLUSTER_NAME}      — child cluster name (e.g. edge-1)
#   ${K8S_VERSION:=v1.31.4}  ${TALOS_VERSION:=v1.9}
#   ${CP_REPLICAS:=1}    ${WORKER_REPLICAS:=1}
#   ${SCW_PROJECT_ID}    ${SCW_REGION:=fr-par}
#   ${SCW_INSTANCE_TYPE:=DEV1-L}
#   ${SCW_IMAGE_NAME}    — Talos image name (talos-image/ on the infra side, same schematic)
#
# Same philosophy as the parent: Talos everywhere, the Cilium+Flux foundation
# injected afterwards by the management (see apps/clusters/README.md).
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-clusters
  labels:
    openaether.io/managed: "true"
    openaether.io/component: capi-clusters
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  # CAPI v1.13 → v1beta2: refs {apiGroup, kind, name} (no more apiVersion/namespace).
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: ${CLUSTER_NAME}-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ScalewayCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ScalewayCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-clusters
spec:
  projectID: ${SCW_PROJECT_ID}
  region: ${SCW_REGION:=fr-par}
  # Scaleway credentials Secret (keys SCW_ACCESS_KEY / SCW_SECRET_KEY,
  # "all other keys ignored" — CAPS docs) — see the header.
  scalewaySecretName: scaleway-capi-credentials
  # Pinned to the Talos image's zone (instance images are PER ZONE: without
  # failureDomains, CAPS spreads across every zone of the region and the
  # out-of-zone machines cannot find the image).
  failureDomains:
    - ${SCW_ZONE:=fr-par-1}
  # The control-plane LB is ALWAYS created by CAPS (cannot be disabled).
  # Optional: network.privateNetwork / publicGateways — reuse the choices
  # from modules/providers/scw on the infra side for a hardened child.
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: ${CLUSTER_NAME}-cp
  namespace: capi-clusters
spec:
  replicas: ${CP_REPLICAS:=1}
  version: ${K8S_VERSION:=v1.31.4}
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    kind: ScalewayMachineTemplate
    name: ${CLUSTER_NAME}-cp
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: ${TALOS_VERSION:=v1.9}
      # The CNI is NOT laid down here (no ~MB inlineManifests inside a CR):
      # Cilium + Flux are injected remotely by the management (kubeConfig).
      # strategicPatches and NOT configPatches (JSON6902): "JSON6902 patches
      # are not supported for multi-document machine configuration" with recent
      # Talos configs (observed for real, CABPT v0.6.12 / Talos v1.13).
      strategicPatches:
        - |
          cluster:
            network:
              cni:
                name: none
            proxy:
              disabled: true
        # providerID: without it CAPI never resolves nodeRef and
        # MachineHealthCheck is dead. Talos does not set it, so the CCM must —
        # which needs the kubelet to hand it the `uninitialized` taint, and the
        # Talos API reachable from kube-system so the CCM can read the metadata.
        # ⚠️ Both halves ship together: this flag with no running CCM leaves
        # every node tainted and the cluster schedules nothing.
        - |
          machine:
            kubelet:
              extraArgs:
                cloud-provider: external
            features:
              kubernetesTalosAPIAccess:
                enabled: true
                allowedRoles:
                  - os:reader
                allowedKubernetesNamespaces:
                  - kube-system
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
spec:
  template:
    spec:
      generateType: join
      talosVersion: ${TALOS_VERSION:=v1.9}
      # Workers need the same kubelet flag as the control plane (see above);
      # kubernetesTalosAPIAccess is a control-plane-only feature.
      strategicPatches:
        - |
          machine:
            kubelet:
              extraArgs:
                cloud-provider: external
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_REPLICAS:=1}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${K8S_VERSION:=v1.35.3}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: ${CLUSTER_NAME}-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ScalewayMachineTemplate
        name: ${CLUSTER_NAME}-workers
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ScalewayMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-cp
  namespace: capi-clusters
spec:
  template:
    spec:
      commercialType: ${SCW_INSTANCE_TYPE:=DEV1-L}
      # Exactly ONE of id|name|label (CAPS v1alpha2, immutable fields).
      image:
        name: ${SCW_IMAGE_NAME}
      # Public IPv4: with no private network/gateway configured, this is the
      # nodes' egress (image pulls, GitHub for the child's Flux).
      publicNetwork:
        enableIPv4: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ScalewayMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: capi-clusters
spec:
  template:
    spec:
      commercialType: ${SCW_INSTANCE_TYPE:=DEV1-L}
      image:
        name: ${SCW_IMAGE_NAME}
      publicNetwork:
        enableIPv4: true
