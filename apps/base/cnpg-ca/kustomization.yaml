apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A stable CA for the CNPG server certificates and the Bundle that publishes it (apps #78, step 1: nothing consumes it yet).
# A separate brick: it needs the cert-manager AND the trust-manager CRDs, and no profile has to carry the CA without a CNPG.
resources:
  - ca.yaml
  - bundle.yaml
