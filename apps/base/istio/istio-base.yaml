apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: "istio"
    pod-security.kubernetes.io/enforce: privileged

---
# CRDs Istio (wave 0 - avant istiod)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: base
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultRevision: default
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: foundation-service-mesh
spec:
  url: https://istio-release.storage.googleapis.com/charts
  interval: 1h
