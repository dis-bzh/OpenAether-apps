apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: "istio"
    pod-security.kubernetes.io/enforce: privileged

---
# Istio CRDs (wave 0 — before istiod)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: base
      version: "1.31.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultRevision: default
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: foundation-service-mesh
spec:
  # Istio 1.31 no longer publishes charts to istio-release.storage.googleapis.com (its index stops at 1.31.0-rc.0).
  # blob.istio.io answers 308 to istio-release.r2.istio.io; the egress policies allow both names.
  url: https://blob.istio.io/istio-release/charts
  interval: 1h
