apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether 0.5.0 Sprint B — Istio Ambient Mesh (Istio 1.24+)
# Profile: ambient (ztunnel DaemonSet + istiod)
# IMPORTANT: requires a reconfigured Cilium (cni-exclusive=false, bpf-lb-sock-hostns-only=true)
# The Cilium bootstrap must be updated BEFORE this kustomize.
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - gateway-backend-egress.yaml
  - istio-base.yaml
  - istiod.yaml
  - istio-cni.yaml
  - ztunnel.yaml
  - gatewayclass-istio.yaml
  - waypoints.yaml
# NB: the north-south Gateway (openaether-gateway), its TLS cert (openaether-tls,
# issued by OpenBao) and the redirect HTTPRoute are DECOUPLED into
# apps/base/services-gateway (flux 14c): their cert depends on a manual offline
# PKI signature → under wait:true here it blocked istio + observability. The
# services-gateway ns and the `istio` GatewayClass are still provided here.
# No global `namespace:`: the HelmReleases have an explicit namespace (foundation-service-mesh),
# istio-base.yaml declares istio-system (required by Istio).
# Un namespace: global renommerait istio-system → foundation-service-mesh (conflit namespaces.yaml).

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "istio"
