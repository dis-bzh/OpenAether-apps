apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether 0.5.0 Sprint B — Istio Ambient Mesh (Istio 1.24+)
# Profile: ambient (ztunnel DaemonSet + istiod)
# IMPORTANT: Requiert Cilium reconfiguré (cni-exclusive=false, bpf-lb-sock-hostns-only=true)
# Bootstrap Cilium mis à jour AVANT ce kustomize.
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - istio-base.yaml
  - istiod.yaml
  - istio-cni.yaml
  - ztunnel.yaml
  - gatewayclass-istio.yaml
  - waypoints.yaml
# NB: la Gateway nord-sud (openaether-gateway), son cert TLS (openaether-tls, émis
# par OpenBao) et la HTTPRoute de redirect sont DÉCOUPLÉS dans
# apps/base/services-gateway (flux 14c) : leur cert dépend d'une signature PKI
# offline manuelle → en wait:true ici, il bloquait istio + observability. Le ns
# services-gateway et la GatewayClass `istio` restent fournis ici.
# Pas de `namespace:` global: les HelmRelease ont namespace explicite (foundation-service-mesh),
# istio-base.yaml déclare istio-system (requis Istio).
# Un namespace: global renommerait istio-system → foundation-service-mesh (conflit namespaces.yaml).

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "istio"
