apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: istiod
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    pilot:
      replicaCount: 1
      autoscaleEnabled: false
      env:
        PILOT_ENABLE_AMBIENT: "true"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    meshConfig:
      enableAutoMtls: true
      # trustDomain = cluster.local (Istio default). Single-cluster dev → idiomatic.
      # If multi-cluster mesh federation ever happens, reintroduce a trustDomain
      # unique + aliases (ex. openaether.local) et migrer les principals.
      trustDomain: cluster.local
