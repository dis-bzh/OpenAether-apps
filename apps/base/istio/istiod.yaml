apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: istiod
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  values:
    pilot:
      replicaCount: 1
      autoscaleEnabled: false
      env:
        PILOT_ENABLE_AMBIENT: "true"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    meshConfig:
      enableAutoMtls: true
      # trustDomain = cluster.local (défaut Istio). Mono-cluster dev → idiomatique.
      # Si fédération mesh multi-cluster un jour, réintroduire un trustDomain
      # unique + aliases (ex. openaether.local) et migrer les principals.
      trustDomain: cluster.local
