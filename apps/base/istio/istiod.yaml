apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: istiod
      version: "1.31.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    pilot:
      # Two, not one. The chart gives istiod a PodDisruptionBudget requiring one
      # available replica, so at replicaCount 1 the budget permits no eviction at
      # all and the node carrying it can never be drained — a rolling upgrade
      # reboots it with istiod still aboard. Costs a second 512Mi request; the
      # alternative is a mesh control plane that pins a node forever.
      replicaCount: 2
      autoscaleEnabled: false
      # Two istiod on two different workers (0.4.0 M4, scripts/check-ha.py). ScheduleAnyway: with one worker left the
      # second replica still starts. The budget (pdb) is in this brick.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              istio: pilot
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              istio: pilot
      seccompProfile:
        type: RuntimeDefault
      env:
        PILOT_ENABLE_AMBIENT: "true"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # The Gateways and waypoints istiod templates (the istio-proxy container) get the default seccomp profile too (#47).
    gateways:
      seccompProfile:
        type: RuntimeDefault
    meshConfig:
      enableAutoMtls: true
      # No TLS floor is set here on purpose: meshConfig.tlsDefaults applies to traffic that is NOT ISTIO_MUTUAL
      # (istio/api 1.31 config.proto), so a minProtocolVersion there sets no floor for mesh mTLS.
      # meshConfig.meshMTLS.minProtocolVersion (new in 1.31) is the knob for ISTIO_MUTUAL traffic: not set, to
      # evaluate on a cluster (ztunnel HBONE is separate from it). A Gateway floor is a per-listener setting
      # (tls.options), not a mesh one.
      # trustDomain = cluster.local (Istio default). Single-cluster dev → idiomatic.
      # If multi-cluster mesh federation ever happens, reintroduce a trustDomain
      # single name + aliases (e.g. openaether.local) and migrate the principals.
      trustDomain: cluster.local
      # Runs of slashes in a request path are merged BEFORE the AuthorizationPolicies, the routes and the services see
      # it (//metrics becomes /metrics). Without it the forge answered https://forge.<domain>//metrics with its
      # Prometheus metrics at 0.4.1 and 0.4.2: deny-metrics-paths matched /metrics literally and Forgejo cleans
      # //metrics to /metrics itself. The policy lists the // spellings too (services-gateway), so this is one of two
      # layers that each stop it; scripts/check-gateway-routes.py pins both.
      #
      # MERGE_SLASHES, not DECODE_AND_MERGE_SLASHES: the latter also unescapes %2F and forwards the decoded slash,
      # which no host needed here (none served metrics on a %2F spelling) and which would change what a client that
      # encodes a slash in a path sends to its service (Forgejo package registries, scoped npm names). Not run, so not
      # shipped.
      #
      # BLAST RADIUS: mesh-wide, read by every Envoy istiod configures: the Gateway pods (openaether-gateway, the only
      # way in for customer requests) and the istio-waypoint, which no workload of this repository uses (no
      # networking.istio.io/use-waypoint). ztunnel is L4 and has no path. A route of yours whose service gives a
      # meaning to `//` in a path (an object key, a URL embedded in a path) receives it merged:
      # docs/public-exposure.md. Istio pushes a changed meshConfig to the running proxies by xDS: no restart (seen on
      # a local rig, not on a cluster).
      pathNormalization:
        normalization: MERGE_SLASHES
