apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: istiod
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    pilot:
      # Two, not one. The chart gives istiod a PodDisruptionBudget requiring one
      # available replica, so at replicaCount 1 the budget permits no eviction at
      # all and the node carrying it can never be drained — a rolling upgrade
      # reboots it with istiod still aboard. Costs a second 512Mi request; the
      # alternative is a mesh control plane that pins a node forever.
      replicaCount: 2
      autoscaleEnabled: false
      # Two istiod on two different workers (0.4.0 M4, scripts/check-ha.py). ScheduleAnyway: with one worker left the
      # second replica still starts. The budget (pdb) is in this brick.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              istio: pilot
      seccompProfile:
        type: RuntimeDefault
      env:
        PILOT_ENABLE_AMBIENT: "true"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # The Gateways and waypoints istiod templates (the istio-proxy container) get the default seccomp profile too (#47).
    gateways:
      seccompProfile:
        type: RuntimeDefault
    meshConfig:
      enableAutoMtls: true
      # No TLS floor is set here on purpose: meshConfig.tlsDefaults only carries ecdhCurves and cipherSuites for traffic
      # that is NOT ISTIO_MUTUAL (istio/api 1.24 config.proto), so a minProtocolVersion there is accepted and ignored.
      # Envoy's own floor (TLS 1.2) applies; a Gateway floor is a per-listener setting (tls.options), not a mesh one.
      # trustDomain = cluster.local (Istio default). Single-cluster dev → idiomatic.
      # If multi-cluster mesh federation ever happens, reintroduce a trustDomain
      # single name + aliases (e.g. openaether.local) and migrate the principals.
      trustDomain: cluster.local
