# Generic egress from the north-south Gateway to application backends.
# A CiliumClusterwideNetworkPolicy (not a namespaced CiliumNetworkPolicy)
# because matchLabels in a namespaced CNP is implicitly scoped to the policy's
# namespace (see the networkpolicy.yaml comments) — unusable here since the
# backend apps live in other namespaces.
# This file knows no business app name: any app that wants to be reachable from
# the Gateway labels itself
# `networking.openaether.io/gateway-backend: "true"` on its pod and listens on
# port 8080 (platform convention) — the opt-in is carried by the app itself in
# its own repo/deploy.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: openaether-gateway-backend-egress
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "Egress du Gateway (services-gateway) vers tout pod labellisé networking.openaether.io/gateway-backend, port 8080."
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: services-gateway
      service.istio.io/canonical-name: openaether-gateway-istio
  egress:
    - toEndpoints:
        - matchLabels:
            networking.openaether.io/gateway-backend: "true"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
