apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: kube-system
  chart:
    spec:
      chart: cni
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  # Idempotence net — real case (2026-07-26): Cilium and istio-cni fought over
  # 05-cilium.conflist, istio-cni never became Ready and the install expired;
  # WITHOUT remediation Flux never retried it and the mesh stayed blocked for
  # 3 h even though the cause had been fixed. With retries, a source change
  # (or a fresh attempt) is enough to
  # restart without manual intervention.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # CNI chained AFTER Cilium (Cilium = 05-cilium.conflist, Istio = ZZ-istio-cni.conflist)
    # Cilium must have: cni.exclusive=false, socketLB.hostNamespaceOnly=true
    chained: true
    logLevel: info
    excludeNamespaces:
      - kube-system
      - management-gitops
      - local-path-storage
    ambient:
      enabled: true
