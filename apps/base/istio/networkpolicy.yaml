---
# istiod: accepte connexions des proxies/ztunnel/webhooks, émet vers kube-api
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istiod
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "istiod: ingress depuis proxies (15012 xDS/CA, 15010 xDS plaintext, 443 webhook, 15014 debug), egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app: istiod
  ingress:
    # Proxies Envoy, ztunnel, ingressgateway, openaether-gateway → xDS + CA
    # fromEntities: [cluster] au lieu de fromEndpoints: [matchLabels: {}]
    # car ce dernier ne résout pas les identités cross-namespace (Cilium bug/limitation).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # kube-apiserver → webhook MutatingWebhookConfiguration (istiod listens on 15017)
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15017"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ztunnel: DaemonSet ambient — doit joindre istiod (xDS+CA) et kube-api
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ztunnel
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "ztunnel: egress istiod (15012 CA+xDS, 15010), kube-api, DNS. Ingress HBONE (15008) depuis tous pods."
  endpointSelector:
    matchLabels:
      app: ztunnel
  ingress:
    # HBONE tunnels depuis n'importe quel pod ambient (cross-node).
    # fromEntities: [cluster] au lieu de fromEndpoints: [matchLabels: {}]
    # car ce dernier ne résout pas les identités cross-namespace (Cilium bug/limitation).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
    # stats/health depuis kube-apiserver
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15020"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # istiod xDS + CA
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # kube-api (watch pods, services, etc.)
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Trafic ambient HBONE vers autres pods/noeuds
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
    # Remote ztunnel sur autres noeuds (HBONE cross-node)
    - toEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
---
# ── Waypoint (foundation-service-mesh) ──────────────────────────────
# Envoy proxy dédié (pas ambient, pas sidecar). Nécessaire pour l'authz L7.
# Egress: istiod :15012 (xDS/CA) + :15010 (xDS plaintext) + DNS + kube-api.
# L'ingress vers istiod est déjà couvert par la CNP istiod (fromEntities: cluster).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istio-waypoint
  namespace: foundation-service-mesh
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "istio-waypoint: egress vers istiod (xDS/CA) + DNS + kube-api."
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: istio-waypoint
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # istiod xDS/CA (15012 mTLS, 15010 plaintext)
    - toServices:
        - k8sService:
            serviceName: istiod
            namespace: istio-system
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # kube-api (auth, cert signing)
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# openaether-gateway-istio (Gateway API): ingress HTTP/HTTPS/status, egress istiod xDS/CA + DNS + kube-api
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openaether-gateway
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
spec:
  description: "openaether-gateway: ingress 80/443/15021 depuis world+lb+nœuds, egress istiod xDS/CA + DNS + kube-api."
  endpointSelector:
    matchLabels:
      service.istio.io/canonical-name: openaether-gateway-istio
  ingress:
    # ⚠️ `host` et `remote-node` sont REQUIS par le chemin public : le LB cloud
    # tape les NodePorts figés (30080/30443, cf.
    # apps/base/services-gateway/service-nodeport.yaml), et en
    # externalTrafficPolicy: Cluster le nœud SNAT le paquet vers sa propre IP.
    # L'entité vue par Cilium n'est donc plus `world` mais le nœud lui-même —
    # sans ces deux entités, tout l'ingress public est droppé.
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "15021"
              protocol: TCP
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # Explicit toServices for istiod Service IP (clusterIP) — required when
    # client dials the Service IP instead of pod IPs directly.
    - toServices:
        - k8sService:
            namespace: istio-system
            serviceName: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Trafic applicatif vers les backends d'UI exposés par le Gateway.
    # ⚠️ NE PAS utiliser `toEndpoints: [{matchLabels: {}}]` : un selector vide en
    # egress est scopé au namespace de la policy (services-gateway) → ne matche
    # AUCUN backend cross-ns → l'Envoy timeout vers grafana/zitadel/vault/longhorn.
    # Même piège que l'ingress (cf. L18/L74, contourné par fromEntities: cluster).
    # On cible donc chaque backend par ns+app sur son targetPort RÉEL (le port du
    # pod, pas du Service — Cilium enforce sur le targetPort). Moindre privilège :
    # l'Envoy ne joint QUE les 4 backends d'UI.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
            app.kubernetes.io/name: zitadel
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: longhorn-system
            app: longhorn-ui
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
