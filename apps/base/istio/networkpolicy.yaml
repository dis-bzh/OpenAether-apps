---
# istiod: accepts connections from proxies/ztunnel/webhooks, emits to kube-api
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istiod
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "istiod: ingress from proxies (15012 xDS/CA, 15010 xDS plaintext, 443 webhook, 15014 debug), egress DNS + kube-api."
  endpointSelector:
    matchLabels:
      app: istiod
  ingress:
    # Proxies Envoy, ztunnel, ingressgateway, openaether-gateway → xDS + CA
    # fromEntities: [cluster] instead of fromEndpoints: [matchLabels: {}]
    # because the latter does not resolve cross-namespace identities (Cilium limitation).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # kube-apiserver → webhook MutatingWebhookConfiguration (istiod listens on 15017)
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15017"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ztunnel: ambient DaemonSet — must reach istiod (xDS+CA) and kube-api
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ztunnel
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "ztunnel: egress istiod (15012 CA+xDS, 15010), kube-api, DNS. Ingress HBONE (15008) from every pod."
  endpointSelector:
    matchLabels:
      app: ztunnel
  ingress:
    # HBONE tunnels from any ambient pod (cross-node).
    # fromEntities: [cluster] instead of fromEndpoints: [matchLabels: {}]
    # because the latter does not resolve cross-namespace identities (Cilium limitation).
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
    # stats/health from kube-apiserver
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15020"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # istiod xDS + CA
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # kube-api (watch pods, services, etc.)
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Ambient HBONE traffic to other pods/nodes
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
    # Remote ztunnel on other nodes (HBONE cross-node)
    - toEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
---
# ── Waypoint (foundation-service-mesh) ──────────────────────────────
# Dedicated Envoy proxy (not ambient, not sidecar). Required for L7 authz.
# Egress: istiod :15012 (xDS/CA) + :15010 (xDS plaintext) + DNS + kube-api.
# Ingress to istiod is already covered by the istiod CNP (fromEntities: cluster).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istio-waypoint
  namespace: foundation-service-mesh
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  description: "istio-waypoint: egress to istiod (xDS/CA) + DNS + kube-api."
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: istio-waypoint
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # istiod xDS/CA (15012 mTLS, 15010 plaintext)
    - toServices:
        - k8sService:
            serviceName: istiod
            namespace: istio-system
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # kube-api (auth, cert signing)
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# openaether-gateway-istio (Gateway API): ingress HTTP/HTTPS/status, egress istiod xDS/CA + DNS + kube-api
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openaether-gateway
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
spec:
  description: "openaether-gateway: ingress 80/443/15021 from world+lb+nodes, egress istiod xDS/CA + DNS + kube-api."
  endpointSelector:
    matchLabels:
      service.istio.io/canonical-name: openaether-gateway-istio
  ingress:
    # ⚠️ `host` and `remote-node` are REQUIRED by the public path: the cloud LB
    # hits the fixed NodePorts (30080/30443, see
    # apps/base/services-gateway/service-nodeport.yaml), et en
    # with externalTrafficPolicy: Cluster the node SNATs the packet to its own IP.
    # The entity Cilium sees is therefore no longer `world` but the node itself —
    # without those two entities, all public ingress is dropped.
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "15021"
              protocol: TCP
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    # Explicit toServices for istiod Service IP (clusterIP) — required when
    # client dials the Service IP instead of pod IPs directly.
    - toServices:
        - k8sService:
            namespace: istio-system
            serviceName: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
            - port: "15010"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Application traffic to the UI backends exposed by the Gateway.
    # ⚠️ DO NOT use `toEndpoints: [{matchLabels: {}}]`: an empty selector in
    # egress is scoped to the policy's namespace (services-gateway) → it matches
    # NO cross-ns backend → Envoy times out to grafana/zitadel/vault/longhorn.
    # Same trap as the ingress side (worked around with fromEntities: cluster).
    # So we target each backend by ns+app on its REAL targetPort (the pod's port,
    # not the Service's — Cilium enforces on the targetPort). Least privilege:
    # Envoy can only reach the 4 UI backends.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
            app.kubernetes.io/name: zitadel
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: longhorn-system
            app: longhorn-ui
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
