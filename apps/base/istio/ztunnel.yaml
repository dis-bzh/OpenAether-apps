apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: ztunnel
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-cni
  # Filet d'idempotence : sans remediation, une install Helm qui échoue une
  # fois reste bloquée définitivement (Flux ne la retente jamais).
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    hub: docker.io/istio
    tag: "1.24.2"
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
