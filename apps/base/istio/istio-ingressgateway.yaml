apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: gateway
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istiod
  values:
    # Gateway API: pods qui recevront les Gateway/HTTPRoute
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
