apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: gateway
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  install:
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  dependsOn:
    - name: istiod
  values:
    # revision: default → pod gets istio.io/rev=default label → webhook injects image
    # No need for namespace-level injection label on istio-system
    revision: default
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
