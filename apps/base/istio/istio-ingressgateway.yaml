apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: foundation-service-mesh
spec:
  interval: 10m
  targetNamespace: istio-system
  chart:
    spec:
      chart: gateway
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istiod
  # Gateway API: pods recevront les Gateway/HTTPRoute (defaults chart = 1 replica)
