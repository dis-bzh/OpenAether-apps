# OpenAether 0.5.0 — Istio AuthorizationPolicy Default Deny (Zero Trust)
# Appliqué dans CHAQUE namespace ambient: ferme tout le trafic L7 par défaut.
# Chaque workload doit avoir son AuthorizationPolicy explicite pour être accessible.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: DENY
  rules:
    - {}
---
