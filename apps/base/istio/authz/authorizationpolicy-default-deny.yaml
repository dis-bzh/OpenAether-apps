# Istio AuthorizationPolicy default-deny (zero trust).
#
# Scopes are DISJOINT, never duplicated:
#   * ambient namespaces → authz belongs HERE. Under ambient, pod→pod traffic is
#     encapsulated in HBONE :15008, so per-port CiliumNetworkPolicies do not see it.
#   * out-of-mesh namespaces → NO AuthorizationPolicy: ztunnel does not
#     intercept, so one would be inert (security theatre). Security there is
#     L3/L4 CiliumNetworkPolicy + OpenBao k8s-auth.
#
# The correct default-deny is `spec: {}` — implicit ALLOW with zero rules, i.e.
# "allows nothing", overridable by authorizationpolicy-explicit-allows.yaml.
# ⚠️ NOT `action: DENY` + `rules: [{}]`: an empty DENY matches everything and
# wins over the ALLOWs (eval order CUSTOM → DENY → ALLOW), killing them all.
# Mesh root namespace — default deny-all on istio-system.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec: {} # implicit ALLOW, 0 rules → deny by default, overridden by the ALLOWs
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: foundation-service-mesh
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec: {}
# NOTE: services-observability is NO LONGER ambient (kubelet probes dropped by
# HBONE → CrashLoop; cf. namespaces.yaml). ztunnel intercepts nothing there, so
# an AuthorizationPolicy would be inert ("security theatre"). Its security is
# CiliumNetworkPolicy L3/L4 (apps/base/observability/networkpolicy.yaml).
---
# foundation-networking: ambient (future Gateway-API controllers). With no
# policy it is allow-all — a real hole. The intra-ns allow is to be completed
# workloads are deployed there (the namespace is empty today).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: foundation-networking
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec: {}
---
# services-gateway: the ns is NOT ambient, BUT the Gateway-API pod is a
# dedicated Envoy proxy (injected by the Gateway deployment) that enforces AuthZ
# itself — different from ztunnel. So we keep the deny-all; it is overridden in
# par `allow-gateway-ingress` (targetRefs Gateway, action ALLOW ouverte) dans
# authorizationpolicy-explicit-allows.yaml. ⚠️ DO NOT gate the entry point on an
# mTLS `source.principals`: external ingress has no SPIFFE identity → 403.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec: {}
