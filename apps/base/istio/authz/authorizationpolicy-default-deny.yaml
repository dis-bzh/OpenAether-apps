# OpenAether 0.5.0 — Istio AuthorizationPolicy Default Deny (Zero Trust)
# ──────────────────────────────────────────────────────────────────────────
# AUTHORISATION MODEL (DISJOINT scopes, no duplication):
#
#   • Namespaces AMBIENT (label istio.io/dataplane-mode: ambient) :
#       L4 authorisation carried by Istio/ztunnel through SPIFFE identity.
#       Under ambient, pod→pod traffic is encapsulated in HBONE :15008 → the
#       per-application-port CiliumNetworkPolicies DO NOT SEE that traffic.
#       So in-mesh authz = THESE policies (here), not Cilium.
#
#   • Namespaces HORS-MESH (cert-manager, kyverno, capi*, longhorn-system,
#       flux-system, foundation-databases, foundation-vault/pki) :
#       NO AuthorizationPolicy here. ztunnel does not intercept → they would
#       be inert (security theatre). Their security =
#       L3/L4 CiliumNetworkPolicy (SA identity) + OpenBao k8s-auth.
#
#   • Mesh-wide STRICT mTLS: see peerauthentication-strict.yaml (unchanged).
#
# THE CORRECT ISTIO DEFAULT-DENY: an AuthorizationPolicy with `spec: {}`
# (implicit ALLOW action, ZERO rules) = "allows nothing", OVERRIDABLE by
# les ALLOW explicites (authorizationpolicy-explicit-allows.yaml).
# ⚠️ DO NOT use `action: DENY` + `rules: [{}]`: an empty DENY matches EVERYTHING
# and wins over the ALLOWs (Istio eval order: CUSTOM → DENY → ALLOW) → every
# allow becomes dead.
# ──────────────────────────────────────────────────────────────────────────

# Mesh root namespace — default deny-all on istio-system.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec: {} # implicit ALLOW, 0 rules → deny by default, overridden by the ALLOWs
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: foundation-service-mesh
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec: {}
# NOTE: services-observability is NO LONGER ambient (kubelet probes dropped by
# HBONE → CrashLoop ; cf. namespaces.yaml). ztunnel n'y intercepte plus rien →
# an AuthorizationPolicy would be inert there ("security theatre"). Its security
# = CiliumNetworkPolicy L3/L4 (apps/base/observability/networkpolicy.yaml).
---
# foundation-networking : ambient (futurs Gateway-API controllers). Sans policy
# = allow-all → a real hole. The intra-ns allow is to be completed once
# workloads are deployed there (the namespace is empty today).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: foundation-networking
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec: {}
---
# services-gateway: the ns is NOT ambient, BUT the Gateway-API pod is a
# dedicated Envoy proxy (injected by the Gateway deployment) that enforces AuthZ
# itself — different from ztunnel. So we keep the deny-all; it is overridden in
# par `allow-gateway-ingress` (targetRefs Gateway, action ALLOW ouverte) dans
# authorizationpolicy-explicit-allows.yaml. ⚠️ DO NOT gate the entry point on an
# mTLS `source.principals`: external ingress has no SPIFFE identity → 403.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec: {}
