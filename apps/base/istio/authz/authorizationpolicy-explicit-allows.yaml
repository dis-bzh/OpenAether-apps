# OpenAether 0.5.0 — Istio AuthorizationPolicy Explicit Allows (Zero Trust)
# ──────────────────────────────────────────────────────────────────────────
# LEGITIMATE L7 allows between workloads, ONLY in AMBIENT namespaces (where
# ztunnel actually enforces the policy). Eval order: DENY → ALLOW;
# le default-deny (authorizationpolicy-default-deny.yaml, forme `spec: {}`)
# allows nothing, so these ALLOWs reopen the required flows.
#
# The flows of OUT-OF-MESH namespaces (cert-manager→OpenBao, grafana→CNPG,
# flux→kube-api, cert-manager/kyverno webhooks, internal longhorn) are NO LONGER
# here: they are protected by L3/L4 CiliumNetworkPolicy + OpenBao k8s-auth.
# Under ambient, egress from a meshed pod to an out-of-mesh destination (CNPG,
# OpenBao) sort hors HBONE → seul Cilium L4 s'applique côté destination.
#
# Identités SPIFFE = trustDomain `cluster.local` (cf. istiod.yaml).
# ──────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════
# istio-system : plan de contrôle (xDS / CA / HBONE)
# ════════════════════════════════════════════════════════════════════════
# istiod ↔ ztunnel ↔ gateway ↔ waypoint : xDS (15010/15012) + injection (15017)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-istiod-ztunnel
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/ztunnel"
              - "cluster.local/ns/services-gateway/sa/openaether-gateway-istio"
              - "cluster.local/ns/foundation-service-mesh/sa/istio-waypoint-istio"
      to:
        - operation:
            ports:
              - "15010"
              - "15012"
              - "15017"
---
# ztunnel ↔ ztunnel : data-plane HBONE (mTLS overlay)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ztunnel-hbone
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/ztunnel"
      to:
        - operation:
            ports:
              - "15008"
---
# ════════════════════════════════════════════════════════════════════════
# services-observability : HORS MESH (plus d'AuthorizationPolicy ici)
# ════════════════════════════════════════════════════════════════════════
# Le namespace a quitté l'ambient (probes kubelet droppées par HBONE :15008
# → CrashLoop vm-operator/KSM/grafana ; cf. namespaces.yaml). ztunnel n'y
# intercepte plus rien → toute AuthorizationPolicy y serait inerte.
# Flux intra-stack + ingress Gateway→Grafana :3000 = CiliumNetworkPolicy L3/L4
# (apps/base/observability/networkpolicy.yaml, CNP grafana ← services-gateway).
# ════════════════════════════════════════════════════════════════════════
# services-gateway : POINT D'ENTRÉE ingress externe (Envoy Gateway-API dédié)
# ════════════════════════════════════════════════════════════════════════
# L'Envoy Gateway reçoit le trafic EXTERNE non-authentifié (navigateurs) → il
# n'a AUCUNE identité SPIFFE source. Gater l'entrée sur `principals` (mTLS) la
# bloquait (403 sur toutes les UIs : le seul principal autorisé était la Gateway
# elle-même, jamais le client externe). On AUTORISE donc l'ingress ; la
# protection périmétrique = ACL de l'app-LB Scaleway (admin_ip, voir
# modules/providers/scw/lb.tf). Le zero-trust reste appliqué EN AVAL : les
# backends meshés n'acceptent que le principal SPIFFE de la Gateway (leurs
# propres AuthorizationPolicy / CiliumNetworkPolicy, dans leurs namespaces).
#
# targetRefs (Gateway API, Istio ≥1.22) cible le proxy Gateway précisément, sans
# toucher d'autres workloads éventuels du ns. action ALLOW + `rules: [{}]` =
# « autorise toute requête entrante vers ce proxy » (surcharge le default-deny).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-ingress
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
  action: ALLOW
  rules:
    - {} # autorise tout ingress vers l'Envoy Gateway (périmètre = ACL LB admin_ip)
