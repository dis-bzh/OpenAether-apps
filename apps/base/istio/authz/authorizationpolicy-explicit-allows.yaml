# OpenAether 0.5.0 — Istio AuthorizationPolicy Explicit Allows (Zero Trust)
# ──────────────────────────────────────────────────────────────────────────
# LEGITIMATE L7 allows between workloads, ONLY in AMBIENT namespaces (where
# ztunnel actually enforces the policy). Eval order: DENY → ALLOW;
# the default-deny (authorizationpolicy-default-deny.yaml, the `spec: {}` form)
# allows nothing, so these ALLOWs reopen the required flows.
#
# The flows of OUT-OF-MESH namespaces (cert-manager→OpenBao, grafana→CNPG,
# flux→kube-api, cert-manager/kyverno webhooks, internal longhorn) are NO LONGER
# here: they are protected by L3/L4 CiliumNetworkPolicy + OpenBao k8s-auth.
# Under ambient, egress from a meshed pod to an out-of-mesh destination (CNPG,
# OpenBao) leaves HBONE → only Cilium L4 applies on the destination side.
#
# SPIFFE identities = trustDomain `cluster.local` (see istiod.yaml).
# ──────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════
# istio-system: control plane (xDS / CA / HBONE)
# ════════════════════════════════════════════════════════════════════════
# istiod ↔ ztunnel ↔ gateway ↔ waypoint : xDS (15010/15012) + injection (15017)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-istiod-ztunnel
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/ztunnel"
              - "cluster.local/ns/services-gateway/sa/openaether-gateway-istio"
              - "cluster.local/ns/foundation-service-mesh/sa/istio-waypoint-istio"
      to:
        - operation:
            ports:
              - "15010"
              - "15012"
              - "15017"
---
# ztunnel ↔ ztunnel : data-plane HBONE (mTLS overlay)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ztunnel-hbone
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/ztunnel"
      to:
        - operation:
            ports:
              - "15008"
---
# ════════════════════════════════════════════════════════════════════════
# services-observability: OUT OF MESH (no AuthorizationPolicy here)
# ════════════════════════════════════════════════════════════════════════
# The namespace left ambient (kubelet probes dropped by HBONE :15008 →
# CrashLoop vm-operator/KSM/grafana; cf. namespaces.yaml), so ztunnel
# intercepts nothing and any AuthorizationPolicy would be inert. Its security
# is CiliumNetworkPolicy L3/L4 (apps/base/observability/networkpolicy.yaml).
# ════════════════════════════════════════════════════════════════════════
# services-gateway: the external ingress ENTRY POINT (dedicated Gateway-API Envoy)
# ════════════════════════════════════════════════════════════════════════
# The Gateway Envoy receives EXTERNAL unauthenticated traffic (browsers) → it
# has NO source SPIFFE identity. Gating the entry on `principals` (mTLS) blocked
# it (403 on every UI: the only allowed principal was the Gateway itself, never
# the external client). So we ALLOW the ingress.
#
# ⚠️ This used to say the perimeter was the app-LB admin_ip ACL. There is no such
# ACL: on Scaleway, OVH and Outscale the app LB listens on 80/443 unrestricted,
# and admin_ip guards only the k8s API frontend. So there is NO perimeter here —
# every route attached to this Gateway is reachable by anyone who resolves the
# host. Attach nothing to it that does not authenticate its own callers.
# Zero-trust is still enforced DOWNSTREAM: the
# meshed backends accept only the Gateway's SPIFFE principal, through their own
# AuthorizationPolicy / CiliumNetworkPolicy in their namespaces.
#
# targetRefs (Gateway API, Istio ≥1.22) targets the Gateway proxy precisely,
# without touching any other workload in the ns. action ALLOW + `rules: [{}]` =
# "allow any inbound request to this proxy" (overrides the default-deny).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-ingress
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
  action: ALLOW
  rules:
    - {}  # allows all ingress to the Envoy Gateway — there is no perimeter in front
