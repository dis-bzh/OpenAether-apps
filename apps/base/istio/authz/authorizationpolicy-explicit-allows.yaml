# OpenAether 0.5.0 — Istio AuthorizationPolicy Explicit Allows (Zero Trust)
# ──────────────────────────────────────────────────────────────────────────
# Allows L7 LÉGITIMES entre workloads, UNIQUEMENT dans les namespaces AMBIENT
# (où ztunnel applique réellement la policy). Ordre d'éval : DENY → ALLOW ;
# le default-deny (authorizationpolicy-default-deny.yaml, forme `spec: {}`)
# n'autorise rien, ces ALLOW rouvrent les flux nécessaires.
#
# Les flux des namespaces HORS-MESH (cert-manager→OpenBao, grafana→CNPG,
# flux→kube-api, webhooks cert-manager/kyverno, longhorn interne) NE SONT PLUS
# ici : ils sont protégés par CiliumNetworkPolicy L3/L4 + OpenBao k8s-auth.
# En ambient, l'egress d'un pop meshé vers une destination hors-mesh (CNPG,
# OpenBao) sort hors HBONE → seul Cilium L4 s'applique côté destination.
#
# Identités SPIFFE = trustDomain `cluster.local` (cf. istiod.yaml).
# ──────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════
# istio-system : plan de contrôle (xDS / CA / HBONE)
# ════════════════════════════════════════════════════════════════════════
# istiod ↔ ztunnel ↔ gateway ↔ waypoint : xDS (15010/15012) + injection (15017)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-istiod-ztunnel
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/ztunnel"
              - "cluster.local/ns/services-gateway/sa/openaether-gateway-istio"
              - "cluster.local/ns/foundation-service-mesh/sa/istio-waypoint-istio"
      to:
        - operation:
            ports:
              - "15010"
              - "15012"
              - "15017"
---
# ztunnel ↔ ztunnel : data-plane HBONE (mTLS overlay)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ztunnel-hbone
  namespace: istio-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "istio"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/ztunnel"
      to:
        - operation:
            ports:
              - "15008"
---
# ════════════════════════════════════════════════════════════════════════
# services-observability : stack métrologie/logs (AMBIENT)
# ════════════════════════════════════════════════════════════════════════
# Intra-stack : un seul domaine de confiance applicatif. Autorisé à
# granularité NAMESPACE (grafana→loki/vmselect, vmagent→vminsert/vmstorage,
# alloy→loki, peers loki/vmstorage…). La microsegmentation par-SA est reportée
# à l'adoption de waypoints (vrai L7 path/method) — sans waypoint elle
# n'apporterait rien de plus que le niveau namespace.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-intra
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "services-observability"
---
# Ingress north-south : la Gateway (Envoy dédié) → Grafana :3000 (UI).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-to-grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/services-gateway/sa/openaether-gateway-istio"
      to:
        - operation:
            ports:
              - "3000"
---
# ════════════════════════════════════════════════════════════════════════
# foundation-storage : MinIO (AMBIENT)
# ════════════════════════════════════════════════════════════════════════
# MinIO ← Loki/vmbackup (chunks + backups S3, :9000). Source = ns observability.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-to-minio
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "services-observability"
      to:
        - operation:
            ports:
              - "9000"
---
# ════════════════════════════════════════════════════════════════════════
# services-gateway : ingress externe → backends (proxy Envoy dédié)
# ════════════════════════════════════════════════════════════════════════
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-to-backends
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/services-gateway/sa/openaether-gateway-istio"
      to:
        - operation:
            ports:
              - "80"
              - "443"
              - "8080"
              - "8443"
