# AuthorizationPolicies du namespace foundation-storage (MinIO).
#
# ⚠️ They lived in apps/base/istio/authz until 2026-07-27. But that directory is
# applied as soon as Istio is picked, whereas foundation-storage only exists if
# the `storage` brick is picked too: an "istio without storage" profile (the
# children's workload profile) blocked the Kustomization
# istio-authorizationpolicies sur « namespaces "foundation-storage" not
# found" — observed for real on edge-2 on 2026-07-27.
#
# Elles forment donc une brique COMPAGNON à part, dependsOn [istio, storage] :
# pioché uniquement quand les deux le sont. Règle générale — une policy qui
# protège une brique optionnelle doit suivre le sort de cette brique.
---
# foundation-storage : ambient (MinIO). Sans policy = allow-all → trou réel.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec: {}
---
# ════════════════════════════════════════════════════════════════════════
# foundation-storage : MinIO (AMBIENT)
# ════════════════════════════════════════════════════════════════════════
# MinIO ← Loki/vmbackup (chunks + backups S3, :9000). Source = ns observability.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-to-minio
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "platform"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "services-observability"
      to:
        - operation:
            ports:
              - "9000"
