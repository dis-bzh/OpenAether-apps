apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether 0.5.0 Sprint B — cert-manager v1.15+
# ClusterIssuers dans apps/base/cert-manager-issuers/ (Kustomization Flux 13b)
# pour éviter le chicken-and-egg : dry-run échoue si CRDs cert-manager.io/v1 absentes.
resources:
  - namespace.yaml
  - helmrelease.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "cert-manager"
