apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether 0.5.0 Sprint B — cert-manager v1.15+
# ClusterIssuers live in apps/base/cert-manager-issuers/ (Flux Kustomization 13b)
# to avoid the chicken-and-egg: the dry-run fails if the cert-manager.io/v1 CRDs are absent.
resources:
  - namespace.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
  - rbac-vault-auth.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "cert-manager"
