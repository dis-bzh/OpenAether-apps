---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.15.3"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 1h
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      leaderElection:
        namespace: cert-manager
    installCRDs: true
    # Kyverno reads the container level (#47): the chart's default lacks runAsNonRoot and seccompProfile there.
    containerSecurityContext: &csc
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    startupapicheck:
      enabled: false
    replicaCount: 2
    # The top-level `resources` below is the controller's only: the webhook and the cainjector read their own key
    # (lab 11: both ran with no memory limit). Measured 9-62 Mi (webhook), 60-80 Mi (cainjector, which caches).
    webhook:
      replicaCount: 2
      containerSecurityContext: *csc
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 32Mi
    cainjector:
      replicaCount: 2
      containerSecurityContext: *csc
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
