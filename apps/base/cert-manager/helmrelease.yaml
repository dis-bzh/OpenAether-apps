---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 1h
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      leaderElection:
        namespace: cert-manager
    # `installCRDs` is deprecated since 1.15: same rendered CRDs through crds.enabled, and keep them on uninstall.
    crds:
      enabled: true
      keep: true
    # Kyverno reads the container level (#47): the chart's default lacks runAsNonRoot and seccompProfile there.
    containerSecurityContext: &csc
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    startupapicheck:
      enabled: false
    replicaCount: 2
    webhook:
      replicaCount: 2
      containerSecurityContext: *csc
    cainjector:
      replicaCount: 2
      containerSecurityContext: *csc
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
