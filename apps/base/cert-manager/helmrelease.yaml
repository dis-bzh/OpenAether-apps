---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 1h
  # Idempotence net: without remediation, a Helm install that fails once stays
  # blocked forever (Flux never retries it).
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      leaderElection:
        namespace: cert-manager
    # `installCRDs` is deprecated since 1.15: same rendered CRDs through crds.enabled, and keep them on uninstall.
    crds:
      enabled: true
      keep: true
    # Kyverno reads the container level (#47): the chart's default lacks runAsNonRoot and seccompProfile there.
    containerSecurityContext: &csc
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    startupapicheck:
      enabled: false
    replicaCount: 2
    # Two replicas on two different workers and a budget that lets a drain take one at a time (0.4.0 M4): a lost worker
    # must not stop certificate issuing or the webhook (scripts/check-ha.py). ScheduleAnyway: with one worker left the
    # second replica still starts.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cert-manager
            app.kubernetes.io/instance: cert-manager
            app.kubernetes.io/component: controller
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # The top-level `resources` below is the controller's only: the webhook and the cainjector read their own key
    # (lab 11: both ran with no memory limit). Measured 9-62 Mi (webhook), 60-80 Mi (cainjector, which caches).
    webhook:
      replicaCount: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/instance: cert-manager
              app.kubernetes.io/component: webhook
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      containerSecurityContext: *csc
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 32Mi
    cainjector:
      replicaCount: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cainjector
              app.kubernetes.io/instance: cert-manager
              app.kubernetes.io/component: cainjector
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      containerSecurityContext: *csc
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
