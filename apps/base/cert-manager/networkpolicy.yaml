apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: cert-manager
spec:
  description: "cert-manager: webhook ingress kube-apiserver + intra-namespace,
    egress DNS + kube-api + OpenBao PKI (signer) + OpenBao workload (signer)."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  ingress:
    # kube-apiserver → webhook (ValidatingWebhookConfiguration)
    # remote-node: on Talos the static kube-apiserver pod is identified by Cilium
    # as a node (node identity), not as the kube-apiserver entity.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # intra-namespace : cainjector → webhook, startupapicheck → webhook
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
            app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    # VMAgent scrapes the controller's metrics — that is where certificate
    # expiry comes from, so without this rule CertificateExpiringSoon can never
    # fire and the silence looks exactly like "no certificate is expiring".
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver (watch CRDs, CertificateRequests, etc.)
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # intra-namespace : controller → webhook, cainjector → apiserver local
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
            app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    # OpenBao PKI (signer pki/sign/openaether) — one OpenBao only (Shamir seal).
    # The former foundation-pki-root (OpenBao root) has been removed.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
