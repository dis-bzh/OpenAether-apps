apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    # PAS de istio.io/dataplane-mode: ambient — cert-manager fabrique les certs,
    # il ne peut pas dépendre d'un mesh qui dépend de lui. En ambient, ses appels
    # vers OpenBao (8200) partaient en HBONE/15008, bloqués par CiliumNetworkPolicy
    # + default-deny → "connection reset / context deadline exceeded".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: "cert-manager"
