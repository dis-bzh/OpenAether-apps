apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    # NO istio.io/dataplane-mode: ambient — cert-manager makes the certificates,
    # it cannot depend on a mesh that depends on it. Under ambient its calls to
    # OpenBao (8200) went over HBONE/15008, blocked by CiliumNetworkPolicy
    # + default-deny → "connection reset / context deadline exceeded".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: "cert-manager"
