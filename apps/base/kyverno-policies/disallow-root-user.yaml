apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-runasnonroot
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-outscale-system  # isolated CAPOSC provider (upstream collisions)
              - capi-operator-system
              - cnpg-system
              - cert-manager
              # Istio mesh: upstream charts (istiod, ztunnel) that do not set
              # runAsNonRoot:true explicitly and require network privileges.
              - istio-system
              - foundation-service-mesh
              # Istio Gateway: istiod AUTO-generates the Envoy Deployment
              # (openaether-gateway-istio), which does not set runAsNonRoot:true →
              # blocked → Gateway never Programmed (no Envoy/LB), seen on Scaleway June 2026.
              - services-gateway
              # Observability : charts upstream Grafana/Loki/Alloy/KSM/node-exporter/
              # vm-operator. node-exporter (hostPath/hostNetwork) legitimately runs as
              # root; the others do not all set runAsNonRoot:true explicitly →
              # admission rejection (6 HelmReleases stuck in "Helm install failed",
              # seen on Scaleway June 2026). A broad exclusion to unblock monitoring.
              # Pass 2 (hardening): tighten through the Helm securityContexts where
              # the chart allows it (Grafana can run non-root) rather than excluding.
              - services-observability
      validate:
        # EITHER form, not both. Kubernetes' own "restricted" Pod Security
        # Standard is satisfied when runAsNonRoot is set on the pod OR on every
        # container — the pod-level field is only a default for containers that
        # say nothing. Requiring both rejected workloads that are exactly as
        # safe, and the namespace exclusion list above is what that cost: every
        # entry is the same over-strict pattern worked around once more.
        #
        # It also hid a failure that only appears on the SECOND scheduling.
        # external-secrets sets runAsNonRoot on each container and nothing on the
        # pod. Its pods were admitted at bootstrap, before Kyverno enforced, and
        # were denied when the nodes rebooted during a Talos upgrade — taking
        # twelve Kustomizations down with them. Measured on Scaleway 2026-08-14.
        # A cluster that cannot survive a reboot is not a working cluster.
        #
        # ⚠️ initContainers are not covered, here or before this change.
        message: >-
          Running as root is not allowed. Set runAsNonRoot: true on the pod
          securityContext, or on every container's.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
              - securityContext:
                  runAsNonRoot: true
