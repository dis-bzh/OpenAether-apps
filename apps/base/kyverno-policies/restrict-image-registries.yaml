# OpenAether 0.5.0 — Restrict Image Registries
# Reports images from outside the allowed registries and organisations (Audit: nothing is blocked yet).
# A public registry is not a trust boundary, its organisations are: the list is per organisation.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images must come from known registries. Blocks docker.io default
      and unknown registries.
spec:
  validationFailureAction: Audit
  # Enforce only in a namespace carrying the label below (docs/kyverno-enforcement.md); none does, so every namespace
  # stays in Audit. Kyverno spells it here, per policy (`validate.failureActionOverrides` is 1.13+).
  # Rollback: remove the label.
  validationFailureActionOverrides:
    - action: Enforce
      namespaceSelector:
        matchLabels:
          kyverno.openaether.io/enforce-restrict-image-registries: "true"
  background: true
  rules:
    - name: validate-registries
      match:
        any:
        - resources:
            kinds:
              - Pod
            # CREATE only: an update of a pod that already runs (label patch, finalizer) is never denied by Enforce.
            operations:
              - CREATE
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
      validate:
        message: >-
          Image registry not allowed. Allowed: the organisations this platform runs, on ghcr.io (cloudnative-pg,
          external-secrets, fluxcd, kyverno, zitadel), reg.kyverno.io (kyverno), quay.io (cilium, jetstack, kiwigrid,
          orc, prometheus, prometheus-operator), all of registry.k8s.io and, on Docker Hub, istio, rancher, kiwigrid,
          grafana, victoriametrics, restic, openbao, alpine, prom and wait4x, plus registry.hub.docker.com/outscale (the
          CAPI Outscale provider). Docker Hub images are written either as docker.io/<org>/<image> or as the short
          <org>/<image> the VictoriaMetrics operator uses. The list is the image inventory of the DAG
          (scripts/dev/gen-sbom.py --helm), org by org: a registry-wide wildcard admits whatever any account on it
          publishes. Still Audit: read the reports before Enforce.
        pattern:
          spec:
            containers:
            - image: "ghcr.io/cloudnative-pg/* | ghcr.io/external-secrets/* | ghcr.io/fluxcd/* | ghcr.io/kyverno/* | reg.kyverno.io/kyverno/* | ghcr.io/zitadel/* | quay.io/cilium/* | quay.io/jetstack/* | quay.io/kiwigrid/* | quay.io/orc/* | quay.io/prometheus/* | quay.io/prometheus-operator/* | registry.k8s.io/* | docker.io/istio/* | docker.io/rancher/* | docker.io/kiwigrid/* | docker.io/grafana/* | docker.io/victoriametrics/* | docker.io/restic/* | docker.io/openbao/* | docker.io/alpine/* | docker.io/prom/* | docker.io/wait4x/* | registry.hub.docker.com/outscale/* | istio/* | rancher/* | kiwigrid/* | grafana/* | victoriametrics/* | restic/* | openbao/* | alpine/* | prom/* | wait4x/*"  # yamllint disable-line rule:line-length
            # Conditional anchor: initContainers is optional (#47).
            =(initContainers):
            - image: "ghcr.io/cloudnative-pg/* | ghcr.io/external-secrets/* | ghcr.io/fluxcd/* | ghcr.io/kyverno/* | reg.kyverno.io/kyverno/* | ghcr.io/zitadel/* | quay.io/cilium/* | quay.io/jetstack/* | quay.io/kiwigrid/* | quay.io/orc/* | quay.io/prometheus/* | quay.io/prometheus-operator/* | registry.k8s.io/* | docker.io/istio/* | docker.io/rancher/* | docker.io/kiwigrid/* | docker.io/grafana/* | docker.io/victoriametrics/* | docker.io/restic/* | docker.io/openbao/* | docker.io/alpine/* | docker.io/prom/* | docker.io/wait4x/* | registry.hub.docker.com/outscale/* | istio/* | rancher/* | kiwigrid/* | grafana/* | victoriametrics/* | restic/* | openbao/* | alpine/* | prom/* | wait4x/*"  # yamllint disable-line rule:line-length
