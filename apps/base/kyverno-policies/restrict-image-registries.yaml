# OpenAether 0.5.0 — Restrict Image Registries
# Forbids images from outside the allowed registries.
# Prevents pulling unverified or compromised images.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images must come from known registries. Blocks docker.io default
      and unknown registries.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
      validate:
        message: >-
          Image registry not allowed. Allowed: ghcr.io, quay.io,
          registry.k8s.io, docker.io/istio, docker.io/rancher,
          docker.io/kiwigrid, gcr.io, docker.io/grafana,
          docker.io/registry.k8s.io, docker.io/victoriametrics,
          docker.io/restic, docker.io/openbao, docker.io/alpine.
        pattern:
          spec:
            containers:
            - image: "ghcr.io/* | quay.io/* | registry.k8s.io/* | docker.io/istio/* | docker.io/rancher/* | docker.io/kiwigrid/* | gcr.io/* | docker.io/grafana/* | docker.io/registry.k8s.io/* | docker.io/victoriametrics/* | docker.io/restic/* | docker.io/openbao/* | docker.io/alpine/*"  # yamllint disable-line rule:line-length
            initContainers:
            - image: "ghcr.io/* | quay.io/* | registry.k8s.io/* | docker.io/istio/* | docker.io/rancher/* | docker.io/kiwigrid/* | gcr.io/* | docker.io/grafana/* | docker.io/registry.k8s.io/* | docker.io/victoriametrics/* | docker.io/restic/* | docker.io/openbao/* | docker.io/alpine/*"  # yamllint disable-line rule:line-length
