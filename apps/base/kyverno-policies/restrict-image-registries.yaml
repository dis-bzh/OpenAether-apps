# OpenAether 0.5.0 — Restrict Image Registries
# Forbids images from outside the allowed registries.
# Prevents pulling unverified or compromised images.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images must come from known registries. Blocks docker.io default
      and unknown registries.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
      validate:
        message: >-
          Image registry not allowed. Allowed: ghcr.io, quay.io, registry.k8s.io, gcr.io and, on Docker Hub, the
          organisations istio, rancher, kiwigrid, grafana, victoriametrics, restic, openbao, alpine and prom, written
          either as docker.io/<org>/<image> or as the short <org>/<image> the VictoriaMetrics operator uses.
        pattern:
          spec:
            containers:
            - image: "ghcr.io/* | quay.io/* | registry.k8s.io/* | gcr.io/* | docker.io/istio/* | docker.io/rancher/* | docker.io/kiwigrid/* | docker.io/grafana/* | docker.io/registry.k8s.io/* | docker.io/victoriametrics/* | docker.io/restic/* | docker.io/openbao/* | docker.io/alpine/* | docker.io/prom/* | istio/* | rancher/* | kiwigrid/* | grafana/* | victoriametrics/* | restic/* | openbao/* | alpine/* | prom/*"  # yamllint disable-line rule:line-length
            # Conditional anchor: initContainers is optional (#47).
            =(initContainers):
            - image: "ghcr.io/* | quay.io/* | registry.k8s.io/* | gcr.io/* | docker.io/istio/* | docker.io/rancher/* | docker.io/kiwigrid/* | docker.io/grafana/* | docker.io/registry.k8s.io/* | docker.io/victoriametrics/* | docker.io/restic/* | docker.io/openbao/* | docker.io/alpine/* | docker.io/prom/* | istio/* | rancher/* | kiwigrid/* | grafana/* | victoriametrics/* | restic/* | openbao/* | alpine/* | prom/*"  # yamllint disable-line rule:line-length
