# restrict-capabilities for ephemeral containers (`kubectl debug`). Own policy:
# Kyverno 1.12.1 refuses a policy that matches a subresource with background scanning on (found when Flux applied it
# on a real cluster, lab 11), and the Pod rule wants it on.
# An ephemeral container only ever exists as an UPDATE of a running pod, so a background scan has nothing to report.
# For the same reason the match lists UPDATE: with no `operations` Kyverno registers CREATE only on the webhook and
# `kubectl debug` (an UPDATE of pods/ephemeralcontainers) was admitted unseen (lab 11, both providers).
# The same namespace label flips both (kyverno.openaether.io/enforce-restrict-capabilities).
# Two rules instead of validationFailureActionOverrides: Kyverno 1.19.1 does not apply a namespaceSelector override to
# the
# ephemeralcontainers subresource (admitted with a warning in a labelled namespace; lab 12). A namespaceSelector in
# `match`
# and the rule-level failureAction do work there.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-capabilities-ephemeral
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Restrict Capabilities (ephemeral containers)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      An ephemeral container (kubectl debug) must not add a sensitive capability either; see restrict-capabilities.
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: deny-sensitive-capabilities-ephemeral
      match:
        any:
        - resources:
            kinds:
              # A plain Pod match does not register the ephemeralcontainers subresource with the webhook.
              - Pod/ephemeralcontainers
            operations:
              - CREATE
              - UPDATE
      exclude:
        any:
        # Namespaces that enforce are handled by the next rule.
        - resources:
            namespaceSelector:
              matchLabels:
                kyverno.openaether.io/enforce-restrict-capabilities: "true"
        # Single-purpose system namespaces: Cilium and the CNI agents, Longhorn, local-path, the CAPI controllers.
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
              - capi-outscale-system
        # ztunnel adds NET_ADMIN, SYS_ADMIN and NET_RAW by design; the Istio CNI agent installs the redirection rules.
        - resources:
            namespaces:
              - istio-system
              - foundation-service-mesh
            names:
              - "ztunnel-*"
              - "istio-cni-node-*"
      validate:
        failureAction: Audit
        message: >-
          A sensitive capability is added (capabilities.add). Drop ALL and add back only what the process needs;
          NET_BIND_SERVICE is the usual one.
        foreach:
          - list: request.object.spec.ephemeralContainers[] || `[]`
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.capabilities.add[] || `[]` }}"
                    operator: AnyIn
                    value:
                      - ALL
                      - AUDIT_CONTROL
                      - BPF
                      - CHECKPOINT_RESTORE
                      - DAC_READ_SEARCH
                      - IPC_LOCK
                      - MAC_ADMIN
                      - MAC_OVERRIDE
                      - MKNOD
                      - NET_ADMIN
                      - NET_RAW
                      - PERFMON
                      - SYS_ADMIN
                      - SYS_BOOT
                      - SYS_MODULE
                      - SYS_PTRACE
                      - SYS_RAWIO
                      - SYS_TIME
    - name: deny-sensitive-capabilities-ephemeral-enforce
      match:
        any:
        - resources:
            kinds:
              # A plain Pod match does not register the ephemeralcontainers subresource with the webhook.
              - Pod/ephemeralcontainers
            operations:
              - CREATE
              - UPDATE
            namespaceSelector:
              matchLabels:
                kyverno.openaether.io/enforce-restrict-capabilities: "true"
      exclude:
        any:
        # Single-purpose system namespaces: Cilium and the CNI agents, Longhorn, local-path, the CAPI controllers.
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
              - capi-outscale-system
        # ztunnel adds NET_ADMIN, SYS_ADMIN and NET_RAW by design; the Istio CNI agent installs the redirection rules.
        - resources:
            namespaces:
              - istio-system
              - foundation-service-mesh
            names:
              - "ztunnel-*"
              - "istio-cni-node-*"
      validate:
        failureAction: Enforce
        message: >-
          A sensitive capability is added (capabilities.add). Drop ALL and add back only what the process needs;
          NET_BIND_SERVICE is the usual one.
        foreach:
          - list: request.object.spec.ephemeralContainers[] || `[]`
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.capabilities.add[] || `[]` }}"
                    operator: AnyIn
                    value:
                      - ALL
                      - AUDIT_CONTROL
                      - BPF
                      - CHECKPOINT_RESTORE
                      - DAC_READ_SEARCH
                      - IPC_LOCK
                      - MAC_ADMIN
                      - MAC_OVERRIDE
                      - MKNOD
                      - NET_ADMIN
                      - NET_RAW
                      - PERFMON
                      - SYS_ADMIN
                      - SYS_BOOT
                      - SYS_MODULE
                      - SYS_PTRACE
                      - SYS_RAWIO
                      - SYS_TIME
