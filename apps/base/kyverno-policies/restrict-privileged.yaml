# OpenAether 0.5.0 — Restrict Privileged Containers
# Forbids privileged, hostNetwork, hostPID and hostIPC pods.
# Exclusions: namespaces where legitimate workloads need it
# (longhorn, istio-cni, capi, local-path, node-exporter).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-privileged
  annotations:
    policies.kyverno.io/title: Restrict Privileged Containers
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers, hostNetwork, hostPID and hostIPC are prohibited
      except in system namespaces where they are required.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privileged
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
              - services-observability
              - foundation-service-mesh
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
            - =(securityContext):
                =(privileged): false
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
    - name: deny-hostpath
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
        # The only workloads that legitimately mount host paths outside those namespaces, named rather than their whole
        # namespace so that a new hostPath pod next to them is still flagged (#47): node-exporter (/proc, /sys, /),
        # ztunnel and the Istio CNI agent (the CNI socket and binaries).
        - resources:
            namespaces:
              - services-observability
            names:
              - "*node-exporter*"
        - resources:
            namespaces:
              - foundation-service-mesh
            names:
              - "ztunnel-*"
              - "istio-cni-node-*"
      validate:
        message: "HostPath volumes are not allowed."
        pattern:
          spec:
            # Kyverno's own form: volumes is optional, and when present no entry may carry a hostPath.
            =(volumes):
            - X(hostPath): "null"
