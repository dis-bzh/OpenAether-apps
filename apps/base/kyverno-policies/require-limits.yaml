# A memory limit on every container (ANSSI FT082 R10 in part). Informational: a limit chosen blind OOM-kills the
# workload, so this reports and the values are set from measured usage. Memory only; no CPU limit (throttling).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Require Memory Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A container without a memory limit can take the whole node's memory. Informational.
spec:
  validationFailureAction: Audit
  # Enforce only in a namespace carrying the label below (docs/kyverno-enforcement.md); none does, so every namespace
  # stays in Audit. Kyverno 1.12 spells it here, per policy (`validate.failureActionOverrides` is 1.13+).
  # Rollback: remove the label.
  validationFailureActionOverrides:
    - action: Enforce
      namespaceSelector:
        matchLabels:
          kyverno.openaether.io/enforce-require-limits: "true"
  background: true
  rules:
    - name: check-memory-limit
      match:
        any:
        - resources:
            kinds:
              - Pod
            # CREATE only: an update of a pod that already runs (label patch, finalizer) is never denied by Enforce.
            operations:
              - CREATE
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
              - capi-outscale-system
      validate:
        message: "resources.limits.memory should be set on every container."
        pattern:
          spec:
            containers:
            - resources:
                limits:
                  memory: "?*"
            =(initContainers):
            - resources:
                limits:
                  memory: "?*"
