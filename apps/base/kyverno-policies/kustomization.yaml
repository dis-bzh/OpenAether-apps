apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every ClusterPolicy lives HERE, never alongside the operator: a Kustomization
# holding both the CRDs and their CRs is rejected while the CRDs do not exist
# (disallow-root-user sat in apps/base/kyverno until 2026-07-28).
resources:
  - disallow-root-user.yaml
  - block-default-ns.yaml
  - require-security-context.yaml
  - restrict-privileged.yaml
  - restrict-image-registries.yaml
