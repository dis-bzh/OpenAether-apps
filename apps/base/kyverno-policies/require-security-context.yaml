# OpenAether 0.5.0 — Require SecurityContext on all containers
# Blocks any pod without a container-level securityContext.
# Exclusions: namespaces privileged (longhorn, istio-cni, capi, local-path)
# where the workloads legitimately need privileges.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-security-context
  annotations:
    policies.kyverno.io/title: Require SecurityContext
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must have a securityContext with runAsNonRoot, drop ALL caps,
      allowPrivilegeEscalation:false, and seccompProfile RuntimeDefault.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-container-security-context
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - longhorn-system
              - local-path-storage
              - capi-system
              - orc-system
              - capi-operator-system
      validate:
        message: >-
          Containers must have securityContext: runAsNonRoot=true,
          allowPrivilegeEscalation=false, capabilities.drop=["ALL"],
          seccompProfile.type=RuntimeDefault.
        pattern:
          spec:
            containers:
            - securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
            # Conditional anchor: a pod WITHOUT initContainers is compliant. Written bare, the key itself
            # was required and 13 of the pods measured on a fresh cluster failed only there (#47).
            =(initContainers):
            - securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
