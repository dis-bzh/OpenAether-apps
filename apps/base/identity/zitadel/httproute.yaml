# OpenAether — HTTPRoute Zitadel → openaether-gateway
# parentRef: openaether-gateway (Istio, ns services-gateway, from: All).
# Zitadel parle gRPC/HTTP2 en clair (h2c) ; TLS terminé à la Gateway.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
      namespace: services-gateway
  hostnames:
    - "zitadel.openaether.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 8080
