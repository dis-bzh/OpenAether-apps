# Zitadel namespace — deliberately OUTSIDE the ambient mesh, like the foundation.
#
# An IdP is a ROOT OF TRUST: it must not depend on the mesh it helps secure.
# Circular bootstrap (ztunnel must run for the IdP to start), and ztunnel
# intercepts the kubelet probes → HBONE → dropped by the L4 CNP → startupProbe
# timeout → CrashLoopBackOff (seen on Scaleway, same trap as the foundation).
#
# Zero-trust still holds without it: WireGuard east-west, L3/L4 CNP
# (networkpolicy.yaml), and Zitadel's own OIDC. The mesh would only add
# east-west mTLS on the IdP — marginal, since north-south TLS terminates at the
# Gateway and consumers validate JWTs.
#
# baseline (not restricted): the chart needs a few tolerances; tighten later.
apiVersion: v1
kind: Namespace
metadata:
  name: services-identity
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/component: zitadel
