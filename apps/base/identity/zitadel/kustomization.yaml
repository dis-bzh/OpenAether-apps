apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenAether — Zitadel (identity). The services-identity namespace is declared
# HERE (not in apps/base/namespaces/) because no early layer targets it before
# the `identity` Flux Kustomization (step 35). The zitadel-db CNPG Postgres backend
# lives in apps/base/cnpg/ (foundation-databases).
# NB: NO Istio AuthorizationPolicy — services-identity is OUTSIDE the mesh (ztunnel
# does not intercept → an AuthorizationPolicy would be inert there, security theatre).
# Network security comes from the L3/L4 CiliumNetworkPolicy (networkpolicy.yaml).
resources:
  - namespace.yaml
  - externalsecrets.yaml
  - helmrelease.yaml
  - httproute.yaml
  - networkpolicy.yaml
