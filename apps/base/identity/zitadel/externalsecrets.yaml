# OpenAether — Secrets Zitadel depuis OpenBao (via ESO)
# ──────────────────────────────────────────────────────────────────────────
# Seeding: vault/bootstrap-roles-job.yaml step 10 generates in OpenBao:
#   secret/zitadel/masterkey  → { masterkey } (EXACTEMENT 32 octets)
#   secret/zitadel/db         → { username, password }
#
# Two Secrets consumed by the Zitadel chart:
#   1. zitadel-masterkey       → masterkeySecretName (key `masterkey`)
#   2. zitadel-secret-config   → configSecretName (key `config-yaml`)
#      SECRET config YAML (DB passwords) merged on top of configmapConfig.
#      ESO assembles that YAML through a template from the OpenBao password.

# ── Masterkey (32 octets) ──────────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel/masterkey
        property: masterkey

# ── Secret config (DB password) → the config-yaml key ────────────────────────
# The password serves both the application user and the admin (init/setup);
# both point at the `zitadel` CNPG role (see configmap.yaml).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secret-config
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-secret-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ .password }}"
              Admin:
                Password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: zitadel/db
        property: password
