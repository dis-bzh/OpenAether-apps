# Zitadel secrets from OpenBao (through ESO)
# ──────────────────────────────────────────────────────────────────────────
# Seeding: vault/scripts/configure.sh (application_secrets) creates in OpenBao:
#   secret/zitadel/masterkey  → { masterkey } (EXACTLY 32 bytes)
#   secret/zitadel/db         → { username, password }
#   secret/zitadel/admin      → { username, password } the first human admin (read ONCE, at instance creation)
#   secret/zitadel/session-cookie → { secret } signs the login UI's session cookie (48 characters, 32 at least)
#
# Three Secrets consumed by the Zitadel chart:
#   1. zitadel-masterkey       → masterkeySecretName (key `masterkey`)
#   2. zitadel-secret-config   → configSecretName (key `config-yaml`)
#      SECRET config YAML (DB passwords, the first admin's password) merged on top of configmapConfig.
#      ESO assembles that YAML through a template from the OpenBao values.
#   3. zitadel-login-session-cookie → login.sessionCookieSecretName (key `ZITADEL_SESSION_COOKIE_SECRET`)

# ── Masterkey (32 bytes) ──────────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel/masterkey
        property: masterkey

# ── Secret config (DB password, first admin password) → the config-yaml key ──
# The DB password serves both the application user and the admin (init/setup);
# both point at the `zitadel` CNPG role (see configmapConfig in helmrelease.yaml).
# The first admin's password is read by the setup Job on an EMPTY database only (FirstInstance): on an
# initialised instance it changes nothing, and the OpenBao value is the INITIAL password, not the current one.
# If secret/zitadel/admin does not exist yet (a cluster seeded before this key existed), this ExternalSecret
# reports SecretSyncedError and the Secret is expected to keep its previous content (External Secrets does not
# rewrite a target it cannot fill), so Zitadel is untouched. Run the configure Job (create only) to seed the
# key, docs/zitadel-hardening.md.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secret-config
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-secret-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ .password }}"
              Admin:
                Password: "{{ .password }}"
          FirstInstance:
            Org:
              Human:
                Password: "{{ .adminpw }}"
  data:
    - secretKey: password
      remoteRef:
        key: zitadel/db
        property: password
    - secretKey: adminpw
      remoteRef:
        key: zitadel/admin
        property: password

# ── Login UI session cookie secret ────────────────────────────────────────
# Zitadel v4.19.5 asks that ZITADEL_SESSION_COOKIE_SECRET is random and not an example value. One entry (or a
# comma-separated list for a rotation: "new,old"), 32 characters at least, else the login reports not ready.
# Seeded by configure.sh (create only). A cluster that predates it needs the configure Job run BEFORE this change
# reaches the login pods (docs/zitadel-hardening.md): without the OpenBao key the Secret does not exist and the
# new login pods wait in CreateContainerConfigError while the old ones keep serving.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-session-cookie
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-login-session-cookie
    creationPolicy: Owner
  data:
    - secretKey: ZITADEL_SESSION_COOKIE_SECRET
      remoteRef:
        key: zitadel/session-cookie
        property: secret
