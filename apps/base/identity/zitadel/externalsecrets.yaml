# OpenAether — Secrets Zitadel depuis OpenBao (via ESO)
# ──────────────────────────────────────────────────────────────────────────
# Seeding : vault/bootstrap-roles-job.yaml step 10 génère dans OpenBao :
#   secret/zitadel/masterkey  → { masterkey } (EXACTEMENT 32 octets)
#   secret/zitadel/db         → { username, password }
#
# Deux Secrets consommés par le chart Zitadel :
#   1. zitadel-masterkey       → masterkeySecretName (clé `masterkey`)
#   2. zitadel-secret-config   → configSecretName (clé `config-yaml`)
#      YAML de config SECRÈTE (mots de passe DB) fusionné par-dessus configmapConfig.
#      ESO assemble ce YAML via template à partir du password OpenBao.

# ── Masterkey (32 octets) ──────────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel/masterkey
        property: masterkey

# ── Config secrète (mot de passe DB) → clé config-yaml ──────────────────────
# Le mot de passe sert à la fois pour l'utilisateur applicatif et l'admin (init/
# setup) ; tous deux pointent sur le rôle CNPG `zitadel` (cf. configmap.yaml).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secret-config
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-secret-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ .password }}"
              Admin:
                Password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: zitadel/db
        property: password
