# OpenAether — Zitadel (sovereign identity / IAM)
# ──────────────────────────────────────────────────────────────────────────
# Chart officiel Zitadel. Backend Postgres = CNPG zitadel-db (foundation-databases,
# 3 HA instances). TLS terminated upstream by the Istio Gateway → Zitadel serves h2c
# (TLS.Enabled=false, ExternalSecure=true). Masterkey + password DB via ESO/OpenBao.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  url: https://charts.zitadel.com
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: "10.0.2"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: services-identity
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 2

    # ── Images: we keep the chart defaults (NO global imageRegistry) ──────────
    # TRAP (Scaleway, June 2026): `imageRegistry: ghcr.io` is GLOBAL → it prefixes
    # EVERY image, including the `alpine/k8s` kubectl helper → `ghcr.io/alpine/k8s`,
    # which DOES NOT EXIST on ghcr.io → 403 Forbidden → the setupJob (machinekey/pat)
    # goes ImagePullBackOff → the Helm install hangs. The chart defaults pull:
    #   ghcr.io/zitadel/zitadel(-login)  (OK), docker.io/alpine/k8s (helper kubectl),
    #   docker.io/wait4x/wait4x:3.6      (initContainer wait-for-zitadel).
    # Kyverno restrict-image-registries est en Audit (non bloquant) → docker.io/*
    # is only reported, not refused — exactly like openbao-init/bootstrap
    # (docker.io/alpine/k8s), which already run. If Kyverno ever goes Enforce,
    # mirror those 2 images to an allowed registry through tools.{kubectl,wait4x}.image.
    #
    # tools.kubectl.image.tag left empty defaults to the cluster's own
    # Kubernetes version (chart default) — broke live 2026-07-30 on v1.36.3:
    # alpine/k8s had only published up to 1.36.2, so the setup Job's kubectl
    # helper went ImagePullBackOff on a tag that doesn't exist yet upstream.
    # Pinned explicitly instead of auto-derived.
    tools:
      kubectl:
        image:
          # renovate: datasource=docker depName=alpine/k8s
          tag: "1.36.2"

    # ── securityContext conforme Kyverno (global / fallback) ─────────────────
    # Used as-is by the initJob/setupJob containers (a direct reference to
    # .Values.securityContext in the chart templates).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zitadel
              topologyKey: kubernetes.io/hostname

    zitadel:
      # Masterkey (32 bytes) from the ESO Secret — never in cleartext in the chart.
      masterkeySecretName: zitadel-masterkey
      # Secret config (DB password) merged on top of configmapConfig.
      configSecretName: zitadel-secret-config
      configSecretKey: config-yaml

      # Explicit securityContext on the Deployment's main container.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # NON-secret config (ConfigMap). The keys follow Zitadel's config tree.
      configmapConfig:
        ExternalDomain: zitadel.openaether.local
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          # TLS terminated upstream by the Istio Gateway → Zitadel serves cleartext (h2c).
          Enabled: false
        Database:
          Postgres:
            Host: zitadel-db-rw.foundation-databases.svc.cluster.local
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: zitadel
              SSL:
                Mode: disable

    # init/setup Jobs (schema + key creation). Enabled by default.
    # Images at the chart defaults (see the Images block at the top of the values).
    initJob:
      enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    setupJob:
      enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

    # Startup probe: leave headroom for the cold start (DB migrations).
    startupProbe:
      periodSeconds: 10
      failureThreshold: 30

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    metrics:
      enabled: true

    pdb:
      enabled: true
      minAvailable: 1
