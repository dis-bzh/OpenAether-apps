# OpenAether — Zitadel (identité / IAM souverain)
# ──────────────────────────────────────────────────────────────────────────
# Chart officiel Zitadel. Backend Postgres = CNPG zitadel-db (foundation-databases,
# 3 instances HA). TLS terminé en amont par la Gateway Istio → Zitadel sert h2c
# (TLS.Enabled=false, ExternalSecure=true). Masterkey + password DB via ESO/OpenBao.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  url: https://charts.zitadel.com
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: "10.0.2"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: services-identity
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 2

    # ── Images : on garde les défauts du chart (PAS de imageRegistry global) ──
    # PIÈGE (Scaleway juin 2026) : `imageRegistry: ghcr.io` est GLOBAL → il préfixe
    # TOUTES les images, dont le helper kubectl `alpine/k8s` → `ghcr.io/alpine/k8s`
    # qui N'EXISTE PAS sur ghcr.io → 403 Forbidden → setupJob (machinekey/pat) en
    # ImagePullBackOff → install Helm bloquée. Les défauts du chart tirent :
    #   ghcr.io/zitadel/zitadel(-login)  (OK), docker.io/alpine/k8s (helper kubectl),
    #   docker.io/wait4x/wait4x:3.6      (initContainer wait-for-zitadel).
    # Kyverno restrict-image-registries est en Audit (non bloquant) → docker.io/*
    # est seulement signalé, pas refusé — exactement comme openbao-init/bootstrap
    # (docker.io/alpine/k8s) qui tournent déjà. Si Kyverno passe en Enforce un jour,
    # miroir ces 2 images sur un registre autorisé via tools.{kubectl,wait4x}.image.

    # ── securityContext conforme Kyverno (global / fallback) ─────────────────
    # Utilisé tel quel par les containers des initJob/setupJob (référence
    # directe à .Values.securityContext dans les templates du chart).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zitadel
              topologyKey: kubernetes.io/hostname

    zitadel:
      # Masterkey (32 octets) depuis le Secret ESO — pas en clair dans le chart.
      masterkeySecretName: zitadel-masterkey
      # Config secrète (password DB) fusionnée par-dessus configmapConfig.
      configSecretName: zitadel-secret-config
      configSecretKey: config-yaml

      # securityContext explicite sur le container principal du Deployment.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Config NON secrète (ConfigMap). Les keys suivent l'arbre de config Zitadel.
      configmapConfig:
        ExternalDomain: zitadel.openaether.local
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          # TLS terminé par la Gateway Istio en amont → Zitadel sert en clair (h2c).
          Enabled: false
        Database:
          Postgres:
            Host: zitadel-db-rw.foundation-databases.svc.cluster.local
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: zitadel
              SSL:
                Mode: disable

    # Jobs d'init/setup (création schéma + clés). Activés par défaut.
    # Images aux défauts du chart (cf. bloc Images en tête des values).
    initJob:
      enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    setupJob:
      enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

    # Startup probe : laisser de la marge pour le cold start (migrations DB).
    startupProbe:
      periodSeconds: 10
      failureThreshold: 30

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    metrics:
      enabled: true

    pdb:
      enabled: true
      minAvailable: 1
