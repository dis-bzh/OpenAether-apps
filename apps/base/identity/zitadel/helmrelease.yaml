# OpenAether — Zitadel (sovereign identity / IAM)
# ──────────────────────────────────────────────────────────────────────────
# Chart officiel Zitadel. Backend Postgres = CNPG zitadel-db (foundation-databases,
# 3 HA instances). TLS terminated upstream by the Istio Gateway → Zitadel serves h2c
# (TLS.Enabled=false, ExternalSecure=true). Masterkey + password DB via ESO/OpenBao.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  url: https://charts.zitadel.com
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: "10.0.2"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: services-identity
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Zitadel's server and login pods never call the Kubernetes API
  # (only the setup Job does, and its pod spec is not touched).
  # The chart has no automount value, hence the post-renderer. Rollback: delete this block.
  # Addresses FT082-R12 and NSA12-POD-06.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
  values:
    replicaCount: 2

    # ── Images: we keep the chart defaults (NO global imageRegistry) ──────────
    # TRAP (Scaleway, June 2026): `imageRegistry: ghcr.io` is GLOBAL → it prefixes
    # EVERY image, including the `alpine/k8s` kubectl helper → `ghcr.io/alpine/k8s`,
    # which DOES NOT EXIST on ghcr.io → 403 Forbidden → the setupJob (machinekey/pat)
    # goes ImagePullBackOff → the Helm install hangs. The chart defaults pull:
    #   ghcr.io/zitadel/zitadel(-login)  (OK), docker.io/alpine/k8s (helper kubectl),
    #   docker.io/wait4x/wait4x:3.6      (initContainer wait-for-zitadel).
    # Kyverno restrict-image-registries is in Audit (non-blocking). alpine/* and the tagged image
    # wait4x/wait4x are on its allow-list (an untagged or digest reference would be reported again,
    # see kyverno-policies/restrict-image-registries.yaml): when the chart changes either image,
    # read the policy report. To take them off Docker Hub, mirror them through
    # tools.{kubectl,wait4x}.image.
    #
    # tools.kubectl.image.tag left empty defaults to the cluster's own
    # Kubernetes version (chart default) — broke live 2026-07-30 on v1.36.3:
    # alpine/k8s had only published up to 1.36.2, so the setup Job's kubectl
    # helper went ImagePullBackOff on a tag that doesn't exist yet upstream.
    # Pinned explicitly instead of auto-derived.
    tools:
      kubectl:
        image:
          # renovate: datasource=docker depName=alpine/k8s
          tag: "1.37.1"
      # The readiness-wait init container of the login pods had no limit (Kyverno require-limits, lab 11).
      wait4x:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi

    # The login UI had no limit at all (the `resources:` below are the server's). Measured 191 Mi on a lab cluster.
    login:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # ── securityContext conforme Kyverno (global / fallback) ─────────────────
    # Used as-is by the initJob/setupJob containers (a direct reference to
    # .Values.securityContext in the chart templates).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zitadel
              topologyKey: kubernetes.io/hostname

    zitadel:
      # Masterkey (32 bytes) from the ESO Secret — never in cleartext in the chart.
      masterkeySecretName: zitadel-masterkey
      # Secret config (DB password) merged on top of configmapConfig.
      configSecretName: zitadel-secret-config
      configSecretKey: config-yaml

      # Explicit securityContext on the Deployment's main container.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # NON-secret config (ConfigMap). The keys follow Zitadel's config tree.
      configmapConfig:
        ExternalDomain: zitadel.openaether.local
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          # TLS terminated upstream by the Istio Gateway → Zitadel serves cleartext (h2c).
          Enabled: false
        Database:
          Postgres:
            Host: zitadel-db-rw.foundation-databases.svc.cluster.local
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            User:
              Username: zitadel
              SSL:
                # `require` = encrypted, server not authenticated: CNPG serves TLS (self-signed CA) and
                # needs no CA mounted. verify-full is a later step. Rollback: `disable`.
                Mode: require
            Admin:
              Username: zitadel
              SSL:
                Mode: require

        # ── Authentication policy (ANSSI PA-079, PG-078, docs/zitadel-hardening.md) ─────────────────────────────
        # TWO scopes, and the difference is the whole risk of this block:
        #   * FirstInstance and DefaultInstance.* are read ONCE, when the instance is created (the setup Job on
        #     an empty database). On a cluster whose Zitadel is already initialised they change NOTHING:
        #     docs/zitadel-hardening.md has the Admin API calls (scripts/zitadel-apply-policies.py) that apply
        #     the same policies to a running instance.
        #   * SystemDefaults.* and Log* are read at every start, so they apply to a running instance at the next
        #     rollout.
        # The first admin's PASSWORD is not here: it comes from OpenBao (zitadel-secret-config), merged on top.
        FirstInstance:
          Org:
            Human:
              # The upstream default is Password1!. Forced to change at the first login, which also enrols MFA.
              PasswordChangeRequired: true
        DefaultInstance:
          PasswordComplexityPolicy:
            # ANSSI PA-079 R21: at least 15 characters for a strong-to-very-strong level (admin accounts).
            MinLength: 15
            HasLowercase: true
            HasUppercase: true
            HasNumber: true
            HasSymbol: true
          LockoutPolicy:
            # R10. The default is 0 (no limit). The break-glass if the only human admin is locked out is the
            # iam-admin machine user (secret iam-admin-pat), see docs/zitadel-hardening.md.
            MaxPasswordAttempts: 5
            MaxOTPAttempts: 5
          LoginPolicy:
            # No self-registration: with the default (true) anyone who reaches the login page can create an
            # account, and Grafana turns every account into a Viewer of all logs.
            AllowRegister: false
            # R1/R2: a second factor for everybody. OTP or WebAuthn (no SMS provider is configured; R8).
            ForceMFA: true
            # No identity provider is configured; adding one is a decision, not a default.
            AllowExternalIDP: false
            # R12: a password / federated login counts for 12 h (default 10 days), not for a week and a half.
            PasswordCheckLifetime: 12h
            ExternalLoginCheckLifetime: 12h
          OIDCSettings:
            # R12. All four are required together (Zitadel refuses a partial block). Grafana opens its own
            # session at login and does not use the refresh token.
            AccessTokenLifetime: 1h
            IdTokenLifetime: 1h
            RefreshTokenIdleExpiration: 168h
            RefreshTokenExpiration: 720h
        # Applies to a RUNNING instance at the next rollout. ANSSI PA-079 R29 asks for a memory-hard function
        # (scrypt or Argon2) for stored passwords; the default is bcrypt. Existing bcrypt hashes keep verifying
        # through `Verifiers` (without it nobody could log in after the switch) and are re-hashed at the next
        # successful login. 32 MiB x 3 passes x 4 threads is Zitadel's own argon2 default: above OWASP's minimum
        # (19 MiB, 2 passes), below RFC 9106's 64 MiB, kept for the 1Gi memory limit (each concurrent hash
        # holds 32 MiB). Raise Memory together with the limit.
        SystemDefaults:
          PasswordHasher:
            Hasher:
              Algorithm: argon2id
              Time: 3
              Memory: 32768
              Threads: 4
            Verifiers:
              - bcrypt
        # Structured logs, and the HTTP access log on stdout (Alloy ships both to Loki): who hit the login and
        # the API, with which status. Authorization, Cookie and Set-Cookie headers are redacted by Zitadel
        # (internal/logstore/record/access.go); the URL keeps its query string, which Alloy scrubs (alloy.yaml).
        # Authentication EVENTS (success, failure, role grants) stay in
        # the eventstore: they are NOT in Loki, see docs/zitadel-hardening.md.
        Log:
          Formatter:
            Format: json
        LogStore:
          Access:
            Stdout:
              Enabled: true

    # init/setup Jobs (schema + key creation). Enabled by default.
    # Images at the chart defaults (see the Images block at the top of the values).
    initJob:
      enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    setupJob:
      enabled: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

    # Startup probe: leave headroom for the cold start (DB migrations).
    startupProbe:
      periodSeconds: 10
      failureThreshold: 30

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    metrics:
      enabled: true

    pdb:
      enabled: true
      minAvailable: 1
