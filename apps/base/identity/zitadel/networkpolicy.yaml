# OpenAether — CiliumNetworkPolicy Zitadel (Zero Trust L3/L4)
# ──────────────────────────────────────────────────────────────────────────
# services-identity est HORS mesh (cf. namespace.yaml) → toute la sécurité réseau
# de Zitadel repose sur CETTE CiliumNetworkPolicy L3/L4 (+ WireGuard niveau nœud
# + l'authN native OIDC de Zitadel). Pas d'AuthorizationPolicy Istio (inerte hors-mesh).
#
# Flux :
#   ingress : probes kubelet + Gateway Istio → Zitadel :8080 ; login :3000
#   egress  : DNS + kube-api (discovery) + CNPG zitadel-db :5432
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  description: "Zitadel: ingress gateway :8080, egress CNPG :5432 + DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  ingress:
    # Probes kubelet/health (startup/readiness/liveness). Hors mesh, la probe vient
    # directement du nœud (entité Cilium `host` / `remote-node` cross-node), PAS via
    # ztunnel. On l'autorise explicitement car la CNP active le default-deny ingress.
    # (En ambient, ztunnel redirigeait la probe via 169.254.7.127/HBONE → DROP L4 →
    # CrashLoopBackOff : c'est la raison du passage hors mesh. Cf. namespace.yaml.)
    # Port 3000 = pod login (http-server), 8080 = zitadel (http2-server).
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    # Gateway Istio (services-gateway) — ingress north-south (UI + API OIDC).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Intra-namespace : le pod login (wait-for-zitadel + runtime) appelle zitadel:8080.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (le chart/jobs peuvent watcher l'API)
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # CNPG PostgreSQL (zitadel-db) — hors mesh, donc Cilium L4 côté DB.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-databases
            cnpg.io/cluster: zitadel-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
