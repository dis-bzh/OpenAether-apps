# OpenAether — CiliumNetworkPolicy Zitadel (Zero Trust L3/L4)
# ──────────────────────────────────────────────────────────────────────────
# services-identity est HORS mesh (cf. namespace.yaml) → toute la sécurité réseau
# de Zitadel repose sur CETTE CiliumNetworkPolicy L3/L4 (+ WireGuard niveau nœud
# + l'authN native OIDC de Zitadel). Pas d'AuthorizationPolicy Istio (inerte hors-mesh).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  description: "Zitadel: ingress gateway :8080, egress CNPG :5432 + DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Intra-namespace : le pod login appelle zitadel:8080 (ingress côté serveur).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-databases
            cnpg.io/cluster: zitadel-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# ──────────────────────────────────────────────────────────────────────────
# Pod login (Next.js, app.kubernetes.io/name: zitadel-login). Sélecteur SÉPARÉ
# car son label diffère de `zitadel`. Sans cette CNP, son egress (DNS + zitadel:8080)
# est bloqué → l'initContainer wait-for-zitadel timeout (exit 124).
#   ingress : probes kubelet :3000 + Gateway Istio :3000 (UI login)
#   egress  : DNS + zitadel:8080 (wait4x /debug/ready + appels API) + kube-api
# ──────────────────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel-login
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  description: "Zitadel-login: ingress gateway :3000, egress zitadel :8080 + DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-login
  ingress:
    # Probes kubelet (liveness/readiness :3000) — entité host/remote-node hors mesh.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Gateway Istio — UI login north-south.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS — indispensable pour résoudre le service "zitadel".
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Vers le serveur Zitadel — wait4x /debug/ready (initContainer) + appels API runtime.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
            app.kubernetes.io/name: zitadel
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # kube-api (service account / projected token).
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
