# OpenAether — CiliumNetworkPolicy Zitadel (Zero Trust L3/L4)
# ──────────────────────────────────────────────────────────────────────────
# services-identity is OUTSIDE the mesh (see namespace.yaml) → all of Zitadel's
# network security rests on THIS L3/L4 CiliumNetworkPolicy (+ node-level
# WireGuard + Zitadel's native OIDC authN). No Istio AuthorizationPolicy (inert outside the mesh).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  description: "Zitadel: ingress gateway :8080, egress CNPG :5432 + DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Grafana (OIDC SSO): code exchange + /oidc/v1/userinfo, SERVER-to-server
    # calls — the browser flow goes through the gateway instead.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Intra-namespace: the login pod calls zitadel:8080 (server-side ingress).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver through toEntities (NOT toServices:kubernetes). The
    # `kubernetes` Service DNATs 443→6443: toServices only opens 443, but Cilium
    # applies egress on the post-DNAT port (6443) → dropped. Breaks the
    # sidecars setup zitadel-machinekey/machine-pat (kubectl create secret) →
    # setup Job, which never Completes → the HelmRelease hangs on install.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-databases
            cnpg.io/cluster: zitadel-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# ──────────────────────────────────────────────────────────────────────────
# The login pod (Next.js, app.kubernetes.io/name: zitadel-login). A SEPARATE
# selector because its label differs from `zitadel`. Without this CNP its egress
# (DNS + zitadel:8080) is blocked → the wait-for-zitadel initContainer times out (exit 124).
#   ingress : probes kubelet :3000 + Gateway Istio :3000 (UI login)
#   egress  : DNS + zitadel:8080 (wait4x /debug/ready + appels API) + kube-api
# ──────────────────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel-login
  namespace: services-identity
  labels:
    openaether.io/managed: "true"
    openaether.io/component: zitadel
spec:
  description: "Zitadel-login: ingress gateway :3000, egress zitadel :8080 + DNS + kube-api."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-login
  ingress:
    # kubelet probes (liveness/readiness :3000) — host/remote-node entity, outside the mesh.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Gateway Istio — UI login north-south.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS — essential to resolve the "zitadel" service.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # To the Zitadel server — wait4x /debug/ready (initContainer) + runtime API calls.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
            app.kubernetes.io/name: zitadel
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # kube-api (service account / projected token).
    # kube-apiserver through toEntities (NOT toServices:kubernetes). The
    # `kubernetes` Service DNATs 443→6443: toServices only opens 443, but Cilium
    # applies egress on the post-DNAT port (6443) → dropped. Breaks the
    # sidecars setup zitadel-machinekey/machine-pat (kubectl create secret) →
    # setup Job, which never Completes → the HelmRelease hangs on install.
    - toEntities:
        - kube-apiserver
