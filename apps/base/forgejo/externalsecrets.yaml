# Forgejo secrets from OpenBao (through ESO)
# ──────────────────────────────────────────────────────────────────────────
# Seeding (the vault configure Job, create only) creates in OpenBao:
#   secret/forgejo/db     → { password }   the forgejo-db Postgres role's password
#   secret/forgejo/admin  → { password }   the initial admin's password (read ONCE, at the first install)
#   secret/forgejo/oidc   → { key, secret } the Zitadel OIDC client credentials (rung 3)
#
# If a key is missing in OpenBao the ExternalSecret reports SecretSyncedError and
# the target Secret is simply not (re)written — External Secrets does not rewrite
# a target it cannot fill (same behaviour as the zitadel/admin precedent).
#
# Three Secrets consumed here (ns services-git):
#   1. forgejo-db-credentials → the app's DB password, injected as
#      GITEA__database__PASSWD (deployment.env in helmrelease.yaml). Its
#      foundation-databases twin — same OpenBao key — is created for the CNPG
#      bootstrap by apps/base/cnpg/forgejo-db-externalsecret.yaml.
#   2. forgejo-admin          → gitea.admin.existingSecret (key `password`).
#   3. forgejo-oauth          → gitea.oauth[].existingSecret (keys `key`/`secret`),
#      for the Zitadel OIDC auth source (shipped disabled in helmrelease.yaml,
#      enabled at rung 3).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-credentials
  namespace: services-git
  labels:
    openaether.io/managed: "true"
    openaether.io/component: forgejo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-db-credentials
    creationPolicy: Owner
    template:
      data:
        username: "forgejo"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: services-git
  labels:
    openaether.io/managed: "true"
    openaether.io/component: forgejo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
  namespace: services-git
  labels:
    openaether.io/managed: "true"
    openaether.io/component: forgejo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-oauth
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: forgejo/oidc
        property: key
    - secretKey: secret
      remoteRef:
        key: forgejo/oidc
        property: secret
