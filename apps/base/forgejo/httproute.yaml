# OpenAether — HTTPRoute Forgejo → openaether-gateway
# parentRef: openaether-gateway (Istio, ns services-gateway, from: All).
# TLS terminates at the Gateway; Forgejo serves cleartext HTTP (PROTOCOL http,
# ROOT_URL https — see helmrelease.yaml).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: services-git
  labels:
    openaether.io/managed: "true"
    openaether.io/component: forgejo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
      namespace: services-gateway
  hostnames:
    - "forge.openaether.local"
  rules:
    # /metrics (gitea.metrics.enabled, scraped in-cluster by vmagent on :3000) is NOT served to the Internet: it answers
    # without authentication and lists the forge's counters. A rule with no backendRefs makes the Gateway answer 500 to
    # it (Gateway API: "no valid backends"); the more specific match wins over `/`. UNVERIFIED on a cluster.
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # gitea.fullname-http → forgejo-http (chart name forgejo, release forgejo).
        - name: forgejo-http
          port: 3000
