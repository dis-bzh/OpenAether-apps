# OpenAether 0.5.0 Sprint C — StorageClasses Longhorn
# ──────────────────────────────────────────────────────────────────
# Convention: longhorn-{replication}-{access}[-encrypted]
#   replication : x1 (1 replica Longhorn) · x2 (2 replicas) · x3 (3 replicas)
#   access      : rwo (ReadWriteOnce) · rwx (ReadWriteMany)
#   encrypted   : LUKS through an OpenBao key (longhorn-encryption Secret)
#
# GOLDEN RULE: never double up replication.
#   App self-replicates (CNPG, VMCluster, Loki, Kafka, OpenSearch)
#     → longhorn-x1-rwo or local-path
#   Single-replica app with no clean failover
#     → longhorn-x2-rwo (or encrypted for sensitive data)
#
# NETWORK WARNING: Longhorn x2 = 2× the write traffic on the cluster network.
#   On 1 Gbps between nodes, exceeding 30% of Longhorn IO degrades the cluster.
#   Prefer local-path or x1 for IO-intensive workloads (metrics, logs).
#
# All Longhorn volumes: reclaimPolicy=Retain (no accidental loss).
# allowVolumeExpansion=true (grow without recreating the pod).
# ──────────────────────────────────────────────────────────────────

# ── longhorn-x1-rwo ────────────────────────────────────────────────
# 1 Longhorn replica + ReadWriteOnce.
# For: apps that self-replicate (CNPG primary, vmstorage, Loki singleBinary).
# Benefit: the volume is NOT replicated by Longhorn → zero Longhorn network overhead.
# HA is provided by the application. Longhorn backup (S3) stays available.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-x1-rwo
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""

# ── longhorn-x1-rwo-encrypted ──────────────────────────────────────
# 1 Longhorn replica + ReadWriteOnce + LUKS encryption.
# For: self-replicating apps + sensitive data (encrypted CNPG, stored secrets).
# The LUKS key lives in the longhorn-encryption Secret (ns longhorn-system),
# managed by an ExternalSecret → OpenBao (secret/longhorn/encryption.passphrase).
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-x1-rwo-encrypted
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: longhorn-encryption
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: longhorn-encryption
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: longhorn-encryption
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system

# ── longhorn-x2-rwo ────────────────────────────────────────────────
# 2 Longhorn replicas + ReadWriteOnce.
# For: single-replica apps with no HA of their own (Grafana, Keycloak, stateful apps).
# Longhorn provides the volume's HA: if a node dies, the volume stays reachable.
# WARNING: 2× the network write traffic. Avoid for IO-intensive workloads.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-x2-rwo
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""

# ── longhorn-x2-rwo-encrypted ──────────────────────────────────────
# 2 Longhorn replicas + ReadWriteOnce + LUKS encryption.
# For: single-replica apps + sensitive data (Keycloak, apps holding credentials).
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-x2-rwo-encrypted
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: longhorn-encryption
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: longhorn-encryption
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: longhorn-encryption
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system

# ── longhorn-x2-rwx ────────────────────────────────────────────────
# 2 Longhorn replicas + ReadWriteMany (NFS-like through the Longhorn Share Manager).
# For: the rare multi-pod shared storage cases (static assets, uploads).
# WARNING: NFS overhead on the network. Do not use for high-frequency IO.
# nfsOptions (apps #124): Longhorn's own default is timeo=600,retrans=5. timeo is in
# tenths of a second and the TCP retry timeout grows by timeo each time, so a client
# whose share-manager vanished waited 60+120+180+240+300 s = 15 min before softerr
# returned an error: the "> 12 min in unmountPodMounts" of a graceful reboot of a node
# that hosted both (lab 12). timeo=100,retrans=3 gives up after 10+20+30 = 60 s, long
# enough for a share-manager restart or fast failover, short enough for a node shutdown.
# Apps then see ETIMEDOUT instead of a hang (softerr): RWX users must tolerate it.
# StorageClass parameters are immutable: the force annotation lets Flux delete and
# recreate the class (bound PVs are untouched). Volumes created BEFORE the change keep
# the options they were created with; see docs/traps.md.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-x2-rwx
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  nfsOptions: "vers=4.1,noresvport,softerr,timeo=100,retrans=3"

# ── longhorn-x2-rwx-encrypted ──────────────────────────────────────
# 2 Longhorn replicas + ReadWriteMany + LUKS encryption.
# For: multi-pod shared storage + sensitive data.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-x2-rwx-encrypted
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  nfsOptions: "vers=4.1,noresvport,softerr,timeo=100,retrans=3"
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: longhorn-encryption
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: longhorn-encryption
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: longhorn-encryption
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system
