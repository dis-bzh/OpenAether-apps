# OpenAether 0.5.0 Sprint C — Longhorn distributed block storage
# ──────────────────────────────────────────────────────────────────
# Longhorn provides distributed storage for apps that have no replication of
# their own (single-replica apps, RWX, encrypted volumes).
#
# Apps that self-replicate (CNPG, VMCluster, Loki singleBinary)
# → use the local-path or longhorn-x1-rwo StorageClass to avoid double
#   replication (app 2× + Longhorn 2× = 4× the data volume).
#
# Talos: kubeletRootDir=/var/lib/kubelet (standard).
# Cilium CNI: no iSCSI, but Longhorn uses NFS/TCP → fine.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  url: https://charts.longhorn.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  # Helm's default timeout (5 min) is not enough for Longhorn in the cloud: the
  # longhorn-manager DaemonSet and the engine images are heavy to pull, the
  # install stays "InProgress" and expires. It is then remediated by an
  # uninstall — and if that is itself interrupted (node reboot), the Helm
  # release is left in status `uninstalling` and Flux blocks on "unable to determine state":
  # the release stays stuck while every pod runs (hit 2026-07-26, Outscale management).
  # Manual unblock: delete the sh.helm.release.v1.longhorn.v1 Secret.
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 1h
  # No automatic remediation: Longhorn refuses downgrades, so a Helm rollback after a failed upgrade is
  # refused by its pre-upgrade job and strands the release; an install remediation uninstalls Longhorn.
  # A failure is read and fixed by a person (docs/patching.md, "Longhorn in-place hops").
  # A FIRST install that hits one transient error (apps #134: `etcdserver: request timed out` on a busy control
  # plane left the release Stalled) is retried by `strategy: RetryOnFailure` (helm-controller >= 1.5): it retries the
  # install every retryInterval WITHOUT the uninstall that remediation would run (Longhorn's pre-delete Job refuses it
  # while deleting-confirmation-flag is false, checked in longhorn-manager v1.12.1, and could remove data when it is true).
  # The upgrade path keeps retries 0 and the default strategy on purpose.
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  values:
    # 1.12 renders NetworkPolicies by default (restrictInternalTraffic); the CiliumNetworkPolicy of this
    # brick already governs longhorn-system, so keep it the single authority until a cluster has shown both agree.
    networkPolicies:
      restrictInternalTraffic: false
    defaultSettings:
      # Longhorn's data path on each node → a dedicated, encrypted (LUKS2) Talos
      # user volume, mounted at /var/mnt/longhorn (see OpenAether-infra
      # worker_storage). Isolates the replicas from the OS disk and survives
      # `talosctl upgrade --preserve`. Upstream default = /var/lib/longhorn.
      defaultDataPath: /var/mnt/longhorn
      # Default replica count for new volumes.
      # Overridden per StorageClass (numberOfReplicas).
      defaultReplicaCount: 2
      # Minimum free space before refusing new volumes.
      storageMinimalAvailablePercentage: 15
      # Orphan auto-deletion is deliberately NOT enabled (apps #115). The old key here (`orphanAutoDeletion`) is not a
      # key of the chart (it reads `orphanResourceAutoDeletion`) and was ignored since 1.9, so nothing was ever enabled
      # and the comment promised a behaviour that did not exist. An "orphan" is replica data on a node with no
      # matching replica object, which is exactly what a restore of etcd or a rebuilt node looks like for a while:
      # deleting it automatically could remove the only copy. Reclaim space by reading `kubectl get orphans.longhorn.io`
      # first. A test fails on a key the pinned chart does not read.
      # No backup target here either: it is the chart's `defaultBackupStore.backupTarget` (defaultSettings.backupTarget
      # is not read), and it is deliberately left empty. The truth lives in the CRs laid down by the
      # `storage-backup-target` brick (apps/base/storage/backup-target), which gets the URL from the
      # `cluster-identity` ConfigMap and the credentials from OpenBao.
      # kubelet path Talos
      kubernetesClusterAutoscalerEnabled: false
    longhornManager:
      tolerations: []
      nodeSelector: {}
    longhornDriver:
      tolerations: []
      nodeSelector: {}
    csi:
      # Talos: /var/lib/kubelet is the standard kubelet root dir.
      kubeletRootDir: /var/lib/kubelet
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 2
      snapshotterReplicaCount: 2
    persistence:
      # Do not set a default StorageClass here — local-path stays the default.
      defaultClass: false
      defaultClassReplicaCount: 2
    ingress:
      enabled: false  # UI accessible via port-forward or HTTPRoute sprint D
