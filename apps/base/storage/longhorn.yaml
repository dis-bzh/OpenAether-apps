# OpenAether 0.5.0 Sprint C — Longhorn distributed block storage
# ──────────────────────────────────────────────────────────────────
# Longhorn fournit le stockage distribué pour les apps qui n'ont pas
# leur propre réplication (single-replica apps, RWX, volumes chiffrés).
#
# Apps qui auto-répliquent (CNPG, VMCluster, Loki singleBinary)
# → utiliser StorageClass local-path ou longhorn-x1-rwo pour éviter
#   la double réplication (app 2× + Longhorn 2× = 4× le volume de données).
#
# Talos: kubeletRootDir=/var/lib/kubelet (standard).
# Cilium CNI: pas d'iSCSI mais Longhorn utilise NFS/TCP → OK.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  url: https://charts.longhorn.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  # Le timeout Helm par défaut (5 min) ne suffit pas à Longhorn en cloud : le
  # DaemonSet longhorn-manager et les engine images sont lourds à tirer, l'install
  # reste « InProgress » et expire. Elle est alors remédiée par un uninstall — si
  # celui-ci est lui-même interrompu (reboot de nœud), la release Helm reste en
  # statut `uninstalling` et Flux se bloque sur « unable to determine state »
  # alors que tous les pods tournent (vécu le 2026-07-26, management Outscale).
  # Déblocage manuel : supprimer le Secret sh.helm.release.v1.longhorn.v1.
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: "1.9.2"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      # Chemin des données Longhorn sur chaque nœud → user volume Talos dédié et
      # chiffré (LUKS2), monté en /var/mnt/longhorn (cf. OpenAether-infra
      # worker_storage). Isole les réplicas du disque OS et survit à
      # `talosctl upgrade --preserve`. Défaut amont = /var/lib/longhorn.
      defaultDataPath: /var/mnt/longhorn
      # Nombre de répliques par défaut pour les nouveaux volumes.
      # Surchargé par StorageClass (numberOfReplicas).
      defaultReplicaCount: 2
      # Espace minimal disponible avant de refuser de nouveaux volumes.
      storageMinimalAvailablePercentage: 15
      # Supprimer automatiquement les volumes orphelins (sans PVC).
      orphanAutoDeletion: true
      # backupTarget : laissé vide ICI volontairement. `defaultSettings` n'est lu
      # qu'au PREMIER déploiement ; la vérité vit ensuite dans les Setting CR,
      # posées par la brique `storage-backup-target`
      # (apps/base/storage/backup-target) qui reçoit l'URL du ConfigMap
      # `cluster-identity` et les credentials d'OpenBao. Y mettre une valeur ici
      # ne servirait qu'à l'installation initiale et divergerait ensuite.
      backupTarget: ""
      # kubelet path Talos
      kubernetesClusterAutoscalerEnabled: false
    longhornManager:
      tolerations: []
      nodeSelector: {}
    longhornDriver:
      tolerations: []
      nodeSelector: {}
    csi:
      # Talos: /var/lib/kubelet est le kubelet root dir standard.
      kubeletRootDir: /var/lib/kubelet
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 2
      snapshotterReplicaCount: 2
    persistence:
      # Ne pas définir de StorageClass par défaut ici — local-path reste default.
      defaultClass: false
      defaultClassReplicaCount: 2
    ingress:
      enabled: false  # UI accessible via port-forward ou HTTPRoute sprint D
