---
# longhorn-system: allow internal Longhorn traffic
# CiliumClusterwideNetworkPolicies (allow-dns, allow-kube-api) create default-deny.
# Longhorn components need to talk to each other on port 9500.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "storage"
spec:
  description: "longhorn: allow all intra-ns traffic + webhook ports 9501-9502 + instance manager 8500-8503 + egress DNS + kube-api."
  endpointSelector:
    matchLabels: {}
  ingress:
    # Allow all intra-namespace traffic (Longhorn pods don't always have ns label)
    - fromEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "8500"
              protocol: TCP
            - port: "8501"
              protocol: TCP
            - port: "8502"
              protocol: TCP
            - port: "8503"
              protocol: TCP
    # kube-apiserver → webhooks (admission 9502, conversion 9501, backend 9500)
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "9501"
              protocol: TCP
            - port: "9502"
              protocol: TCP
  egress:
    # Intra-namespace: allow all (Longhorn pods don't always have ns label)
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "8500"
              protocol: TCP
            - port: "8501"
              protocol: TCP
            - port: "8502"
              protocol: TCP
            - port: "8503"
              protocol: TCP
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-api
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # iSCSI targets (Longhorn uses TCP 3260 for iSCSI)
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "3260"
              protocol: TCP
    # Cross-node: instance manager gRPC (8500-8503) + replica traffic (9500)
    - toEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "8500"
              protocol: TCP
            - port: "8501"
              protocol: TCP
            - port: "8502"
              protocol: TCP
            - port: "8503"
              protocol: TCP
            - port: "9501"
              protocol: TCP
            - port: "9502"
              protocol: TCP
---
# ── MinIO (namespace: foundation-storage) ────────────────────────────
# S3-compatible backend pour Loki chunks/backups et futur VMCluster backup.
# ingress :9000 limité à services-observability (Loki, vmagent backup).
# ingress :9001 (console) supprimé — accès via port-forward uniquement.
# egress : DNS (kube-dns via CCNP allow-dns), kube-api (via CCNP allow-kube-api).
# Le default-deny-all-egress/ingress CCNP ferme le reste.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: minio
spec:
  description: "MinIO: ingress S3 API :9000 depuis services-observability, deny console."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  ingress:
    # Loki + vmbackup (S3 API :9000)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Pas de :9001 (console UI) — accès via port-forward uniquement.
  # egress : DNS + kube-api couverts par les CCNP allow-dns / allow-kube-api.
