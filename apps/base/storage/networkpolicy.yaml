---
# longhorn-system: allow internal Longhorn traffic
# CiliumClusterwideNetworkPolicies (allow-dns, allow-kube-api) create default-deny.
# Longhorn components need to talk to each other on port 9500.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "storage"
spec:
  description: "longhorn: allow all intra-ns traffic + webhook ports 9501-9502 + instance manager 8500-8503 + egress DNS + kube-api + the provider's object storage (FQDN, :443)."  # yamllint disable-line rule:line-length
  endpointSelector:
    matchLabels: {}
  ingress:
    # Allow all intra-namespace traffic (Longhorn pods don't always have ns label)
    - fromEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            # The managers call each other's conversion (9501) and admission (9502) webhooks through their Services:
            # allowed on both sides, or Cilium drops them (lab 11: 66 denied flows).
            - port: "9501"
              protocol: TCP
            - port: "9502"
              protocol: TCP
            - port: "8500"
              protocol: TCP
            - port: "8501"
              protocol: TCP
            - port: "8502"
              protocol: TCP
            - port: "8503"
              protocol: TCP
    # kube-apiserver → webhooks (admission 9502, conversion 9501, backend 9500)
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "9501"
              protocol: TCP
            - port: "9502"
              protocol: TCP
    # Gateway Istio (services-gateway) → UI longhorn-ui:8000 (north-south).
    # ⚠️ The longhorn-frontend svc maps 80→8000; Cilium enforces the pod's REAL
    # targetPort (8000), not the Service port → allow 8000, not 80.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # kubelet probes on the UI (longhorn-system is outside the mesh → node source).
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # Intra-namespace: allow all (Longhorn pods don't always have ns label)
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "9501"
              protocol: TCP
            - port: "9502"
              protocol: TCP
            - port: "8500"
              protocol: TCP
            - port: "8501"
              protocol: TCP
            - port: "8502"
              protocol: TCP
            - port: "8503"
              protocol: TCP
    # DNS
    # `rules.dns` lets the toFQDNs rule below match: without the DNS proxy observing the lookup, Cilium never learns the
    # S3 addresses (same mechanism as the Loki rule, apps #53).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Longhorn's backup target is the provider's object storage (the `storage-backup-target` brick): the manager checks
    # it, the instance managers write the backups. Without this rule the BackupTarget stays `available: false` (seen
    # on a real OVH cluster). Every region, as the other S3 rules (see test-s3-egress-fqdns.py). The policy selects
    # every pod of the namespace, so the rule is not limited to those two components.
    - toFQDNs:
        - matchPattern: "s3.*.scw.cloud"          # Scaleway Object Storage
        - matchPattern: "s3.*.io.cloud.ovh.net"   # OVH Object Storage (standard class)
        - matchPattern: "oos.*.outscale.com"      # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # kube-api
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # iSCSI targets (Longhorn uses TCP 3260 for iSCSI)
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "3260"
              protocol: TCP
    # Cross-node: instance manager gRPC (8500-8503) + replica traffic (9500)
    - toEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "8500"
              protocol: TCP
            - port: "8501"
              protocol: TCP
            - port: "8502"
              protocol: TCP
            - port: "8503"
              protocol: TCP
            - port: "9501"
              protocol: TCP
            - port: "9502"
              protocol: TCP
---
# ── MinIO: CNP MOVED to apps/base/storage/minio/networkpolicy.yaml ──────────
# The minio brick is only included locally (overlay), whereas this file belongs
# to the storage brick (Longhorn), which is redirected to a stub locally:
# the minio CNP defined HERE was therefore NEVER applied where minio runs
# (found during the backup e2e test: ingress :9000 dropped by the
# default-deny-all-ingress CCNP). It now lives with the minio brick.
