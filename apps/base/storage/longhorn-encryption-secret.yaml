# OpenAether 0.5.0 Sprint C — Secret chiffrement LUKS pour Longhorn
# ──────────────────────────────────────────────────────────────────
# Longhorn LUKS encryption requires a Kubernetes Secret in longhorn-system with
# the CRYPTO_KEY_VALUE key. That Secret is managed by ESO from OpenBao.
#
# Seeding: vault/bootstrap-roles-job.yaml step 10 generates the passphrase
# dans OpenBao (secret/data/longhorn/encryption.passphrase) si absente.
#
# Key rotation: a new OpenBao version updates this Secret.
# Existing volumes keep their old LUKS key (re-keying is an offline operation
# on the individual volume through longhorn-manager). New volumes use the new
# key.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-encryption
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: longhorn-encryption
    creationPolicy: Owner
    template:
      data:
        # Longhorn expects CRYPTO_KEY_VALUE as the key inside the Secret.
        CRYPTO_KEY_VALUE: "{{ .passphrase }}"
        # The algorithm and provider live in the StorageClass (parameters).
        # The Secret holds ONLY the passphrase.
  data:
    - secretKey: passphrase
      remoteRef:
        key: longhorn/encryption
        property: passphrase
