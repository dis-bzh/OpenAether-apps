# LUKS encryption secret for Longhorn
# ──────────────────────────────────────────────────────────────────
# Longhorn LUKS encryption requires a Kubernetes Secret in longhorn-system with
# the CRYPTO_KEY_VALUE key. That Secret is managed by ESO from OpenBao.
#
# Seeding: vault/scripts/configure.sh (application_secrets) creates the passphrase
# in OpenBao (secret/data/longhorn/encryption.passphrase) if missing.
#
# DO NOT ROTATE while encrypted volumes exist. A new OpenBao version reaches this
# Secret within the 1 h refresh and the node-stage step hands it to every volume,
# whose LUKS header still holds the old passphrase: they would fail to attach
# (reasoned from the mechanism, not tested; Longhorn's docs describe no passphrase
# change). All volumes share this one passphrase (per-volume secrets are not
# done). See docs/key-inventory.md.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-encryption
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: longhorn-encryption
    creationPolicy: Owner
    template:
      data:
        # Longhorn expects CRYPTO_KEY_VALUE as the key inside the Secret.
        CRYPTO_KEY_VALUE: "{{ .passphrase }}"
        # Longhorn reads the LUKS parameters from THIS Secret (not from the
        # StorageClass) and falls back to CRYPTO_KEY_SIZE 256 (= AES-128 in XTS)
        # and argon2i when they are absent. They are applied when a volume is
        # formatted; an existing LUKS volume keeps what its header says.
        # Read in longhorn-manager v1.9.2 (csi/node_server.go -> csi/crypto -> go-common-libs
        # ns/crypto.go): each value is passed unchecked to `cryptsetup luksFormat --pbkdf/--key-size`;
        # argon2id is a documented --pbkdf value since cryptsetup 2.0 and its default since 2.4.
        CRYPTO_KEY_PROVIDER: "secret"
        CRYPTO_KEY_CIPHER: "aes-xts-plain64"  # gitleaks:allow (a cipher name, not a key)
        CRYPTO_KEY_HASH: "sha256"
        CRYPTO_KEY_SIZE: "512"
        CRYPTO_PBKDF: "argon2id"
  data:
    - secretKey: passphrase
      remoteRef:
        key: longhorn/encryption
        property: passphrase
