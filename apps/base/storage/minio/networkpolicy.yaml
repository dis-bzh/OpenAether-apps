# MinIO (local) — ingress S3 :9000 sous default-deny-all-ingress (CCNP).
# Lives IN the minio brick (rather than in storage/networkpolicy.yaml) so it is
# applied wherever minio is — found during the backup e2e test.
# ⚠️ the minio 5.2.0 chart sets the legacy label `app: minio` (NOT
# app.kubernetes.io/name) — selector sur les deux formes.
# egress : DNS + kube-api couverts par les CCNP allow-dns / allow-kube-api.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/component: minio
spec:
  description: "MinIO: ingress S3 :9000 (observability, jobs backup, mc intra-ns), deny console"
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["minio"]
  ingress:
    # Loki + vmbackup (S3 API :9000)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Backup Jobs (restic → local repositories) + the chart's mc post-job (intra-ns)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao-snapshot
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-databases
            app: cnpg-dump
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # No :9001 (console UI) — access through port-forward only.
---
# The chart's mc post-job (bucket creation): its EGRESS to minio:9000 was
# dropped by the default-deny egress → buckets never created locally
# (found during the backup e2e test: restic does NOT create the buckets).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-post-job
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/component: minio
spec:
  description: "mc post-job: egress DNS + minio:9000 (création buckets)"
  endpointSelector:
    matchLabels:
      app: minio-job
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
