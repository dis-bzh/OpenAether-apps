# Credentials S3 des backups de volumes Longhorn.
#
# Longhorn attend EXACTEMENT ces trois clés dans le Secret référencé par le
# réglage `backup-target-credential-secret` : AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY et AWS_ENDPOINTS (l'URL du endpoint S3). Elles viennent
# de la même destination que les dépôts restic (`secret/backup/s3-primary` dans
# OpenBao), seedée par l'opérateur — cf. docs/admin-access.md § 3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: longhorn-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
    - secretKey: AWS_ENDPOINTS
      remoteRef: { key: backup/s3-primary, property: endpoint }
