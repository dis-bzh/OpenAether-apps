# S3 credentials for the Longhorn volume backups.
#
# Longhorn expects EXACTLY these three keys in the Secret referenced by the
# `backup-target-credential-secret` setting: AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY and AWS_ENDPOINTS (the S3 endpoint URL). They come from
# the same destination as the restic repositories (`secret/backup/s3-primary` in
# OpenBao), seeded by the operator — see docs/admin-access.md § 3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: longhorn-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: backup/s3-primary, property: access_key }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: backup/s3-primary, property: secret_key }
    - secretKey: AWS_ENDPOINTS
      remoteRef: { key: backup/s3-primary, property: endpoint }
