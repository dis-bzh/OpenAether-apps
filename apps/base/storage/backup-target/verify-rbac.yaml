# The backup verifier (foundation-databases/backup-verify) reads the Longhorn Backup and BackupVolume objects: the
# newest backup of each volume must be Completed, with a size and no error. Read-only, in this namespace only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-verify-longhorn-read
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["backups", "backupvolumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-verify-longhorn-read
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: backup-verify-longhorn-read }
subjects:
  - { kind: ServiceAccount, name: backup-verify, namespace: foundation-databases }
