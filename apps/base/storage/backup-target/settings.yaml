# Backup target for Longhorn volumes.
#
# ⚠️ Longhorn ≥ 1.6 moved this out of `Setting` into the `BackupTarget` CRD; the
# webhook now rejects the old name ("setting backup-target is not supported").
# We patch the `default` object Longhorn creates at startup — the one volumes
# use without an annotation.
#
# Separate Kustomization on purpose: it carries a `substituteFrom`, and Flux
# substitution applies to a whole render — merged with `apps/base/storage` it
# would blank the shell variables of its `install.yaml`.
#
# Empty default: a cluster that publishes no URL keeps Longhorn without volume
# backups, i.e. the previous behaviour — no silent regression.
---
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
spec:
  backupTargetURL: "${BACKUP_TARGET_URL:=}"
  credentialSecret: longhorn-backup-credentials
  pollInterval: 5m0s
