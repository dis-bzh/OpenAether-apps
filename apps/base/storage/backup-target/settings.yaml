# Cible de sauvegarde des volumes Longhorn.
#
# ── API : BackupTarget, PAS le réglage `backup-target` ───────────────────────
# Longhorn ≥ 1.6 a sorti la destination de sauvegarde des `Setting` pour lui
# donner une CRD dédiée, `backuptargets.longhorn.io` (plusieurs destinations
# possibles). Le webhook de validation REJETTE désormais explicitement l'ancien
# nom :
#   admission webhook "validator.longhorn.io" denied the request:
#   setting backup-target is not supported
# Constaté en cloud réel le 2026-07-28 sur Longhorn v1.9.2 — la version
# précédente de ce fichier utilisait l'API supprimée. Schéma vérifié contre la
# CRD servie : spec = {backupTargetURL, credentialSecret, pollInterval}.
#
# On patche l'objet `default` que Longhorn crée lui-même au démarrage, plutôt
# que d'en ajouter un : c'est celui que les volumes utilisent sans annotation.
#
# ── Pourquoi une Kustomization séparée ───────────────────────────────────────
# Ce dossier est substitué par Flux (${BACKUP_TARGET_URL} vient du ConfigMap
# `cluster-identity`). La substitution s'applique à TOUT le rendu d'une
# Kustomization : fusionnée avec `apps/base/storage`, elle viderait les
# variables shell de son `install.yaml` (`$VOL_DIR`).
#
# Défaut VIDE : un cluster qui ne publie pas l'URL garde Longhorn sans
# sauvegarde de volumes — comportement d'avant, pas de régression silencieuse.
---
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: storage
spec:
  backupTargetURL: "${BACKUP_TARGET_URL:=}"
  credentialSecret: longhorn-backup-credentials
  pollInterval: 5m0s
