# OpenAether 0.5.0 — Foundation Storage
# local-path-provisioner lives in apps/base/platform/local-path-provisioner —
# a duplicate copy used to live here too (v0.0.30 vs its v0.0.31), colliding on
# the same StorageClass/Namespace whenever both were picked together. Removed;
# `storage` now depends on `platform-local-path-provisioner` (apps/flux/base/21-storage.yaml).
# Longhorn Sprint C: distributed storage, multiple StorageClasses, OpenBao encryption
# MinIO: local overlay only (apps/overlays/local/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - longhorn.yaml
  # httproute-longhorn.yaml is deliberately NOT here: the Longhorn UI has no
  # authentication of its own, and the app LB fronting the gateway is open on
  # 80/443 on all three providers (only the k8s API carries the admin_ip ACL).
  # Publishing it by default put an unauthenticated volume-admin UI on the
  # internet. Add the line yourself once something in front of it authenticates.
  - storageclasses.yaml
  - longhorn-encryption-secret.yaml
