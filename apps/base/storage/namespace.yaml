apiVersion: v1
kind: Namespace
metadata:
  name: foundation-storage
  labels:
    # privileged by default (the released behaviour). Only MinIO (local clusters) lives here and Longhorn has
    # its own privileged
    # namespace below: opt in to baseline with apps/flux/components/psa-baseline. warn/audit restricted show the drift.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    istio.io/dataplane-mode: ambient
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
