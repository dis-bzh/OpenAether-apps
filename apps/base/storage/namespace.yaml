apiVersion: v1
kind: Namespace
metadata:
  name: foundation-storage
  labels:
    # baseline: only MinIO (local clusters) lives here; Longhorn has its own privileged namespace below.
    # To go back, set enforce to privileged. warn/audit restricted keep the drift visible.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    istio.io/dataplane-mode: ambient
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
