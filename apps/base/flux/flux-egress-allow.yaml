# OpenAether 0.5.0 — Flux Egress Allow
# Autorise Flux (source-controller, helm-controller, etc.) à sortir vers Internet
# et à interroger CoreDNS (kube-system)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-egress-allow-all
  namespace: flux-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Allow Flux egress to world, host, remote-node, cluster"
  endpointSelector: {}
  egress:
    - toEntities:
        - world
        - host
        - remote-node
        - cluster