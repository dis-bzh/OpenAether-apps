# OpenAether 0.5.0 — Flux Egress Restricted (Zero Trust)
# Replaces flux-egress-allow-all.yaml (far too permissive: world + host + remote-node)
# Allows ONLY the required destinations:
# - github.com (GitRepository + Helm charts GitHub Pages)
# - Helm registries: charts.jetstack.io, charts.longhorn.io, charts.min.io,
#   blob.istio.io (redirects to istio-release.r2.istio.io), victoriametrics.github.io,
#   grafana.github.io, grafana-community.github.io, prometheus-community.github.io, kubernetes-sigs.github.io
# - CoreDNS (cluster) for DNS resolution
# - Kube-API (cluster) for Kubernetes operations
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-egress-restricted
  namespace: flux-system
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  description: "Restrict Flux egress to specific FQDNs + cluster DNS/API; allow VMAgent to scrape :8080"
  endpointSelector: {}
  ingress:
    # The cluster-wide default-deny leaves Flux with no ingress at all, so the
    # controllers' metrics were unreachable. They are scraped from here. gotk_reconcile_condition no longer
    # exists in Flux 2.8 (apps #44): nothing alerts on a Kustomization that reconciles and fails.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # 1. GitHub (GitRepository + Helm charts via GitHub Pages)
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 2. cert-manager Helm repository
    - toFQDNs:
        - matchName: charts.jetstack.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 3. Longhorn Helm repository
    - toFQDNs:
        - matchName: charts.longhorn.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 4. MinIO Helm repository
    - toFQDNs:
        - matchName: charts.min.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 5. Istio Helm repository: blob.istio.io answers 308, index and charts come from istio-release.r2.istio.io
    #    (Istio 1.31 stopped publishing to istio-release.storage.googleapis.com)
    - toFQDNs:
        - matchName: blob.istio.io
        - matchName: istio-release.r2.istio.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 6. VictoriaMetrics Operator Helm (GitHub Pages)
    - toFQDNs:
        - matchName: victoriametrics.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 7. Grafana Helm (GitHub Pages): Alloy on grafana.github.io, Loki (and Grafana) on grafana-community.github.io
    - toFQDNs:
        - matchName: grafana.github.io
        - matchName: grafana-community.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 8. Prometheus Community Helm (GitHub Pages) - kube-state-metrics
    - toFQDNs:
        - matchName: prometheus-community.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 9. Cluster API Operator Helm (GitHub Pages)
    - toFQDNs:
        - matchName: kubernetes-sigs.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 10. CoreDNS (kube-system) for DNS resolution
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # 11. Kube-API server for Kubernetes operations
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # 12. The in-cluster Alertmanager, for the Flux notification Provider (#139). Ingress is allowed on its side
    #     (services-observability/networkpolicy.yaml, CNP vmalertmanager).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
