# PUBLIC entry point of the Gateway — FIXED NodePorts.
#
# Istio's own `openaether-gateway-istio` Service keeps a PRIVATE LB-IPAM VIP:
# that is the admin path, through the bastion tunnel, and it is unchanged.
# The PUBLIC path goes through the cloud LB created by OpenTofu in PHASE 1,
# before the cluster exists — so it cannot discover a randomly allocated
# nodePort (30000-32767). Hence this dedicated Service with fixed ports.
#
# ⚠️ THESE NUMBERS ARE A CROSS-REPOSITORY CONTRACT with `app_lb_node_ports`
# (OpenAether-infra, modules/providers/*/variables.tf). A mismatch = a public LB
# pointing at nothing, with no error anywhere.
#
# Istio's Service cannot be pinned (istiod generates it, and neither Kustomize
# nor `spec.infrastructure` can force a nodePort), and a CCM was ruled out —
# see the "Public ingress" decision in docs/backlog.md.
---
apiVersion: v1
kind: Service
metadata:
  name: openaether-gateway-nodeport
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
spec:
  type: NodePort
  # `Cluster` (the default) rather than `Local`: the cloud LB targets ALL
  # workers, including those hosting no gateway pod. Under `Local` they would
  # fail the health check and traffic would concentrate on a single node.
  # Accepted trade-off: the source IP is masked by the node's SNAT — hence the
  # `host`/`remote-node` entities added to the `openaether-gateway` CNP.
  externalTrafficPolicy: Cluster
  # Selector taken from the `openaether-gateway` CNP (apps/base/istio/networkpolicy.yaml),
  # which works in production on this exact Gateway — so the label is verified.
  selector:
    service.istio.io/canonical-name: openaether-gateway-istio
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443
