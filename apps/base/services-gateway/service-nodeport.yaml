# PUBLIC entry point of the Gateway — FIXED NodePorts.
#
# ── Pourquoi un Service en plus ───────────────────────────────────────────────
# Istio creates its own `openaether-gateway-istio` LoadBalancer Service for this
# Gateway. Cilium LB-IPAM assigns it a **private** VIP from the pool
# (172.16.12.240-254): that is the ADMINISTRATION path, reached by SSH tunnel
# from the bastion. It is unchanged.
#
# The PUBLIC path goes through a cloud load balancer created by OpenTofu
# (`modules/providers/*/lb.tf`, the `app` resource). That LB is provisioned in
# PHASE 1, before the cluster exists: it therefore cannot discover a
# dynamically allocated port. The nodePorts Kubernetes assigns by default are
# random (30000-32767) — hence this dedicated Service with FIXED ports.
#
# ⚠️ THESE NUMBERS ARE A CONTRACT BETWEEN THE TWO REPOSITORIES. Changing them
# here requires changing `app_lb_node_ports` in OpenAether-infra
# (`infrastructure/opentofu/modules/providers/*/variables.tf`), otherwise the
# public LB points at nothing — exactly the original outage, where it targeted
# worker:80/443 while nothing was listening there.
#
# ── Why not pin the ports on Istio's own Service ──────────────────────────────
# It is generated by istiod, not by us: neither Kustomize nor the Gateway API's
# `spec.infrastructure` field lets you force a nodePort on it.
# An additional Service selecting the same pods is the simplest way not to
# conflict with its controller.
#
# ── Why not a CCM ─────────────────────────────────────────────────────────────
# A CCM would push provider-specific annotations up into this shared layer,
# while the rest of the architecture confines them to `modules/providers/`.
# And it does not exist on Proxmox, which is in scope.
---
apiVersion: v1
kind: Service
metadata:
  name: openaether-gateway-nodeport
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
spec:
  type: NodePort
  # `Cluster` (the default) rather than `Local`: the cloud LB targets ALL
  # workers, including those hosting no gateway pod. Under `Local` they would
  # fail the health check and traffic would concentrate on a single node.
  # Accepted trade-off: the source IP is masked by the node's SNAT — hence the
  # `host`/`remote-node` entities added to the `openaether-gateway` CNP.
  externalTrafficPolicy: Cluster
  # Selector taken from the `openaether-gateway` CNP (apps/base/istio/networkpolicy.yaml),
  # which works in production on this exact Gateway — so the label is verified.
  selector:
    service.istio.io/canonical-name: openaether-gateway-istio
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443
