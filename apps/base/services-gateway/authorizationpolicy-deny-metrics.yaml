# No route of the Gateway should serve a metrics endpoint: Grafana's /metrics answered 200 to any caller that reached
# the Gateway (Zitadel's is /debug/metrics). vmagent scrapes pod to pod. DENY runs before allow-gateway-ingress.
# Refusal seen on a cluster in a proof lab for Grafana and Zitadel; the forge's //metrics answered with its metrics at
# 0.4.2 (measured; 0.4.1 has the same apps/ tree, not run; below). Opt-out and limits: docs/public-exposure.md.
#
# SLASH SPELLINGS. This policy matches the path as it arrives, after Istio's BASE normalisation (dot segments, %2e,
# %6D, and the backslash, which becomes a slash). It does not merge slashes, and Forgejo cleans //metrics to /metrics,
# so the four literal paths alone let https://forge.<domain>//metrics through to the forge's metrics. Two layers close
# it, each on its own:
#   1. istiod meshConfig.pathNormalization MERGE_SLASHES (apps/base/istio/istiod.yaml): the policy then sees /metrics.
#   2. The two patterns `//*` and `/debug//*` below: a path that starts with `//`, or has `//` right after /debug, is
#      refused whatever the mesh does. Istio paths match only exactly, as a prefix (x*), as a suffix (*x) or anything
#      (*), so this is the shortest set: `//*` covers //metrics, ///metrics, //metrics/ and //debug/metrics;
#      `/debug//*` covers /debug//metrics. No suffix pattern (`*/metrics`): it would also refuse a repository or a
#      dashboard named metrics. No service gives a meaning to a path that starts with `//` (layer 1 merges it anyway).
# Not covered: a %2F spelling (/%2fmetrics) and case or ;param variants reach the service as written; no service of
# this repository served metrics on one (measured on a local rig and, first hop only, on two clusters that followed a
# branch ref). scripts/check-gateway-routes.py pins layers 1 and 2.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-metrics-paths
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - /metrics
              - /metrics/*
              - /debug/metrics
              - /debug/metrics/*
              - //*
              - /debug//*
