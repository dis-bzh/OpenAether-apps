apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether — north-south Gateway (ns services-gateway), DECOUPLED from the istio mesh.
# Separated from apps/base/istio because the `openaether-tls` cert is issued by
# (issuer openbao → pki/sign/openaether) et requiert une signature OFFLINE
# OpenBao. Leaving it in the istio Kustomization (wait:true) blocked istio and
# its dependants (observability, authz-policies). The mesh has its own CA → it
# must not depend on the OpenBao PKI.
# Deployed by flux 14c-services-gateway (wait:false, dependsOn istio +
# cert-manager-issuers + foundation-vault). The services-gateway ns and the
# `istio` GatewayClass are provided by the istio Kustomization.
resources:
  - gateway-openaether.yaml
  - service-nodeport.yaml
  - openbao-ca-bundle.yaml
  - certificate-openaether-tls.yaml
  - httproute-redirect.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "gateway"
