apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openaether-gateway
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintB"
    openaether.io/component: "gateway"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: openaether-gateway-options
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # By default accepts no cleartext HTTP route — the redirect is handled by an HTTPRoute
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: openaether-tls
            namespace: services-gateway
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openaether-gateway-options
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
data:
  # Istio merges this onto the Deployment it generates (Gateway API deployment customization). Kyverno reads
  # seccomp on the CONTAINER and the generated istio-proxy only carries it on the pod (#47).
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
