# OpenAether 0.5.0 — HTTP to HTTPS Redirect
# Attache un filtre RequestRedirect 301 au listener HTTP du gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-http-redirect
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: "gateway"
spec:
  parentRefs:
    - name: openaether-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301