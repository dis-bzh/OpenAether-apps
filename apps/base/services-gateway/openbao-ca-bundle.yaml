# OpenBao's CA bundle, materialised IN the gateway's namespace.
#
# ── Why this Certificate ───────────────────────────────────────────────────
# The openbao-tls `DestinationRule` (apps/base/foundation/vault) must have the
# gateway's Envoy verify OpenBao's certificate. Istio allows this through
# `trafficPolicy.tls.credentialName`, which reads a Secret — but in the CLIENT's
# namespace, here `services-gateway`. Yet the CA lives in `cert-manager`.
#
# So we ask cert-manager to issue a certificate here signed by the SAME CA: the
# resulting Secret contains `ca.crt`, which is all Envoy needs in SIMPLE mode.
# The leaf certificate itself is unused — that is the price of not adding a
# component (trust-manager) just to copy a 1 KB bundle.
#
#
# ⚠️ Alternative if you want to avoid the useless leaf: deploy trust-manager and
# replace this Certificate with a `Bundle`. Worth revisiting if other namespaces
# need the same — for a single one, this stays the lightest option.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca-bundle
  namespace: services-gateway
  labels:
    openaether.io/managed: "true"
    openaether.io/component: gateway
spec:
  secretName: openbao-ca-bundle
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: openbao-ca
    kind: ClusterIssuer
  # The name has no functional value: only the Secret's `ca.crt` is consumed.
  commonName: openbao-ca-bundle.services-gateway
  dnsNames:
    - openbao-ca-bundle.services-gateway.svc.cluster.local
