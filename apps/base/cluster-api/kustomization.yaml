apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenAether Phase A — CAPI Layer-0 (management cluster)
# Stack : CAPI Operator → CoreProvider + CABPT + CACPPT + CAPS + CAPO + CAPOSC
# Prépare le management cluster à provisionner des clusters tenant via CAPI.
# Phase B ajoutera les provider clusters (Level-1) dans apps/provider-clusters/.
resources:
  - namespace.yaml
  - operator.yaml
  - core-providers.yaml
  - infra-providers.yaml

labels:
  - includeSelectors: true
    pairs:
      openaether.io/managed: "true"
      openaether.io/component: "cluster-api"
