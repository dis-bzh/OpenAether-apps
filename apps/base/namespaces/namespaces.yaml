apiVersion: v1
kind: Namespace
metadata:
  name: foundation-networking
  labels:
    # Sprint 1: Istio ambient labels seront ajoutés (istio.io/dataplane-mode: ambient)
    # baseline: tolérance pour Gateway API controllers (hostPort potentiel)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-policy-engine
  labels:
    # baseline: Kyverno background-controller peut avoir besoin de host watchers
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# foundation-pki-root et foundation-vault sont ici (et non dans leurs services respectifs)
# car le RBAC cross-namespace (foundation-pki-root-rbac Kustomization) a besoin que ces
# deux namespaces existent AVANT que pki-root et vault soient déployés.
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-pki-root
  labels:
    # restricted: OpenBao tourne runAsNonRoot uid=100, drop ALL caps, readOnlyRootFS.
    # Aucune raison de privileged pour un secret store.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "openbao-pki-root"
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-vault
  labels:
    # restricted: OpenBao workload même profil que root (runAsNonRoot, drop ALL).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-workload
