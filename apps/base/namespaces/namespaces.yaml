apiVersion: v1
kind: Namespace
metadata:
  name: foundation-networking
  labels:
    istio.io/dataplane-mode: ambient
    # baseline: tolérance pour Gateway API controllers (hostPort potentiel)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-policy-engine
  labels:
    # baseline: Kyverno background-controller peut avoir besoin de host watchers
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# foundation-pki-root et foundation-vault sont ici (et non dans leurs services respectifs)
# car le RBAC cross-namespace (foundation-pki-root-rbac Kustomization) a besoin que ces
# deux namespaces existent AVANT que pki-root et vault soient déployés.
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-pki-root
  labels:
    # PAS de istio.io/dataplane-mode: ambient — couche fondation HORS mesh.
    # Raison: la PKI/secrets vit SOUS le mesh (cycle de dépendance sinon:
    # istio→cert-manager-issuers→cert-manager→openbao→ztunnel→istio). En ambient,
    # ztunnel encapsule le trafic dans HBONE/15008, bloqué par les
    # CiliumNetworkPolicy L4 (allow-list 8200/8201 only) + default-deny → reset.
    # Sécurité assurée par CiliumNetworkPolicy L3/L4 (identité SA) + OpenBao k8s-auth.
    # restricted: OpenBao tourne runAsNonRoot uid=100, drop ALL caps, readOnlyRootFS.
    # Aucune raison de privileged pour un secret store.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: "openbao-pki-root"
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-vault
  labels:
    # PAS de istio.io/dataplane-mode: ambient — couche fondation HORS mesh.
    # Même raison que foundation-pki-root: cycle de dépendance + HBONE/15008
    # bloqué par CiliumNetworkPolicy. Bonus: le raft inter-pod (8201) repasse
    # en direct (en ambient il partait aussi en HBONE → join cassé silencieusement).
    # restricted: OpenBao workload même profil que root (runAsNonRoot, drop ALL).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-workload
---
# services-observability déclaré ICI (et non dans observability/) car les
# AuthorizationPolicy Istio (Kustomization istio-authorizationpolicies, étape 14b)
# créent une policy default-deny DANS ce namespace AVANT que la Kustomization
# observability (étape 30) ne tourne. Sans déclaration précoce → 14b échoue
# "namespaces services-observability not found". Règle: tout namespace ciblé
# par une couche précoce doit exister tôt. Ambient conservé: c'est une app (mesh).
apiVersion: v1
kind: Namespace
metadata:
  name: services-observability
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    istio.io/dataplane-mode: ambient
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: "observability"
