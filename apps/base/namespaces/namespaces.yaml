apiVersion: v1
kind: Namespace
metadata:
  name: foundation-networking
  labels:
    istio.io/dataplane-mode: ambient
    # baseline: tolerance for Gateway API controllers (possible hostPort)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-policy-engine
  labels:
    # baseline: the Kyverno background-controller may need host watchers
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# foundation-vault lives here (rather than in its own service) because the
# cross-namespace RBAC needs it to exist BEFORE vault is deployed.
apiVersion: v1
kind: Namespace
metadata:
  name: foundation-vault
  labels:
    # NO istio.io/dataplane-mode: ambient — the foundation layer is OUTSIDE the mesh.
    # Reason: PKI/secrets live UNDER the mesh (otherwise a dependency cycle:
    # istio→cert-manager-issuers→cert-manager→openbao→ztunnel→istio) + HBONE/15008
    # blocked by CiliumNetworkPolicy. Bonus: inter-pod raft (8201) goes back to
    # direct (under ambient it also went over HBONE → join silently broken).
    # restricted: OpenBao tourne runAsNonRoot uid=100, drop ALL caps, readOnlyRootFS.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao
---
# services-observability is declared HERE (not in observability/) because the
# Istio AuthorizationPolicies (istio-authorizationpolicies Kustomization, step 14b)
# create a default-deny policy IN that namespace BEFORE the observability
# Kustomization (step 30) runs. Without an early declaration → 14b fails with
# "namespaces services-observability not found". Rule: any namespace targeted
# by an early layer must exist early.
#
# NO istio.io/dataplane-mode: ambient — observability is OUTSIDE the mesh.
# Reason: ambient redirects the kubelet probes (livez/readyz/health) through
# ztunnel HBONE :15008, blocked by the CiliumNetworkPolicies + default-deny.
# Result: vm-operator/kube-state-metrics/grafana start healthy then get killed
# on liveness failure (i/o timeout) → CrashLoop, and vmagent→vminsert goes over
# broken HBONE. Observability is infrastructure (it scrapes the whole cluster,
# talks to the kubelet :10250) → same logic as the out-of-mesh foundation
# (see foundation-vault above). L3/L4 security = CiliumNetworkPolicy.
# The Istio AuthorizationPolicies (step 14b) become inert here → to be cleaned up.
apiVersion: v1
kind: Namespace
metadata:
  name: services-observability
  labels:
    # enforce: baseline. node-exporter, the one workload here that needs hostPath/hostNetwork/hostPID, has its own
    # privileged namespace (services-observability-node, below). Baseline still forbids host namespaces, hostPath and
    # privileged containers for everything left here (Grafana, Loki, vm-*, Alloy, kube-state-metrics).
    # To go back: set enforce to privileged (and nothing else breaks). The rest of the stack stays:
    #   - outside the ambient mesh (see the block above)
    #   - excluded from Kyverno disallow-root-user (a broad exclusion, see that policy)
    #   - real security = L3/L4 CiliumNetworkPolicy (observability/networkpolicy.yaml)
    # warn/audit stay restricted → drift of the pods (grafana/loki/vm-*) stays visible in the apiserver logs.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: "observability"
---
# prometheus-node-exporter ALONE: it mounts hostPath /proc /sys / and runs hostNetwork/hostPID on port 9100, which only
# the privileged Pod Security level allows, and PSA has no per-pod granularity. The rest of the observability
# stack stays in services-observability. Nothing else may be deployed here
# (scripts/dev/test-node-exporter-namespace.py); Kyverno exempts node-exporter here by pod name.
# Out of the mesh like services-observability.
apiVersion: v1
kind: Namespace
metadata:
  name: services-observability-node
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
    openaether.io/managed: "true"
    openaether.io/component: "node-exporter"
