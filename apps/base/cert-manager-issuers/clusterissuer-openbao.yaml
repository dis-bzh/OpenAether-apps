apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao
spec:
  vault:
    path: pki/sign/openaether
    server: https://openbao.foundation-vault.svc.cluster.local:8200
    # OpenBao's internal CA. Resolved in cert-manager's "cluster resource
    # namespace" (`cert-manager`) — which is why the CA is issued there
    # (apps/base/foundation/vault-ca) rather than in foundation-vault.
    caBundleSecretRef:
      name: openbao-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-issuer
        serviceAccountRef:
          name: cert-manager
