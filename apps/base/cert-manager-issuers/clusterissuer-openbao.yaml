apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao
spec:
  vault:
    path: pki/sign/openaether
    server: https://openbao.foundation-vault.svc.cluster.local:8200
    # CA interne d'OpenBao. Résolue dans le « cluster resource namespace » de
    # cert-manager (`cert-manager`) — c'est pourquoi la CA y est émise
    # (apps/base/foundation/vault/tls.yaml) plutôt que dans foundation-vault.
    caBundleSecretRef:
      name: openbao-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-issuer
        serviceAccountRef:
          name: cert-manager
