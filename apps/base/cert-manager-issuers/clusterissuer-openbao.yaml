apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao
spec:
  vault:
    path: pki/sign/openaether
    server: http://openbao.foundation-vault.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-issuer
        serviceAccountRef:
          name: cert-manager
