apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ClusterIssuers séparés du HelmRelease cert-manager pour éviter le dry-run
# chicken-and-egg : les CRDs cert-manager.io/v1 n'existent qu'après l'install Helm.
# Cette kustomization est déployée par la Kustomization Flux 13b-cert-manager-issuers
# qui dépend de cert-manager (HelmRelease ready).
# Single OpenBao (foundation-vault) : un seul issuer signant via
# pki/sign/openaether. Les anciens issuers openbao-pki-root /
# openbao-pki-intermediate (mounts pki-root/pki-intermediate de l'archi 2-OpenBao)
# sont supprimés — non référencés par aucun Certificate.
resources:
  - clusterissuer-openbao.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "cert-manager"
