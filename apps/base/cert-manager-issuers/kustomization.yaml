apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ClusterIssuers séparés du HelmRelease cert-manager pour éviter le dry-run
# chicken-and-egg : les CRDs cert-manager.io/v1 n'existent qu'après l'install Helm.
# Cette kustomization est déployée par la Kustomization Flux 13b-cert-manager-issuers
# qui dépend de cert-manager (HelmRelease ready).
resources:
  - clusterissuer-openbao-pki.yaml
  - clusterissuer-openbao-workload.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "cert-manager"
