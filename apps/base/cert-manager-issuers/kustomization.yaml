apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ClusterIssuers kept separate from the cert-manager HelmRelease to avoid the
# dry-run chicken-and-egg: the cert-manager.io/v1 CRDs only exist after the Helm install.
# This kustomization is deployed by the 13b-cert-manager-issuers Flux Kustomization,
# which depends on cert-manager (HelmRelease ready).
# Single OpenBao (foundation-vault) : un seul issuer signant via
# pki/sign/openaether. The former openbao-pki-root issuers /
# openbao-pki-intermediate (mounts pki-root/pki-intermediate de l'archi 2-OpenBao)
# have been removed — referenced by no Certificate.
resources:
  - clusterissuer-openbao.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintB"
      openaether.io/component: "cert-manager"
