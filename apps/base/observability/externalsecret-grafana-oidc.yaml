# Credentials de l'application OIDC Grafana déclarée dans Zitadel.
#
# ── À faire côté Zitadel, une fois (console) ─────────────────────────────────
#   1. Projet « OpenAether » → Application → type **Web**
#   2. Méthode d'authentification : **Code** (PKCE recommandé) + client secret
#   3. Redirect URI      : https://grafana.openaether.local/login/generic_oauth
#      Post-logout URI   : https://grafana.openaether.local/login
#   4. Cocher « User Info inside ID Token » si l'on veut mapper des rôles
#   5. Reporter les identifiants dans OpenBao :
#        bao kv put secret/grafana/oidc client-id=… client-secret=…
#
# ⚠️ Tant que ce chemin n'est pas seedé, le Secret n'existe pas. Les variables
# d'environnement correspondantes sont déclarées `optional: true` côté
# HelmRelease : Grafana DÉMARRE quand même, avec son admin local. Sans ça, un
# SSO non configuré rendrait Grafana totalement inaccessible — l'inverse du but.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: grafana/oidc, property: client-id }
    - secretKey: client-secret
      remoteRef: { key: grafana/oidc, property: client-secret }
