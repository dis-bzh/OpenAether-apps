# Credentials of the Grafana OIDC application declared in Zitadel.
#
# ── To do once on the Zitadel side (console) ─────────────────────────────────
#   1. Projet « OpenAether » → Application → type **Web**
#   2. Authentication method: **Code** (PKCE recommended) + client secret
#   3. Redirect URI      : https://grafana.openaether.local/login/generic_oauth
#      Post-logout URI   : https://grafana.openaether.local/login
#   4. Tick "User Info inside ID Token" if you want to map roles
#   5. Store the credentials in OpenBao:
#        bao kv put secret/grafana/oidc client-id=… client-secret=…
#
# ⚠️ Until this path is seeded the Secret does not exist. The matching
# environment variables are declared `optional: true` on the HelmRelease side:
# Grafana STARTS anyway, with its local admin. Without that, an unconfigured
# SSO would make Grafana completely unreachable — the opposite of the goal.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: grafana/oidc, property: client-id }
    - secretKey: client-secret
      remoteRef: { key: grafana/oidc, property: client-secret }
