# OpenAether 0.5.0 Sprint C — Alloy (collecte logs Kubernetes → Loki)
# ──────────────────────────────────────────────────────────────────
# Alloy replaces Promtail as the log collector. DaemonSet (1 per node).
# Uses the Kubernetes API (loki.source.kubernetes) to collect pod logs without
# direct access to /var/log files → compatible with Docker-in-Docker AND Talos
# nodes (the containerd rootfs is not exposed as a hostPath).
#
# Config HCL inline: discovery → relabeling → loki.write.
# Extensible: add Alloy components (metrics, traces, OTEL) without a
# redeployment — edit the configMap and Alloy hot-reloads.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: alloy
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "0.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset
    alloy:
      configMap:
        content: |
          // ── Kubernetes pod discovery ───────────────────────────────────
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // ── Relabeling: enrich the logs with k8s metadata ──────────────
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            // Namespace
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            // Pod name
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            // Container name
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Label app (fallback: app.kubernetes.io/name)
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "(.+)"
              target_label  = "app"
            }

            // Sprint / composant OpenAether
            rule {
              source_labels = ["__meta_kubernetes_pod_label_openaether_io_component"]
              target_label  = "component"
            }

            // Exclude Alloy's own pods (avoids a log loop).
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "alloy"
              action        = "drop"
            }
          }

          // ── Collecte logs via API k8s ───────────────────────────────────
          // loki.source.kubernetes: stream logs through the kube API (no hostPath).
          // Works on Talos (containerd rootfs not exposed) and Docker-in-Docker.
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          // ── Ship to Loki ────────────────────────────────────────────────
          loki.write "default" {
            endpoint {
              url = "http://loki.services-observability.svc.cluster.local:3100/loki/api/v1/push"
            }
            // External labels common to every log of this cluster.
            external_labels = {
              cluster = "management",
            }
          }
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    rbac:
      create: true
    serviceAccount:
      create: true
    # Tolerations so it is deployed on the control-plane nodes too.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
