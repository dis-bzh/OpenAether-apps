# OpenAether 0.5.0 Sprint C — Loki HA (stockage logs)
# ──────────────────────────────────────────────────────────────────
# Mode: SingleBinary x2 (simple à opérer, HA par réplication Loki).
# Backend: S3 (MinIO en local, S3 natif en cloud via overlay).
# replication_factor=2: chaque chunk est répliqué sur les 2 instances.
#
# Destination S3 : ExternalSecret loki-s3-credentials (externalsecret-loki.yaml),
# alimenté par `secret/observability/loki-s3` dans OpenBao. Credentials ET
# emplacement (endpoint + bucket) transitent par ce Secret, injectés en
# `valuesFrom` : passer du MinIO interne au S3 du provider ne demande donc
# AUCUN changement de code, seulement un reseed. Destination volontairement
# distincte de `backup/s3-primary` — Loki n'a pas à pouvoir écrire dans le
# bucket des sauvegardes.
#
# schemaConfig v13 (tsdb): schéma recommandé depuis Loki 2.8+.
# auth_enabled=false: pas d'auth multi-tenant (cluster privé).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: loki
spec:
  url: https://grafana.github.io/helm-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "6.25.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: accessKey
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: secretKey
      targetPath: loki.storage.s3.secretAccessKey
    # endpoint et bucket viennent du MÊME Secret : le chart n'accepte que des
    # chaînes littérales, et cette brique ne peut pas être substituée par Flux
    # (les dashboards Grafana contiennent des ${datasource} qui seraient vidés).
    # Résultat : passer du MinIO interne au S3 du provider ne demande QUE de
    # reseeder `secret/observability/loki-s3` — aucun changement de code.
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: endpoint
      targetPath: loki.storage.s3.endpoint
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: bucket
      targetPath: loki.storage.bucketNames.chunks
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: bucket
      targetPath: loki.storage.bucketNames.ruler
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: bucket
      targetPath: loki.storage.bucketNames.admin
  values:
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 2
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: loki
                    app.kubernetes.io/component: single-binary
                topologyKey: kubernetes.io/hostname
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 2
      storage:
        type: s3
        # bucketNames et endpoint sont ÉCRASÉS par les `valuesFrom` ci-dessus,
        # depuis le Secret loki-s3-credentials. Ces valeurs ne servent que de
        # documentation du format attendu.
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          endpoint: http://minio.foundation-storage:9000
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 30d
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
    # Pas de MinIO intégré (on utilise notre propre instance).
    minio:
      enabled: false
    # Caches memcached désactivés : le chart Loki les dimensionne pour la prod
    # (chunksCache ~9.6Gi + resultsCache ~1.2Gi de requests mémoire). Le
    # chunksCache (8Gi alloc) ne rentre sur AUCUN worker DEV-S (~3.3Gi
    # allouables) → Pending permanent, et la pression mémoire bloque aussi
    # le scheduling de vminsert. En SingleBinary dev (faible volume de logs),
    # le cache n'apporte rien d'essentiel. À ré-activer + dimensionner si les
    # workers grossissent (cf. sizing nodes / overlay cloud).
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Pas de gateway/ingress (accès interne seulement via service ClusterIP).
    gateway:
      enabled: false
    # Désactiver les composants distribués non nécessaires en SingleBinary.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    monitoring:
      serviceMonitor:
        enabled: false
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
