# OpenAether 0.5.0 Sprint C — Loki HA (log storage)
# ──────────────────────────────────────────────────────────────────
# Mode: SingleBinary x3, replication_factor 2 (simple to operate). Three, not two: with 2
# replicas and RF 2 a write needs both, so one pod down (drain, upgrade) rejects every push.
# With 3, one can be down. Capacity: +100m CPU / +256Mi memory requested per replica.
# Backend: S3 (local MinIO or the provider's S3, chosen by the seeded endpoint).
# replication_factor=2: every chunk is replicated across both instances.
#
# S3 destination: ExternalSecret loki-s3-credentials (externalsecret-loki.yaml),
# fed from `secret/observability/loki-s3` in OpenBao. Credentials AND location
# (endpoint + bucket) travel through that Secret, injected with `valuesFrom`:
# moving from the internal MinIO to the provider's S3 therefore requires NO
# code change at all, only a reseed. OpenAether-infra's seed gives it a bucket of its own
# (`…-logs-<env>`); the keys are a dedicated pair only when the operator supplies one
# (infra #302). Otherwise they are the primary store's, and Loki can still reach the backups.
#
# schemaConfig v13 (tsdb): the recommended schema since Loki 2.8+.
# auth_enabled=false: no multi-tenant auth (private cluster).
#
# Retention: 8760h (365 days; ANSSI hygiene M36, PA-012 R25), ENFORCED by the compactor: the
# limit alone deletes nothing. Do not turn the compactor on with a shorter value: it deletes
# at once what is older. The local overlay (local/) shortens it to protect the MinIO disk.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: loki
spec:
  url: https://grafana.github.io/helm-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "6.25.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: accessKey
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: secretKey
      targetPath: loki.storage.s3.secretAccessKey
    # endpoint and bucket come from the SAME Secret: the chart only accepts
    # literal strings, and this brick cannot be substituted by Flux (the Grafana
    # dashboards contain ${datasource} placeholders that would be blanked).
    # Result: moving from the internal MinIO to the provider's S3 ONLY requires
    # reseeding `secret/observability/loki-s3` — no code change.
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: endpoint
      targetPath: loki.storage.s3.endpoint
    # Loki signs SigV4 with this region (Loki 3.3.2 sends "dummy" when it is unset) and Scaleway and
    # OVH answer a mismatch with AuthorizationHeaderMalformed ("region ... is wrong; expecting ...").
    # The ExternalSecret fills it: seeded value, else read from the provider endpoint, else us-east-1.
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: region
      targetPath: loki.storage.s3.region
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: bucket
      targetPath: loki.storage.bucketNames.chunks
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: bucket
      targetPath: loki.storage.bucketNames.ruler
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: bucket
      targetPath: loki.storage.bucketNames.admin
  values:
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 3
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # Preferred, not required: clusters have 1 to 3 workers, and a required rule would leave a
      # replica Pending (the HelmRelease then fails and rolls back). The chart exposes no
      # topologySpreadConstraints for the single binary, so this is the only spread.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: loki
                    app.kubernetes.io/component: single-binary
                topologyKey: kubernetes.io/hostname
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    loki:
      # Kyverno reads the container level (#47): all four fields are set here.
      containerSecurityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      auth_enabled: false
      commonConfig:
        replication_factor: 2
      # Without this block retention_enabled stays false and limits_config.retention_period is
      # never applied. Every replica runs the compactor; Loki elects one (compactor ring), to
      # be confirmed in the lab.
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: s3
        compaction_interval: 10m
        retention_delete_delay: 2h
      storage:
        type: s3
        # The endpoint, the region and the three bucket names are NOT set here: they come from the
        # loki-s3-credentials Secret through `valuesFrom` above. `spec.values` is merged AFTER
        # `valuesFrom` and wins, so a literal here silently replaced the seeded destination: on a
        # cloud cluster Loki wrote to a MinIO that does not exist and refused every push (500,
        # "at least 2 live replicas required"), measured 2026-10-13.
        s3:
          s3ForcePathStyle: true
          # No `insecure` here (chart default false): the seeded endpoint decides the scheme,
          # https:// for a provider; the local overlay sets it true for the MinIO.
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 8760h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
    # No cluster-wide read of ConfigMaps and Secrets. The chart's rules sidecar (loki_rule
    # ConfigMaps) is the only reason for that ClusterRole, and no Loki ruler is deployed;
    # namespaced keeps the chart from rendering it back if the sidecar is ever re-enabled.
    sidecar:
      rules:
        enabled: false
    rbac:
      namespaced: true
    # No bundled MinIO (we use our own instance).
    minio:
      enabled: false
    # memcached caches disabled: the Loki chart sizes them for production
    # (chunksCache ~9.6Gi + resultsCache ~1.2Gi of memory requests). The
    # chunksCache (8Gi alloc) fits on NO DEV-S worker (~3.3Gi allocatable) →
    # permanently Pending, and the memory pressure also blocks vminsert
    # scheduling. In SingleBinary dev (low log volume) the cache brings nothing
    # essential. To re-enable and size if the
    # workers grossissent (cf. sizing nodes / overlay cloud).
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # No gateway/ingress (internal access only, through the ClusterIP service).
    gateway:
      enabled: false
    # Disable the distributed components that SingleBinary does not need.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # Never evict the last replica. minAvailable 2 would keep the write quorum, but the pods are
    # pinned to their node by local-path, so a drain of a node holding two of them would wait
    # forever for the first to come back. An unready pod never blocks an eviction.
    podDisruptionBudget:
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    monitoring:
      serviceMonitor:
        enabled: false
      selfMonitoring:
        enabled: false
    # Top-level in chart 6.25.0 (it was under monitoring:, which is ignored): no canary
    # DaemonSet on every node, nothing reads its metrics.
    lokiCanary:
      enabled: false
    # The chart refuses to render with the canary off while its helm test is on
    # (validate.yaml), and Flux runs no helm test here.
    test:
      enabled: false
