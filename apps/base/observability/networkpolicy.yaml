# OpenAether 0.5.0 Sprint C — NetworkPolicies Observability
# ──────────────────────────────────────────────────────────────────
# One CiliumNetworkPolicy per component in services-observability.
# Principle: Cilium's implicit deny-all + an explicit allow per flow.
#
# Main flows:
#   VMAgent       → vminsert :8480 (remote_write)
#   VMAlert       → vmselect :8481 (evaluate) + vminsert :8480 (alert state)
#   VMAlert       → vmalertmanager :9093 (fire)
#   Grafana       ← Istio gateway :3000 (UI)
#   Grafana       → vmselect :8481 + Loki :3100 + CNPG :5432
#   Loki          ← Alloy :3100 (push logs)
#   Alloy         → Loki :3100 + k8s API :443 (discovery)
#   node-exporter ← VMAgent :9100
#   KSM           ← VMAgent :8080
# ──────────────────────────────────────────────────────────────────

# ── VMAgent ────────────────────────────────────────────────────────
# egress: DNS + k8s API (SD) + every pod's scrape ports + vminsert
# ingress: none (VMAgent serves no external requests)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent
spec:
  description: "VMAgent: egress scraping cluster-wide + remote_write vminsert."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (SD discovery + auth)
    # kube-apiserver through toEntities (NOT toServices:kubernetes). The
    # `kubernetes` Service DNATs 443→6443: toServices only opens 443, but Cilium
    # applies egress on the post-DNAT port (6443) → dropped. There is no
    # fallback toEntities → k8s SD (Alloy/vmagent/Grafana sidecar) breaks.
    - toEntities:
        - kube-apiserver
    # remote_write to vminsert
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vminsert
      toPorts:
        - ports:
            - port: "8480"
              protocol: TCP
    # Cluster-wide scraping: all pods on the usual metrics ports.
    # VMAgent uses a dynamic port per target; allow the standard scraping
    # ports for the known components.
    # ⚠️ toPorts ALONE means any destination, world included; toEntities: cluster
    # bounds scraping to the cluster (stops a compromised VMAgent reaching an
    # OpenBao :8200 outside it).
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"   # kube-state-metrics, vmalert, many operators
              protocol: TCP
            - port: "8200"   # OpenBao metrics
              protocol: TCP
            - port: "8428"   # VMSingle (if present)
              protocol: TCP
            - port: "8429"   # vmagent self-metrics (peer scrape)
              protocol: TCP
            - port: "8480"   # vminsert
              protocol: TCP
            - port: "8481"   # vmselect
              protocol: TCP
            - port: "8482"   # vmstorage self-metrics
              protocol: TCP
            - port: "9090"   # Prometheus compat
              protocol: TCP
            - port: "9093"   # vmalertmanager self-metrics
              protocol: TCP
            - port: "9100"   # node-exporter
              protocol: TCP
            - port: "9187"   # postgres-exporter
              protocol: TCP
    # Scrape kubelet/cadvisor on the nodes (:10250) — a host target, not a pod.
    # Under ambient this traffic went over HBONE; outside the mesh it must be
    # allowed explicitly to the host + remote-node entities.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"  # kubelet metrics + cadvisor
              protocol: TCP

# ── VMCluster (vminsert + vmstorage + vmselect) ────────────────────
# Labels set by VMOperator: app.kubernetes.io/name = vminsert|vmstorage|vmselect
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vminsert
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmcluster
spec:
  description: "vminsert: ingress VMAgent :8480, egress vmstorage :8400."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vminsert
  ingress:
    # VMAgent (scraped series) and VMAlert (ALERTS/ALERTS_FOR_STATE, which is
    # what survives a restart and keeps the long `for:` windows armed).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmalert
      toPorts:
        - ports:
            - port: "8480"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmstorage
      toPorts:
        - ports:
            - port: "8400"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmstorage
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmcluster
spec:
  description: "vmstorage: ingress vminsert :8400 + vmselect :8401 + peers :8401 + VMAgent :8482."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmstorage
  ingress:
    # Self-metrics on 8482 (disk usage, ingestion rate, per-storage series
    # counts). This rule was missing, so vmstorage was never scraped — invisible
    # because a target that is never discovered produces no `up` series at all.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8482"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vminsert
      toPorts:
        - ports:
            - port: "8400"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmselect
      toPorts:
        - ports:
            - port: "8401"
              protocol: TCP
    # vmstorage peers (internal VMCluster replication)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmstorage
      toPorts:
        - ports:
            - port: "8400"
              protocol: TCP
            - port: "8401"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmstorage
      toPorts:
        - ports:
            - port: "8400"
              protocol: TCP
            - port: "8401"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmselect
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmcluster
spec:
  description: "vmselect: ingress Grafana + VMAlert :8481, egress vmstorage :8401."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmselect
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "8481"
              protocol: TCP
    # VMAlert reads here on every evaluation (datasource + remoteRead). Drop
    # this rule and no rule in the cluster is ever evaluated again.
    # VMAgent scrapes vmselect's OWN metrics on the same port — 8481 serves both
    # queries and /metrics, so removing the VMAgent rule as "query-only" takes
    # the self-scrape down with it (done on 2026-07-29, caught by `up == 0`).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmalert
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8481"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmstorage
      toPorts:
        - ports:
            - port: "8401"
              protocol: TCP

# ── VMAlert + VMAlertmanager ───────────────────────────────────────
# Labels set by VMOperator: app.kubernetes.io/name = vmalert | vmalertmanager
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalert
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmalert
spec:
  description: "VMAlert: egress vmselect :8481 + vminsert :8480 + alertmanager :9093, ingress VMAgent :8080."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Read the rules' data (datasource + remoteRead).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmselect
      toPorts:
        - ports:
            - port: "8481"
              protocol: TCP
    # Persist ALERTS/ALERTS_FOR_STATE.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vminsert
      toPorts:
        - ports:
            - port: "8480"
              protocol: TCP
    # Deliver the firing alerts. Without this rule they are evaluated and then
    # dropped on the wire — the exact silence this whole stack exists to end.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalertmanager
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmalertmanager
spec:
  description: "VMAlertmanager: ingress VMAlert + VMAgent :9093, egress DNS only."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmalert
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The config-reloader INIT container reads the config Secret through the API
    # and blocks the pod until it succeeds — with DNS-only egress, Alertmanager
    # never starts (Init:CrashLoopBackOff, "dial 10.96.0.1:443: i/o timeout").
    # toEntities and not toServices: the `kubernetes` Service DNATs 443→6443 and
    # Cilium enforces on the post-DNAT port. Same trap as VMAgent above.
    - toEntities:
        - kube-apiserver
    # No egress to the outside: the receiver is empty. Adding a real one (SMTP,
    # Slack, webhook) means adding its egress here, or the notification is
    # dropped on the wire with nothing to show for it.

# ── Loki ──────────────────────────────────────────────────────────
# ingress: Alloy (push logs) + Grafana (query)
# egress: DNS + MinIO :9000 (chunks S3)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: loki
spec:
  description: "Loki: ingress Alloy+Grafana :3100, egress MinIO :9000."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    # Alloy: logs push (DaemonSet, hostNetwork=false → pod IP normale)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Grafana: query logs
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Loki peers (memberlist replication)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "7946"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # MinIO S3 (local) ou S3 cloud :443 (overlay)
    # ⚠️ the minio 5.2.0 chart sets the legacy label `app: minio` (NOT
    # app.kubernetes.io/name) — found during the backup brick's e2e test:
    # the canonical selector alone matches NOTHING → local S3 egress dropped.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app: minio
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-storage
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Cloud S3 (HTTPS) — for the cloud overlay.
    # ⚠️ toEntities:world :443 = n'importe quelle IP publique → exfiltration possible.
    # Narrowed to the provider's cloud S3 FQDNs. Cloud overlays may add other
    # providers if needed.
    # Locally: this rule is never reached (the internal MinIO :9000 is enough).
    - toFQDNs:
        - matchName: s3.fr-par.scw.cloud     # Scaleway Object Storage
        - matchName: s3.eu-west-par.io.cloud.ovh.net  # OVH (aligned with the eu-west-par tfvars)
        - matchName: oos.eu-west-2.outscale.com   # Outscale OSU
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

# ── Alloy (DaemonSet) ──────────────────────────────────────────────
# egress: DNS + Loki :3100 + k8s API :443 (discovery pods)
# Alloy uses the k8s API to read logs → no hostPath required.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: alloy
spec:
  description: "Alloy DaemonSet: egress DNS + Loki :3100 + k8s API :443."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver through toEntities (NOT toServices:kubernetes). The
    # `kubernetes` Service DNATs 443→6443: toServices only opens 443, but Cilium
    # applies egress on the post-DNAT port (6443) → dropped. There is no
    # fallback toEntities → k8s SD (Alloy/vmagent/Grafana sidecar) breaks.
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP

# ── Grafana ────────────────────────────────────────────────────────
# ingress: Istio gateway :80 (the HTTPRoute redirects to :80/3000)
# egress: DNS + vmselect :8481 + Loki :3100 + CNPG :5432 + k8s API (sidecar)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana
spec:
  description: "Grafana: ingress Istio gateway, egress datasources + CNPG + OIDC Zitadel."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # Gateway Envoy (services-gateway, outside ambient) → Grafana :3000 directly.
    # Observability outside the mesh: no more ztunnel/waypoint, Envoy connects
    # directement au pod Grafana → source = namespace services-gateway.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-gateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Loki (memberlist/health internal)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # k8s API (sidecar dashboard discovery + ServiceAccountToken)
    # kube-apiserver through toEntities (NOT toServices:kubernetes). The
    # `kubernetes` Service DNATs 443→6443: toServices only opens 443, but Cilium
    # applies egress on the post-DNAT port (6443) → dropped. There is no
    # fallback toEntities → k8s SD (Alloy/vmagent/Grafana sidecar) breaks.
    - toEntities:
        - kube-apiserver
    # vmselect (datasource VictoriaMetrics)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: vmselect
      toPorts:
        - ports:
            - port: "8481"
              protocol: TCP
    # Loki (datasource logs)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-observability
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # CNPG PostgreSQL (grafana-db)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-databases
            cnpg.io/cluster: grafana-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Zitadel OIDC — SSO. The browser talks to Zitadel on its own side, but
    # Grafana ALSO calls it server-side (exchanging the code for a token, then
    # /oidc/v1/userinfo). Without this rule the login fails with Cilium's
    # "operation not permitted", with nothing in the Grafana logs but a
    # timeout.
    # Targeted by namespace + app + REAL port: a `toEndpoints: {}` would be
    # scoped to the local namespace and would never match cross-ns.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: services-identity
            app.kubernetes.io/name: zitadel
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
