# OpenAether 0.5.0 Sprint C — node-exporter (node metrics)
# ──────────────────────────────────────────────────────────────────
# DaemonSet: 1 pod per node → HA by nature (5 pods on 5 nodes).
# Exposes the node's CPU, memory, disk, network and filesystem.
# Requires hostPID + hostNetwork to reach the system metrics.
# Scraping: VMServiceScrape node-exporter (vmscapes.yaml).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: node-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.39.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 15m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Talos: /host mounted from hostPath to reach the FS metrics.
    hostRootFsMount:
      enabled: true
      mountPropagation: HostToContainer
    # No ServiceMonitor (VMServiceScrape lives in vmscapes.yaml).
    prometheus:
      monitor:
        enabled: false
    # Tolerations so it is deployed on every node (control-plane included).
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
