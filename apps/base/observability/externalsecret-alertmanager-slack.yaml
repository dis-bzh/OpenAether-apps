# Alertmanager's Slack webhook.
#
# The URL IS the credential — anyone holding it can post to the channel — so it
# never appears in git: OpenBao holds it, ESO projects it, and Alertmanager
# reads it from a FILE (`api_url_file`), never from its config.
#
# To seed once per cluster:
#   bao kv put secret/observability/alertmanager-slack \
#     webhook-url=https://hooks.slack.com/services/T…/B…/…
#
# ⚠️ Until seeded, this ExternalSecret stays NotReady and Alertmanager will not
# start — so NOTHING is alerted. That is deliberate and it is the honest
# failure: the previous state (an empty receiver) looked healthy while every
# alert went nowhere. Choose between real alerting and a visible outage, not
# between real alerting and a comfortable illusion.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmalertmanager
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef: { key: observability/alertmanager-slack, property: webhook-url }
