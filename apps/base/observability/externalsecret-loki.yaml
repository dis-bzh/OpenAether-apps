# Loki's S3 destination — credentials AND location travel through this Secret,
# so switching from the internal MinIO to the provider's S3 needs no code change.
#
# ⚠️ Intended to be NOT `backup/s3-primary` (a compromised Loki could erase the backups), but
# today infra's seed-openbao.sh fills this path with the SAME bucket and keys as
# backup/s3-primary (infra #302): Loki holds the backup bucket's write key until a
# dedicated bucket and key are seeded.
#
# To seed once per cluster (cloud, or the local MinIO):
#   bao kv put secret/observability/loki-s3 endpoint=… bucket=… accessKey=… secretKey=…
#
# Until seeded, this ExternalSecret stays NotReady and Loki does not install —
# deliberate: a visible failure beats logs written silently to the wrong place.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: loki
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef: { key: observability/loki-s3, property: accessKey }
    - secretKey: secretKey
      remoteRef: { key: observability/loki-s3, property: secretKey }
    # endpoint and bucket travel through the SAME Secret, consumed with
    # `valuesFrom` on the HelmRelease side: the chart only accepts literal
    # strings and this brick cannot be substituted by Flux (the Grafana
    # dashboards contain ${datasource} placeholders that would be blanked).
    - secretKey: endpoint
      remoteRef: { key: observability/loki-s3, property: endpoint }
    - secretKey: bucket
      remoteRef: { key: observability/loki-s3, property: bucket }
