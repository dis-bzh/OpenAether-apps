# Destination S3 de Loki — credentials ET emplacement.
#
# ── Why a DEDICATED destination ──────────────────────────────────────────────
# Loki pointed at `minio/root`: in the cloud its logs therefore landed on the
# internal MinIO, hence on Longhorn volumes — which defeats the point of object
# storage and puts the logs in the same basket as everything else.
#
# We do NOT reuse `backup/s3-primary` (the destination of the restic
# repositories, CNPG PITR and volume backups): that would give Loki WRITE access
# to the backup bucket. A compromised Loki could erase them.
# Destination distincte, credentials distincts.
#
# ── To be seeded by the operator (once per cluster) ──────────────────────────
#   bao kv put secret/observability/loki-s3 \
#     endpoint="https://s3.fr-par.scw.cloud" bucket="s3-openaether-scw-loki-dev" \
#     accessKey=… secretKey=…
# Locally, point at the internal MinIO to reproduce the current behaviour:
#   bao kv put secret/observability/loki-s3 \
#     endpoint="http://minio.foundation-storage:9000" bucket="loki" \
#     accessKey=… secretKey=…      # same values as secret/minio/root
#
# ⚠️ Until this path is seeded the ExternalSecret stays NotReady and the Loki
# HelmRelease does not install (it consumes that Secret through valuesFrom).
# That is deliberate: a visible failure beats a Loki silently writing to the
# wrong place — the very defect being fixed here.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: loki
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef: { key: observability/loki-s3, property: accessKey }
    - secretKey: secretKey
      remoteRef: { key: observability/loki-s3, property: secretKey }
    # endpoint and bucket travel through the SAME Secret, consumed with
    # `valuesFrom` on the HelmRelease side: the chart only accepts literal
    # strings and this brick cannot be substituted by Flux (the Grafana
    # dashboards contain ${datasource} placeholders that would be blanked).
    - secretKey: endpoint
      remoteRef: { key: observability/loki-s3, property: endpoint }
    - secretKey: bucket
      remoteRef: { key: observability/loki-s3, property: bucket }
