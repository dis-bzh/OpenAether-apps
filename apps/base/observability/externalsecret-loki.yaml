# Loki's S3 destination — credentials AND location travel through this Secret,
# so switching from the internal MinIO to the provider's S3 needs no code change.
#
# The bucket is Loki's own (OpenAether-infra's seed writes `…-logs-<env>`, infra #302). The keys
# are a pair limited to it only if the operator gave one (OA_LOKI_S3_ACCESS_KEY_ID and
# OA_LOKI_S3_SECRET_ACCESS_KEY); otherwise they are the primary store's and a compromised Loki can
# still erase the backups, the separate bucket then only protects against a mistake.
#
# To seed once per cluster (cloud, or the local MinIO):
#   bao kv put secret/observability/loki-s3 endpoint=… bucket=… accessKey=… secretKey=… [region=…]
# `region` is optional (see the template below): set it when the endpoint is not a Scaleway,
# OVH or Outscale host name from which it can be read.
#
# Until seeded, this ExternalSecret stays NotReady and Loki does not install —
# deliberate: a visible failure beats logs written silently to the wrong place.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: loki
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
    # `extract` + a template instead of one `data` entry per key: the optional `region` may be
    # absent from the seed (every existing cluster), and a `data` entry for a missing property
    # makes the ExternalSecret fail. Only the five keys below reach the Secret.
    template:
      engineVersion: v2
      data:
        accessKey: '{{ .accessKey }}'
        secretKey: '{{ .secretKey }}'
        # endpoint and bucket travel through the SAME Secret, consumed with `valuesFrom` on the
        # HelmRelease side: the chart only accepts literal strings and this brick cannot be
        # substituted by Flux (the Grafana dashboards contain ${datasource} placeholders).
        endpoint: '{{ .endpoint }}'
        bucket: '{{ .bucket }}'
        # Loki signs SigV4 with this region and Scaleway/OVH/Outscale refuse another one
        # (loki.yaml). Seeded `region` wins; else read from the provider's endpoint host; else
        # us-east-1 (the local MinIO, which ignores it, and what was hard-coded before).
        region: |-
          {{- $hosts := "s3\\.[a-z0-9-]+\\.(scw\\.cloud|io\\.cloud\\.ovh\\.net|perf\\.cloud\\.ovh\\.net)" -}}
          {{- $oos := "oos\\.[a-z0-9-]+\\.outscale\\.[a-z]+" -}}
          {{- if index . "region" -}}{{ index . "region" }}
          {{- else if regexMatch (printf "^https://(%s|%s)(:[0-9]+)?/?$" $hosts $oos) .endpoint -}}
          {{ regexReplaceAll "^https://(s3|oos)\\.([a-z0-9-]+)\\..*$" .endpoint "${2}" }}
          {{- else -}}us-east-1
          {{- end -}}
  dataFrom:
    - extract:
        key: observability/loki-s3
