# Destination S3 de Loki — credentials ET emplacement.
#
# ── Pourquoi une destination DÉDIÉE ──────────────────────────────────────────
# Loki pointait `minio/root` : en cloud, ses logs atterrissaient donc sur le
# MinIO interne, donc sur des volumes Longhorn — ce qui annule l'intérêt d'un
# stockage objet et met les logs dans le même panier que le reste.
#
# On ne réutilise PAS `backup/s3-primary` (la destination des dépôts restic, du
# PITR CNPG et des backups de volumes) : ce serait donner à Loki un accès en
# ÉCRITURE au bucket des sauvegardes. Un Loki compromis pourrait les effacer.
# Destination distincte, credentials distincts.
#
# ── À seeder par l'opérateur (une fois par cluster) ───────────────────────────
#   bao kv put secret/observability/loki-s3 \
#     endpoint="https://s3.fr-par.scw.cloud" bucket="s3-openaether-scw-loki-dev" \
#     accessKey=… secretKey=…
# En local, pointer sur le MinIO interne pour retrouver le comportement actuel :
#   bao kv put secret/observability/loki-s3 \
#     endpoint="http://minio.foundation-storage:9000" bucket="loki" \
#     accessKey=… secretKey=…      # mêmes valeurs que secret/minio/root
#
# ⚠️ Tant que ce chemin n'est pas seedé, l'ExternalSecret reste NotReady et le
# HelmRelease Loki ne s'installe pas (il consomme ce Secret via valuesFrom).
# C'est volontaire : mieux vaut un échec visible qu'un Loki qui écrit silencieusement
# au mauvais endroit — le défaut qu'on corrige ici.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: loki
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef: { key: observability/loki-s3, property: accessKey }
    - secretKey: secretKey
      remoteRef: { key: observability/loki-s3, property: secretKey }
    # endpoint et bucket transitent par le MÊME Secret, consommés en `valuesFrom`
    # côté HelmRelease : le chart n'accepte que des chaînes littérales et cette
    # brique ne peut pas être substituée par Flux (les dashboards Grafana
    # contiennent des ${datasource} qui seraient vidés).
    - secretKey: endpoint
      remoteRef: { key: observability/loki-s3, property: endpoint }
    - secretKey: bucket
      remoteRef: { key: observability/loki-s3, property: bucket }
