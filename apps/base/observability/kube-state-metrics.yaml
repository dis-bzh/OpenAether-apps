# OpenAether 0.5.0 Sprint C — kube-state-metrics
# ──────────────────────────────────────────────────────────────────
# Exposes the metrics of Kubernetes objects (Deployments, Pods, Nodes,
# PersistentVolumes, etc.) au format Prometheus.
# Scraping is handled by the kube-state-metrics VMServiceScrape (vmscapes.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: kube-state-metrics
spec:
  url: https://prometheus-community.github.io/helm-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: kube-state-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "5.25.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 2
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kube-state-metrics
              topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 512Mi
    # No ServiceMonitor (we use VMServiceScrape in vmscapes.yaml).
    prometheus:
      monitor:
        enabled: false
    # podDisruptionBudget: the kube-state-metrics 5.25.1 chart expects the raw PDB spec
    # (minAvailable/maxUnavailable), WITHOUT an `enabled` field, which breaks the schema.
    podDisruptionBudget:
      minAvailable: 1
