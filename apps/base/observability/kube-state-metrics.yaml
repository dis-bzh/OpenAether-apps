# OpenAether 0.5.0 Sprint C — kube-state-metrics
# ──────────────────────────────────────────────────────────────────
# Exposes the metrics of Kubernetes objects (Deployments, Pods, Nodes,
# PersistentVolumes, etc.) in the Prometheus format.
# Scraping is handled by the kube-state-metrics VMServiceScrape (vmscapes.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: kube-state-metrics
spec:
  url: https://prometheus-community.github.io/helm-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: kube-state-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "8.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Kyverno reads the container level (#47): all four fields are set here.
    containerSecurityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    # The chart's default collectors minus `secrets` and `configmaps` (chart key, unchanged to 8.6.0): the default
    # ClusterRole lists Secrets cluster-wide, which returns their data, and no rule, scrape or dashboard reads
    # kube_secret_* or kube_configmap_*. A list REPLACES the default: a collector added upstream later must be
    # added here.
    # The node labels the loss alerts read: the failure domain of each node (topology.kubernetes.io/zone, set by the
    # Talos machine config) for FailureDomainLost. Only this key: other labels can carry free text.
    metricLabelsAllowlist:
      - nodes=[topology.kubernetes.io/zone]
    collectors:
      - certificatesigningrequests
      - cronjobs
      - daemonsets
      - deployments
      - endpoints
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - leases
      - limitranges
      - mutatingwebhookconfigurations
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - replicationcontrollers
      - resourcequotas
      - services
      - statefulsets
      - storageclasses
      - validatingwebhookconfigurations
      - volumeattachments
    # ⚠️ ONE replica, deliberately. `replicaCount: 2` used to sit here and this
    # chart's key is `replicas` — Helm ignored the value in silence and the
    # Deployment ran at 1 for as long as anyone had been reading it as HA.
    # Two is also the wrong answer: without sharding, both pods export the same
    # series under different `pod` labels, so every `sum()` in the alert rules
    # would double. A brief gap while a node drains is the cheaper failure.
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 512Mi
    # No ServiceMonitor (we use VMServiceScrape in vmscapes.yaml).
    prometheus:
      monitor:
        enabled: false
    # Per-object Flux state, gotk_resource_info{ready,suspended}: the controllers themselves export only
    # reconcile durations (kustomize-controller v1.8.5 records no gotk_reconcile_condition), so
    # FluxObjectNotReady (vmrule-platform.yaml) reads this. The mapping is the one of the Flux docs
    # (monitoring/custom-metrics), cut to the four kinds this repo reconciles. The core collectors stay on:
    # the node, pod and backup rules read them. list+watch on the Flux objects only, no secrets.
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Kustomization resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRelease resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux GitRepository resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    # False when spec.verify rejected the HEAD commit (unsigned or signed by an unknown key); empty
                    # while
                    # git-verify is off (no such condition). Read by FluxSourceNotVerified (infra #337).
                    source_verified: [status, conditions, "[type=SourceVerified]", status]
            - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRepository resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
    rbac:
      extraRules:
        - apiGroups:
            - source.toolkit.fluxcd.io
            - kustomize.toolkit.fluxcd.io
            - helm.toolkit.fluxcd.io
          resources: [gitrepositories, helmrepositories, kustomizations, helmreleases]
          verbs: [list, watch]
    # podDisruptionBudget: the kube-state-metrics chart expects the raw PDB spec
    # (minAvailable/maxUnavailable), WITHOUT an `enabled` field, which breaks the schema.
    #
    # maxUnavailable, NOT minAvailable. `minAvailable: 1` on a one-replica
    # Deployment means disruptionsAllowed=0 for ever: the pod can never be
    # evicted, so no node carrying it can ever be drained. It blocked every
    # Talos node roll that reached it (2026-08-14, three runs; 2026-08-15 again),
    # and it is the wrong promise for a stateless exporter — losing it for a
    # minute costs a gap in the graphs, not availability.
    podDisruptionBudget:
      maxUnavailable: 1
