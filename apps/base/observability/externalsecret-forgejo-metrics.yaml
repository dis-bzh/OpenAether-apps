# The bearer token of Forgejo's /metrics, for the VMPodScrape `forgejo` (vm-customresources/vmscrapes-pipeline.yaml).
#
# Forgejo asks for it ([metrics] TOKEN, GITEA__metrics__TOKEN in apps/base/forgejo/helmrelease.yaml) because /metrics
# answered without a credential and, spelled //metrics, reached the Internet at 0.4.1 and 0.4.2. The operator resolves
# a scrape's Secret in the scrape's own namespace, and the forge's Kustomization (services-git) does not depend on the
# VM CRDs, so the same OpenBao key (secret/forgejo/metrics, seeded by the vault configure Job) feeds two
# ExternalSecrets: this one and services-git/forgejo-metrics.
#
# It belongs to this bundle, not to the forge's: it needs no VM CRD, and the VMPodScrape in vm-customresources reads
# it. On a profile without the forge it is one Secret nobody reads. Missing (the key is not seeded yet on a cluster
# that is being upgraded): the operator skips the forgejo scrape and logs it, vmagent and every other scrape keep
# running, and the forge target appears when the Secret does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-metrics
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-metrics
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: forgejo/metrics
        property: token
