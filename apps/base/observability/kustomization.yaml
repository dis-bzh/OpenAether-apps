# OpenAether 0.5.0 Sprint C — Stack Monitoring HA
# ──────────────────────────────────────────────────────────────────
# Remplace base.yaml (prototype sprint0: raw Deployments emptyDir).
# Architecture HA full GitOps:
#   VMOperator + VMCluster (vminsert x2 + vmstorage x2 + vmselect x2)
#   VMAgent x2 (sharding, scraping kubernetes SD)
#   kube-state-metrics x2 + node-exporter (DaemonSet)
#   Loki x2 (SingleBinary, backend MinIO/S3)
#   Alloy (DaemonSet, collecte logs → Loki)
#   Grafana x2 (backend PostgreSQL CNPG grafana-db)
#   NetworkPolicy Cilium par composant
#   Dashboards GitOps (ConfigMaps label grafana_dashboard=1)
#
# NB: NO global `namespace:` directive — each resource declares its own
# namespace to avoid unwanted rewrites.
# grafana-cnpg-db + externalsecret foundation-databases → apps/base/cnpg/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # NB: the services-observability Namespace is declared in apps/base/namespaces/
  # (the 'namespaces' Flux Kustomization, an early step) because the
  # istio-authorizationpolicies Kustomization (14b) creates a policy there before
  # this group (30) runs. Declaring it here too → SSA double-ownership between two Kustomizations.
  # VictoriaMetrics Operator (installe les CRDs VMCluster/VMAgent/VM*Scrape).
  # The Custom Resources that CONSUME these CRDs (vmcluster/vmagent/vmscrapes)
  # live in vm-customresources/ — applied by a separate Flux Kustomization AFTER
  # this operator, to avoid the bundle being rejected at dry-run
  # ("no matches for kind VMAgent"). Cf. vm-customresources/kustomization.yaml.
  - vm-operator.yaml
  # Metrics exporters
  - kube-state-metrics.yaml
  - node-exporter.yaml
  # Logs: Loki + Alloy
  - loki.yaml
  - externalsecret-loki.yaml
  - alloy.yaml
  # Grafana HA (CNPG DB dans apps/base/cnpg/)
  - grafana.yaml
  - externalsecrets-grafana.yaml
  - externalsecret-grafana-oidc.yaml
  - httproute-grafana.yaml
  # Network
  - networkpolicy.yaml
  # Dashboards GitOps (sidecar Grafana)
  - dashboards/node-exporter.yaml
  - dashboards/k8s-cluster.yaml
  - dashboards/openbao.yaml
  - dashboards/victoriametrics.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintC"
