# OpenAether 0.5.0 Sprint C — VMAgent HA (scraping Kubernetes)
# ──────────────────────────────────────────────────────────────────
# VMAgent scrapes metrics through kubernetes_sd (automatic discovery) and sends
# them to vminsert through remote_write.
#
# 2 replicas + shardCount=2: each agent scrapes half the targets.
# Avoids duplicate scraping while providing HA.
#
# ClusterRole vmagent: cluster-wide read of nodes/services/endpoints/pods/namespaces,
# which is all kubernetes_sd needs. No `secrets` (no scrape references one: every
# scrape uses the pod's own bearerTokenFile) and no `nodes/proxy` (kubelet and
# cAdvisor are scraped on :10250 directly, which `nodes/metrics` authorizes).
# Adding a scrape that needs a Secret = a namespaced Role, not this ClusterRole.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: services-observability
roleRef:
  kind: ClusterRole
  name: vmagent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent
spec:
  replicaCount: 2
  shardCount: 2
  # Kyverno reads the container level (#47). The operator copies this flat block onto every container
  # (pod and container fields share it: spec.securityContext, not containerSecurityContext).
  # runAsUser is explicit because these images run as root and runAsNonRoot alone makes the container fail to start.
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: vmagent
  remoteWrite:
    - url: "http://vminsert-victoria-metrics.services-observability:8480/insert/0/prometheus"
  # memory request lowered 256Mi→128Mi: vmagent is a light scraper/forwarder
  # (real usage < 128Mi on this cluster). 4 pods (replicaCount=2 × shardCount=2)
  # → frees 256Mi on worker-1 so loki-1 (256Mi, pinned local-path PV) can be
  # scheduled. The LIMIT stays 512Mi (no OOM risk, burst preserved).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmagent
            topologyKey: kubernetes.io/hostname
  # Select every VMServiceScrape/VMNodeScrape in the cluster.
  selectAllByDefault: true
  podDisruptionBudget:
    minAvailable: 1
