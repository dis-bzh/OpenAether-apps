# Security-relevant alerting: policy violations, the policy engine itself, GitOps drift.
#
# Kyverno's policies are in Audit: a violation is recorded in a policy report and, until now, nowhere else. These
# rules read the Kyverno metrics (VMServiceScrape kyverno) and Flux's per-object state (gotk_resource_info).
# They are a start, not a detection programme: no OpenBao authentication or root-use alert (the OpenBao rules are
# ported separately), no exec / RBAC-change / audit-log scenario (needs the API server audit log in Loki).
# docs/detection.md lists what is covered and what is not.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: security-alerts
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: security
spec:
  groups:
    - name: openaether-policy-engine
      interval: 1m
      rules:
        # 1) A new object broke a policy, at admission time. Background scans are left out on purpose: they recount
        #    every existing violation on each pass and would fire for ever. require-security-context is left out
        #    until its known violations (vendored charts) are fixed: it is in Audit and alone would keep this firing.
        #    require-ro-rootfs and require-limits are informational reports, read with the policy report, not alerts.
        #    A policy added later alerts by default. Review: kubectl get cpol,polr -A (docs/detection.md).
        - alert: KyvernoPolicyViolation
          expr: |
            sum by (policy_name, rule_name, resource_namespace) (
              increase(kyverno_policy_results_total{
                rule_result="fail", rule_execution_cause="admission_request",
                policy_name!~"require-security-context|require-ro-rootfs|require-limits"
              }[15m])
            ) > 0
          for: 0m
          labels:
            severity: warning
            component: kyverno
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#kyvernopolicyviolation"
            summary: "Kyverno policy {{ $labels.policy_name }} failed in {{ $labels.resource_namespace }}"
            description: >-
              An object created in the last 15 min breaks the policy (blocked if Enforce, admitted if Audit).
              kubectl get polr -A | grep fail, then kubectl describe on the report.

        # 2) The admission controller serves the webhook the API server calls. At 0 replicas the policies either block
        #    every create (failurePolicy Fail) or silently stop applying (Ignore); both are an outage of the control.
        - alert: KyvernoAdmissionDown
          expr: |
            kube_deployment_status_replicas_available{namespace="kyverno",
              deployment="kyverno-admission-controller"} == 0
          for: 5m
          labels:
            severity: critical
            component: kyverno
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#kyvernoadmissiondown"
            summary: "Kyverno admission controller has no available replica"
            description: "kubectl -n kyverno get pods; kubectl -n kyverno describe deploy kyverno-admission-controller."

        - alert: KyvernoControllerNotReady
          expr: |
            kube_deployment_status_replicas_available{namespace="kyverno"}
              < kube_deployment_spec_replicas{namespace="kyverno"}
          for: 15m
          labels:
            severity: warning
            component: kyverno
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#\
              kyvernocontrollernotready"
            summary: "Kyverno {{ $labels.deployment }} has fewer available replicas than wanted"

        # 3) The metrics themselves are gone: a Kyverno that evaluates nothing, or a scrape the NetworkPolicy drops.
        #    Rule 1 would read "no violation". Silent when Kyverno is not deployed (it is optional in pick.py): a
        #    cluster without the brick must not warn for ever.
        - alert: KyvernoMetricsAbsent
          expr: |
            absent(kyverno_policy_results_total)
            and on() (count(kube_deployment_spec_replicas{namespace="kyverno"}) > 0)
          for: 30m
          labels:
            severity: warning
            component: kyverno
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#kyvernometricsabsent"
            summary: "No Kyverno policy result is reported: violation alerts are blind"
            description: "The kyverno CiliumNetworkPolicy must accept vmagent on :8000; kubectl get cpol."

    - name: openaether-gitops
      interval: 1m
      rules:
        # 4) A Flux object stuck in a non-Ready state: the cluster no longer converges to git. Unlike
        #    FluxReconciliationStalled (a flat counter) this catches "reconciling but failing". 20 min lets a slow
        #    install (Longhorn, Istio) finish. Ready is "" for an object Flux has not yet looked at;
        #    a HelmRepository of type oci never gets a Ready condition at all (source-controller does not
        #    reconcile it), so it is excluded or the alert would fire for it forever (seen live: talos-ccm).
        - alert: FluxObjectNotReady
          expr: |
            max by (customresource_kind, exported_namespace, name) (
              gotk_resource_info{ready!="True", suspended!="true"}
              unless on (customresource_kind, exported_namespace, name)
              gotk_resource_info{customresource_kind="HelmRepository", ready=""}
            ) == 1
          for: 20m
          labels:
            severity: warning
            component: flux
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxobjectnotready"
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.name }} is not Ready"
            description: >-
              flux get all -A, then kubectl describe {{ $labels.customresource_kind }}
              -n {{ $labels.exported_namespace }} {{ $labels.name }}. Objects that depend on it wait too.

        # 4b) Flux rejected the HEAD commit because its signature does not verify (git-verify component, infra #337).
        #     FluxObjectNotReady says the source is not Ready after 20 minutes and nothing more; this one says why,
        # at once:
        #     either a legitimate push was not signed (or by a key not in the signer table), or something pushed
        # that should
        #     not have. The cluster keeps running the last verified revision. Silent (no series with the label) while
        #     spec.verify is off.
        - alert: FluxSourceNotVerified
          expr: |
            max by (exported_namespace, name) (
              gotk_resource_info{customresource_kind="GitRepository", source_verified="False"}
            ) == 1
          for: 5m
          labels:
            severity: critical
            component: flux
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxsourcenotverified"
            summary: "Flux rejected the commit of GitRepository {{ $labels.name }}: unsigned or unknown signer"
            description: >-
              kubectl describe gitrepository -n {{ $labels.exported_namespace }} {{ $labels.name }}
              (condition SourceVerified), then git log --show-signature on the branch. Sign the push with a
              registered key or remove the unexpected commit; docs/signed-commits.md.

        # 5) Suspended and forgotten: git no longer applies to it. Often deliberate during an operation.
        #    HelmRelease services-observability/alloy-audit is suspended by design (the audit collector is opt-in,
        #    apps/flux/components/audit-log-collector), so it is excluded: without that the alert fired after 24 h on
        #    every default install (lab 17). A suspension of any other object still alerts. Suspending alloy-audit
        #    after enabling the collector is not reported (use FluxObjectNotReady / the log alerts for it).
        - alert: FluxObjectSuspended
          expr: |
            max by (customresource_kind, exported_namespace, name) (
              gotk_resource_info{suspended="true"}
              unless on (customresource_kind, exported_namespace, name)
              gotk_resource_info{
                customresource_kind="HelmRelease", exported_namespace="services-observability-audit", name="alloy-audit"
              }
            ) == 1
          for: 24h
          labels:
            severity: warning
            component: flux
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxobjectsuspended"
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.name }} has been suspended for 24 h"
            description: "flux resume ... when the operation is over."

        # 6) The state metrics are gone: rules 4 and 5 are blind (kube-state-metrics custom resource state, or its
        #    list/watch rights on the Flux objects).
        - alert: FluxStateMetricsAbsent
          expr: absent(gotk_resource_info{customresource_kind="Kustomization"})
          for: 15m
          labels:
            severity: warning
            component: flux
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxstatemetricsabsent"
            summary: "No Flux object state is exported: Flux failure alerts are blind"
            description: "kubectl -n services-observability logs deploy/kube-state-metrics | grep -i forbidden."
