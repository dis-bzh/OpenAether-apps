# Cluster-health alerting — nodes, pods, volumes.
#
# Built only on metrics something actually scrapes (vmscapes.yaml). A rule on a
# metric nobody produces evaluates clean and reads as "all clear" —
# `task check-alerts` is the guard against writing one.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cluster-health-alerts
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: cluster-health
spec:
  groups:
    - name: openaether-nodes
      interval: 1m
      rules:
        # 1) The kubelet stopped reporting. This is the signature of the OVH
        #    failure where the node is dead while the hypervisor still shows it
        #    ACTIVE: nothing in OpenTofu or the provider console says a word.
        - alert: NodeUnreachable
          expr: kube_node_status_condition{condition="Ready",status="unknown"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} unreachable (kubelet silent > 5 min)"
            description: >-
              The kubelet no longer reports. The VM may still be ACTIVE on the
              hypervisor. Check the serial console BEFORE recovering, that trace
              is the only way to learn why it died; recovery is a HARD reboot
              through the provider API.

        # 2) Node Ready=false — reported, but unhealthy (disk, runtime, CNI).
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} NotReady for 10 min"
            description: "talosctl -n <node> dmesg, and kubectl describe node {{ $labels.node }}."

        # 3) Pressure: still Ready, already evicting. Precedes the DEV1-M OOM
        #    cascade that took down two workers at once.
        - alert: NodeUnderPressure
          expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }}: {{ $labels.condition }} for 15 min"

    - name: openaether-workloads
      interval: 1m
      rules:
        # 4) A container restarting in a loop. Threshold > 3 in 15 min: below
        #    that it is a slow start, not a loop.
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarting in a loop"
            description: "kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} --previous"

        # 5) A volume filling up. 10% left is the last point at which growing it
        #    is still a routine operation.
        #    Silent locally: kubelet_volume_stats_* comes from the CSI driver,
        #    and local-path is hostPath. Longhorn reports them; empty is fine.
        - alert: PersistentVolumeFillingUp
          expr: |
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} over 90% full"

    # ⚠️ These rules are a post-mortem record, not a page: during a real quorum
    # loss nothing fired at the time (DNS and the write path went with the
    # control plane). The Watchdog above is what covers that.
    - name: openaether-etcd
      interval: 1m
      rules:
        # A) No leader = the cluster accepts no writes. Nothing else reports it:
        #    the kubelets keep saying Ready while every apply fails. This is the
        #    one failure a Talos cluster cannot recover from on its own.
        #    `for: 1m`: writes fail the whole time, and the window where a
        #    member still ANSWERS while reporting no leader is ~3 min.
        - alert: EtcdNoLeader
          expr: etcd_server_has_leader == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "etcd has no leader on {{ $labels.instance }}"
            description: >-
              Quorum is lost or an election is stuck. talosctl -n <cp> service
              etcd, and talosctl -n <cp> etcd members. Recovery goes through a
              snapshot — see docs/backup-restore.md.

        # A-bis) Quorum by COUNT: if every member goes unreachable there is no
        #    has_leader series left to compare, and an absent metric matches
        #    nothing. Fires when at most half the members answer.
        - alert: EtcdQuorumLost
          expr: |
            2 * (count(up{job=~".*etcd.*"} == 1) or vector(0)) <= count(up{job=~".*etcd.*"})
          for: 2m
          labels:
            severity: critical
            component: etcd
          annotations:
            summary: "etcd has lost quorum — the cluster accepts no writes"

        # B) A member that stopped answering. Below quorum this becomes (A), so
        #    it is the warning that precedes the outage.
        - alert: EtcdMemberDown
          expr: up{job=~".*etcd.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: etcd
          annotations:
            summary: "etcd member unreachable on {{ $labels.instance }}"

        # C) Flapping elections: a cluster that keeps re-electing is usually
        #    starved on disk or network, and degrades before it breaks.
        - alert: EtcdLeaderFlapping
          expr: |
            increase(etcd_server_leader_changes_seen_total[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd re-elected a leader more than 3 times in 15 min"

    - name: openaether-watchdog
      interval: 1m
      rules:
        # A dead man's switch: it fires forever, on purpose.
        #
        # No rule here can report the cluster being GONE — killing etcd quorum
        # proved it: metrics right in hindsight, nothing delivered at the time.
        # So this one inverts the question. It pings while the whole chain is
        # alive, and ITS ABSENCE IS THE ALARM. Routed to a dead-man's-switch
        # service, never to Slack: a human noticing a message stopped arriving
        # is not a monitoring system.
        - alert: Watchdog
          expr: vector(1)
          for: 0s
          labels:
            severity: none
            watchdog: "true"
          annotations:
            summary: "Alerting is alive end to end"
            description: >-
              Pings the dead-man's-switch service every 5 min. If the pings stop,
              the cluster, its alerting or its egress is gone.

    - name: openaether-monitoring-itself
      interval: 1m
      rules:
        # 6) Who watches the watchmen. Every rule above reads kube-state-metrics:
        #    if it stops, they all evaluate empty and the cluster looks healthy.
        #    `absent()` is the only thing that catches the absence of a metric.
        - alert: KubeStateMetricsAbsent
          expr: absent(kube_node_status_condition)
          for: 10m
          labels:
            severity: critical
            component: monitoring
          annotations:
            summary: "kube-state-metrics no longer reports — node alerting is BLIND"
            description: >-
              Every node, pod and backup rule is built on this metric. While it
              is missing they evaluate to nothing, which is indistinguishable
              from "nothing wrong".
