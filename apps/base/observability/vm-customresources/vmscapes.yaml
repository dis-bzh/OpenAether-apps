# OpenAether 0.5.0 Sprint C — VMServiceScrape / VMNodeScrape
# ──────────────────────────────────────────────────────────────────
# These CRDs define WHAT VMAgent scrapes (GitOps-native discovery).
# No need to edit ConfigMaps by hand.
#
# Adding a new scrape = create a VMServiceScrape in any namespace
# (VMAgent selectAllByDefault=true → cluster-wide discovery).

# ── kubelet + cAdvisor (node + container metrics) ─────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: kubelet
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  scheme: https
  tlsConfig:
    insecureSkipVerify: true
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  # kubelet exposes the standard node metrics + cadvisor (containers).
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
  path: /metrics
---
# cAdvisor: detailed per-container metrics (CPU, memory, network, IO).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: cadvisor
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  scheme: https
  path: /metrics/cadvisor
  tlsConfig:
    insecureSkipVerify: true
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)

# ── kube-state-metrics ─────────────────────────────────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kube-state-metrics
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  namespaceSelector:
    matchNames:
      - services-observability
  endpoints:
    - port: http
      path: /metrics
      # ⚠️ MANDATORY for kube-state-metrics. KSM reports OTHER objects, so its
      # series carry their namespace/pod/container. Without honorLabels the
      # scraper's own labels win and KSM's get renamed exported_* — every series
      # then reads namespace="services-observability", pod="kube-state-metrics-…".
      # Any rule selecting on namespace or pod silently matches NOTHING
      # (verified locally 2026-07-29: this is why BackupJobFailed, which selects
      # namespace=~"foundation-.*", could never have fired).
      honorLabels: true

# ── node-exporter ──────────────────────────────────────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: node-exporter
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  namespaceSelector:
    matchNames:
      - services-observability
  endpoints:
    - port: http-metrics
      path: /metrics

# ── VMCluster self-scrape ──────────────────────────────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vmcluster
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - vminsert
          - vmstorage
          - vmselect
  namespaceSelector:
    matchNames:
      - services-observability
  endpoints:
    - port: http

# ── VMAgent self-scrape ────────────────────────────────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vmagent
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  namespaceSelector:
    matchNames:
      - services-observability
  endpoints:
    - port: http

# ── Flux controllers ───────────────────────────────────────────────
# A VMPodScrape and not a VMServiceScrape: the Flux Services only expose :80
# (artifacts, webhooks). The metrics port `http-prom` is on the POD only, so
# service discovery would never find it.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: flux
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  namespaceSelector:
    matchNames:
      - flux-system
  podMetricsEndpoints:
    - port: http-prom
      path: /metrics
      # Same reason as kube-state-metrics: gotk_reconcile_condition carries the
      # RECONCILED object's namespace, which would otherwise be overwritten by
      # the controller pod's own (flux-system) and pushed to exported_namespace.
      honorLabels: true

# ── cert-manager ───────────────────────────────────────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cert-manager
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  namespaceSelector:
    matchNames:
      - cert-manager
  endpoints:
    # The chart still names this port `tcp-prometheus-servicemonitor` (v1.15.3),
    # not the http-metrics you would expect. Verified with `helm template`.
    - port: tcp-prometheus-servicemonitor
      path: /metrics
      # certmanager_certificate_* carries the CERTIFICATE's namespace, not the
      # controller's — same reason as kube-state-metrics.
      honorLabels: true

# ── kube-apiserver ─────────────────────────────────────────────────
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kube-apiserver
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
