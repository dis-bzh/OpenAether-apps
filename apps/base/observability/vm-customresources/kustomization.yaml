# OpenAether 0.5.0 Sprint C — VictoriaMetrics Custom Resources
# ──────────────────────────────────────────────────────────────────
# Séparé du bundle observability pour casser le chicken-and-egg CRD→CR :
# ces objets (VMCluster, VMAgent, VMNodeScrape, VMServiceScrape) n'existent
# comme kinds qu'APRÈS que le HelmRelease victoria-metrics-operator (dans
# apps/base/observability/) ait installé ses CRDs. Si on les laisse dans le
# même bundle, le dry-run de validation Flux échoue ("no matches for kind
# VMAgent") et REJETTE tout le bundle — y compris l'opérateur → rien ne
# s'installe, jamais. Même pattern que cert-manager-issuers.
#
# La Kustomization Flux 'observability-vm-customresources' (apps/flux/base/
# 30-observability.yaml) applique ce dossier APRÈS 'observability' (Ready).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - vmcluster.yaml
  - vmagent.yaml
  - vmscapes.yaml

labels:
  - includeSelectors: false
    pairs:
      openaether.io/managed: "true"
      openaether.io/sprint: "0.5.0-sprintC"
