# VMAlert + VMAlertmanager — what actually EVALUATES the VMRules.
#
# ⚠️ A VMRule alone is an INERT object: the operator stores it, nothing reads it,
# and no component reports the gap. The three backup rules — the only alerting
# this platform had — sat like that from the day they were written until
# 2026-07-29. Deleting VMAlert silently disarms every alert in the cluster.
#
# Alerts go to Slack. The webhook URL comes from OpenBao through ESO and is read
# from a file, so it never touches git — see the ExternalSecret. Without it
# seeded, Alertmanager does not start and nothing is alerted, which is the point:
# an empty receiver looked healthy while every alert went nowhere.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vmalert
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmalert
spec:
  # Pinned (apps #117): the operator's default moves with every operator bump (0.68.1 defaults to this one).
  image:
    tag: v1.136.0
  replicaCount: 2
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Pick up every VMRule in the cluster, as VMAgent does for the scrapes.
  selectAllByDefault: true
  evaluationInterval: 30s
  datasource:
    url: http://vmselect-victoria-metrics.services-observability:8481/select/0/prometheus
  # remoteWrite persists ALERTS/ALERTS_FOR_STATE and remoteRead restores the
  # pending state on restart. Without them a rolling update resets every `for:`
  # timer, so the long-window rules (BackupCronJobStale, 26 h) would never fire.
  remoteWrite:
    url: http://vminsert-victoria-metrics.services-observability:8480/insert/0/prometheus
  remoteRead:
    url: http://vmselect-victoria-metrics.services-observability:8481/select/0/prometheus
  notifiers:
    - url: http://vmalertmanager-alertmanager.services-observability:9093
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmalert
            topologyKey: kubernetes.io/hostname
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmalert
            topologyKey: topology.kubernetes.io/zone
  podDisruptionBudget:
    minAvailable: 1
---
# Two replicas on two workers (0.4.0 M4): a lost worker must not silence the alerts that announce it. The peers gossip
# on :9094 (networkpolicy.yaml) so a notification is sent once; VMAlert's notifier is the headless Service, which lists
# the Ready replicas only. Whether both replicas see each other is checked by AlertmanagerClusterDegraded.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: alertmanager
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmalertmanager
spec:
  # Pinned (apps #117): the operator's default moves with every operator bump (0.68.1 defaults to v0.31.0).
  image:
    tag: v0.31.0
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmalertmanager
            topologyKey: kubernetes.io/hostname
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmalertmanager
            topologyKey: topology.kubernetes.io/zone
  podDisruptionBudget:
    minAvailable: 1
  # Kyverno reads the container level (#47). The operator copies this flat block onto every container
  # (pod and container fields share it: spec.securityContext, not containerSecurityContext).
  # runAsUser is explicit because these images run as root and runAsNonRoot alone makes the container fail to start.
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # The webhook URL is mounted, never inlined — see
  # observability/externalsecret-alertmanager-slack.yaml. Mount path is
  # /etc/vm/secrets/<secret name>/<key>.
  secrets:
    - alertmanager-slack
    - alertmanager-deadmansswitch
  configRawYaml: |
    route:
      receiver: slack
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      # 12 h between repeats for a warning; a critical repeats hourly, because
      # the ones here (no etcd leader, node unreachable, policy not enforced)
      # do not resolve on their own.
      repeat_interval: 12h
      routes:
        # The watchdog FIRST: it must never be swallowed by another matcher.
        # It goes to the dead-man's-switch service, NOT to Slack: a human
        # noticing a daily message stopped is not a monitoring system. The
        # service alarms when the ping stops — which is the only arrangement
        # that survives this cluster dying.
        # A ping at least every 5 min, because a DMS grace period is usually 15-60 min.
        - matchers:
            - alertname="Watchdog"
          receiver: deadmansswitch
          group_wait: 0s
          # repeat_interval MUST be strictly greater than group_interval.
          # With both at 5m Alertmanager sent the ping ONCE and never again
          # (verified: 1 notification in 11 min), which would trip the
          # dead-man's switch on a perfectly healthy cluster — the exact false
          # alarm this is meant to avoid.
          # And a ping goes out at the first group_interval tick at or after repeat_interval: repeat_interval 5m with
          # group_interval 1m measured 360 s between pings (lab 19), not 5 min. 3m gives about 4 min (at most
          # repeat_interval + group_interval, which test-alert-delivery.py keeps within 5 min).
          group_interval: 1m
          repeat_interval: 3m
        # The scheduled delivery test (opt-in component alert-delivery-probe, docs/alert-delivery.md): one chat message
        # per window, never a "resolved" one. Without the component nothing carries this label.
        - matchers:
            - probe="delivery"
          receiver: delivery-probe
          group_wait: 30s
          repeat_interval: 12h
        - matchers:
            - severity="critical"
          receiver: slack
          repeat_interval: 1h
    # While a delivery test went unacknowledged, the heartbeat stops on purpose: the external dead-man's-switch then
    # pages through its own channel, the one path that does not use the chat receiver. Nothing carries the source alert
    # unless the opt-in probe component is on.
    inhibit_rules:
      - source_matchers:
          - alertname="AlertDeliveryNotAcknowledged"
        target_matchers:
          - alertname="Watchdog"
    receivers:
      # The dead-man's switch. Its URL is a ping endpoint (healthchecks.io,
      # PagerDuty DMS, Better Stack…) that raises the alarm when pings STOP.
      # send_resolved is off: a resolve would look like a ping and defeat it.
      - name: deadmansswitch
        webhook_configs:
          - url_file: /etc/vm/secrets/alertmanager-deadmansswitch/url
            send_resolved: false
      - name: delivery-probe
        slack_configs:
          - api_url_file: /etc/vm/secrets/alertmanager-slack/webhook-url
            send_resolved: false
            title: "[PROBE] alert delivery test"
            text: "Scheduled test of the alert path, no action. See docs/alert-delivery.md."
      - name: slack
        slack_configs:
          - api_url_file: /etc/vm/secrets/alertmanager-slack/webhook-url
            # No `channel:` on purpose. An incoming webhook already posts to the
            # channel it was created for, so overriding it here bought nothing and
            # named a real workspace in a public repository. Set one only if you
            # need to redirect a webhook, and take it from a Secret if you do.
            send_resolved: true
            title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
            text: >-
              {{ range .Alerts }}{{ or .Annotations.summary .Annotations.message }}
              {{ with .Annotations.description }}{{ . }}{{ end }}
              {{ end }}
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
---
# Self-scrape: `vmalert_alerts_fired_total` and `vmalert_execution_errors_total`
# are how you tell "no alert fired" from "the evaluator is broken".
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vmalert
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - vmalert
          - vmalertmanager
  namespaceSelector:
    matchNames:
      - services-observability
  endpoints:
    - port: http
