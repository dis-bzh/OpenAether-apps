# Platform alerting — GitOps delivery and the certificate chain.
#
# Both are silent failure modes: a Kustomization that stops reconciling leaves
# the cluster running the LAST good state, so nothing looks broken until someone
# wonders why a commit never landed. An expiring certificate breaks everything
# at once, on a date nobody is watching.
#
# Sources: the Flux controllers (VMPodScrape `flux`) and the cert-manager
# controller (VMServiceScrape `cert-manager`), both in vmscapes.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform-alerts
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: platform
spec:
  groups:
    - name: openaether-flux
      interval: 1m
      rules:
        # 1) An object Flux has STOPPED reconciling — wedged controller, stuck
        #    finalizer, or suspended and forgotten. Every Kustomization has an
        #    interval <= 10 min, so a flat counter over 30 min is a real stop. HelmReleases run on a 1 h
        #    interval (lab 12: 27 false alerts on an idle, healthy cluster with the single 30 min window),
        #    so they get a 2.5 h window. HelmRepository (24 h) and the other kinds are not watched here.
        #    Does NOT catch "reconciling but failing": Flux 2.8 and 2.9 export no
        #    per-object Ready condition (OpenAether-infra CHANGELOG, Known limits).
        - alert: FluxReconciliationStalled
          expr: |
            increase(gotk_reconcile_duration_seconds_count{kind=~"Kustomization|GitRepository"}[30m]) == 0
            or
            increase(gotk_reconcile_duration_seconds_count{kind="HelmRelease"}[150m]) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#\
              fluxreconciliationstalled"
            summary: "Flux: {{ $labels.kind }}/{{ $labels.name }} has not reconciled for 30 min (HelmRelease: 2.5 h)"
            description: >-
              flux get all -A. If the object is suspended on purpose, that is
              the alert doing its job — resume it or remove it.


    - name: openaether-cilium
      interval: 1m
      rules:
        # 1) A policy that FAILED to import is an enforcement gap: the CNP is in
        #    the API, kubectl shows it, and the datapath never applied it. The
        #    only visible trace is this counter.
        - alert: CiliumPolicyImportFailed
          expr: |
            increase(cilium_policy_change_total{outcome="failure"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#\
              ciliumpolicyimportfailed"
            summary: "Cilium rejected a policy change on {{ $labels.instance }}"
            description: >-
              A NetworkPolicy is present in the API but NOT enforced in the
              datapath. cilium status --all-controllers on that node.

        # 2) Endpoints whose policy could not be programmed — same gap, per pod.
        - alert: CiliumEndpointRegenerationFailing
          expr: |
            increase(cilium_endpoint_regenerations_total{outcome="fail"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#\
              ciliumendpointregenerationfailing"
            summary: "Cilium failing to regenerate endpoints on {{ $labels.instance }}"

        # 3) An agent not running on a LIVE node: bad rollout, crashloop,
        #    unschedulable. No CNI and no policy enforcement there.
        #    NOT `up == 0`: Cilium is pod-discovered, so a removed pod takes its
        #    target out of discovery and an absent series matches nothing.
        #    Says nothing about a DEAD node either — DaemonSet pods are never
        #    evicted, so numberReady does not move. That is NodeUnreachable's.
        - alert: CiliumAgentMissing
          expr: |
            kube_daemonset_status_number_ready{daemonset="cilium"}
              < kube_daemonset_status_desired_number_scheduled{daemonset="cilium"}
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#ciliumagentmissing"
            summary: "Cilium agent missing on at least one node"
            description: >-
              No CNI and no policy enforcement on the affected node.
              kubectl -n kube-system get pods -l k8s-app=cilium -o wide.

    # Network policy denials. Hubble is off, so the only trace of a blocked flow is this counter; it says how many
    # and on which node, not who. Info: a known-noisy flow (probes, a retrying client) can sit above the threshold;
    # calibrate on the first week, then lower it or raise the severity.
    - name: openaether-network-policy
      interval: 1m
      rules:
        - alert: CiliumPolicyDeniedBurst
          expr: |
            sum by (instance, direction) (rate(cilium_drop_count_total{reason=~"Policy denied.*"}[5m])) > 5
          for: 10m
          labels:
            severity: info
            component: cilium
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#ciliumpolicydeniedburst"
            summary: "Cilium drops more than 5 packets/s by policy on {{ $labels.instance }} ({{ $labels.direction }})"
            description: >-
              A pod is blocked by a CiliumNetworkPolicy, in a loop. A new flow that needs allowing, or something
              trying to reach what it should not. cilium monitor --type drop in the agent pod on that node.

    - name: openaether-certificates
      interval: 5m
      rules:
        # 2) Expiry. 21 days leaves room for the offline signing ceremony of the
        #    PKI intermediate, which is not a five-minute operation.
        - alert: CertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 21
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#certificateexpiringsoon"
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 21 days"

        # 3) Not renewing. Distinct from the above: a Certificate can be
        #    not-Ready for weeks while the current one is still valid — the
        #    failure only becomes visible once it expires, far too late.
        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#certificatenotready"
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not Ready for 1 h"
            description: "kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}"

    - name: openaether-databases
      interval: 1m
      rules:
        # 1) A CNPG instance pod left in phase Succeeded. After a node reboot without a drain the kubelet's graceful
        #    shutdown leaves the pod Completed (postgres exits 0); CNPG 1.23.1 never recreates it, the cluster waits
        #    for ever (lab 11, both databases down). Fixed in CNPG 1.23.3 (#2056). Owned by a Cluster, so the
        #    Succeeded pods of Jobs (dump, restore test) do not count.
        - alert: CnpgInstancePodSucceeded
          expr: |
            kube_pod_status_phase{namespace="foundation-databases", phase="Succeeded"} == 1
              and on (namespace, pod) kube_pod_owner{namespace="foundation-databases", owner_kind="Cluster"}
          for: 5m
          labels:
            severity: critical
            component: databases
          annotations:
            summary: "CNPG instance pod {{ $labels.pod }} is Completed and will not be restarted"
            description: >-
              Left by a node shutdown (reboot without drain).
              kubectl delete pod -n {{ $labels.namespace }} {{ $labels.pod }}
              (the PVC stays; the operator recreates the pod). Never delete the PVC. docs/traps.md, Databases.
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/traps.md"
