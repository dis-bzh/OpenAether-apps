# yamllint disable rule:line-length
# CNPG health beyond backups (0.4.0 M1): replication lag, replica streaming, collector, WAL pile-up. Metrics: the CNPG
# exporter (default queries) through the cnpg VMPodScrape. Rung: static + synthetic series. UNVERIFIED on a cluster: the
# names cnpg_pg_replication_*, cnpg_collector_up and cnpg_collector_pg_wal (lab 17 read only pg_stat_archiver ones).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: database-alerts
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: database
spec:
  groups:
    - name: openaether-database
      interval: 1m
      rules:
        - alert: CnpgReplicationLagHigh
          expr: |
            max by (cnpg_io_cluster, pod) (cnpg_pg_replication_lag) > 30
          for: 10m
          labels:
            severity: warning
            component: database
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpgreplicationlaghigh"
            summary: "CNPG {{ $labels.cnpg_io_cluster }}: replica {{ $labels.pod }} lags {{ $value | humanizeDuration }}"
            description: >-
              A failover now would lose that much committed data or wait for replay. The DB write gap target is 30
              s.

        - alert: CnpgReplicaNotStreaming
          expr: |
            min by (cnpg_io_cluster, pod) (cnpg_pg_replication_is_wal_receiver_up) == 0 and on (cnpg_io_cluster, pod) (cnpg_pg_replication_in_recovery == 1)
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpgreplicanotstreaming"
            summary: "CNPG {{ $labels.cnpg_io_cluster }}: replica {{ $labels.pod }} receives no WAL"
            description: >-
              The WAL receiver of a replica is down: no replication, no failover target.

        - alert: CnpgInstanceDown
          expr: |
            min by (cnpg_io_cluster, pod) (cnpg_collector_up) == 0
          for: 5m
          labels:
            severity: critical
            component: database
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpginstancedown"
            summary: "CNPG {{ $labels.cnpg_io_cluster }}: PostgreSQL does not answer on {{ $labels.pod }}"
            description: >-
              The instance manager runs but PostgreSQL does not respond to its queries.

        # A pod that is gone (deleted, Pending, on a lost node) exports nothing, so the three rules above evaluate empty and stay
        # quiet (lab 19: a force-killed replica raised nothing). No metric says how many instances the Cluster wants, so this
        # compares with what reported during the last day: fewer than the maximum of the day, or none left of a cluster that had
        # some, for 10 min. A deliberate scale-down looks the same for up to a day: silence it or wait.
        - alert: CnpgInstanceMissing
          expr: |
            (
              count by (cnpg_io_cluster) (cnpg_collector_up) < max_over_time((count by (cnpg_io_cluster) (cnpg_collector_up))[1d:5m])
            ) or (
              max_over_time((count by (cnpg_io_cluster) (cnpg_collector_up))[1d:5m])
              unless on (cnpg_io_cluster) count by (cnpg_io_cluster) (cnpg_collector_up)
            )
          for: 10m
          labels:
            severity: warning
            component: database
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpginstancemissing"
            summary: "CNPG {{ $labels.cnpg_io_cluster }}: an instance that reported during the last day reports no more"
            description: >-
              A replica or the primary is gone, Pending or unscheduled, and its series disappeared with it, so the replication and
              collector rules cannot see it. Compare `kubectl cnpg status` with the number of instances wanted.

        # Both Clusters run synchronous replication with dataDurability required (any 1 of 2, class A data): with no streaming
        # replica left, PostgreSQL BLOCKS every commit instead of acknowledging it unreplicated. Applications see timeouts, not
        # errors: this is an outage of the writes, not a warning. The threshold is `number` of the Clusters (1).
        # UNVERIFIED on a cluster: cnpg_pg_replication_streaming_replicas (a column of the CNPG default pg_replication query).
        - alert: CnpgSyncReplicaMissing
          expr: |
            (
              max by (cnpg_io_cluster) (cnpg_pg_replication_streaming_replicas and on (cnpg_io_cluster, pod) (cnpg_pg_replication_in_recovery == 0)) < 1
            )
            and on (cnpg_io_cluster)
            (
              max by (cnpg_io_cluster) (cnpg_collector_sync_replicas{value="expected"}) >= 1
            )
          # Only a Cluster that asks for synchronous replicas can block on a missing one: a `light` profile (one instance, nothing
          # replicated) raised this critical alert for good in lab 23 once its metrics were scraped.
          for: 3m
          labels:
            severity: critical
            component: database
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpgsyncreplicamissing"
            summary: "CNPG {{ $labels.cnpg_io_cluster }}: no replica streams from the primary, synchronous commits are BLOCKED"
            description: >-
              The primary has no streaming replica, and dataDurability is required: every write waits for a standby that is
              not there (applications time out). Nothing is lost, nothing is acknowledged. Bring a replica back
              (`kubectl cnpg status`), see the runbook.

        - alert: CnpgWalFilesPiling
          expr: |
            max by (cnpg_io_cluster, pod) (cnpg_collector_pg_wal{value="count"}) > 200
          for: 15m
          labels:
            severity: warning
            component: database
          annotations:
            runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpgwalfilespiling"
            summary: "CNPG {{ $labels.cnpg_io_cluster }}: {{ $labels.pod }} holds over 200 WAL files"
            description: >-
              WAL accumulates when archiving or a replication slot lags: the volume fills until PostgreSQL stops.
              Usually seen with CnpgWalArchiveFailing.
