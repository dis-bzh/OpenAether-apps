# Alerting des sauvegardes — sans ces règles, un backup qui échoue est SILENCIEUX.
#
# Les deux CronJobs (`openbao-snapshot` 02:17, `cnpg-dump` 02:47) poussent vers
# deux dépôts restic. Jusqu'ici rien ne remontait : ni un Job en échec, ni un
# CronJob qui ne se déclenche plus (ExternalSecret NotReady, schedule supprimé,
# controller-manager en carafe). Or un backup qu'on croit fait est pire que pas
# de backup — on ne le découvre qu'au moment de restaurer.
#
# Métriques : kube-state-metrics (apps/base/observability/kube-state-metrics.yaml).
#
# ⚠️ Ce fichier vit dans vm-customresources/ et pas dans observability/ : le kind
# `VMRule` n'existe qu'APRÈS l'installation des CRDs par l'opérateur VictoriaMetrics.
# Dans le même bundle, le dry-run Flux rejetterait TOUT (même piège que les CR
# VMCluster/VMAgent — cf. kustomization.yaml de ce dossier).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: backup-alerts
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: backup
spec:
  groups:
    - name: openaether-backups
      interval: 5m
      rules:
        # 1) Un Job de sauvegarde a échoué. `for: 15m` laisse passer les échecs
        #    qu'une reprise du CronJob corrige d'elle-même.
        - alert: BackupJobFailed
          expr: |
            max by (namespace, job_name) (
              kube_job_status_failed{namespace=~"foundation-.*", job_name=~"(openbao-snapshot|cnpg-dump)-.*"}
            ) > 0
          for: 15m
          labels:
            severity: critical
            component: backup
          annotations:
            summary: "Sauvegarde en échec : {{ $labels.namespace }}/{{ $labels.job_name }}"
            description: >-
              Le Job a échoué et n'a pas été repris. Causes fréquentes : dépôt
              restic illisible (RESTIC_PASSWORD d'un autre cluster), bucket
              absent, creds S3 périmés. Logs : kubectl logs -n
              {{ $labels.namespace }} job/{{ $labels.job_name }}

        # 2) Le CronJob ne se déclenche PLUS. Le cas le plus dangereux : aucun
        #    Job en échec à voir, donc invisible sans cette règle. Seuil 26 h
        #    pour une planification quotidienne (2 h de marge).
        - alert: BackupCronJobStale
          expr: |
            time() - max by (namespace, cronjob) (
              kube_cronjob_status_last_schedule_time{namespace=~"foundation-.*", cronjob=~"openbao-snapshot|cnpg-dump"}
            ) > 26 * 3600
          for: 1h
          labels:
            severity: critical
            component: backup
          annotations:
            summary: "Sauvegarde non déclenchée depuis > 26 h : {{ $labels.namespace }}/{{ $labels.cronjob }}"
            description: >-
              Aucun Job créé depuis plus de 26 h pour un schedule quotidien.
              Vérifier que le CronJob n'est pas suspendu et que l'ExternalSecret
              backup-restic-env est Ready (destinations seedées dans OpenBao).

        # 3) Le CronJob est suspendu — souvent volontaire pendant une opération,
        #    mais on oublie de le réactiver. Avertissement, pas critique.
        - alert: BackupCronJobSuspended
          expr: |
            max by (namespace, cronjob) (
              kube_cronjob_spec_suspend{namespace=~"foundation-.*", cronjob=~"openbao-snapshot|cnpg-dump"}
            ) > 0
          for: 6h
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Sauvegarde suspendue depuis > 6 h : {{ $labels.namespace }}/{{ $labels.cronjob }}"
            description: "kubectl patch cronjob -n {{ $labels.namespace }} {{ $labels.cronjob }} -p '{\"spec\":{\"suspend\":false}}'"
