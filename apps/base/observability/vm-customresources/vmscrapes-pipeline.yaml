# Scrapes for the log pipeline, the policy engine and the databases, which the rules in vmrule-logging.yaml,
# vmrule-security.yaml and vmrule-backup.yaml read. Before this file Alloy, Loki, Grafana, Kyverno, Zitadel and CNPG
# were not scraped at all (loki.yaml also disables the chart's self-monitoring), so no rule could see them fail.
# Each needs an ingress rule for vmagent in its own CiliumNetworkPolicy and the port in vmagent's egress list
# (observability/networkpolicy.yaml): without them the target is dropped and `up` has no series, not a zero.
# Selectors and port names read from the rendered charts (alloy 1.13.1, loki 18.16.2, grafana 8.6.4,
# zitadel 10.4.0) and the vendored Kyverno 1.12.1 and CNPG 1.23.1 manifests.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: alloy
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  namespaceSelector:
    matchNames:
      - services-observability
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
---
# The control-plane audit-log collector (alloy.yaml's twin, own namespace): its read counters feed K8sAuditLogSilent.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: alloy-audit
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  namespaceSelector:
    matchNames:
      - services-observability-audit
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
---
# Pods, not the Service: the chart also publishes a headless Service on the same port, which would
# scrape each replica twice.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: loki
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: single-binary
  namespaceSelector:
    matchNames:
      - services-observability
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  namespaceSelector:
    matchNames:
      - services-observability
  podMetricsEndpoints:
    - port: grafana
      path: /metrics
---
# The four Kyverno controllers each publish :8000 through a Service whose port is named metrics-port; the admission
# controller carries kyverno_policy_results_total and the webhook latency. The kyverno-svc webhook Service is
# selected too and skipped: it has no port of that name.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kyverno
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  namespaceSelector:
    matchNames:
      - kyverno
  endpoints:
    - port: metrics-port
      path: /metrics
---
# Zitadel serves /debug/metrics on its HTTP port (the chart annotates the pod with it). Scraped so the data exists;
# no rule reads it yet, because its metric names are not checked against a running Zitadel.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: zitadel
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel
      app.kubernetes.io/component: start
  namespaceSelector:
    matchNames:
      - services-identity
  podMetricsEndpoints:
    - port: http2-server
      path: /debug/metrics
---
# CNPG instance pods, port `metrics` (:9187): WAL archiver failures and the last (failed) base backup. The cluster
# manifests set enablePodMonitor, which needs the Prometheus Operator CRDs this platform does not install.
# cnpg.io/cluster becomes the `cnpg_io_cluster` label.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmagent-scrapes
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  namespaceSelector:
    matchNames:
      - foundation-databases
  podTargetLabels:
    - cnpg.io/cluster
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
