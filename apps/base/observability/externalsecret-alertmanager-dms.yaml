# The dead-man's-switch ping URL.
#
# This is the ONLY part of the alerting that survives the cluster dying. Every
# rule here reports a problem from INSIDE; none can report "the cluster is
# gone", verified by killing etcd quorum — the metrics were right in hindsight
# and nothing was delivered at the time. The Watchdog alert pings this endpoint
# every 5 minutes while the whole chain is alive, and the SERVICE alarms when
# the pings stop.
#
# Any ping-on-absence endpoint works: healthchecks.io, PagerDuty DMS, Better
# Stack heartbeats. The URL is the credential, so it lives in OpenBao.
#
# To seed once per cluster:
#   bao kv put secret/observability/alertmanager-deadmansswitch \
#     url=https://hc-ping.com/<uuid>
#
# ⚠️ Set the service's grace period ABOVE the 5 min repeat_interval — 15 min is
# a reasonable floor. Too tight and every Alertmanager restart pages you.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadmansswitch
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/component: vmalertmanager
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-deadmansswitch
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef: { key: observability/alertmanager-deadmansswitch, property: url }
