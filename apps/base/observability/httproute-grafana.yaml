# OpenAether 0.5.0 Sprint C — HTTPRoute Grafana → openaether-gateway
# Moved out of base.yaml into this dedicated file.
# parentRef: openaether-gateway (Istio, ns services-gateway, from: All).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openaether-gateway
      namespace: services-gateway
  hostnames:
    - "grafana.openaether.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
