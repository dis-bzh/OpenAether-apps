# OpenAether 0.5.0 Sprint C — Grafana HA
# ──────────────────────────────────────────────────────────────────
# 2 répliques avec podAntiAffinity.
# Backend DB: PostgreSQL CNPG grafana-db (grafana-cnpg-db.yaml) pour
# la session, les dashboards, les utilisateurs — requis pour HA.
# Admin: ExternalSecret grafana-admin (username=admin).
# Datasources: VictoriaMetrics vmselect + Loki (inline values).
# Dashboards: sidecar dashboard (label grafana_dashboard=1) → découverte
# ConfigMaps de tous les namespaces (searchNamespace: ALL).
#
# Pas de PVC Grafana (state dans PostgreSQL).
# Dashboard sidecar recharge les ConfigMaps à chaud (hot-reload).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "8.6.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 2
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
              topologyKey: kubernetes.io/hostname
    # Admin credentials depuis ExternalSecret grafana-admin.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # PostgreSQL CNPG pour la session HA (requis si replicas > 1).
    grafana.ini:
      database:
        type: postgres
        host: grafana-db-rw.foundation-databases:5432
        name: grafana
        user: grafana
        password: "$__env{GF_DATABASE_PASSWORD}"
        ssl_mode: disable
      server:
        root_url: "https://grafana.openaether.local"
      security:
        cookie_secure: true
        strict_transport_security: true
      analytics:
        reporting_enabled: false
        check_for_updates: false
      users:
        # Rôle par défaut d'un utilisateur qui arrive par le SSO sans rôle
        # reconnu. Lecture seule : élargir ensuite dans Zitadel, pas ici.
        auto_assign_org_role: Viewer
      # ── SSO OIDC via Zitadel ────────────────────────────────────────────────
      # Endpoints VÉRIFIÉS contre la doc Zitadel (apis/openidoauth/endpoints) :
      # /oauth/v2/authorize, /oauth/v2/token, /oidc/v1/userinfo,
      # /oidc/v1/end_session.
      #
      # ⚠️ Le formulaire de connexion LOCAL reste actif (`disable_login_form`
      # non posé) : l'admin local est le filet si le SSO est cassé ou pas encore
      # configuré côté Zitadel. Ne le désactiver qu'une fois le SSO éprouvé.
      auth.generic_oauth:
        enabled: true
        name: Zitadel
        allow_sign_up: true
        use_pkce: true
        client_id: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
        client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
        # ⚠️ `urn:zitadel:iam:org:projects:roles` est INDISPENSABLE : sans lui,
        # Zitadel n'émet AUCUN claim de rôles et tout le monde retombe sur
        # `auto_assign_org_role` (Viewer). Mesuré en réel le 2026-07-28 —
        # avec « openid profile » seul, aucun claim `*:roles` dans
        # /oidc/v1/userinfo ; il n'apparaît qu'avec ce scope.
        scopes: "openid profile email urn:zitadel:iam:org:projects:roles"
        auth_url: "https://zitadel.openaether.local/oauth/v2/authorize"
        token_url: "https://zitadel.openaether.local/oauth/v2/token"
        api_url: "https://zitadel.openaether.local/oidc/v1/userinfo"
        # Mapping de rôle depuis le claim projet de Zitadel.
        #
        # STRUCTURE VÉRIFIÉE en réel (2026-07-28, Zitadel v4.14) : la valeur est
        # un OBJET dont les CLÉS sont les rôles — `keys()` est donc la bonne
        # approche :
        #   {"grafana-admin": {"<orgId>": "<domaine>"}}
        #
        # ⚠️ NOM du claim : deux formes existent. Zitadel émet la forme
        # PRÉFIXÉE PAR L'ID DE PROJET (`…:project:<projectId>:roles`) quand les
        # rôles sont demandés pour d'autres projets ; la forme non préfixée
        # ci-dessous vaut pour le projet auquel appartient le client — le cas de
        # Grafana. Si après une vraie connexion tous les comptes restent Viewer,
        # inspecter le token et, au besoin, substituer l'ID de projet ici :
        #   curl -H "Authorization: Bearer <token>" https://zitadel.…/oidc/v1/userinfo
        #
        # `role_attribute_strict: false` est délibéré : un mapping qui ne matche
        # pas laisse l'utilisateur en Viewer au lieu de lui refuser l'accès.
        role_attribute_path: >-
          contains(keys("urn:zitadel:iam:org:project:roles"), 'grafana-admin') && 'Admin' || 'Viewer'
        role_attribute_strict: false
        signout_redirect_url: "https://zitadel.openaether.local/oidc/v1/end_session"
    # Injecter le password DB depuis le Secret grafana-db-credentials.
    # envFromSecret monte TOUTES les clés du secret comme env vars.
    # La clé doit s'appeler GF_DATABASE_PASSWORD pour que grafana.ini
    # la résolve via $__env{GF_DATABASE_PASSWORD}.
    envFromSecret: grafana-db-credentials
    # Identifiants OIDC — `optional: true` est ESSENTIEL : tant que
    # `secret/grafana/oidc` n'est pas seedé dans OpenBao, le Secret n'existe pas.
    # Sans `optional`, le pod resterait bloqué et Grafana serait TOTALEMENT
    # inaccessible faute d'un SSO pas encore configuré — l'inverse du but.
    # Avec, Grafana démarre, le bouton Zitadel est simplement inopérant, et
    # l'admin local fonctionne.
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc
          key: client-id
          optional: true
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client-secret
          optional: true
    # Datasources inline (Flux gère la mise à jour).
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: "http://vmselect-victoria-metrics.services-observability:8481/select/0/prometheus"
            isDefault: true
            editable: false
            jsonData:
              prometheusType: Prometheus
              timeInterval: "30s"
          - name: Loki
            type: loki
            url: "http://loki.services-observability:3100"
            editable: false
    # Sidecar: découverte automatique des ConfigMaps label grafana_dashboard=1.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        provider:
          foldersFromFilesStructure: true
          allowUiUpdates: false
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    podDisruptionBudget:
      minAvailable: 1
