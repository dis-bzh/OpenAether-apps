# OpenAether 0.5.0 Sprint C — Grafana HA
# ──────────────────────────────────────────────────────────────────
# 2 replicas with podAntiAffinity.
# Backend DB: PostgreSQL CNPG grafana-db (grafana-cnpg-db.yaml) pour
# session, dashboards and users — required for HA.
# Admin: ExternalSecret grafana-admin (username=admin).
# Datasources: VictoriaMetrics vmselect + Loki (inline values).
# Dashboards: dashboard sidecar (label grafana_dashboard=1) → discovers
# ConfigMaps from every namespace (searchNamespace: ALL).
#
# No Grafana PVC (state lives in PostgreSQL).
# The dashboard sidecar hot-reloads the ConfigMaps.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "8.6.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: services-observability
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 2
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
              topologyKey: kubernetes.io/hostname
    # Admin credentials depuis ExternalSecret grafana-admin.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # CNPG PostgreSQL for the HA session store (required when replicas > 1).
    grafana.ini:
      database:
        type: postgres
        host: grafana-db-rw.foundation-databases:5432
        name: grafana
        user: grafana
        password: "$__env{GF_DATABASE_PASSWORD}"
        ssl_mode: disable
      server:
        root_url: "https://grafana.openaether.local"
      security:
        cookie_secure: true
        strict_transport_security: true
      analytics:
        reporting_enabled: false
        check_for_updates: false
      users:
        # Default role for a user arriving through SSO with no recognised role.
        # Read-only: widen it in Zitadel afterwards, not here.
        auto_assign_org_role: Viewer
      # ── SSO OIDC via Zitadel ────────────────────────────────────────────────
      # Endpoints VERIFIED against the Zitadel docs (apis/openidoauth/endpoints):
      # /oauth/v2/authorize, /oauth/v2/token, /oidc/v1/userinfo,
      # /oidc/v1/end_session.
      #
      # ⚠️ The LOCAL login form stays enabled (`disable_login_form` not set):
      # the local admin is the safety net if SSO is broken or not yet configured
      # on the Zitadel side. Only disable it once SSO is proven.
      auth.generic_oauth:
        enabled: true
        name: Zitadel
        allow_sign_up: true
        use_pkce: true
        client_id: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
        client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
        # ⚠️ `urn:zitadel:iam:org:projects:roles` is ESSENTIAL: without it
        # Zitadel emits NO role claim at all and everyone falls back to
        # `auto_assign_org_role` (Viewer). Measured for real on 2026-07-28 —
        # with "openid profile" alone there is no `*:roles` claim in
        # /oidc/v1/userinfo; it only appears with this scope.
        scopes: "openid profile email urn:zitadel:iam:org:projects:roles"
        auth_url: "https://zitadel.openaether.local/oauth/v2/authorize"
        token_url: "https://zitadel.openaether.local/oauth/v2/token"
        api_url: "https://zitadel.openaether.local/oidc/v1/userinfo"
        # Role mapping from Zitadel's project claim.
        #
        # STRUCTURE VERIFIED for real (2026-07-28, Zitadel v4.14): the value is
        # an OBJECT whose KEYS are the roles — so `keys()` is the right
        # approche :
        #   {"grafana-admin": {"<orgId>": "<domaine>"}}
        #
        # ⚠️ Claim NAME: two forms exist. Zitadel emits the PROJECT-ID-PREFIXED
        # form (`…:project:<projectId>:roles`) when roles are requested for other
        # projects; the unprefixed form below applies to the project the client
        # belongs to — Grafana's case. If after a real login every account stays
        # Viewer, inspect the token and, if needed, substitute the project ID
        # here:
        #   curl -H "Authorization: Bearer <token>" https://zitadel.…/oidc/v1/userinfo
        #
        # `role_attribute_strict: false` is deliberate: a mapping that does not
        # match leaves the user as Viewer instead of denying access.
        role_attribute_path: >-
          contains(keys("urn:zitadel:iam:org:project:roles"), 'grafana-admin') && 'Admin' || 'Viewer'
        role_attribute_strict: false
        signout_redirect_url: "https://zitadel.openaether.local/oidc/v1/end_session"
    # Inject the DB password from the grafana-db-credentials Secret.
    # envFromSecret mounts ALL of the secret's keys as env vars.
    # The key must be named GF_DATABASE_PASSWORD so that grafana.ini resolves
    # it through $__env{GF_DATABASE_PASSWORD}.
    envFromSecret: grafana-db-credentials
    # OIDC credentials — `optional: true` is ESSENTIAL: until
    # `secret/grafana/oidc` is seeded into OpenBao, the Secret does not exist.
    # Without `optional` the pod would stay stuck and Grafana would be TOTALLY
    # unreachable for want of a not-yet-configured SSO — the opposite of the goal.
    # With it, Grafana starts, the Zitadel button is simply inert, and
    # l'admin local fonctionne.
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc
          key: client-id
          optional: true
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client-secret
          optional: true
    # Inline datasources (Flux handles updates).
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: "http://vmselect-victoria-metrics.services-observability:8481/select/0/prometheus"
            isDefault: true
            editable: false
            jsonData:
              prometheusType: Prometheus
              timeInterval: "30s"
          - name: Loki
            type: loki
            url: "http://loki.services-observability:3100"
            editable: false
    # Sidecar: automatic discovery of ConfigMaps labelled grafana_dashboard=1.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        provider:
          foldersFromFilesStructure: true
          allowUiUpdates: false
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    podDisruptionBudget:
      minAvailable: 1
