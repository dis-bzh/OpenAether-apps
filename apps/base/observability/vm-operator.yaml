# OpenAether 0.5.0 Sprint C — VMOperator (VictoriaMetrics Operator)
# ──────────────────────────────────────────────────────────────────
# VMOperator installs the CRDs: VMCluster, VMAgent, VMSingle,
# VMServiceScrape, VMNodeScrape, VMPodScrape, VMRule, VMAlertManager.
# These CRDs let you declare scrapes, alerts and clusters in GitOps.
#
# Flux selfHeal handles the CRDs → CRs race (VMCluster/VMAgent applied before
# the CRD is installed → selfHeal reapplies automatically).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: victoriametrics-operator
spec:
  url: https://victoriametrics.github.io/helm-charts/
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: victoriametrics-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-operator
      version: "0.65.1"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: services-observability
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # 1 replica: 2 replicas fight over the leader lease → crash loop.
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # More probe timeout to give the reconcile time to finish
    # initial (VMCluster 6 StatefulSets).
    probePath: /health
    livenessProbe:
      failureThreshold: 10
      periodSeconds: 15
    readinessProbe:
      failureThreshold: 10
      periodSeconds: 15
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: victoria-metrics-operator
              topologyKey: kubernetes.io/hostname
    # No webhook in simple mode (avoids cert-manager complexity for the operator itself).
    admissionWebhooks:
      enabled: false
