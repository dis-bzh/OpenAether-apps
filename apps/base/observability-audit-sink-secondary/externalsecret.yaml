# yamllint disable rule:line-length
# The SECOND sink's location, its own S3 key pair and its repository password, from OpenBao (secret/audit/sink), written by
# OpenAether-infra's seed-openbao.sh (create-only) when audit_sink_placement is not off. Until it is seeded this stays NotReady and the shipper
# does not start: deliberate (a visible failure beats logs sent nowhere). Nothing here is substituted by Flux: the values are read at
# runtime from the Secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-sink-secondary-credentials
  namespace: services-observability-audit-sink
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: audit-sink-secondary-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # restic's own names, so that the Secret can be an envFrom: the repository, its password, the S3 pair, the region.
        RESTIC_REPO_BASE: 's3:{{ .endpoint }}/{{ .bucket }}/{{ .prefix }}'
        RESTIC_PASSWORD: '{{ .restic_password }}'
        AWS_ACCESS_KEY_ID: '{{ .access_key }}'
        AWS_SECRET_ACCESS_KEY: '{{ .secret_key }}'
        AWS_DEFAULT_REGION: '{{ .region }}'
        # For the delivery check, which lists with the AWS CLI.
        ENDPOINT: '{{ .endpoint }}'
        BUCKET: '{{ .bucket }}'
        PREFIX: '{{ .prefix }}'
  dataFrom:
    - extract:
        key: audit/sink-secondary
