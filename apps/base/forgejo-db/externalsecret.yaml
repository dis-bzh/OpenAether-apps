# ExternalSecret forgejo-db-credentials (foundation-databases)
# CNPG's bootstrap.initdb.secret must be in the same namespace as the Cluster.
# The services-git version (consumed by the app through GITEA__database__PASSWD)
# lives in apps/base/forgejo/externalsecrets.yaml — same OpenBao key, so the
# bootstrap and the app always agree on the forgejo role's password.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-credentials
  namespace: foundation-databases
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: forgejo-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: forgejo-db-credentials
    creationPolicy: Owner
    template:
      data:
        username: "forgejo"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/db
        property: password
