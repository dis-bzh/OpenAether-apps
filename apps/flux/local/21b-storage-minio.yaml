# Local-only: S3-compatible MinIO for local testing (no HelmRelease → in a separate minio/).
# Active locally because S3 is needed to test the Loki/Grafana config without Longhorn.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-minio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/storage/minio
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
