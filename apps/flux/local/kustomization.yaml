apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenAether — Overlay LOCAL management (Docker/WSL2, cluster_role implicite = management).
# Base: ../base (DAG management complet).
# Différences vs management (cloud):
#   - local-path-provisioner actif (00b) : Docker n'a pas de provisioner dynamique.
#   - storage-minio actif (21b) : S3 local pour test Loki/Grafana.
#   - cert-manager, istio, storage, observability : suspendus (HelmReleases, réseau chart
#     inaccessible en Docker / nécessitent Longhorn + Istio non disponibles).
#   - cnpg : suspendu (webhook ESO + OpenBao requis, non dispos en local).
#   - storage-minio : suspendu (namespace créé par storage/Longhorn, lui-même suspendu).
#   - platform-local-storage : suspendu (kustomize build fetche raw.githubusercontent.com, DNS Docker cassé ; ressources déjà déployées).
#   - platform-gateway-api : suspendu (kustomize build fetche github.com, DNS Docker cassé ; CRDs déjà présents).
#   - cluster-api-operator/providers : suspendus (nécessitent cert-manager, suspendu).
#   - foundation-pki-root : dépendance ajoutée sur platform-local-storage (PVC openbao).
#
# Règle DAG (invariant) : l'ensemble {suspended} doit être fermé vers le haut —
# aucune Kustomization active ne dépend d'une suspended (sinon deadlock wait).
resources:
  - ../base
  - 00b-local-storage.yaml
  - 21b-storage-minio.yaml

patches:
  # cert-manager suspendu : HelmRelease chart non accessible en Docker.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: cert-manager
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # istio suspendu : HelmReleases (5), nécessite cert-manager + réseau chart.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: istio
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # storage (Longhorn) suspendu : HelmRelease, nœuds Docker sans disque dédié.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: storage
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # observability suspendu : dépend de storage+cert-manager+istio (tous suspendus).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: observability
    patch: |-
      - { op: add, path: /spec/suspend, value: true }

  # cnpg suspendu : nécessite le webhook ESO + OpenBao opérationnels (non dispos en local).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: cnpg
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # storage-minio suspendu : namespace foundation-storage créé par storage (Longhorn, suspendu).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: storage-minio
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # platform-local-storage suspendu : kustomize build fetche raw.githubusercontent.com (DNS Docker cassé).
  # Ressources local-path-provisioner déjà déployées (vendored + kubectl apply direct).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: platform-local-storage
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # platform-gateway-api suspendu : kustomize build fetche github.com (DNS Docker cassé).
  # CRDs Gateway API déjà présents (vendored + kubectl apply direct).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: platform-gateway-api
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # foundation-vault : retirer dep platform-gateway-api (suspendu local).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: foundation-vault
    patch: |-
      - { op: replace, path: /spec/dependsOn, value: [{ name: foundation-pki-root }] }

  # foundation-pki-root : retirer dep platform-local-storage (suspendu local).
  # La dep platform-local-storage locale (PVC openbao) est déjà déployée.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: foundation-pki-root
    patch: |-
      - { op: replace, path: /spec/dependsOn, value: [{ name: namespaces }, { name: foundation-pki-root-rbac }] }

  # cluster-api-operator suspendu : nécessite cert-manager (suspendu en local).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: cluster-api-operator
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

  # cluster-api-providers suspendu : dépend de cluster-api-operator (suspendu).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: cluster-api-providers
    patch: |-
      - { op: add,     path: /spec/suspend, value: true }
      - { op: replace, path: /spec/wait,    value: false }

