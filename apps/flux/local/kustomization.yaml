apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenAether — LOCAL overlay (Docker/WSL2).
#
# Locally Flux does not reconcile from GitHub: every Kustomization is suspended,
# Flux is a no-op, and deployment happens with `kubectl apply -k apps/base/<x>`.
# `task local-test` (infra repo) drives the whole order; check with
# `kubectl get kustomization -A`.
#
# Two local specifics, both patched below:
#   * the LB-IPAM pool must point at the Docker bridge (10.5.0.240-254) — the
#     base pool targets the Scaleway VPC and every LoadBalancer stays <pending>;
#   * storage is redirected to an empty stub (no Longhorn locally).
#
# Zitadel is cloud-only for now: it needs the TLS Gateway, whose intermediate is
# signed offline.
resources:
  - ../base
  - 00b-local-storage.yaml
  - 21b-storage-minio.yaml

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |-
      - { op: add, path: /spec/suspend, value: true }
  # Longhorn requiert iscsi-tools (extension Talos absente de l'image Docker).
  # Redirects storage to an empty stub — guards against an accidental local apply.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: storage
    patch: |-
      - { op: replace, path: /spec/path, value: ./apps/base/storage/local }
  # LB-IPAM pool repointed at the local overlay (Docker bridge range 10.5.0.0/24
  # instead of the Scaleway private VPC 172.16.12.0/22) — otherwise every
  # LoadBalancer Service (including the openaether Gateway) stays <pending> locally.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: platform-cilium-lb-ipam
    patch: |-
      - { op: replace, path: /spec/path, value: ./apps/base/platform/cilium-lb-ipam-local }
