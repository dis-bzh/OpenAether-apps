apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenAether — Overlay LOCAL management (Docker/WSL2).
#
# PRINCIPE : en local, Flux ne peut pas réconcilier depuis GitHub (DNS Docker cassé).
# Toutes les Kustomizations sont suspendues → Flux est un no-op.
# Le déploiement et les tests se font via `kubectl apply -k apps/base/<composant>`.
#
# Ordre de déploiement local (à suivre à la main ou via local-apply.sh) :
#   1. kubectl apply -k apps/base/namespaces
#   2. kubectl apply -k apps/base/platform/local-path-provisioner
#   3. kubectl apply -k apps/base/platform/gateway-api
#   4. kubectl apply -k apps/base/platform/priority-classes
#   5. kubectl apply -k apps/base/platform/network-policies
#   6. kubectl apply -k apps/base/foundation/pki-root/rbac
#   7. kubectl apply -k apps/base/foundation/pki-root
#   8. kubectl apply -k apps/base/foundation/vault
#   9. kubectl apply -k apps/base/external-secrets
#   10. kubectl apply -k apps/base/external-secrets/stores
#
# Pour vérifier l'état : task local-test (ou kubectl get kustomization -A)
resources:
  - ../base
  - 00b-local-storage.yaml
  - 21b-storage-minio.yaml

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |-
      - { op: add, path: /spec/suspend, value: true }
  # Longhorn requiert iscsi-tools (extension Talos absente de l'image Docker).
  # Redirige storage vers un stub vide — protège contre un apply accidentel en local.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: storage
    patch: |-
      - { op: replace, path: /spec/path, value: ./apps/base/storage/local }
