apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Profil OpenAether GÉNÉRÉ par scripts/pick.py — ne pas éditer à la main.
# Pioche : vault eso certs gateway
# Régénérer : python3 scripts/pick.py vault eso certs gateway -o <ce dossier>
#
# Le DAG complet reste dans ../base ; ce profil supprime ($patch: delete)
# les Kustomizations non sélectionnées. La fermeture transitive garantit
# qu'aucune Kustomization retenue ne dépend d'une supprimée.
resources:
  - ../base
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: platform-metrics-server
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cnpg
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: storage
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: backup-databases
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: observability
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: observability-vm-customresources
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: identity
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kyverno
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kyverno-policies
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cluster-api-operator
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cluster-api-providers
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: orc
        namespace: flux-system
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: capi-clusters
        namespace: flux-system
      $patch: delete
