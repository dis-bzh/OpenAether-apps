# OpenAether pick catalogue — consumed by scripts/pick.py
#
# IMPORTANT: dependencies are NOT declared here. The source of truth remains
# `spec.dependsOn` of the Flux Kustomizations (apps/flux/base/*.yaml).
# This file carries UX metadata only: aliases, baseline bricks, companions and
# descriptions. pick.py rejects any name unknown to the DAG.

# Always included in a profile (the default security posture).
# Can be disabled with --no-baseline (not recommended).
baseline:
  - namespaces                 # PSA labels + foundation-*/services-* split
  - platform-network-policies  # default-deny + allow-dns/kube-api (everything else assumes this posture)
  - flux-egress                # locks down flux-system egress

# Added automatically as soon as ALL their dependencies (dependsOn) are already
# selected — never a driver for pulling in new dependencies.
companions:
  - external-secrets-stores          # openbao ClusterSecretStore (if ESO + OpenBao picked)
  - cert-manager-issuers             # openbao ClusterIssuer (if cert-manager + OpenBao picked)
  - istio-authorizationpolicies      # mesh AuthorizationPolicies (if istio picked)
  - istio-authorizationpolicies-storage  # foundation-storage policies (if istio AND storage picked)
  - kyverno-policies                 # policies (if kyverno picked)
  - observability-vm-customresources  # VMCluster/VMAgent (if observability picked)
  - storage-backup-target            # S3 target for volume backups (if storage + ESO picked)
  - backup-openbao-identity          # CLUSTER_NAME ConfigMap (restic repository prefix)
  - backup-databases-identity        # same, on the CNPG side
  - backup-openbao                   # backup by default once OpenBao + ESO are picked
  - backup-databases                 # backup by default once CNPG + ESO are picked
  - capi-clusters                    # client cluster instantiation (if CAPI picked)
  - orc                              # CAPO (OpenStack) dependency — openstack.k-orc.cloud CRDs

# Friendly aliases → Flux Kustomization name.
aliases:
  vault: foundation-vault
  openbao: foundation-vault
  eso: external-secrets
  certs: cert-manager
  pki: cert-manager
  mesh: istio
  ambient: istio
  gateway: services-gateway
  ingress: services-gateway
  db: cnpg
  postgres: cnpg
  longhorn: storage
  obs: observability
  monitoring: observability
  iam: identity
  sso: identity
  zitadel: identity
  policies: kyverno
  capi: cluster-api-providers
  management: cluster-api-providers
  metrics: platform-metrics-server

# Descriptions shown by --list (optional, one line).
descriptions:
  namespaces: foundation-*/services-* namespaces (PSA, mesh/out-of-mesh split)
  platform-local-path-provisioner: local-path / local-path-retain StorageClasses
  platform-gateway-api: Gateway API CRDs
  platform-priority-classes: PriorityClasses platform-critical/medium/low/batch
  platform-cilium-lb-ipam: Cilium LB-IPAM pool (LoadBalancer Services)
  platform-network-policies: Default-deny + allow-dns/kube-api (CiliumNetworkPolicy)
  platform-metrics-server: metrics-server (kubectl top, HPA)
  vault-ca: internal CA of the OpenBao listener (ns cert-manager)
  foundation-vault: HA OpenBao, raft 3 (Shamir 5/3 seal, unsealer, PKI intermediate)
  external-secrets: External Secrets Operator
  external-secrets-stores: shared openbao ClusterSecretStore
  cert-manager: cert-manager (TLS webhooks, internal certs)
  cert-manager-issuers: openbao ClusterIssuer (OpenBao PKI)
  istio: Istio ambient (istiod, CNI, ztunnel)
  istio-authorizationpolicies: mesh AuthorizationPolicies
  services-gateway: north-south Gateway + openaether TLS cert
  cnpg: CloudNativePG (operator + zitadel-db/grafana-db clusters)
  storage: Longhorn (replicated volumes, LUKS through OpenBao)
  storage-backup-target: S3 target for Longhorn volume backups (credentials through OpenBao)
  backup-openbao-identity: CLUSTER_NAME ConfigMap (restic repository prefix, ns foundation-vault)
  backup-databases-identity: CLUSTER_NAME ConfigMap (restic repository prefix, ns foundation-databases)
  backup-openbao: OpenBao raft snapshot → restic (client-encrypted, 2 S3 repositories)
  backup-databases: CNPG pg_dump → restic (client-encrypted, 2 S3 repositories)
  observability: VictoriaMetrics + Loki + Grafana + Alloy
  observability-vm-customresources: VMCluster/VMAgent/VM*Scrape
  identity: Zitadel (IAM/SSO, CNPG backend)
  kyverno: Kyverno (policy engine)
  kyverno-policies: OpenAether Kyverno policies
  cluster-api-operator: CAPI operator (management layer)
  cluster-api-providers: CAPI providers (Talos, Scaleway, OpenStack, Outscale)
  capi-clusters: CAPI client clusters (apps/clusters, kubeception/gitception)
  orc: openstack-resource-controller (CRDs required by CAPO)
  flux-egress: egress-restricted NetworkPolicy for flux-system
