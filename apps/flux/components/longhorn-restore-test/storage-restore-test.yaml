apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-restore-test
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/storage-restore-test
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-identity
  dependsOn:
    - name: storage-backup-target  # the BackupTarget, the recurring job, the namespaces and CRDs of Longhorn
    - name: backup-databases       # the metrics ConfigMap and exporter, the scratch namespace (through cnpg)
