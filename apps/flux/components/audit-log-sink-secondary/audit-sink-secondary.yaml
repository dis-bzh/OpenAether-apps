# yamllint disable rule:line-length
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-audit-sink-secondary
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability-audit-sink-secondary
  prune: true
  wait: false   # NotReady until the operator has seeded audit/sink-secondary: by design
  dependsOn:
    - name: observability-audit-sink   # the namespace, the ServiceAccount and the scripts
