apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenAether — Overlay CLOUD management (cluster_role=management).
# Read by the root Kustomization (flux-bootstrap.yaml.tftpl → path: apps/flux/management).
#
# The full DAG inherited from ../base — everything active (kyverno included).
# Deployment order (through dependsOn):
#   00 namespaces
#   └─ 01 platform
#      └─ 11 vault (OpenBao seal Shamir + unsealer HA — plus de root)
#         └─ 13 cert-manager ← also: 12 eso
#            └─ 14 istio
#   └─ 12 eso
#      └─ 20 cnpg
#      └─ 21 storage
#         └─ 30 observability ← also: cert-manager, istio, cnpg
#      └─ 35 identity (Zitadel) ← also: cnpg, cert-manager, istio, services-gateway
#   └─ 40 kyverno → kyverno-policies
resources:
  - ../base
