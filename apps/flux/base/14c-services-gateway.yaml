# Group 14c — north-south Gateway (Gateway API + OpenBao-issued TLS cert).
# DECOUPLED from istio (14): the `openaether-tls` cert depends on the OpenBao
# issuers AND on a manual OFFLINE signing of the intermediate. Under
# `wait: true` inside istio it blocked the control plane + observability. Here
# `wait: false` → applies the Gateway/cert/route without waiting for readiness.
# The istio mesh (14) has its own CA and stays independent of the OpenBao PKI.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/services-gateway
  prune: true
  wait: false
  dependsOn:
    - name: istio                 # GatewayClass `istio` + ns services-gateway
    - name: cert-manager-issuers  # ClusterIssuer openbao
    - name: foundation-vault      # PKI pki/sign/openaether
    - name: platform-cilium-lb-ipam  # pool LB-IPAM : sans lui le Service LoadBalancer du Gateway reste <pending>
