# Groupe 21 — Storage (Longhorn HelmRelease + StorageClasses + ExternalSecret LUKS)
# Depends on eso (the longhorn-encryption ExternalSecret).
# Isolation: a Longhorn problem does not affect the foundation stack.
# MinIO: local overlay only (see apps/flux/local/21-storage.yaml).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/storage
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
