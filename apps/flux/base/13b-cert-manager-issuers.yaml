# Groupe 13b — ClusterIssuers cert-manager (OpenBao PKI)
# Separated from group 13 to avoid the dry-run chicken-and-egg:
# the cert-manager.io/v1 CRDs only exist once the cert-manager HelmRelease is
# installed. This Kustomization waits for cert-manager to be Ready before applying.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cert-manager-issuers
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    - name: foundation-vault
