# Group 14b — Istio AuthorizationPolicies (once the Istio CRDs are ready)
# Depends on the 'istio' Kustomization (which installs the CRDs through the istio-base HelmRelease).
# Applies the authz/ subdirectory holding the AuthorizationPolicies.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-authorizationpolicies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio/authz
  prune: true
  wait: true
  dependsOn:
    - name: istio
