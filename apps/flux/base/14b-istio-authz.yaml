# Groupe 14b — Istio AuthorizationPolicies (après CRDs Istio prêts)
# Dépend du Kustomization 'istio' (qui installe CRDs via istio-base HelmRelease).
# Applique le sous-dossier authz/ qui contient les AuthorizationPolicies.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-authorizationpolicies
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio/authz
  prune: true
  wait: true
  dependsOn:
    - name: istio