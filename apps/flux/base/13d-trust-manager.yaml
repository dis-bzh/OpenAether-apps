# yamllint disable rule:line-length
# Group 13d — trust-manager and the CNPG CA (apps #78, step 1: nothing consumes the Bundle yet).
# Two Kustomizations: the Bundle CRD exists only once the trust-manager HelmRelease is installed (an operator and its own
# CRs need two, see the flux-dag skill).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/trust-manager
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    # Its CiliumNetworkPolicy and the default-deny posture it assumes.
    - name: platform-network-policies
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-ca
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cnpg-ca
  prune: true
  wait: true
  dependsOn:
    - name: trust-manager
    - name: namespaces
