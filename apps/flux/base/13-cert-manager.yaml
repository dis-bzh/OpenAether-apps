# Groupe 13 — cert-manager (HelmRelease)
# Depends on vault (OpenBao PKI ClusterIssuers) and eso (ExternalSecrets).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cert-manager
  prune: true
  wait: true
  dependsOn:
    # ⚠️ NO MORE dependency on `foundation-vault` (removed 2026-07-27).
    # It was superfluous: this brick installs the cert-manager OPERATOR and an
    # RBAC living in its own namespace — nothing in it calls OpenBao. It is the
    # ISSUERS (13b) that depend on it, and they are already a separate brick.
    #
    # What it cost: cert-manager waited on OpenBao, and istio,
    # observability et cluster-api-operator attendaient cert-manager — OpenBao
    # put OpenBao on the critical path of half the DAG.
    # What it blocked: giving a cert-manager certificate to OpenBao's listener
    # (internal TLS) was impossible, since cert-manager came after it.
    - name: external-secrets
