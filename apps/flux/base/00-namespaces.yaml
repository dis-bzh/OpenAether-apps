# Groupe 00 — Namespaces
# An absolute prerequisite: everything else depends on it.
# No dependsOn — the first to reconcile.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/namespaces
  prune: true
  wait: true
