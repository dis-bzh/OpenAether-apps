# Group 21c — backup target for Longhorn volumes.
#
# WHY IT IS SEPARATE FROM THE `storage` BRICK
#   This Kustomization carries a `postBuild.substituteFrom` to inject
#   ${BACKUP_TARGET_URL}. But Flux substitution applies to the WHOLE render of a
#   Kustomization: merged with `apps/base/storage`, it would blank the shell
#   variables of its `install.yaml` (`$VOL_DIR`). Same reason, and same shape,
#   as the `backup-*-identity` bricks (22a).
#
#   ⚠️ Never merge these resources into `apps/base/storage`.
#
# WHAT THIS UNBLOCKS
#   Until now `backupTarget` was empty and referred to a "cloud overlay" that
#   never existed: Longhorn volumes had NO backup destination at all, while the
#   project aims to back up everything critical.
#   The credentials come from OpenBao (the same destination as the restic
#   repositories), the URL from the `cluster-identity` ConfigMap laid down at bootstrap by OpenTofu.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-backup-target
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/storage/backup-target
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-identity
  dependsOn:
    - name: storage                  # CRD Setting + namespace longhorn-system
    - name: external-secrets-stores  # ClusterSecretStore openbao
