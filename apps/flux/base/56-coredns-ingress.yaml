apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns-ingress
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/platform/network-policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: openaether
  dependsOn:
    - name: platform-network-policies