# Groupe 50 — CAPI Operator (HelmRelease + CRDs)
# Depends on cert-manager (the operator's webhooks).
# Must be Ready BEFORE 51-cluster-api-providers (through wait: true).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cluster-api-operator
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
