# Groupe 50 — CAPI Operator (HelmRelease + CRDs)
# Dépend de cert-manager (webhooks de l'operator).
# Doit être Ready AVANT 51-cluster-api-providers (via wait: true).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-operator
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cluster-api-operator
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
