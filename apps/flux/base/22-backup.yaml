# Groupe 22 — Backups chiffrés multi-destinations (restic, cf. apps/base/backup/README.md)
# Compagnons dans la pioche : activés automatiquement dès que leurs dépendances
# sont sélectionnées — un cluster qui a du critique le sauvegarde par défaut.
# wait: false : les ExternalSecrets restent NotReady tant que l'opérateur n'a
# pas seedé backup/s3-{primary,replica} (creds provider) — by design.
#
# ⚠️ Le CHEMIN des dépôts restic est préfixé par le nom du cluster
# (`$CLUSTER_NAME`, injecté dans le conteneur par le ConfigMap `cluster-identity`
# de leur namespace — cf. 22a-backup-identity.yaml). Sans ce préfixe, deux
# clusters partageant un bucket écrivent au même endroit ; or un dépôt restic
# n'est lisible qu'avec le RESTIC_PASSWORD de celui qui l'a créé, régénéré à
# chaque bootstrap d'OpenBao. Le second ne peut alors ni lire ni initialiser
# (« already initialized ») : backups en échec permanent. Vécu au déploiement
# Outscale sur le bucket replica Scaleway laissé par le management OVH.
#
# ⚠️ NE PAS ajouter de `postBuild.substituteFrom` ICI : ces manifests contiennent
# des scripts shell aux variables NUES (`$PRIMARY_ENDPOINT`, `$LEADER`,
# `$init_err`…) que la substitution Flux viderait toutes. La substitution est
# volontairement isolée dans 22a-backup-identity.yaml, qui ne rend que des
# ConfigMaps.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-openbao
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/backup/openbao
  prune: true
  wait: false
  dependsOn:
    - name: external-secrets-stores  # implique foundation-vault + external-secrets
    - name: backup-openbao-identity  # ConfigMap CLUSTER_NAME (préfixe du dépôt)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-databases
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/backup/databases
  prune: true
  wait: false
  dependsOn:
    - name: external-secrets-stores
    - name: cnpg                     # Secrets <cluster>-app + instances à dumper
    - name: backup-databases-identity # ConfigMap CLUSTER_NAME (préfixe du dépôt)
