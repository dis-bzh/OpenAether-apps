# Group 22 — encrypted multi-destination backups (restic, see apps/base/backup/README.md)
# Companions in the pick: enabled automatically as soon as their dependencies
# are selected — a cluster holding critical data backs it up by default.
# wait: false — the ExternalSecrets stay NotReady until the operator has seeded
# backup/s3-{primary,replica} (provider credentials) — by design.
#
# ⚠️ The restic repository PATH is prefixed with the cluster name (see
# 22a-backup-identity.yaml). Without it, two clusters sharing a bucket collide:
# a restic repo is only readable with its creator's RESTIC_PASSWORD, so the
# second can neither read nor init it and its backups fail permanently.
#
# ⚠️ DO NOT add a `postBuild.substituteFrom` HERE: these manifests contain shell
# scripts with BARE variables (`$PRIMARY_ENDPOINT`, `$LEADER`, `$init_err`…)
# that Flux substitution would blank out entirely. The substitution is
# deliberately isolated in 22a-backup-identity.yaml, which renders only
# ConfigMaps.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-openbao
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/backup/openbao
  prune: true
  wait: false
  dependsOn:
    - name: external-secrets-stores  # implique foundation-vault + external-secrets
    - name: backup-openbao-identity  # CLUSTER_NAME ConfigMap (repository prefix)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-databases
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/backup/databases
  prune: true
  wait: false
  dependsOn:
    - name: external-secrets-stores
    - name: cnpg                     # <cluster>-app Secrets + the instances to dump
    - name: backup-databases-identity # CLUSTER_NAME ConfigMap (repository prefix)
