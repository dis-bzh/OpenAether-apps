# Group 22a — the cluster identity, copied into the backup namespaces.
#
# WHY TWO KUSTOMIZATIONS SEPARATE FROM THE BACKUP BRICK
#   `postBuild.substituteFrom` applies to the WHOLE render of a Kustomization.
#   And the backup CronJobs embed shell scripts with BARE variables
#   (`$PRIMARY_ENDPOINT`, `$LEADER`, `$init_err`…): Flux substitution would
#   replace them all with empty strings, silently breaking the backups.
#   Substitution is therefore confined here, to manifests containing nothing
#   but a ConfigMap. The CronJobs then read it as a variable
#   d'environnement ordinaire, au runtime.
#
#   ⚠️ Never merge these resources into `apps/base/backup/*`.
#
# The source `cluster-identity` ConfigMap (ns flux-system) is laid down at
# bootstrap: `flux-bootstrap.yaml.tftpl` on the infra side for the parent,
# `child-gitops` for the CAPI children. Its absence fails both Kustomizations —
# deliberate: a loud failure beats an empty prefix and a collision between clusters.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-openbao-identity
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/backup/openbao-identity
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-identity
  dependsOn:
    - name: foundation-vault   # propriétaire du namespace foundation-vault
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-databases-identity
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/backup/databases-identity
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-identity
  dependsOn:
    - name: cnpg               # propriétaire du namespace foundation-databases
