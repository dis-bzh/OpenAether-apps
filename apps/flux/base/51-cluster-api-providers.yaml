# Groupe 51 — CAPI Providers (CoreProvider, CABPT, CACPPT, CAPS, CAPO, CAPOSC)
# Dépend de cluster-api-operator : les CRDs Provider n'existent qu'après l'operator.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-providers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cluster-api-providers
  prune: true
  wait: true
  dependsOn:
    - name: cluster-api-operator
