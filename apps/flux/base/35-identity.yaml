# Groupe 35 — Identité (Zitadel)
# ──────────────────────────────────────────────────────────────────────────
# IAM souverain. Backend Postgres = CNPG zitadel-db (groupe 20). Secrets
# (masterkey + password DB) via ESO/OpenBao (groupe 12). Exposé via la Gateway
# Istio (groupe 14c) ; trafic in-mesh sécurisé par Istio (ambient).
# Isolation : un crash Zitadel n'impacte ni la fondation ni l'observability.
#
# Zitadel ne livre PAS de CRD → pas besoin du split chicken-egg opérateur/CR.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/identity/zitadel
  prune: true
  wait: false
  dependsOn:
    - name: cnpg               # backend Postgres zitadel-db
    - name: external-secrets   # masterkey + password DB
    - name: istio              # mesh ambient (services-identity)
    - name: services-gateway   # HTTPRoute → openaether-gateway
