# Group 35 — identity (Zitadel)
# ──────────────────────────────────────────────────────────────────────────
# IAM souverain. Backend Postgres = CNPG zitadel-db (groupe 20). Secrets
# (masterkey + DB password) through ESO/OpenBao (group 12). Exposed through the
# Istio Gateway (group 14c); in-mesh traffic secured by Istio (ambient).
# Isolation: a Zitadel crash affects neither the foundation nor observability.
#
# Zitadel ships NO CRD → no need for the operator/CR chicken-and-egg split.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/identity/zitadel
  prune: true
  wait: false
  dependsOn:
    - name: cnpg               # backend Postgres zitadel-db
    - name: external-secrets   # masterkey + password DB
    - name: istio              # mesh ambient (services-identity)
    - name: services-gateway   # HTTPRoute → openaether-gateway
