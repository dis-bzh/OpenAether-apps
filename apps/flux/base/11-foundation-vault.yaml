# Groupe 11 — OpenBao Workload (raft HA 3 nodes, auto-unseal via pki-root)
# Isolation : un crash workload n'impacte pas pki-root ni eso.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-vault
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/foundation/vault
  prune: true
  wait: false
  # force: le Job openbao-vault-bootstrap est IMMUABLE ; sans force, toute
  # évolution de son spec fait échouer le dry-run → TOUT le bundle vault est
  # rejeté (vu en cloud réel). force recrée le Job (delete+create), ce qui est
  # exactement son contrat (« supprimé + recréé à chaque sync », idempotent).
  force: true
  dependsOn:
    # cert-manager émet le certificat du listener OpenBao (TLS interne). C'est
    # possible depuis que la dépendance INVERSE — cert-manager → foundation-vault
    # — a été retirée : elle était fausse (seuls les ISSUERS dépendent d'OpenBao).
    - name: cert-manager
    - name: vault-ca   # CA du certificat serveur (ns cert-manager)
    - name: platform-gateway-api
    - name: platform-local-path-provisioner  # PVC raft storageClassName local-path-retain
    - name: platform-priority-classes        # priorityClassName platform-critical (pod rejeté à l'admission si absente)
    # - name: foundation-pki-root  # SUPPRIMÉ: plus de root OpenBao, unsealer HA gère le Shamir
