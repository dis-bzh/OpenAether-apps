# Groupe 11 — OpenBao Workload (raft HA 3 nodes, auto-unseal via pki-root)
# Isolation: a workload crash affects neither pki-root nor eso.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-vault
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/foundation/vault
  prune: true
  wait: false
  # force: the openbao-vault-bootstrap Job is IMMUTABLE; without force, any
  # change to its spec fails the dry-run → the WHOLE vault bundle is rejected
  # (seen on real cloud). force recreates the Job (delete+create), which is
  # exactly its contract ("deleted + recreated on every sync", idempotent).
  force: true
  dependsOn:
    # cert-manager issues the OpenBao listener's certificate (internal TLS).
    # This became possible once the REVERSE dependency — cert-manager →
    # foundation-vault — was removed: it was wrong (only the ISSUERS depend on OpenBao).
    - name: cert-manager
    - name: vault-ca   # CA du certificat serveur (ns cert-manager)
    - name: platform-gateway-api
    - name: platform-local-path-provisioner  # PVC raft storageClassName local-path-retain
    - name: platform-priority-classes        # priorityClassName platform-critical (pod rejected at admission if absent)
    # - name: foundation-pki-root  # REMOVED: no more OpenBao root, the HA unsealer handles Shamir
