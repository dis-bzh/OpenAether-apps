# Group 11 — OpenBao (raft HA 3 nodes, static auto-unseal). See apps/base/foundation/vault/README.md.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-vault
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/foundation/vault
  prune: true
  wait: false
  # force: the Jobs openbao-init and openbao-vault-bootstrap are IMMUTABLE; without force, a change to
  # a spec (including the configMapGenerator hash of a changed script) fails the dry-run → the WHOLE
  # vault bundle is rejected (seen on real cloud). force recreates a Job only then (delete+create);
  # with an unchanged spec Flux reports it unchanged. openbao-init also expires after its TTL (3600 s)
  # and is recreated by the next reconcile (reasoned, not observed).
  force: true
  dependsOn:
    # cert-manager issues the OpenBao listener's certificate (internal TLS).
    # This became possible once the REVERSE dependency — cert-manager →
    # foundation-vault — was removed: it was wrong (only the ISSUERS depend on OpenBao).
    - name: cert-manager
    - name: vault-ca   # CA of the server certificate (ns cert-manager)
    - name: platform-gateway-api
    - name: platform-local-path-provisioner  # PVC raft storageClassName local-path-retain
    - name: platform-priority-classes        # priorityClassName platform-critical (pod rejected at admission if absent)
