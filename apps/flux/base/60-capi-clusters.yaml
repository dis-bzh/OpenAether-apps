# Groupe 60 — Instanciation des clusters clients CAPI (kubeception/gitception).
# Reconciles apps/clusters/ (one file per child cluster, see its README).
# A pick companion: enabled automatically alongside cluster-api-providers.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-clusters
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/clusters
  prune: true
  wait: false
  dependsOn:
    - name: cluster-api-providers
