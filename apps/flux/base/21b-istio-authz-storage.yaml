# Group 21b — AuthorizationPolicies for the foundation-storage namespace (MinIO).
#
# Deliberately SEPARATE from 14b: its policies target a namespace created by the
# `storage` brick. Merged into 14b they left any "istio without storage" profile
# (the children's workload profile) stuck on
# "namespaces \"foundation-storage\" not found" — observed on edge-2 on
# 2026-07-27. Declared a COMPANION in bricks.yaml: it is only picked if istio
# AND storage already are, and it never drags storage into a profile.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-authorizationpolicies-storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio/authz-storage
  prune: true
  wait: true
  dependsOn:
    - name: istio-authorizationpolicies
    - name: storage
