# Groupe 21b — AuthorizationPolicies du namespace foundation-storage (MinIO).
#
# Brique SÉPARÉE de 14b volontairement : ses policies visent un namespace créé
# par la brique `storage`. Fondues dans 14b, elles rendaient tout profil
# « istio sans storage » (profil workload des enfants) bloqué sur
# « namespaces "foundation-storage" not found » — constaté sur edge-2 le
# 2026-07-27. Déclarée COMPAGNON dans bricks.yaml : elle n'est piochée que si
# istio ET storage le sont déjà, et n'entraîne jamais storage dans un profil.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-authorizationpolicies-storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio/authz-storage
  prune: true
  wait: true
  dependsOn:
    - name: istio-authorizationpolicies
    - name: storage
