# Group 52 — ORC (openstack-resource-controller), a CAPO dependency.
# Without these CRDs, capi-openstack-controller does not start its watchers and
# no OpenStackCluster provisions (observed on real cloud with edge-2).
# A pick companion: pulled in automatically with cluster-api-providers.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orc
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/orc
  prune: true
  wait: true
  force: true
  dependsOn:
    - name: cluster-api-providers
