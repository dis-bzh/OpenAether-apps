# Group 14 — Istio ambient (4 HelmReleases : base, istiod, cni, ztunnel)
# Depends on cert-manager (the CONTROLLER, for CRDs/webhook) — NOT on
# cert-manager-issuers: istiod uses its OWN self-signed CA
# (istio-ca-root-cert, trustDomain openaether.local), it does not need OpenBao.
# Depending on the OpenBao issuers recreated a cycle:
#   istio → cert-manager-issuers → cert-manager → openbao → ztunnel → istio.
# The Gateway's TLS cert (openaether-tls) does depend on the issuers, but it
# reconciles AFTERWARDS without blocking the control plane (see gateway-openaether.yaml).
# Isolated blast radius: an Istio update does not affect the foundation stack.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio
  prune: true
  wait: true
  dependsOn:
    - name: platform-gateway-api
    - name: cert-manager
