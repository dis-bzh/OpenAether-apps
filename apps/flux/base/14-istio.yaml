# Groupe 14 — Istio ambient (5 HelmReleases : base, istiod, cni, ztunnel, ingressgateway)
# Dépend de cert-manager (le CONTROLLER, pour CRDs/webhook) — PAS de
# cert-manager-issuers : istiod utilise sa PROPRE CA auto-signée
# (istio-ca-root-cert, trustDomain openaether.local), il n'a pas besoin
# d'OpenBao. Dépendre des issuers OpenBao recréait un cycle :
#   istio → cert-manager-issuers → cert-manager → openbao → ztunnel → istio.
# Le cert TLS de la Gateway (openaether-tls), lui, dépend des issuers, mais se
# réconcilie APRÈS sans bloquer le control plane (cf. gateway-openaether.yaml).
# Blast-radius isolé : une mise à jour Istio n'impacte pas la stack foundation.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio
  prune: true
  wait: true
  dependsOn:
    - name: platform-gateway-api
    - name: cert-manager
