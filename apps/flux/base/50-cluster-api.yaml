# Groupe 50 — cluster-api (CAPI Operator + providers)
# Dépend de cert-manager (CAPI Operator utilise cert-manager pour ses webhooks).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cluster-api
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
