# Groupe 20 — CloudNative-PG (operator + clusters)
# Dépend d'eso (ExternalSecrets pour grafana-db-credentials).
# Isolation : crash CNPG n'impacte pas la stack foundation ni la storage layer.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cnpg
  prune: true
  # Injecte la destination S3 du PITR (${BACKUP_S3_BUCKET}/${BACKUP_S3_ENDPOINT})
  # depuis le ConfigMap `cluster-identity` posé au bootstrap.
  #
  # ⚠️ Sûr ICI, contrairement aux briques backup/storage : le manifeste vendoré
  # de l'opérateur contient bien des `$(VAR_NAME)`, mais VÉRIFIÉ le 2026-07-27 —
  # les 13 occurrences sont toutes dans des champs `description` de CRD, aucune
  # dans un conteneur. Aucune variable shell fonctionnelle à vider.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-identity
  wait: true
  dependsOn:
    - name: external-secrets
    - name: platform-local-path-provisioner  # clusters zitadel-db/grafana-db en storageClass local-path-retain
