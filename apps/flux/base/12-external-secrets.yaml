# Groupe 12 — External Secrets Operator
# Depends only on namespaces (not on vault: ESO installs before it connects).
# The openbao ClusterSecretStore becomes operational once vault is ready (auto retry).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/external-secrets
  prune: true
  wait: true
  force: true
  dependsOn:
    - name: namespaces
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/external-secrets/stores
  prune: true
  wait: false
  dependsOn:
    - name: external-secrets
    - name: foundation-vault
