# clusterctl inventory for the management cluster.
#
# Without it, `clusterctl move` REJECTS this cluster as a target — a hard
# requirement for bootstrapping a management from a throwaway cluster and then
# making it self-managed (see docs/capi-bootstrap.md on the infra side).
#
# `wait: false`: these objects carry no Ready condition, they are plain
# inventory entries.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clusterctl-inventory
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cluster-api-providers/clusterctl-inventory
  prune: true
  wait: false
  dependsOn:
    # The providers.clusterctl.cluster.x-k8s.io CRD ships with the CoreProvider
    # components. cluster-api-providers has wait:true, but that only guarantees
    # the operator's CRs were created, not that the components are installed:
    # the first reconciles may fail with "no matches for kind Provider", and
    # Flux retries until the CRD shows up.
    - name: cluster-api-providers
