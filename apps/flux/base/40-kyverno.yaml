# Group 40 — Kyverno (admission controller + policies)
# Isolation: admission policies, with no dependency on the application stack.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/kyverno
  prune: true
  wait: true
  dependsOn:
    - name: namespaces
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/kyverno-policies
  prune: true
  wait: true
  dependsOn:
    - name: kyverno
---
# Audit-only guard on External Secrets objects. Needs both CRD sets, hence its
# own Kustomization (Kyverno refuses a policy naming a kind it cannot resolve).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies-eso
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/kyverno-policies-eso
  prune: true
  wait: false
  dependsOn:
    - name: kyverno-policies
    - name: external-secrets
---
# The guard on the scratch Clusters of the restore tests (a Cluster, not a Pod). It needs the CNPG CRDs to EXIST when
# the policy is created (a policy created earlier does not enforce its kind until it is updated: lab 20), hence its own
# Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies-cnpg
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/kyverno-policies-cnpg
  prune: true
  wait: false
  dependsOn:
    - name: kyverno-policies
    - name: cnpg
