# Groupe 13c — CA interne d'OpenBao (TLS du listener).
#
# WHY A KUSTOMIZATION SEPARATE FROM `foundation-vault`
#   The vault brick's kustomization carries `namespace: foundation-vault`, and
#   Kustomize's namespace transformer overrides the namespace of EVERY resource,
#   including those of a referenced base. The CA must live in `cert-manager` —
#   the only place where the openbao `ClusterIssuer` can read a
#   `caBundleSecretRef`. It therefore cannot be carried by the vault brick.
#
#   Observed in the cloud on 2026-07-28: the CA landed in foundation-vault,
#   `openbao-server-tls` stayed "Secret does not exist" and the 3 OpenBao pods
#   bloquaient en ContainerCreating.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-ca
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/foundation/vault-ca
  prune: true
  # wait: true — foundation-vault depends on it: its pods do not start without
  # the server certificate, itself signed by this CA.
  wait: true
  dependsOn:
    - name: cert-manager
