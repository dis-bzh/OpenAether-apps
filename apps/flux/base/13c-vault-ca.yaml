# Groupe 13c — CA interne d'OpenBao (TLS du listener).
#
# POURQUOI UNE KUSTOMIZATION SÉPARÉE DE `foundation-vault`
#   Le kustomization de la brique vault porte `namespace: foundation-vault`, et
#   le transformateur de namespace de Kustomize écrase le namespace de CHAQUE
#   ressource, y compris celles d'une base référencée. La CA doit vivre dans
#   `cert-manager` — seul endroit où le `ClusterIssuer` openbao sait lire un
#   `caBundleSecretRef`. Elle ne peut donc pas être portée par la brique vault.
#
#   Constaté en cloud le 2026-07-28 : la CA atterrissait dans foundation-vault,
#   `openbao-server-tls` restait « Secret does not exist » et les 3 pods OpenBao
#   bloquaient en ContainerCreating.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-ca
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/foundation/vault-ca
  prune: true
  # wait: true — foundation-vault en dépend : ses pods ne démarrent pas sans le
  # certificat serveur, lui-même signé par cette CA.
  wait: true
  dependsOn:
    - name: cert-manager
