# Group 30 — Observability (VMCluster, Loki, Grafana, Alloy, exporters)
# Key isolation: a broken Grafana affects neither OpenBao, Istio nor storage.
# Depends on storage (volumes), cert-manager (Grafana certs), istio (mTLS), cnpg (grafana-db).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability
  prune: true
  wait: false
  dependsOn:
    - name: storage
    - name: cert-manager
    - name: istio
    - name: cnpg
    - name: external-secrets
    - name: external-secrets-stores  # ClusterSecretStore openbao (#38)
    - name: platform-local-path-provisioner  # Loki + VMCluster en storageClass local-path
---
# Group 30b — VictoriaMetrics Custom Resources (VMCluster/VMAgent/VM*Scrape)
# Separated from 'observability' to break the CRD→CR chicken-and-egg: these kinds
# only exist after the victoria-metrics-operator HelmRelease has installed its
# CRDs. In the same bundle the dry-run fails ("no matches for kind VMAgent") and
# Flux REJECTS everything — including the operator → nothing installs.
# Isolated, this group retries on its own (retryInterval) until the CRDs appear,
# without blocking the operator. Same pattern as cert-manager-issuers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-vm-customresources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability/vm-customresources
  prune: true
  wait: true
  dependsOn:
    - name: observability
---
# Group 30c — OpenBao VMServiceScrape and VMRule. A companion: it needs the VM CRDs AND the foundation-vault namespace,
# so it can live neither in 'observability-vm-customresources' (a cluster without OpenBao would fail to apply it) nor in
# 'foundation-vault' (the VM CRDs may not exist yet). wait: false: a missing metric must not hold anything back.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-openbao
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability-openbao
  prune: true
  wait: false
  dependsOn:
    - name: foundation-vault
    - name: observability-vm-customresources
---
# Group 30d — the external hosts Alertmanager may reach (the chat webhook, the dead-man's-switch ping; apps #146).
# Alone because its network policy reads Flux substitution (cluster-identity: ALERT_CHAT_HOST, ALERT_HEARTBEAT_HOST,
# defaults hooks.slack.com and hc-ping.com) and substitution applies to the WHOLE render of a Kustomization:
# 'observability' holds Grafana dashboards, VMRule templates and chart values with `$` expressions that it would blank.
# Same pattern as backup-databases-identity (22a). wait: false: a CiliumNetworkPolicy has no Ready to wait for. If this
# Kustomization fails, Alertmanager cannot reach the outside and the dead-man's switch pages you:
# `kubectl -n flux-system get kustomization observability-alert-egress`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-alert-egress
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability-alert-egress
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-identity
        optional: true   # a cluster whose ConfigMap has neither key keeps the two defaults
  dependsOn:
    - name: observability   # the namespace, the vmalertmanager policy this one adds to
