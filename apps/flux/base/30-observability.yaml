# Groupe 30 — Observability (VMCluster, Loki, Grafana, Alloy, exporters)
# Isolation clé : Grafana KO n'impacte pas OpenBao, Istio, ou le stockage.
# Dépend de storage (volumes), cert-manager (certs Grafana), istio (mTLS), cnpg (grafana-db).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability
  prune: true
  wait: false
  dependsOn:
    - name: storage
    - name: cert-manager
    - name: istio
    - name: cnpg
    - name: external-secrets
    - name: platform-local-path-provisioner  # Loki + VMCluster en storageClass local-path
---
# Groupe 30b — VictoriaMetrics Custom Resources (VMCluster/VMAgent/VM*Scrape)
# Séparé de 'observability' pour casser le chicken-and-egg CRD→CR : ces kinds
# n'existent qu'après que le HelmRelease victoria-metrics-operator ait installé
# ses CRDs. Dans le même bundle, le dry-run échoue ("no matches for kind
# VMAgent") et Flux REJETTE tout — y compris l'opérateur → rien ne s'installe.
# Isolé, ce groupe retente seul (retryInterval) jusqu'à apparition des CRDs,
# sans bloquer l'opérateur. Même pattern que cert-manager-issuers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-vm-customresources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/observability/vm-customresources
  prune: true
  wait: true
  dependsOn:
    - name: observability
