# OpenAether — the GitRepository source shared by every Flux Kustomization.
# Flux reconciles from this entry point.
#
# GITCEPTION TRAP: this file reapplies Flux's own source from git.
# A hard-coded branch here OVERWRITES the GitRepository laid down at bootstrap
# (the infra inline manifest) on the first reconcile → testing a branch becomes
# impossible. Hence ${GIT_BRANCH:=main}: the root Kustomization
# (openaether-platform, infra-side flux-bootstrap.yaml.tftpl) injects GIT_BRANCH
# through postBuild.substitute — production stays on main by default.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openaether
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/dis-bzh/OpenAether-apps.git
  ref:
    branch: ${GIT_BRANCH:=main}
  timeout: 60s
