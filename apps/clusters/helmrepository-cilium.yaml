# The Cilium chart source SHARED by every child cluster.
#
# ⚠️ It lived in edge-1.yaml until 2026-07-27: any child other than edge-1
# therefore silently depended on edge-1 being enabled in kustomization.yaml.
# Observed for real — edge-2 deployed on its own stayed stuck on
# "HelmRepository \"cilium\" not found", its CNI never installed, nodes
# NotReady. A resource shared by N children has no business living in one of
# their files.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: capi-clusters
spec:
  interval: 24h
  url: https://helm.cilium.io
