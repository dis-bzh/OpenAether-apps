# Cluster enfant edge-2 — OVH (OpenStack), région EU-WEST-PAR.
# Deuxième provider de la flotte multi-cloud (edge-1 = Scaleway, edge-3 = Outscale).
# Prérequis kubectl (jamais en git) :
#   Secret capi-clusters/ovh-capi-credentials (clé clouds.yaml, région dedans)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-2-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/templates/cluster-talos-openstack
  prune: true
  wait: false
  dependsOn:
    - name: capi-clusters
  postBuild:
    substitute:
      CLUSTER_NAME: edge-2
      CP_REPLICAS: "1"
      WORKER_REPLICAS: "1"
      K8S_VERSION: v1.35.3
      TALOS_VERSION: v1.13
      # Image Glance (plateforme openstack) reconstruite en v1.13.4 avec le
      # schematic courant — le renommage in-place du module est corrigé.
      OS_IMAGE_NAME: talos-ovh-amd64-v1.13.4
      OS_FLAVOR: b3-8            # 8 Go — au-dessus du seuil OOM Talos
      OS_EXTERNAL_NETWORK: Ext-Net
      OS_NODE_CIDR: 10.20.0.0/24 # distinct du management OVH
      # FIP pré-allouée des CP : doit figurer dans les certSANs Talos (l'IMDS
      # OpenStack ne la révèle pas). Une IP par réplique de control plane.
      OS_CP_FLOATING_IPS: 57.130.31.34
---
# CNI de l'enfant, appliqué À DISTANCE (kubeConfig CAPI), values alignées sur
# le socle parent (render-bootstrap-manifests.sh).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-2-cilium
  namespace: capi-clusters
spec:
  interval: 10m
  timeout: 10m
  kubeConfig:
    secretRef:
      name: edge-2-kubeconfig
  targetNamespace: kube-system
  storageNamespace: kube-system
  releaseName: cilium
  install:
    remediation: { retries: -1 }   # retry jusqu'à ce que l'API enfant réponde
  chart:
    spec:
      chart: cilium
      version: "1.19.2"
      sourceRef: { kind: HelmRepository, name: cilium, namespace: capi-clusters }
  values:
    kubeProxyReplacement: true
    # ⚠️ Ces deux réglages sont EXIGÉS dès que le profil de l'enfant embarque
    # Istio ambient (apps/base/istio) — ils doivent rester alignés sur le socle
    # parent (render-bootstrap-manifests.sh) :
    #  - cni.exclusive=false : sinon Cilium réécrit 05-cilium.conflist en boucle
    #    et en retire le plugin chaîné istio-cni (« conflicting component
    #    constantly reverting our work ») → /readyz 503 → Helm install timeout
    #    → ztunnel, services-gateway et istio-authorizationpolicies bloqués ;
    #  - socketLB.hostNamespaceOnly=true : sinon le socket-LB court-circuite la
    #    redirection ambient pour les process host-network.
    socketLB: { enabled: true, hostNamespaceOnly: true }
    cni: { exclusive: false }
    bpf: { hostLegacyRouting: false, masquerade: true }
    cgroup: { autoMount: { enabled: false }, hostRoot: /sys/fs/cgroup }
    k8sServiceHost: localhost      # KubePrism Talos
    k8sServicePort: 7445
    hubble: { enabled: false }
    operator: { replicas: 1 }
    encryption: { enabled: true, type: wireguard }
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-2-flux
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/flux-gotk
  prune: true
  wait: false
  kubeConfig:
    secretRef:
      name: edge-2-kubeconfig
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-2-gitops
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/child-gitops
  prune: true
  wait: false
  dependsOn:
    - name: edge-2-flux
  kubeConfig:
    secretRef:
      name: edge-2-kubeconfig
  postBuild:
    substitute:
      CHILD_PROFILE: workload
      CHILD_BRANCH: feat/pioche-backup-gitception
