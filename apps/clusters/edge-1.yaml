# Cluster enfant edge-1 — PREMIÈRE INSTANCIATION RÉELLE (session test 2026-07-25).
# Kubeception : CAPI provisionne les VMs Talos ; gitception : le management
# injecte Cilium+Flux à distance puis l'enfant réconcilie SON profil.
# Prérequis kubectl (jamais en git) :
#   Secret capi-clusters/scaleway-capi-credentials (SCW_ACCESS_KEY, SCW_SECRET_KEY)
#   Secret flux-system/edge-1-substitutes (SCW_PROJECT_ID)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-1-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/templates/cluster-talos-scaleway
  prune: true
  wait: false
  dependsOn:
    - name: capi-clusters
  postBuild:
    substitute:
      CLUSTER_NAME: edge-1
      CP_REPLICAS: "1"
      WORKER_REPLICAS: "1"
      # Alignés sur l'image du parent (talos-image, resolved_image_ref).
      K8S_VERSION: v1.35.3
      TALOS_VERSION: v1.13
      SCW_IMAGE_NAME: talos-scaleway-amd64-v1.13.4
      SCW_ZONE: fr-par-1
    substituteFrom:
      - kind: Secret
        name: edge-1-substitutes   # SCW_PROJECT_ID
---
# (La HelmRepository `cilium` est partagée par tous les enfants et vit
# désormais dans helmrepository-cilium.yaml — elle ne doit pas dépendre de
# l'activation d'edge-1.)
# CNI de l'enfant, appliqué À DISTANCE (kubeConfig CAPI). Values alignées sur
# le socle parent (render-bootstrap-manifests.sh) : KPR + KubePrism + WireGuard.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-1-cilium
  namespace: capi-clusters
spec:
  interval: 10m
  timeout: 10m
  kubeConfig:
    secretRef:
      name: edge-1-kubeconfig
  targetNamespace: kube-system
  storageNamespace: kube-system
  releaseName: cilium
  install:
    remediation: { retries: -1 }   # retry tant que le kubeconfig/API enfant n'est pas prêt
  chart:
    spec:
      chart: cilium
      version: "1.19.2"            # même version que le socle parent
      sourceRef: { kind: HelmRepository, name: cilium }
  values:
    kubeProxyReplacement: true
    # ⚠️ ipam.mode=kubernetes — NE PAS RETIRER. Le défaut du chart est
    # `cluster-pool`, qui IGNORE le `clusterNetwork.pods` déclaré par CAPI
    # (10.244.0.0/16) et taille les CIDR de pods dans 10.0.0.0/8. Or les nœuds
    # vivent dans ce même /8 : 10.20.0.0/24 côté OpenStack, 10.0.0.0/24 pour les
    # sous-réseaux du socle (OVH, Outscale, Proxmox). Le mode `kubernetes`
    # reprend le podCIDR alloué par kube-controller-manager, comme le parent —
    # qui pose ce réglage pour exactement la même raison.
    ipam: { mode: kubernetes }
    # ⚠️ cni.exclusive=false est EXIGÉ dès que le profil de l'enfant embarque
    # Istio ambient (apps/base/istio) : sinon Cilium réécrit 05-cilium.conflist
    # en boucle et en retire le plugin chaîné istio-cni (« conflicting component
    # constantly reverting our work ») → /readyz 503 → install Helm expirée →
    # ztunnel, services-gateway et istio-authorizationpolicies bloqués.
    #
    # hostNamespaceOnly=true : aligné sur le socle parent et exigé par Istio
    # ambient. Le flag ne coupe le socket-LB que pour les netns NON-root (doc du
    # chart : « Disable socket lb for non-root ns ») ; les process host-network,
    # dont kube-apiserver → ClusterIP des webhooks, gardent la traduction. Le
    # « failed calling webhook » du 2026-07-26 lui avait été imputé à tort : il a
    # été observé pendant un rollout de CNI à chaud qui avait déjà cassé le
    # datapath des enfants.
    socketLB: { enabled: true, hostNamespaceOnly: true }
    cni: { exclusive: false }
    nodeSelectorLabels: true
    bpf: { hostLegacyRouting: false, masquerade: true }
    cgroup: { autoMount: { enabled: false }, hostRoot: /sys/fs/cgroup }
    k8sServiceHost: localhost      # KubePrism Talos
    k8sServicePort: 7445
    hubble: { enabled: false }
    operator: { replicas: 1 }
    encryption: { enabled: true, type: wireguard }
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-1-flux
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/flux-gotk
  prune: true
  wait: false
  kubeConfig:
    secretRef:
      name: edge-1-kubeconfig
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-1-gitops
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/child-gitops
  prune: true
  wait: false
  dependsOn:
    - name: edge-1-flux
  kubeConfig:
    secretRef:
      name: edge-1-kubeconfig
  postBuild:
    substitute:
      CHILD_PROFILE: workload
      # CHILD_BRANCH volontairement absent → défaut `main` (cf. child-gitops).
      # Ne le surcharger que pour tester une branche de bout en bout, et penser
      # à le retirer ensuite : une branche supprimée laisse l'enfant sur une
      # source introuvable et il ne réconcilie plus rien.
