# Namespace holding the client cluster definitions (CAPI CRs) on the management side.
---
apiVersion: v1
kind: Namespace
metadata:
  name: capi-clusters
  labels:
    openaether.io/managed: "true"
    openaether.io/component: capi-clusters
    pod-security.kubernetes.io/enforce: restricted
---
# An inert marker: guarantees a non-empty kustomize build while no client
# cluster is defined.
apiVersion: v1
kind: ConfigMap
metadata:
  name: capi-clusters-readme
  namespace: capi-clusters
  labels:
    openaether.io/managed: "true"
    openaether.io/component: capi-clusters
data:
  readme: "Instancier un cluster client: cf. apps/clusters/README.md"
