# Child cluster edge-3 — Outscale (eu-west-2), the fleet's 3rd provider.
#
# ⚠️ ACTIVATION: this file is only added to kustomization.yaml once the Talos
# OMI is published (the **aws** variant — see modules/talos-image/outscale) and
# its ID filled into OSC_IMAGE_ID below.
#
# kubectl prerequisites (never in git):
#   Secret capi-clusters/outscale-capi-credentials — LOWERCASE keys
#     access_key / secret_key / region (≠ convention SCW_* de Scaleway)
#   keypair Outscale `openaether-capi` (node.vm.keypairName requis + immuable)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-3-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/templates/cluster-talos-outscale
  prune: true
  wait: false
  dependsOn:
    - name: capi-clusters
  postBuild:
    substitute:
      CLUSTER_NAME: edge-3
      CP_REPLICAS: "1"
      WORKER_REPLICAS: "1"
      K8S_VERSION: v1.35.3
      TALOS_CONTRACT: v1.13
      POD_CIDR: 10.244.0.0/16
      SVC_CIDR: 10.96.0.0/12
      # Outscale network — a CIDR distinct from the fleet's other clusters
      # (management SCW 172.16.12/22, edge-2 OVH 10.20.0/24).
      OSC_SUBREGION: eu-west-2a
      OSC_NET_CIDR: 10.30.0.0/16
      OSC_SUBNET_PUBLIC: 10.30.2.0/24
      OSC_SUBNET_WORKER: 10.30.3.0/24
      OSC_SUBNET_CP: 10.30.4.0/24
      # 2 vCPU / 8 GB: RAM stays above the Talos OOM threshold, but the cores
      # count against the Outscale `core_limit` quota (20 on this account). An
      # HA management already uses 14 → c4 workers would overflow it
      # (CreateVms → 10042 TooManyResources/QuotaExceeded).
      OSC_VM_TYPE: tinav6.c2r8p1
      # Bump on every size/image change: the OscMachineTemplate spec is
      # immutable, and a new name makes the machines roll.
      MACHINE_REV: v2
      OSC_KEYPAIR_NAME: openaether-capi
      OSC_IMAGE_NAME: talos-outscale-amd64-v1.13.4
      OSC_IMAGE_ACCOUNT_ID: "REDACTED-ACCOUNT-ID"
      OSC_IMAGE_ID: "ami-16d2bedd"       # talos-outscale-amd64-v1.13.4 (variante aws)
      WORKER_DATA_DISK_GB: "50"
      # The Talos port 50000 cannot go through the LBU (a single listener):
      # direct access to the CPs' public IPs, restricted to the management's
      # egress (Outscale NAT — the management now runs on Outscale) and to admin.
      MGMT_EGRESS_CIDR: REDACTED-MGMT-EGRESS-IP/32  # NAT service Outscale (management)
      ADMIN_CIDR: REDACTED-ADMIN-IP/32
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-3-cilium
  namespace: capi-clusters
spec:
  interval: 10m
  timeout: 10m
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
  targetNamespace: kube-system
  storageNamespace: kube-system
  releaseName: cilium
  install:
    remediation: { retries: -1 }
  chart:
    spec:
      chart: cilium
      version: "1.19.2"
      sourceRef: { kind: HelmRepository, name: cilium, namespace: capi-clusters }
  values:
    kubeProxyReplacement: true
    # ⚠️ ipam.mode=kubernetes — DO NOT REMOVE. The chart default is
    # `cluster-pool`, which IGNORES the `clusterNetwork.pods` declared by CAPI
    # (10.244.0.0/16) and carves pod CIDRs out of 10.0.0.0/8. But the nodes
    # live in that same /8: 10.20.0.0/24 on OpenStack, 10.0.0.0/24 for the
    # foundation subnets (OVH, Outscale, Proxmox). The `kubernetes` mode
    # reuses the podCIDR allocated by kube-controller-manager, like the parent —
    # which sets this for exactly the same reason.
    ipam: { mode: kubernetes }
    # ⚠️ cni.exclusive=false is REQUIRED as soon as the child's profile carries
    # Istio ambient (apps/base/istio): otherwise Cilium rewrites
    # 05-cilium.conflist in a loop and strips the chained istio-cni plugin
    # ("conflicting component constantly reverting our work") → /readyz 503 →
    # Helm install timeout → ztunnel, services-gateway and istio-authorizationpolicies stuck.
    #
    # hostNamespaceOnly=true: aligned with the parent foundation and required by
    # Istio ambient. The flag only disables socket-LB for NON-root netns (chart
    # chart : « Disable socket lb for non-root ns ») ; les process host-network,
    # including kube-apiserver → webhook ClusterIPs, keep the translation. The
    # "failed calling webhook" of 2026-07-26 was wrongly blamed on it: it was
    # observed during a hot CNI rollout that had already broken the children's
    # datapath des enfants.
    socketLB: { enabled: true, hostNamespaceOnly: true }
    cni: { exclusive: false }
    nodeSelectorLabels: true
    bpf: { hostLegacyRouting: false, masquerade: true }
    cgroup: { autoMount: { enabled: false }, hostRoot: /sys/fs/cgroup }
    k8sServiceHost: localhost
    k8sServicePort: 7445
    hubble: { enabled: false }
    operator: { replicas: 1 }
    encryption: { enabled: true, type: wireguard }
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-3-flux
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/flux-gotk
  prune: true
  wait: false
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-3-gitops
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/child-gitops
  prune: true
  wait: false
  dependsOn:
    - name: edge-3-flux
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
  postBuild:
    substitute:
      CHILD_PROFILE: workload
      CHILD_NAME: edge-3   # prefix of this child's restic repositories
      # CHILD_BRANCH deliberately absent → defaults to `main` (see child-gitops).
