# Child cluster edge-3 — Outscale (eu-west-2), the fleet's 3rd provider.
#
# ⚠️ ACTIVATION: this file is only added to kustomization.yaml once the Talos
# OMI is published (the **aws** variant — see modules/talos-image/outscale) and
# its ID filled into OSC_IMAGE_ID below.
#
# kubectl prerequisites (never in git):
#   Secret capi-clusters/outscale-capi-credentials — LOWERCASE keys
#     access_key / secret_key / region (≠ convention SCW_* de Scaleway)
#   Outscale keypair `openaether-capi` (node.vm.keypairName, required + immutable)
#   Secret flux-system/edge-3-env — account-specific values (never commit real
#   ones, this file is public):
#     kubectl -n flux-system create secret generic edge-3-env \
#       --from-literal=OSC_IMAGE_ACCOUNT_ID=<outscale account id> \
#       --from-literal=MGMT_EGRESS_CIDR=<management's NAT gateway IP>/32 \
#       --from-literal=ADMIN_CIDR=<your public IP>/32
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-3-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/templates/cluster-talos-outscale
  prune: true
  wait: false
  dependsOn:
    - name: capi-clusters
  postBuild:
    substitute:
      CLUSTER_NAME: edge-3
      CP_REPLICAS: "1"
      # 1 worker isn't enough for the full profile (Istio+Kyverno+CNPG+
      # Longhorn+observability) — same lesson as edge-2 (2026-07-30): the CP
      # is tainted, so a single worker gets 100% of it and starves. 2 spreads
      # it instead of inflating one node further.
      WORKER_REPLICAS: "2"
      K8S_VERSION: v1.35.3
      TALOS_CONTRACT: v1.13
      POD_CIDR: 10.244.0.0/16
      SVC_CIDR: 10.96.0.0/12
      # Outscale network — a CIDR distinct from the fleet's other clusters
      # (management SCW 172.16.12/22, edge-2 OVH 10.20.0/24).
      OSC_SUBREGION: eu-west-2a
      OSC_NET_CIDR: 10.30.0.0/16
      OSC_SUBNET_PUBLIC: 10.30.2.0/24
      OSC_SUBNET_WORKER: 10.30.3.0/24
      OSC_SUBNET_CP: 10.30.4.0/24
      # CAPOSC's voscmachinetemplate webhook only accepts vmType matching
      # ^tinav([3-9]|[1-9][0-9]).c[1-9][0-9]*r[1-9][0-9]*p[1-3]$ (real EC2-
      # style names like m4.xlarge are REJECTED at admission, even though
      # this account's generic ReadVmTypes catalog doesn't list any tinav*
      # type either — found live 2026-07-30, both facts confirmed against
      # the real API/cluster). tinav6.c2r8p1 (2 vCPU/8 GB, the template's
      # own doc comment calls tinav6.c4r8p2 "equivalent b3-8") is the same
      # undersized class that made edge-2 run out of CPU under the full
      # profile. tinav6.c4r16p2 doubles both, mirroring the b3-16 fix.
      # Preflight quota confirmed clean (0/20 vCPU) — 1 CP + 2 workers @ 4
      # vCPU = 12, well inside it.
      OSC_VM_TYPE: tinav6.c4r16p2
      # Bump on every size/image change: the OscMachineTemplate spec is
      # immutable, and a new name makes the machines roll.
      MACHINE_REV: v3
      OSC_KEYPAIR_NAME: openaether-capi
      OSC_IMAGE_NAME: talos-outscale-amd64-v1.13.4
      OSC_IMAGE_ID: "TALOS_OMI_ID"       # your talos-outscale-amd64-<version> OMI;
      # account-specific like the line below, and it is public here. Same
      # convention as infra's envs/*-outscale.tfvars.example.
      WORKER_DATA_DISK_GB: "50"
      # OSC_IMAGE_ACCOUNT_ID, MGMT_EGRESS_CIDR (management's NAT gateway
      # public IP — tofu output nat_gateway_ip, cluster/) and ADMIN_CIDR are
      # account-specific and come from the flux-system/edge-3-env Secret (see
      # header) — never hardcoded here, this file is public. The Talos port
      # 50000 cannot go through the LBU (a single listener): direct access to
      # the CPs' public IPs, restricted to the management's egress and admin.
    substituteFrom:
      - kind: Secret
        name: edge-3-env
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-3-cilium
  namespace: capi-clusters
spec:
  interval: 10m
  timeout: 10m
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
  targetNamespace: kube-system
  storageNamespace: kube-system
  releaseName: cilium
  install:
    remediation: { retries: -1 }
  chart:
    spec:
      chart: cilium
      version: "1.19.2"
      sourceRef: { kind: HelmRepository, name: cilium, namespace: capi-clusters }
  values:
    kubeProxyReplacement: true
    # ⚠️ ipam.mode=kubernetes — DO NOT REMOVE. The chart default is
    # `cluster-pool`, which IGNORES the `clusterNetwork.pods` declared by CAPI
    # (10.244.0.0/16) and carves pod CIDRs out of 10.0.0.0/8. But the nodes
    # live in that same /8: 10.20.0.0/24 on OpenStack, 10.0.0.0/24 for the
    # foundation subnets (OVH, Outscale, Proxmox). The `kubernetes` mode
    # reuses the podCIDR allocated by kube-controller-manager, like the parent —
    # which sets this for exactly the same reason.
    ipam: { mode: kubernetes }
    # ⚠️ cni.exclusive=false is REQUIRED as soon as the child's profile carries
    # Istio ambient (apps/base/istio): otherwise Cilium rewrites
    # 05-cilium.conflist in a loop and strips the chained istio-cni plugin
    # ("conflicting component constantly reverting our work") → /readyz 503 →
    # Helm install timeout → ztunnel, services-gateway and istio-authorizationpolicies stuck.
    #
    # hostNamespaceOnly=true: aligned with the parent foundation and required by
    # Istio ambient. The flag only disables socket-LB for NON-root netns (chart
    # "Disable socket lb for non-root ns"); host-network processes,
    # including kube-apiserver → webhook ClusterIPs, keep the translation. The
    # "failed calling webhook" of 2026-07-26 was wrongly blamed on it: it was
    # observed during a hot CNI rollout that had already broken the children's
    # datapath.
    socketLB: { enabled: true, hostNamespaceOnly: true }
    cni: { exclusive: false }
    nodeSelectorLabels: true
    bpf: { hostLegacyRouting: false, masquerade: true }
    cgroup: { autoMount: { enabled: false }, hostRoot: /sys/fs/cgroup }
    k8sServiceHost: localhost
    k8sServicePort: 7445
    hubble: { enabled: false }
    # Metrics: without these the child's CNI serves nothing and is invisible,
    # while the parent foundation is monitored — the mismatch is silent, hence
    # both keys are in check-cilium-parity.py.
    prometheus: { enabled: true }
    operator: { replicas: 1, prometheus: { enabled: true } }
    encryption: { enabled: true, type: wireguard }
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]  # yamllint disable-line rule:line-length
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
---
# providerID: Talos does not set one, so CAPI never resolves nodeRef and
# MachineHealthCheck stays dead. The CCM fills it in from the Talos platform
# metadata — natively in CAPS's own format, no transformation needed
# (validated on real Scaleway, 2026-07-28).
# ⚠️ Ships with the kubelet `cloud-provider=external` patch in the cluster
# template: that flag alone leaves every node tainted `uninitialized`. This
# release clears the taint, so the child's Flux pods stay Pending until it runs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-3-talos-ccm
  namespace: capi-clusters
spec:
  interval: 10m
  timeout: 10m
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
  targetNamespace: kube-system
  storageNamespace: kube-system
  releaseName: talos-ccm
  install:
    remediation: { retries: -1 }   # retry until the child's API is ready
  chart:
    spec:
      chart: talos-cloud-controller-manager
      version: "0.5.5"
      sourceRef: { kind: HelmRepository, name: talos-ccm }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-3-flux
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/flux-gotk
  prune: true
  wait: false
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-3-gitops
  namespace: capi-clusters
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: openaether, namespace: flux-system }
  path: ./apps/base/cluster-api-clusters/child-gitops
  prune: true
  wait: false
  dependsOn:
    - name: edge-3-flux
  kubeConfig:
    secretRef:
      name: edge-3-kubeconfig
  postBuild:
    substitute:
      CHILD_PROFILE: workload
      CHILD_NAME: edge-3   # prefix of this child's restic repositories
      # CHILD_REF deliberately absent → defaults to refs/heads/main (see child-gitops).
      # A real bucket name lived here until 1.0.1 — this file is public and the
      # repository has purged its history once for that. Substitute your own.
      # Reuses the management's own backup bucket (Scaleway) — shared, path
      # distinguished by CLUSTER_NAME, same pattern as the restic repos.
      # REQUIRED as soon as CHILD_PROFILE picks the cnpg brick, see
      # child-gitops/gitrepository.yaml's header for why there's no default.
      CHILD_BACKUP_S3_BUCKET: s3-<your-bucket>-backups-dev
      CHILD_BACKUP_S3_ENDPOINT: https://s3.fr-par.scw.cloud
      # Same bucket, Longhorn's own URL syntax (storage brick's BackupTarget).
      CHILD_BACKUP_TARGET_URL: s3://s3-<your-bucket>-backups-dev@fr-par/
