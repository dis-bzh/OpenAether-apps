# CAPI client clusters — one file per child cluster, listed EXPLICITLY here.
# example-scaleway.yaml.example is NOT applied (rename + list it to enable).
# The namespace+configmap marker keeps this build non-empty (Flux refuses an empty build).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository-cilium.yaml   # chart source shared by ALL children
  - helmrepository-talos-ccm.yaml   # idem — providerID/CCM chart
  # No child cluster is enabled by default, and that is the point: this file is
  # read by every management cluster that tracks this repo, so a name listed
  # here is a name a STRANGER's cluster tries to reconcile — ten permanently red
  # Flux objects on a Secret they cannot have. Enable your own by renaming
  # example-scaleway.yaml.example and listing it.
  # The DIS fleet ran with edge-2 (OVH) and edge-3 (Outscale) enabled here
  # during the 1.0.0 rollout; it is torn down, and they belong in a branch of
  # your own rather than in the default anyone gets.
  # - edge-1.yaml   # Scaleway — same provider as the management, no cross-provider signal
  # - edge-2.yaml   # OVH
  # - edge-3.yaml   # Outscale
