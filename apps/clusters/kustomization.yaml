# Clusters clients CAPI — un fichier par cluster enfant, listé EXPLICITEMENT ici.
# example-scaleway.yaml.example n'est PAS appliqué (renommer + lister pour activer).
# Le marqueur namespace+configmap garde ce build non-vide (Flux refuse un build vide).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository-cilium.yaml   # source de chart partagée par TOUS les enfants
  - edge-1.yaml   # Scaleway
  - edge-2.yaml   # OVH
  # - edge-3.yaml   # Outscale — DÉSACTIVÉ : quota RAM du compte (40 Go) déjà
  #   dépassé par le management HA (44 Go). Cf. docs/backlog.md.
