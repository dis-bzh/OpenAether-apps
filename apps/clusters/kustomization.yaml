# CAPI client clusters — one file per child cluster, listed EXPLICITLY here.
# example-scaleway.yaml.example is NOT applied (rename + list it to enable).
# The namespace+configmap marker keeps this build non-empty (Flux refuses an empty build).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository-cilium.yaml   # chart source shared by ALL children
  - edge-1.yaml   # Scaleway — re-enabled 2026-07-28 to re-validate a child
  #   on a SECOND provider (the management itself is on OVH, so this is also
  #   a cross-provider kubeception test).
  - edge-2.yaml   # OVH
  # - edge-3.yaml   # Outscale — DISABLED: the account's RAM quota (40 GB) is
  #   already exceeded by the HA management (44 GB). See docs/backlog.md.
