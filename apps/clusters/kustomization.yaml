# CAPI client clusters — one file per child cluster, listed EXPLICITLY here.
# example-scaleway.yaml.example is NOT applied (rename + list it to enable).
# The namespace+configmap marker keeps this build non-empty (Flux refuses an empty build).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository-cilium.yaml   # chart source shared by ALL children
  - helmrepository-talos-ccm.yaml   # idem — providerID/CCM chart
  # 2026-07-30 1.0.0 push: management itself is now on Scaleway (not OVH as
  # the old comment said), so edge-1 (also Scaleway) wouldn't be a real
  # cross-provider test — left disabled. edge-2 (OVH) and edge-3 (Outscale)
  # get enabled one at a time for the phased fleet rollout instead.
  # - edge-1.yaml   # Scaleway — same provider as management, skipped for now
  - edge-2.yaml   # OVH — Phase 2
  - edge-3.yaml   # Outscale — Phase 3
