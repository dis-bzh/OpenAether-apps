# The read-side ObjectStore on the second store (ha). Needs cnpg-profile-common and cnpg-profile-backup too.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - objectstore.yaml
  - externalsecret.yaml
replacements:
  - source: {kind: ConfigMap, name: db-profile-values, fieldPath: data.name}
    targets:
      - select: {kind: ObjectStore, labelSelector: "openaether.io/db-store=replica"}
        fieldPaths:
          - metadata.name
          - spec.configuration.s3Credentials.accessKeyId.name
          - spec.configuration.s3Credentials.secretAccessKey.name
        options: {delimiter: "-", index: 0}
      - select: {kind: ObjectStore, labelSelector: "openaether.io/db-store=replica"}
        fieldPaths:
          - spec.configuration.destinationPath
        options: {delimiter: "/", index: 4}
      - select: {kind: ExternalSecret, labelSelector: "openaether.io/db-secret=backup-replica"}
        fieldPaths:
          - spec.data.0.remoteRef.key
          - spec.data.1.remoteRef.key
        options: {delimiter: "/", index: 1}
