# The keys of the replica store, one OpenBao path per application (databases/NAME/backup-s3-replica).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: NAME-backup-s3-replica
  labels:
    openaether.io/managed: "true"
    openaether.io/component: database
    openaether.io/db-profile: customer
    openaether.io/db-secret: backup-replica
spec:
  refreshInterval: 1h
  secretStoreRef: {name: openbao, kind: ClusterSecretStore}
  target: {name: NAME-backup-s3-replica, creationPolicy: Owner}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: databases/NAME/backup-s3-replica, property: access_key}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: databases/NAME/backup-s3-replica, property: secret_key}
