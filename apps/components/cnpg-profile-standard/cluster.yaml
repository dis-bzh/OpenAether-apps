# Profile standard: TWO instances, quorum replication with PREFERRED durability, backups to one store. For data that
# matters but
# can survive a short, bounded loss. Limit, stated up front: with `preferred` the primary keeps acknowledging
# commits when the
# replica is missing or lagging out of the quorum, so a primary lost in that window loses those commits (dataDurability
# required is the ha profile). A failover with the replica present loses none.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: NAME
  labels:
    openaether.io/managed: "true"
    openaether.io/component: database
    openaether.io/db-profile: standard
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  # No superuser over the network: the application uses its owner; CNPG keeps the postgres password out of reach.
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  # Replicas first, then a switchover, instead of restarting the only writer in place (see apps/base/cnpg/cluster.yaml).
  primaryUpdateMethod: switchover
  storage:
    storageClass: STORAGE_CLASS
    size: SIZE
  bootstrap:
    initdb:
      database: DATABASE
      owner: OWNER
      secret:
        name: NAME-credentials
  resources:
    requests: {cpu: CPU_REQUEST, memory: MEMORY}
    limits: {cpu: CPU_LIMIT, memory: MEMORY}
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      password_encryption: scram-sha-256
    # TLS and SCRAM only: a TCP connection without TLS is refused before authentication, then every other one needs
    # SCRAM.
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    # A second, zone-level preference (lab 21: instances landed in ONE zone); it never blocks scheduling.
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                cnpg.io/cluster: NAME
    # 30 s, the liveness window of the instance manager: a primary on a lost node is failed over after 30 s, not the
    # 300 s default
    # (apps #154, docs/resilience.md).
    tolerations:
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
