# The S3 keys of this database's primary store, one OpenBao path per application (databases/NAME/backup-s3-primary): the
# platform operator provisions keys scoped to the prefix cnpg/NAME/, so the application's namespace does not hold
# the keys of the
# platform's own archives. Same ClusterSecretStore namespace rule as the credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: NAME-backup-s3
  labels:
    openaether.io/managed: "true"
    openaether.io/component: database
    openaether.io/db-profile: customer
    openaether.io/db-secret: backup
spec:
  refreshInterval: 1h
  secretStoreRef: {name: openbao, kind: ClusterSecretStore}
  target: {name: NAME-backup-s3, creationPolicy: Owner}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: databases/NAME/backup-s3-primary, property: access_key}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: databases/NAME/backup-s3-primary, property: secret_key}
