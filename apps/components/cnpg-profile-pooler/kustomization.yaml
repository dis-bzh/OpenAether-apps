# The PgBouncer Pooler of the ha profile and its budget: names, the cluster it fronts, the selectors of its spread
# and budget.
# Needs cnpg-profile-common too.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - pooler.yaml
  - pdb.yaml
  - networkpolicy.yaml
patches:
  # The pooler pods reach the instances: one more ingress rule on the database policy (index 4, after the four of
  # the common one).
  - target: {kind: CiliumNetworkPolicy, labelSelector: "openaether.io/db-netpol=database"}
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          fromEndpoints:
            - matchLabels:
                cnpg.io/poolerName: NAME-pooler-rw
          toPorts:
            - ports: [{port: "5432", protocol: TCP}]
  # TLS to the pooler (lab 23): PgBouncer presents the Cluster server certificate, which names only the -rw, -ro and -r
  # Services, so `sslmode=verify-full` to <name>-pooler-rw failed ("server certificate for ... does not match host
  # name"). The operator-managed certificate takes extra names; after it is reissued the pooler pods must be restarted
  # to serve it (a rollout of the Pooler Deployment, once).
  - target: {kind: Cluster, labelSelector: "openaether.io/db-profile=ha"}
    patch: |-
      - op: add
        path: /spec/certificates
        value:
          serverAltDNSNames:
            - NAME-pooler-rw
            - NAME-pooler-rw.NAMESPACE
            - NAME-pooler-rw.NAMESPACE.svc
            - NAME-pooler-rw.NAMESPACE.svc.cluster.local
replacements:
  - source: {kind: ConfigMap, name: db-profile-values, fieldPath: data.namespace}
    targets:
      - select: {kind: Cluster, labelSelector: "openaether.io/db-profile=ha"}
        fieldPaths:
          - spec.certificates.serverAltDNSNames.1
          - spec.certificates.serverAltDNSNames.2
          - spec.certificates.serverAltDNSNames.3
        options: {delimiter: ".", index: 1}
  - source: {kind: ConfigMap, name: db-profile-values, fieldPath: data.name}
    targets:
      - select: {kind: Cluster, labelSelector: "openaether.io/db-profile=ha"}
        fieldPaths:
          - spec.certificates.serverAltDNSNames.0
          - spec.certificates.serverAltDNSNames.1
          - spec.certificates.serverAltDNSNames.2
          - spec.certificates.serverAltDNSNames.3
        options: {delimiter: "-", index: 0}
      - select: {kind: Pooler}
        fieldPaths:
          - metadata.name
        options: {delimiter: "-", index: 0}
      - select: {kind: Pooler}
        fieldPaths:
          - spec.cluster.name
        options: {delimiter: "-", index: 0}
      - select: {kind: Pooler}
        fieldPaths:
          - spec.template.spec.topologySpreadConstraints.0.labelSelector.matchLabels.[cnpg.io/poolerName]
        options: {delimiter: "-", index: 0}
      - select: {kind: Pooler}
        fieldPaths:
          - spec.template.spec.topologySpreadConstraints.1.labelSelector.matchLabels.[cnpg.io/poolerName]
        options: {delimiter: "-", index: 0}
      - select: {kind: PodDisruptionBudget}
        fieldPaths:
          - metadata.name
        options: {delimiter: "-", index: 0}
      - select: {kind: PodDisruptionBudget}
        fieldPaths:
          - spec.selector.matchLabels.[cnpg.io/poolerName]
        options: {delimiter: "-", index: 0}
      - select: {kind: CiliumNetworkPolicy, labelSelector: "openaether.io/db-netpol=pooler"}
        fieldPaths:
          - spec.endpointSelector.matchLabels.[cnpg.io/poolerName]
        options: {delimiter: "-", index: 0}
      - select: {kind: CiliumNetworkPolicy, labelSelector: "openaether.io/db-netpol=pooler"}
        fieldPaths:
          - spec.egress.1.toEndpoints.0.matchLabels.[cnpg.io/cluster]
        options: {delimiter: "-", index: 0}
      - select: {kind: CiliumNetworkPolicy, labelSelector: "openaether.io/db-netpol=database"}
        fieldPaths:
          - spec.ingress.4.fromEndpoints.0.matchLabels.[cnpg.io/poolerName]
        options: {delimiter: "-", index: 0}
