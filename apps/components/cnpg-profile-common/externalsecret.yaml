# The owner's password: from OpenBao through the openbao ClusterSecretStore, never a literal in git. The store only
# serves the
# namespaces listed in its conditions (check-externalsecret-namespaces.py): the application's namespace must be
# added to that
# list by the platform operator before this object can sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: NAME-credentials
  labels:
    openaether.io/managed: "true"
    openaether.io/component: database
    openaether.io/db-profile: customer
    openaether.io/db-secret: credentials
spec:
  refreshInterval: 1h
  secretStoreRef: {name: openbao, kind: ClusterSecretStore}
  target:
    name: NAME-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: OWNER
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: databases/NAME/credentials, property: password}
