# What every profile ships besides its Cluster: the owner's credentials (ExternalSecret) and the per-database
# CiliumNetworkPolicy.
# List this component first and cnpg-profile-values last (docs/database-profiles.md, "How a profile is built").
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - externalsecret.yaml
  - networkpolicy.yaml
