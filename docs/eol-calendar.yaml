# Source of docs/eol-calendar.md and of scripts/check-eol.py. One row per pinned component.
#   pin       must equal what `pattern` (group 1) reads from `file` on every check: a Renovate bump that leaves a row
#             stale fails the check, so this file cannot drift unnoticed. It is the version in the FILE, not
#             a kustomization comment (Renovate bumps those, and they have drifted from the vendored dump).
#   eol       a YYYY-MM-DD date upstream gives, `not-yet` (supported, no date published), `unsupported` (no
#             longer in the project's supported table) or `unknown` (no published schedule found, not assumed).
#   waiver    an accepted risk for a component past EOL: a reason and an expiry date.
# Snapshot of 2026-10-14. Sources: endoflife.date (api/<product>.json) and the project's own support page.
