# Behaviour tests of alert rules, run by scripts/dev/test-vmrules.sh with vmalert-tool (rules.yaml is the built
# VMRules, restricted to the groups tested here). vmalert-tool starts its clock at 2000-01-01T00:00:00Z
# (946684800), which is the "created" value of the series below. Rung: mocked/static, synthetic series only.
rule_files:
  - rules-under-test.yaml
evaluation_interval: 10m
tests:
  # kube-state-metrics emits the success time only after a first success: a CronJob that never succeeded has none.
  - name: escrow check never succeeded, CronJob older than 36 h
    interval: 10m
    input_series:
      - series: 'kube_cronjob_info{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '1+0x300'
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '946684800+0x300'
    alert_rule_test:
      - eval_time: 30h   # a new cluster: the first daily run has not happened yet
        alertname: OpenBaoEscrowNotAttested
        exp_alerts: []
      - eval_time: 40h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts:
          - exp_labels:
              {namespace: foundation-vault, cronjob: openbao-escrow-check, severity: warning, component: backup}
            exp_annotations: &escrow_annotations
              summary: "The OpenBao seal-key escrow is not attested (or the attestation is stale)"
              description: >-
                The openbao-escrow-check Job fails: no ConfigMap openbao-escrow-ack, or it is older than a year,
                or it is malformed. Losing the seal key loses every secret and every raft snapshot. Logs:
                kubectl -n foundation-vault logs job/<latest openbao-escrow-check job>.
                Procedure: the vault README, Day 0.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/apps/base/foundation/vault/README.md"
  - name: escrow check succeeded 1 h ago
    interval: 10m
    input_series:
      - series: 'kube_cronjob_info{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '1+0x300'
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '946684800+0x300'
      - series: >-
          kube_cronjob_status_last_successful_time{namespace="foundation-vault", cronjob="openbao-escrow-check"}
        values: '946828800+0x300'   # 40 h after the start
    alert_rule_test:
      - eval_time: 41h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts: []
  - name: escrow check last succeeded 40 h ago
    interval: 10m
    input_series:
      - series: 'kube_cronjob_info{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '1+0x300'
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '946684800+0x300'
      - series: >-
          kube_cronjob_status_last_successful_time{namespace="foundation-vault", cronjob="openbao-escrow-check"}
        values: '946684800+0x300'
    alert_rule_test:
      - eval_time: 40h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts:
          - exp_labels:
              {namespace: foundation-vault, cronjob: openbao-escrow-check, severity: warning, component: backup}
            exp_annotations: *escrow_annotations
  - name: no escrow CronJob at all (no vault brick)
    interval: 10m
    input_series:
      - series: 'up{job="x"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 40h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts: []

  # KyvernoMetricsAbsent is silent when Kyverno is not deployed (it is optional in scripts/pick.py).
  - name: Kyverno not deployed
    interval: 10m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="services-observability", deployment="grafana"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: KyvernoMetricsAbsent
        exp_alerts: []
  - name: Kyverno deployed and its metrics gone
    interval: 10m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="kyverno", deployment="kyverno-admission-controller"}'
        values: '3+0x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: KyvernoMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, component: kyverno}
            exp_annotations:
              summary: "No Kyverno policy result is reported: violation alerts are blind"
              description: "The kyverno CiliumNetworkPolicy must accept vmagent on :8000; kubectl get cpol."
  - name: Kyverno deployed and reporting
    interval: 10m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="kyverno", deployment="kyverno-admission-controller"}'
        values: '3+0x300'
      - series: 'kyverno_policy_results_total{policy_name="p", rule_result="pass"}'
        values: '1+1x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: KyvernoMetricsAbsent
        exp_alerts: []
  # OpenBao (observability-openbao/vmrule.yaml). The series names are the ones a real OpenBao 2.7.1 serves; the harness
  # scripts/dev/test-openbao-bootstrap.sh checks that every metric the rules read exists there.
  - name: one OpenBao pod sealed, one unsealed that still has its old series
    interval: 10m
    input_series:
      - series: 'vault_core_unsealed{namespace="foundation-vault", pod="openbao-1", cluster=""}'
        values: '0+0x300'
      # The pod that unsealed still exposes its pre-unseal series (cluster="") for the retention time: the sum hides it.
      - series: 'vault_core_unsealed{namespace="foundation-vault", pod="openbao-0", cluster=""}'
        values: '0+0x300'
      - series: 'vault_core_unsealed{namespace="foundation-vault", pod="openbao-0", cluster="vault-cluster-1"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoWorkloadSealed
        exp_alerts:
          - exp_labels: {pod: openbao-1, severity: critical, component: openbao}
            exp_annotations:
              summary: "OpenBao pod openbao-1 is sealed"
              description: >-
                It unseals itself from the static key in the Secret openbao-seal-key: check that the Secret exists and
                is mounted (kubectl -n foundation-vault describe pod openbao-1), that the key is the one the data was
                sealed with, and the pod logs.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/apps/base/foundation/vault/README.md"
  - name: OpenBao has no active node (a standby reports 0, a sealed pod reports nothing)
    interval: 10m
    input_series:
      - series: 'vault_core_active{namespace="foundation-vault", pod="openbao-0", cluster="vault-cluster-1"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoNoActiveNode
        exp_alerts:
          - exp_labels: {severity: critical, component: openbao}
            exp_annotations:
              summary: "OpenBao has no active node"
              description: >-
                No pod reports itself active (or none is scraped): no secret can be read or written and no certificate
                is issued. Look at raft first: bao operator raft list-peers from a pod that answers.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/apps/base/foundation/vault/README.md"
  - name: OpenBao with one active node
    interval: 10m
    input_series:
      - series: 'vault_core_active{namespace="foundation-vault", pod="openbao-0", cluster="vault-cluster-1"}'
        values: '1+0x300'
      - series: 'vault_core_active{namespace="foundation-vault", pod="openbao-1", cluster="vault-cluster-1"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoNoActiveNode
        exp_alerts: []
  # The audit file is read by one collector per control plane: a flat counter on one of them is silence.
  - name: audit log read on one control plane stalls
    interval: 1m
    input_series:
      - series: 'loki_source_file_read_lines_total{path="/var/log/audit/kube/kube-apiserver.log", instance="cp-a"}'
        values: '0+60x80'
      - series: 'loki_source_file_read_lines_total{path="/var/log/audit/kube/kube-apiserver.log", instance="cp-b"}'
        values: '0+60x30 1800+0x50'   # stalls after 30 min
    alert_rule_test:
      - eval_time: 20m
        alertname: K8sAuditLogSilent
        exp_alerts: []
      - eval_time: 70m
        alertname: K8sAuditLogSilent
        exp_alerts:
          - exp_labels: {instance: cp-b, severity: critical, component: logging}
            exp_annotations:
              summary: "No Kubernetes API audit line read on cp-b for 15 min"
              description: >-
                kubectl -n services-observability-audit logs ds/alloy-audit (permission denied? file missing?), then
                talosctl -n <control plane> ls /var/log/audit/kube. The audit trail is not reaching Loki.
  # A CNPG instance pod stays Completed after a node shutdown (CNPG 1.23.1); a Job's finished pod must not alert.
  - name: CNPG instance pod Succeeded, and a dump Job pod Succeeded
    interval: 1m
    input_series:
      - series: 'kube_pod_status_phase{namespace="foundation-databases", pod="zitadel-db-1", phase="Succeeded"}'
        values: '0+0x5 1+0x40'   # Succeeded from minute 6
      - series: >-
          kube_pod_owner{namespace="foundation-databases", pod="zitadel-db-1", owner_kind="Cluster"}
        values: '1+0x45'
      - series: 'kube_pod_status_phase{namespace="foundation-databases", pod="cnpg-dump-1-abc", phase="Succeeded"}'
        values: '1+0x45'
      - series: >-
          kube_pod_owner{namespace="foundation-databases", pod="cnpg-dump-1-abc", owner_kind="Job"}
        values: '1+0x45'
    alert_rule_test:
      - eval_time: 4m
        alertname: CnpgInstancePodSucceeded
        exp_alerts: []
      - eval_time: 20m
        alertname: CnpgInstancePodSucceeded
        exp_alerts:
          - exp_labels:
              {namespace: foundation-databases, pod: zitadel-db-1, phase: Succeeded, severity: critical,
               component: databases}
            exp_annotations:
              summary: "CNPG instance pod zitadel-db-1 is Completed and will not be restarted"
              description: >-
                Left by a node shutdown (reboot without drain).
                kubectl delete pod -n foundation-databases zitadel-db-1
                (the PVC stays; the operator recreates the pod). Never delete the PVC. docs/traps.md, Databases.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/traps.md"
  # An OCI HelmRepository never gets a Ready condition (ready=""): it must not alert, a failing HelmRelease must.
  - name: Flux object without a Ready condition (OCI HelmRepository) does not alert
    interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="HelmRepository", exported_namespace="capi-clusters", name="talos-ccm", ready="", suspended=""}'
        values: '1+0x60'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="HelmRelease", exported_namespace="services-observability", name="grafana", ready="False", suspended=""}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: FluxObjectNotReady
        exp_alerts:
          - exp_labels:
              {customresource_kind: HelmRelease, exported_namespace: services-observability, name: grafana,
               severity: warning, component: flux}
            exp_annotations:
              summary: "Flux HelmRelease grafana is not Ready"
              description: >-
                flux get all -A, then kubectl describe HelmRelease
                -n services-observability grafana. Objects that depend on it wait too.
  # A rejected signature is named at once (infra #337); a verified or unverified-because-off source does not alert.
  - name: Flux source with a rejected signature alerts, a verified one does not
    interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="openaether", source_verified="False"}'
        values: '1+0x30'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="other", source_verified="True"}'
        values: '1+0x30'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="unverified-off", source_verified=""}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: FluxSourceNotVerified
        exp_alerts: []
      - eval_time: 10m
        alertname: FluxSourceNotVerified
        exp_alerts:
          - exp_labels:
              {exported_namespace: flux-system, name: openaether, severity: critical, component: flux}
            exp_annotations:
              summary: "Flux rejected the commit of GitRepository openaether: unsigned or unknown signer"
              description: >-
                kubectl describe gitrepository -n flux-system openaether
                (condition SourceVerified), then git log --show-signature on the branch. Sign the push with a
                registered key or remove the unexpected commit; docs/signed-commits.md.
  # WAL archiving (#138): "failing now", not "failed once in the last half hour". The old rule (increase over 30m, for
  # 15m) was
  # pending for about 25 minutes after a drained reboot and fired on a second incident inside the window.
  - name: WAL archiving fails continuously, nothing archived
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '0+1x59'
      - series: 'cnpg_pg_stat_archiver_archived_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '10+0x59'
    alert_rule_test:
      - eval_time: 10m
        alertname: CnpgWalArchiveFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: CnpgWalArchiveFailing
        exp_alerts:
          - exp_labels: {cnpg_io_cluster: grafana-db, severity: critical, component: backup}
            exp_annotations:
              summary: "CNPG grafana-db: WAL archiving fails"
              description: >-
                barman cannot write to the object store (credentials, endpoint, egress).
                kubectl logs -n foundation-databases <primary-pod> -c postgres | grep -i archiv.
  - name: two isolated archive failures around a drain, archiving resumes
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '0x10 1 2 2x48'
      - series: 'cnpg_pg_stat_archiver_archived_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '10x12 11+1x47'
    alert_rule_test:
      - {eval_time: 14m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 20m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 30m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 45m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
  - name: two isolated archive failures, then an idle database (nothing to archive)
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '0x10 1 2 2x48'
      - series: 'cnpg_pg_stat_archiver_archived_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '10+0x59'
    alert_rule_test:
      - {eval_time: 20m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 26m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 30m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 45m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
