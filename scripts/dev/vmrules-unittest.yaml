# Behaviour tests of alert rules, run by scripts/dev/test-vmrules.sh with vmalert-tool (rules.yaml is the built
# VMRules, restricted to the groups tested here). vmalert-tool starts its clock at 2000-01-01T00:00:00Z
# (946684800), which is the "created" value of the series below. Rung: mocked/static, synthetic series only.
rule_files:
  - rules-under-test.yaml
evaluation_interval: 10m
tests:
  # kube-state-metrics emits the success time only after a first success: a CronJob that never succeeded has none.
  - name: escrow check never succeeded, CronJob older than 36 h
    interval: 10m
    input_series:
      - series: 'kube_cronjob_info{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '1+0x300'
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '946684800+0x300'
    alert_rule_test:
      - eval_time: 30h   # a new cluster: the first daily run has not happened yet
        alertname: OpenBaoEscrowNotAttested
        exp_alerts: []
      - eval_time: 40h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts:
          - exp_labels:
              {namespace: foundation-vault, cronjob: openbao-escrow-check, severity: warning, component: backup}
            exp_annotations: &escrow_annotations
              summary: "The OpenBao seal-key escrow is not attested (or the attestation is stale)"
              description: >-
                The openbao-escrow-check Job fails: no ConfigMap openbao-escrow-ack, or it is older than a year,
                or it is malformed. Losing the seal key loses every secret and every raft snapshot. Logs:
                kubectl -n foundation-vault logs job/<latest openbao-escrow-check job>.
                Procedure: the vault README, Day 0.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/apps/base/foundation/vault/README.md"
  - name: escrow check succeeded 1 h ago
    interval: 10m
    input_series:
      - series: 'kube_cronjob_info{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '1+0x300'
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '946684800+0x300'
      - series: >-
          kube_cronjob_status_last_successful_time{namespace="foundation-vault", cronjob="openbao-escrow-check"}
        values: '946828800+0x300'   # 40 h after the start
    alert_rule_test:
      - eval_time: 41h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts: []
  - name: escrow check last succeeded 40 h ago
    interval: 10m
    input_series:
      - series: 'kube_cronjob_info{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '1+0x300'
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-escrow-check"}'
        values: '946684800+0x300'
      - series: >-
          kube_cronjob_status_last_successful_time{namespace="foundation-vault", cronjob="openbao-escrow-check"}
        values: '946684800+0x300'
    alert_rule_test:
      - eval_time: 40h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts:
          - exp_labels:
              {namespace: foundation-vault, cronjob: openbao-escrow-check, severity: warning, component: backup}
            exp_annotations: *escrow_annotations
  - name: no escrow CronJob at all (no vault brick)
    interval: 10m
    input_series:
      - series: 'up{job="x"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 40h
        alertname: OpenBaoEscrowNotAttested
        exp_alerts: []

  # KyvernoMetricsAbsent is silent when Kyverno is not deployed (it is optional in scripts/pick.py).
  - name: Kyverno not deployed
    interval: 10m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="services-observability", deployment="grafana"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: KyvernoMetricsAbsent
        exp_alerts: []
  - name: Kyverno deployed and its metrics gone
    interval: 10m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="kyverno", deployment="kyverno-admission-controller"}'
        values: '3+0x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: KyvernoMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, component: kyverno}
            exp_annotations:
              summary: "No Kyverno policy result is reported: violation alerts are blind"
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#kyvernometricsabsent"
              description: "The kyverno CiliumNetworkPolicy must accept vmagent on :8000; kubectl get cpol."
  - name: Kyverno deployed and reporting
    interval: 10m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="kyverno", deployment="kyverno-admission-controller"}'
        values: '3+0x300'
      - series: 'kyverno_policy_results_total{policy_name="p", rule_result="pass"}'
        values: '1+1x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: KyvernoMetricsAbsent
        exp_alerts: []
  # OpenBao (observability-openbao/vmrule.yaml). The series names are the ones a real OpenBao 2.7.1 serves; the harness
  # scripts/dev/test-openbao-bootstrap.sh checks that every metric the rules read exists there.
  - name: one OpenBao pod sealed, one unsealed that still has its old series
    interval: 10m
    input_series:
      - series: 'vault_core_unsealed{namespace="foundation-vault", pod="openbao-1", cluster=""}'
        values: '0+0x300'
      # The pod that unsealed still exposes its pre-unseal series (cluster="") for the retention time: the sum hides it.
      - series: 'vault_core_unsealed{namespace="foundation-vault", pod="openbao-0", cluster=""}'
        values: '0+0x300'
      - series: 'vault_core_unsealed{namespace="foundation-vault", pod="openbao-0", cluster="vault-cluster-1"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoWorkloadSealed
        exp_alerts:
          - exp_labels: {pod: openbao-1, severity: critical, component: openbao}
            exp_annotations:
              summary: "OpenBao pod openbao-1 is sealed"
              description: >-
                It unseals itself from the static key in the Secret openbao-seal-key: check that the Secret exists and
                is mounted (kubectl -n foundation-vault describe pod openbao-1), that the key is the one the data was
                sealed with, and the pod logs.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/apps/base/foundation/vault/README.md"
  - name: OpenBao has no active node (a standby reports 0, a sealed pod reports nothing)
    interval: 10m
    input_series:
      - series: 'vault_core_active{namespace="foundation-vault", pod="openbao-0", cluster="vault-cluster-1"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoNoActiveNode
        exp_alerts:
          - exp_labels: {severity: critical, component: openbao}
            exp_annotations:
              summary: "OpenBao has no active node"
              description: >-
                No pod reports itself active (or none is scraped): no secret can be read or written and no certificate
                is issued. Look at raft first: bao operator raft list-peers from a pod that answers.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/apps/base/foundation/vault/README.md"
  - name: OpenBao with one active node
    interval: 10m
    input_series:
      - series: 'vault_core_active{namespace="foundation-vault", pod="openbao-0", cluster="vault-cluster-1"}'
        values: '1+0x300'
      - series: 'vault_core_active{namespace="foundation-vault", pod="openbao-1", cluster="vault-cluster-1"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoNoActiveNode
        exp_alerts: []
  # The audit file is read by one collector per control plane: a flat counter on one of them is silence.
  - name: audit log read on one control plane stalls
    interval: 1m
    input_series:
      - series: 'loki_source_file_read_lines_total{path="/var/log/audit/kube/kube-apiserver.log", instance="cp-a"}'
        values: '0+60x80'
      - series: 'loki_source_file_read_lines_total{path="/var/log/audit/kube/kube-apiserver.log", instance="cp-b"}'
        values: '0+60x30 1800+0x50'   # stalls after 30 min
    alert_rule_test:
      - eval_time: 20m
        alertname: K8sAuditLogSilent
        exp_alerts: []
      - eval_time: 70m
        alertname: K8sAuditLogSilent
        exp_alerts:
          - exp_labels: {instance: cp-b, severity: critical, component: logging}
            exp_annotations:
              summary: "No Kubernetes API audit line read on cp-b for 15 min"
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#k8sauditlogsilent"
              description: >-
                kubectl -n services-observability-audit logs ds/alloy-audit (permission denied? file missing?), then
                talosctl -n <control plane> ls /var/log/audit/kube. The audit trail is not reaching Loki.
  # A CNPG instance pod stays Completed after a node shutdown (CNPG 1.23.1); a Job's finished pod must not alert.
  - name: CNPG instance pod Succeeded, and a dump Job pod Succeeded
    interval: 1m
    input_series:
      - series: 'kube_pod_status_phase{namespace="foundation-databases", pod="zitadel-db-1", phase="Succeeded"}'
        values: '0+0x5 1+0x40'   # Succeeded from minute 6
      - series: >-
          kube_pod_owner{namespace="foundation-databases", pod="zitadel-db-1", owner_kind="Cluster"}
        values: '1+0x45'
      - series: 'kube_pod_status_phase{namespace="foundation-databases", pod="cnpg-dump-1-abc", phase="Succeeded"}'
        values: '1+0x45'
      - series: >-
          kube_pod_owner{namespace="foundation-databases", pod="cnpg-dump-1-abc", owner_kind="Job"}
        values: '1+0x45'
    alert_rule_test:
      - eval_time: 4m
        alertname: CnpgInstancePodSucceeded
        exp_alerts: []
      - eval_time: 20m
        alertname: CnpgInstancePodSucceeded
        exp_alerts:
          - exp_labels:
              {namespace: foundation-databases, pod: zitadel-db-1, phase: Succeeded, severity: critical,
               component: databases}
            exp_annotations:
              summary: "CNPG instance pod zitadel-db-1 is Completed and will not be restarted"
              description: >-
                Left by a node shutdown (reboot without drain).
                kubectl delete pod -n foundation-databases zitadel-db-1
                (the PVC stays; the operator recreates the pod). Never delete the PVC. docs/traps.md, Databases.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/traps.md"
  # An OCI HelmRepository never gets a Ready condition (ready=""): it must not alert, a failing HelmRelease must.
  - name: Flux object without a Ready condition (OCI HelmRepository) does not alert
    interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="HelmRepository", exported_namespace="capi-clusters", name="talos-ccm", ready="", suspended=""}'
        values: '1+0x60'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="HelmRelease", exported_namespace="services-observability", name="grafana", ready="False", suspended=""}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: FluxObjectNotReady
        exp_alerts:
          - exp_labels:
              {customresource_kind: HelmRelease, exported_namespace: services-observability, name: grafana,
               severity: warning, component: flux}
            exp_annotations:
              summary: "Flux HelmRelease grafana is not Ready"
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxobjectnotready"
              description: >-
                flux get all -A, then kubectl describe HelmRelease
                -n services-observability grafana. Objects that depend on it wait too.
  # alloy-audit is suspended by design (opt-in audit collector): no alert after 24 h; any other suspended object alerts.
  - name: Flux object suspended for a day alerts, the by-design suspended alloy-audit does not
    interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="HelmRelease", exported_namespace="services-observability", name="alloy-audit", ready="True", suspended="true"}'
        values: '1+0x1600'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="HelmRelease", exported_namespace="services-observability", name="grafana", ready="True", suspended="true"}'
        values: '1+0x1600'
    alert_rule_test:
      - eval_time: 25h
        alertname: FluxObjectSuspended
        exp_alerts:
          - exp_labels:
              {customresource_kind: HelmRelease, exported_namespace: services-observability, name: grafana,
               severity: warning, component: flux}
            exp_annotations:
              summary: "Flux HelmRelease grafana has been suspended for 24 h"
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxobjectsuspended"
              description: "flux resume ... when the operation is over."
  # A rejected signature is named at once (infra #337); a verified or unverified-because-off source does not alert.
  - name: Flux source with a rejected signature alerts, a verified one does not
    interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="openaether", source_verified="False"}'
        values: '1+0x30'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="other", source_verified="True"}'
        values: '1+0x30'
      # yamllint disable-line rule:line-length
      - series: 'gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="unverified-off", source_verified=""}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: FluxSourceNotVerified
        exp_alerts: []
      - eval_time: 10m
        alertname: FluxSourceNotVerified
        exp_alerts:
          - exp_labels:
              {exported_namespace: flux-system, name: openaether, severity: critical, component: flux}
            exp_annotations:
              summary: "Flux rejected the commit of GitRepository openaether: unsigned or unknown signer"
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#fluxsourcenotverified"
              description: >-
                kubectl describe gitrepository -n flux-system openaether
                (condition SourceVerified), then git log --show-signature on the branch. Sign the push with a
                registered key or remove the unexpected commit; docs/signed-commits.md.
  # WAL archiving (#138): "failing now", not "failed once in the last half hour". The old rule (increase over 30m, for
  # 15m) was
  # pending for about 25 minutes after a drained reboot and fired on a second incident inside the window.
  - name: WAL archiving fails continuously, nothing archived
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '0+1x59'
      - series: 'cnpg_pg_stat_archiver_archived_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '10+0x59'
    alert_rule_test:
      - eval_time: 10m
        alertname: CnpgWalArchiveFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: CnpgWalArchiveFailing
        exp_alerts:
          - exp_labels: {cnpg_io_cluster: grafana-db, severity: critical, component: backup}
            exp_annotations:
              summary: "CNPG grafana-db: WAL archiving fails"
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#cnpgwalarchivefailing"
              description: >-
                barman cannot write to the object store (credentials, endpoint, egress).
                kubectl logs -n foundation-databases <primary-pod> -c postgres | grep -i archiv.
  - name: two isolated archive failures around a drain, archiving resumes
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '0x10 1 2 2x48'
      - series: 'cnpg_pg_stat_archiver_archived_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '10x12 11+1x47'
    alert_rule_test:
      - {eval_time: 14m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 20m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 30m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 45m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
  - name: two isolated archive failures, then an idle database (nothing to archive)
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '0x10 1 2 2x48'
      - series: 'cnpg_pg_stat_archiver_archived_count{cnpg_io_cluster="grafana-db", pod="grafana-db-1"}'
        values: '10+0x59'
    alert_rule_test:
      - {eval_time: 20m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 26m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 30m, alertname: CnpgWalArchiveFailing, exp_alerts: []}
      - {eval_time: 45m, alertname: CnpgWalArchiveFailing, exp_alerts: []}

  # --- alert delivery (0.4.0 M1). Synthetic Alertmanager counters; the real names are UNVERIFIED until a lab. ---
  - name: delivery probe fires in its two windows only
    interval: 10m
    input_series: []
    alert_rule_test:
      - {eval_time: 5h50m, alertname: AlertDeliveryProbe, exp_alerts: []}
      - eval_time: 6h
        alertname: AlertDeliveryProbe
        exp_alerts:
          - exp_labels: {severity: none, component: alerting, probe: delivery}
            exp_annotations: &probe_annotations
              summary: "Scheduled alert delivery test"
              description: "Twice a day. Receiving it in chat proves vmalert, Alertmanager and the receiver."
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#alertdeliveryprobe"
      - {eval_time: 6h10m, alertname: AlertDeliveryProbe, exp_alerts: []}
      - {eval_time: 12h, alertname: AlertDeliveryProbe, exp_alerts: []}
      - eval_time: 18h
        alertname: AlertDeliveryProbe
        exp_alerts:
          - exp_labels: {severity: none, component: alerting, probe: delivery}
            exp_annotations: *probe_annotations
  - name: probe fired and the chat notification succeeded
    interval: 10m
    input_series:
      - series: 'ALERTS{alertname="AlertDeliveryProbe", alertstate="firing"}'
        values: '_x36 1 _x100'
      - series: 'alertmanager_notifications_total{integration="slack"}'
        values: '0+0x36 1+0x100'
    alert_rule_test:
      - {eval_time: 8h, alertname: AlertDeliveryNotAcknowledged, exp_alerts: []}
  - name: probe fired and every chat attempt failed
    interval: 10m
    input_series:
      - series: 'ALERTS{alertname="AlertDeliveryProbe", alertstate="firing"}'
        values: '_x36 1 _x100'
      - series: 'alertmanager_notifications_total{integration="slack"}'
        values: '0+0x36 3+0x100'
      - series: 'alertmanager_notifications_failed_total{integration="slack"}'
        values: '0+0x36 3+0x100'
    alert_rule_test:
      - {eval_time: 6h10m, alertname: AlertDeliveryNotAcknowledged, exp_alerts: []}   # inside the for: 20m
      - eval_time: 8h
        alertname: AlertDeliveryNotAcknowledged
        exp_alerts:
          - exp_labels: {severity: critical, component: alerting}
            exp_annotations:
              summary: "The scheduled alert delivery test was not acknowledged by the chat receiver"
              description: >-
                While this fires, Alertmanager stops the heartbeat on purpose, so the external dead-man's-switch
                pages you by its own channel.
              runbook_url: >-
                https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#alertdeliverynotacknowledged
  - name: no probe yet, no verdict (a cluster younger than its first window)
    interval: 10m
    input_series:
      - series: 'alertmanager_notifications_total{integration="slack"}'
        values: '0+0x100'
    alert_rule_test:
      - {eval_time: 5h, alertname: AlertDeliveryNotAcknowledged, exp_alerts: []}
  - name: vmalert cannot reach Alertmanager
    interval: 10m
    input_series:
      - series: 'vmalert_alerts_send_errors_total{addr="http://alertmanager:9093"}'
        values: '0+2x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: VMAlertNotifierErrors, exp_alerts: []}
      - eval_time: 1h
        alertname: VMAlertNotifierErrors
        exp_alerts:
          - exp_labels: {addr: "http://alertmanager:9093", severity: critical, component: alerting}
            exp_annotations:
              summary: "VMAlert cannot hand alerts to Alertmanager (http://alertmanager:9093)"
              description: >-
                Every alert evaluated here is lost on its way to Alertmanager. Check the Alertmanager pod, the Service
                and the vmalert egress policy.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#\
                vmalertnotifiererrors"
  - name: Alertmanager gone
    interval: 10m
    input_series:
      - series: 'up{job="other"}'
        values: '1+0x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: AlertmanagerAbsent, exp_alerts: []}
      - eval_time: 30m
        alertname: AlertmanagerAbsent
        exp_alerts:
          - exp_labels: {severity: critical, component: alerting}
            exp_annotations:
              summary: "Alertmanager is not scraped or not running: no alert can leave the cluster"
              description: >-
                The heartbeat stops with it, so an external dead-man's-switch (if configured) pages you.
              runbook_url: "https://github.com/dis-bzh/OpenAether-apps/blob/main/docs/runbooks.md#alertmanagerabsent"

  # --- RED / USE / storage (0.4.0 M1). Synthetic series only: metric names and labels are UNVERIFIED on a cluster. ---
  - name: gateway 5xx at 5 percent burns the budget fast
    interval: 1m
    input_series:
      - series: 'istio_requests_total{namespace="services-gateway", response_code="200"}'
        values: '0+95x400'
      - series: 'istio_requests_total{namespace="services-gateway", response_code="503"}'
        values: '0+5x400'
    alert_rule_test:
      - eval_time: 90m
        alertname: GatewayErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: critical, component: gateway}
  - name: gateway 5xx at 0.05 percent is inside the budget
    interval: 1m
    input_series:
      - series: 'istio_requests_total{namespace="services-gateway", response_code="200"}'
        values: '0+1999x400'
      - series: 'istio_requests_total{namespace="services-gateway", response_code="503"}'
        values: '0+1x400'
    alert_rule_test:
      - {eval_time: 90m, alertname: GatewayErrorBudgetBurnFast, exp_alerts: []}
      - {eval_time: 7h, alertname: GatewayErrorBudgetBurnSlow, exp_alerts: []}
  - name: all errors but almost no traffic does not page
    interval: 1m
    input_series:
      - series: 'istio_requests_total{namespace="services-gateway", response_code="503"}'
        values: '0+1x400'
    alert_rule_test:
      - {eval_time: 90m, alertname: GatewayErrorBudgetBurnFast, exp_alerts: []}
  - name: gateway p99 above two seconds
    interval: 1m
    input_series:
      - series: 'istio_request_duration_milliseconds_bucket{namespace="services-gateway", le="100"}'
        values: '0+0x60'
      - series: 'istio_request_duration_milliseconds_bucket{namespace="services-gateway", le="5000"}'
        values: '0+600x60'
      - series: 'istio_request_duration_milliseconds_bucket{namespace="services-gateway", le="+Inf"}'
        values: '0+600x60'
      - series: 'istio_requests_total{namespace="services-gateway", response_code="200"}'
        values: '0+600x60'
    alert_rule_test:
      - {eval_time: 5m, alertname: GatewayLatencyP99High, exp_alerts: []}
      - eval_time: 30m
        alertname: GatewayLatencyP99High
        exp_alerts:
          - exp_labels: {severity: warning, component: gateway}
  - name: an OOM kill needs a recent restart, not only a remembered reason
    interval: 1m
    input_series:
      - series: >-
          kube_pod_container_status_last_terminated_reason{namespace="a", pod="p", container="c", reason="OOMKilled"}
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="a", pod="p", container="c"}'
        values: '3x30 4x30'
      - series: >-
          kube_pod_container_status_last_terminated_reason{namespace="a", pod="old", container="c", reason="OOMKilled"}
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="a", pod="old", container="c"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels: {namespace: a, pod: p, container: c, severity: warning, component: workload}
  - name: node IO pressure sustained
    interval: 1m
    input_series:
      - series: 'node_pressure_io_stalled_seconds_total{instance="n1"}'
        values: '0+30x60'
      - series: 'node_pressure_io_stalled_seconds_total{instance="n2"}'
        values: '0+3x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeIoPressure
        exp_alerts:
          - exp_labels: {instance: n1, severity: warning, component: node}
  - name: Longhorn degraded for 30 minutes
    interval: 1m
    input_series:
      - series: 'longhorn_volume_robustness{volume="v1", node="n1"}'
        values: '1x10 2x80'
      - series: 'longhorn_volume_robustness{volume="v2", node="n1"}'
        values: '1x90'
    alert_rule_test:
      - {eval_time: 25m, alertname: LonghornVolumeDegraded, exp_alerts: []}
      - eval_time: 60m
        alertname: LonghornVolumeDegraded
        exp_alerts:
          - exp_labels: {volume: v1, severity: warning, component: storage}
  - name: Longhorn blind rule only where Longhorn is installed
    interval: 1m
    input_series:
      - series: 'kube_storageclass_info{storageclass="longhorn", provisioner="driver.longhorn.io"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 45m
        alertname: LonghornMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, component: storage}
  - name: no Longhorn, no blind alert
    interval: 1m
    input_series:
      - series: 'kube_storageclass_info{storageclass="local-path", provisioner="rancher.io/local-path"}'
        values: '1x90'
    alert_rule_test:
      - {eval_time: 45m, alertname: LonghornMetricsAbsent, exp_alerts: []}

  # --- backup signals and CNPG health (0.4.0 M1). Synthetic series. RestoreTestNotSucceeding has no case: it shares the
  # expression of BackupNotSucceededRecently (other selector, 37 d) and a 40 d timeline makes vmalert-tool crawl. ---
  - name: backup succeeded 10 hours ago
    interval: 10m
    input_series:
      - series: 'kube_cronjob_created{namespace="foundation-vault", cronjob="openbao-snapshot"}'
        values: '946684800+0x400'
      - series: 'kube_cronjob_status_last_successful_time{namespace="foundation-vault", cronjob="openbao-snapshot"}'
        values: '946684800+0x400'
    alert_rule_test:
      - {eval_time: 10h, alertname: BackupNotSucceededRecently, exp_alerts: []}
      - eval_time: 40h   # the same timestamp is now 40 h old: the schedule alone would not have said so
        alertname: BackupNotSucceededRecently
        exp_alerts:
          - exp_labels: {namespace: foundation-vault, cronjob: openbao-snapshot, severity: critical, component: backup}
  - name: backup never succeeded since the CronJob was created
    interval: 10m
    input_series:
      - series: 'kube_cronjob_created{namespace="foundation-databases", cronjob="cnpg-dump"}'
        values: '946684800+0x400'
    alert_rule_test:
      - {eval_time: 20h, alertname: BackupNotSucceededRecently, exp_alerts: []}   # a new cluster, first run not due yet
      - eval_time: 40h
        alertname: BackupNotSucceededRecently
        exp_alerts:
          - exp_labels: {namespace: foundation-databases, cronjob: cnpg-dump, severity: critical, component: backup}
  - name: verifier contract is silent without a verifier and loud with a failed one
    interval: 10m
    input_series:
      - series: 'oa_backup_verify_ok{dataset="cnpg"}'
        values: '1x10 0x300'
      - series: 'oa_backup_verify_last_success_timestamp_seconds{dataset="cnpg"}'
        values: '946684800+0x310'
    alert_rule_test:
      - {eval_time: 1h, alertname: BackupVerificationFailed, exp_alerts: []}
      - eval_time: 5h
        alertname: BackupVerificationFailed
        exp_alerts:
          - exp_labels: {dataset: cnpg, severity: critical, component: backup}
      - eval_time: 40h
        alertname: BackupVerificationStale
        exp_alerts:
          - exp_labels: {dataset: cnpg, severity: warning, component: backup}
  - name: CNPG replica lag and a replica that stopped streaming
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_lag{cnpg_io_cluster="db", pod="db-2"}'
        values: '0+10x60'
      - series: 'cnpg_pg_replication_lag{cnpg_io_cluster="db", pod="db-1"}'
        values: '0x60'
      - series: 'cnpg_pg_replication_in_recovery{cnpg_io_cluster="db", pod="db-2"}'
        values: '1x60'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{cnpg_io_cluster="db", pod="db-2"}'
        values: '1x20 0x40'
      - series: 'cnpg_pg_replication_in_recovery{cnpg_io_cluster="db", pod="db-1"}'
        values: '0x60'
      - series: 'cnpg_pg_replication_is_wal_receiver_up{cnpg_io_cluster="db", pod="db-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: CnpgReplicationLagHigh
        exp_alerts:
          - exp_labels: {cnpg_io_cluster: db, pod: db-2, severity: warning, component: database}
      - eval_time: 40m
        alertname: CnpgReplicaNotStreaming
        exp_alerts:
          - exp_labels: {cnpg_io_cluster: db, pod: db-2, severity: warning, component: database}
  - name: Loki compactor stopped applying retention
    interval: 10m
    input_series:
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds{pod="loki-0"}'
        values: '946684800+600x6 _x300'   # advances for an hour, then the series stops moving (stale)
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds{pod="loki-1"}'
        values: '946684800+0x300'
    alert_rule_test:
      - {eval_time: 1h, alertname: LokiRetentionNotSwept, exp_alerts: []}
      - eval_time: 4h
        alertname: LokiRetentionNotSwept
        exp_alerts:
          - exp_labels: {severity: warning, component: logging}
