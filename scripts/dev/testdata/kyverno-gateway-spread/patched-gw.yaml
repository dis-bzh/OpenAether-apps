apiVersion: v1
kind: Pod
metadata:
  name: gw-abc
  namespace: services-gateway
  labels:
    gateway.networking.k8s.io/gateway-name: openaether-gateway
spec:
  containers:
    - name: istio-proxy
      image: example/proxy:1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: openaether-gateway
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: openaether-gateway
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: openaether-gateway
