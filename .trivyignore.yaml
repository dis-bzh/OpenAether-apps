# Accepted `trivy config` findings on the rendered DAG (HIGH, CRITICAL), the baseline of the manifest-scan job.
# Every entry is a vendored upstream dump or a false positive, with the reason in `statement`. A NEW finding on any
# other brick, or a new rule on a listed brick, fails the job. A rule listed for a brick masks a second finding of
# the same rule in the same brick: read the job's table when a dump is re-vendored.
misconfigurations:
  - id: KSV-0014
    paths:
      - apps__base__orc.yaml
      - apps__base__platform__local-path-provisioner.yaml
    statement: "vendored upstream dump: its container posture is upstream's, replaced on re-vendoring"
  # 0.4.0 bricks. Each one is ours, so the reason is ours and is checked by a person when the brick changes.
  - id: KSV-0014
    paths:
      - apps__base__observability__vm-customresources.yaml
    statement: >-
      false positive: the securityContext (read-only root filesystem, no privilege escalation, drop ALL) is
      set once on the VMAgent/VMAlert spec and the operator copies it onto every container, config-reloader
      and config-init included; the Kyverno policies read it at container level (apps #47) and pass on it.
      The named entries only add resources, and Trivy does not know that the operator copies the block
  - id: KSV-0053
    paths:
      - apps__base__backup__databases.yaml
    statement: >-
      the restore test execs psql in a RESTORED scratch cluster: a namespaced Role in backup-restore-test (a
      namespace that holds no application data), verb create only, bound to the test ServiceAccount;
      scripts/dev/test-restore-test-brick.py pins the rights
  - id: KSV-0109
    paths:
      - apps__base__backup__databases.yaml
    statement: >-
      false positive: the scripts name RESTIC_REPOSITORY and PGHOST (an address and a host name); the keys and
      passwords come from Secrets mounted at run time, none is in the ConfigMap
  - id: KSV-0041
    paths:
      - apps__base__cnpg.yaml
      - apps__base__external-secrets.yaml
      - apps__base__kyverno.yaml
      - apps__base__orc.yaml
    statement: "the operator manages Secrets by design; the RBAC is the upstream release, not ours to trim"
  - id: KSV-0046
    paths:
      - apps__base__kyverno.yaml
    statement: "the operator needs these verbs on its own CRDs and cluster resources; upstream release"
  - id: KSV-0053
    paths:
      - apps__base__cnpg.yaml
    statement: "CNPG execs into Postgres pods for failover and backups; upstream release"
  - id: KSV-0056
    paths:
      - apps__base__cnpg.yaml
      - apps__base__kyverno.yaml
      - apps__base__orc.yaml
    statement: "the operator manages Services and Ingress objects; upstream release"
  - id: KSV-0109
    paths:
      - apps__base__foundation__vault.yaml
    statement: "false positive: the scripts mention the word secret, no value is in the ConfigMap"
  - id: KSV-0114
    paths:
      - apps__base__cnpg.yaml
      - apps__base__external-secrets.yaml
      - apps__base__kyverno.yaml
    statement: "webhook configurations are edited by the operator itself (cert rotation); upstream release"
  - id: KSV-0118
    paths:
      - apps__base__external-secrets.yaml
      - apps__base__kyverno.yaml
      - apps__base__platform__local-path-provisioner.yaml
    statement: "a vendored upstream dump with the default security context; re-vendored on upgrade"
