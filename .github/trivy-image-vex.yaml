# Written for the weekly image scan (sbom.yml) when .vex/openaether-apps.openvex.json holds at least one
# statement: Trivy then drops the findings that file declares not_affected or fixed. Kept as a file so the
# workflow and a local `trivy image --config .github/trivy-image-vex.yaml <ref>` read the same thing.
# The ignore file carries the few accepted findings Trivy's VEX matching misses, with a native expiry date.
vulnerability:
  vex:
    - .vex/openaether-apps.openvex.json
ignorefile: .github/trivy-ignore.yaml
