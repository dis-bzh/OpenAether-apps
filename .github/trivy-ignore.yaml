# Findings the image scan (sbom.yml) accepts for a while, in Trivy's own ignore format, which ENFORCES `expired_at`
# (an expired entry is simply no longer ignored, and the scan goes red again). Used only where an OpenVEX statement
# cannot do the job: Trivy 0.69 does not match the product of the Longhorn UI and manager images (the share-manager
# one matches), whatever the purl form. Everything else is in .vex/openaether-apps.openvex.json.
# scripts/check-vex.py requires a statement and a date on every entry. Not a fix: see the CHANGELOG.
vulnerabilities:
  # libexpat in the SLES base image of the Longhorn v1.12.1 images: all six (manager, ui, share-manager, engine,
  # instance-manager, backing-image-manager) carry 2.7.1-150700.3.12.1, read 2026-11-04. The image scan (sbom.yml) saw
  # only three of them (manager, ui, share-manager) until apps #210: gen-sbom.py now also reads the images the chart
  # passes as arguments and env values. Wait for Longhorn v1.12.2
  # (only rc3 on 2026-11-04) and rescan; no jump to 1.13.0 for this (docs/patching.md).
  - id: SUSE-SU-2026:4619-1
    purls:
      - "pkg:rpm/suse/libexpat1@2.7.1-150700.3.12.1"
    expired_at: 2026-12-04
    statement: >-
      libexpat1 2.7.1-150700.3.12.1 is present in all six v1.12.1 images; fixed in 2.8.5-150700.3.15.1, not yet in a
      Longhorn image. Re-read 2026-11-04 on package data and file searches (the RPM requirements on the libexpat
      soname, and a search of each image for files that name it). No Longhorn process was run or traced; `wget --help`
      and `ldd` were run in the backing-image-manager image. The packages that require it are dbus, python,
      fontconfig, cmake, thin-provisioning-tools and, in backing-image-manager, libmetalink3. No Longhorn binary is
      among them. No package requires libmetalink3, and the only file in backing-image-manager that links it is
      /usr/bin/wget (wget 1.24.5), a tool that fetches from the network and has an XML parser behind it (Metalink;
      `wget --help` lists the options that use it); python3 with its XML module is another one in the image. The
      backing-image-manager binary was checked by `strings -a` only: it holds no `wget` string of its own (the one
      case-sensitive match is the junction of two adjacent Go strings, "...%w" and "get credentials: %v"), and it links
      os/exec (158 lines of the output name it), so strings cannot exclude a command built at run time. That does not
      show that wget or the other tools never run in the images or never read XML from outside.
