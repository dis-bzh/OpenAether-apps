# Findings the image scan (sbom.yml) accepts for a while, in Trivy's own ignore format, which ENFORCES `expired_at`
# (an expired entry is simply no longer ignored, and the scan goes red again). Used only where an OpenVEX statement
# cannot do the job: Trivy 0.69 does not match the product of the Longhorn UI and manager images (the share-manager
# one matches), whatever the purl form. Everything else is in .vex/openaether-apps.openvex.json.
# scripts/check-vex.py requires a statement and a date on every entry. Not a fix: see the CHANGELOG.
vulnerabilities:
  # libexpat in the SLES base image of the Longhorn v1.12.1 images: all six (manager, ui, share-manager, engine,
  # instance-manager, backing-image-manager) carry 2.7.1-150700.3.12.1, read 2026-11-04. The image scan (sbom.yml) sees
  # only three of them, the ones the chart renders as `image:` (manager, ui, share-manager). Wait for Longhorn v1.12.2
  # (only rc3 on 2026-11-04) and rescan; no jump to 1.13.0 for this (docs/patching.md).
  - id: SUSE-SU-2026:4619-1
    purls:
      - "pkg:rpm/suse/libexpat1@2.7.1-150700.3.12.1"
    expired_at: 2026-12-04
    statement: >-
      libexpat1 2.7.1-150700.3.12.1 is present in all six v1.12.1 images; fixed in 2.8.5-150700.3.15.1, not yet in a
      Longhorn image. Re-read 2026-11-04 on package data only (the RPM requirements on the libexpat soname and a
      search of each image for files that name it; nothing was run or traced): they are dbus, python, fontconfig, cmake,
      thin-provisioning-tools and libmetalink, and no Longhorn binary is among them. That does not show that
      those tools never run in the images or never read XML from outside.
