# Weekly and on every pushed release tag: an inventory of what the DAG deploys (CycloneDX 1.5,
# scripts/dev/gen-sbom.py: Helm charts and every image, including the ones the charts render) and a Trivy scan of
# those images (ANSSI SBOM25-1/-2/-3, SSDLC CICD-AIP-01b, CONT-REC05).
# The inventory is attached to the release as openaether-apps-<tag>.cdx.json, to a DRAFT release: immutable releases
# (on since 2026-10) refuse every upload once a release is published, so the asset has to be there BEFORE the publish
# (infra #395: 0.3.2, 0.4.0 and 0.4.1 went out without it). Order: push the signed tag, this workflow creates the draft
# (or reuses yours) and attaches the file, the owner edits the notes and publishes (the release skill). On the
# publish event the same workflow only checks that the asset is there. A CRITICAL finding with a fix
# upstream fails the scan job; an accepted one is recorded in .vex/openaether-apps.openvex.json (docs/supply-chain.md),
# with a reason and an expiry date that scripts/check-vex.py enforces (Trivy itself ignores dates).
# A failing scan opens (or comments on) ONE issue per image, `[vuln] <image>`, and closes it when the scan passes: a red
# run alone went unseen for days. Only a scan that ran and wrote a report does that: a scan that did not run (the pull
# was refused or rate limited, #197) fails the job and opens nothing. Not from a workflow_dispatch on a branch: a test
# run opens no issue.
# Never on a pull request, so it joins no required check; no cloud credential, only registry reads (anonymous, and the
# workflow token for ghcr.io).
name: SBOM

on:
  schedule:
    # Off the hour: a shared runner pool is busiest at :00.
    - cron: "41 5 * * 2"
  push:
    tags: ["[0-9]*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag whose DRAFT release gets the inventory (empty: a plain run on the branch)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory
    if: github.repository == 'dis-bzh/OpenAether-apps' && github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: Install kubectl (pinned + checksum-verified)
        env:
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: "v1.37.1"
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          expected="$(curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")"
          echo "${expected}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Install PyYAML
        run: pip install -r scripts/ci-requirements.txt

      - name: Render every DAG path
        run: python3 scripts/dev/render-dag.py "$RUNNER_TEMP/rendered"

      # helm is on the runner image. A chart that does not render fails the run: an inventory that silently
      # drops a chart's images is the defect this exists to avoid.
      - name: Generate the CycloneDX inventory
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -I scripts/dev/gen-sbom.py --rendered "$RUNNER_TEMP/rendered" --helm \
            --version "$REF_NAME" --output sbom.cdx.json

      - name: Keep it as a run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: List the images to scan
        id: images
        run: |
          set -euo pipefail
          list="$(jq -c '[.components[] | select(.type == "container")
            | if .hashes then .name + "@sha256:" + .hashes[0].content
              elif .version == "unversioned" then .name else .name + ":" + .version end] | unique' sbom.cdx.json)"
          [ "$(jq length <<<"$list")" -gt 10 ] || { echo "::error::too few images: the extractor is broken"; exit 1; }
          echo "images=${list}" >>"$GITHUB_OUTPUT"

  # Trivy cannot tell that a waiver has run out. Same issue mechanism as the scans, key `VEX statements`.
  vex:
    name: VEX statements
    if: github.repository == 'dis-bzh/OpenAether-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write  # open, comment on or close the one `[vuln] VEX statements` issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # false for a workflow_dispatch on a branch other than the default
      REPORT_ISSUES: >-
        ${{ github.event_name != 'workflow_dispatch' ||
        github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install -r scripts/ci-requirements.txt

      - name: Every statement has a reason and a date that is not past
        id: check
        run: |
          set +e
          # 2>&1: a file check-vex.py cannot read (exit 2) says why on stderr; without it the report would be empty
          python3 -I scripts/check-vex.py 2>&1 | tee vex-report.txt
          echo "rc=${PIPESTATUS[0]}" >>"$GITHUB_OUTPUT"

      - name: Open or update the issue when a statement is wrong or expired
        if: steps.check.outputs.rc != '0' && env.REPORT_ISSUES == 'true'
        run: scripts/ops/vuln-issue.sh open "VEX statements" vex-report.txt "$RUN_URL"

      - name: Close the issue when all statements are valid
        if: steps.check.outputs.rc == '0' && env.REPORT_ISSUES == 'true'
        run: scripts/ops/vuln-issue.sh close "VEX statements" "$RUN_URL"

      - name: Fail the run when a statement is wrong or expired
        if: steps.check.outputs.rc != '0'
        run: exit 1

  release-asset:
    name: Attach to a draft release
    needs: inventory
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the DRAFT release when there is none, upload one asset to it, nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sbom

      - name: Upload to the draft, named by the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="openaether-apps-${TAG}.cdx.json"
          mv sbom.cdx.json "$file"
          # The by-tag endpoint does not return drafts: list the releases (drafts included) and pick the tag.
          releases="$(gh api "repos/${REPO}/releases" --paginate)"
          # shellcheck disable=SC2016  # $t is a jq variable, not a shell one
          pick='[.[] | select(.tag_name == $t) | .draft | tostring] | first // "none"'
          state="$(jq -r --arg t "$TAG" "$pick" <<<"$releases")"
          case "$state" in
            none)
              gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" \
                --notes "Draft by the SBOM workflow. Write the notes, then: gh release edit $TAG --draft=false"
              ;;
            true) ;;
            false)
              msg="the release of ${TAG} is already published, and an immutable release takes no more assets."
              msg="$msg The SBOM goes on a DRAFT: create the release with --draft (or let this workflow create it)"
              echo "::error::$msg before publishing (the release skill)."
              exit 1
              ;;
            *) echo "::error::unexpected isDraft value: $state"; exit 1 ;;
          esac
          gh release upload "$TAG" "$file" --clobber --repo "$REPO"

  release-has-asset:
    name: The published release carries the SBOM
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          want="openaether-apps-${TAG}.cdx.json"
          have="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | join(" ")')"
          case " $have " in
            *" $want "*) echo "ok: $want is attached" ;;
            *)
              msg="the published release $TAG has no $want (assets: ${have:-none}); an immutable release takes no more."
              msg="$msg Rebuild it from the tag (see the inventory step of this workflow)."
              echo "::error::$msg"
              exit 1
              ;;
          esac

  # Not on the publish event: `inventory` is skipped there, and a matrix built from the output of a skipped job is
  # not left to chance (the run started by the publish must not turn red on its own matrix).
  scan-images:
    name: Scan ${{ matrix.image }}
    needs: inventory
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write  # open, comment on or close the `[vuln] <image>` issue, nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # false for a workflow_dispatch on a branch other than the default
      REPORT_ISSUES: >-
        ${{ github.event_name != 'workflow_dispatch' ||
        github.ref_name == github.event.repository.default_branch }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # An empty VEX file makes Trivy's job harder, not easier: hand it over only once it says something.
      - name: Apply the VEX file if it has statements
        id: vex
        run: |
          if jq -e '.statements | length > 0' .vex/openaether-apps.openvex.json >/dev/null; then
            echo "config=.github/trivy-image-vex.yaml" >>"$GITHUB_OUTPUT"
          else
            echo "config=" >>"$GITHUB_OUTPUT"
          fi

      # An anonymous pull from ghcr.io was refused with TOOMANYREQUESTS on the 0.4.2 tag run (#197). Trivy reads the
      # credentials per registry from ~/.docker/config.json, so only ghcr.io gets the token. It MAY lift the limit: not
      # shown yet, and the limit is reported per runner address. The images are public, so no `packages` scope is asked
      # for; if a pull is ever refused after this login, that is the first thing to read.
      - name: Log in to ghcr.io
        if: startsWith(matrix.image, 'ghcr.io/')
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Trivy image scan (CRITICAL with a fix upstream)
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          trivy-config: ${{ steps.vex.outputs.config }}
          output: trivy-report.txt

      - name: Show the report
        if: always()
        run: cat trivy-report.txt 2>/dev/null || echo "no report (the scan did not start)"

      # Exit 1 is both "findings" and "Trivy stopped before it scanned": only a report on disk tells them apart.
      - name: Tell a finding from a scan that did not run
        id: report
        if: always() && steps.trivy.outcome == 'failure'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -s trivy-report.txt ]; then
            echo "report present, the scan ran: a finding of ${IMAGE}"
            echo "complete=true" >>"$GITHUB_OUTPUT"
          else
            msg="Trivy wrote no report for ${IMAGE}: the scan did not run (pull refused or rate limited, DB download)."
            msg="$msg A failed run, not a finding: no [vuln] issue is opened. Read the Trivy step, then re-run the job."
            echo "::error::$msg"
            exit 1
          fi

      - name: Open or update the issue for this image
        if: failure() && steps.report.outputs.complete == 'true' && env.REPORT_ISSUES == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/ops/vuln-issue.sh open "$IMAGE" trivy-report.txt "$RUN_URL"

      - name: Close the issue of this image when the scan passes
        if: steps.trivy.outcome == 'success' && env.REPORT_ISSUES == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/ops/vuln-issue.sh close "$IMAGE" "$RUN_URL"
