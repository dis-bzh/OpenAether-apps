name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          # gitleaks/gitleaks-action requires a paid license for org-owned
          # repos since its v2 (dis-bzh is an org) — the CLI itself stays
          # fully open source, so we run it directly instead of the Action.
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${asset}" "${base}/${asset}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${asset}$" > checksums.txt
          sha256sum -c checksums.txt
          tar xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git -v --redact

  # gitleaks reads what the pipeline carries; this reads the pipeline itself —
  # unpinned actions, dangerous triggers, a checkout of a fork's HEAD under
  # pull_request_target, over-broad permissions, weakened security jobs.
  # Same job in OpenAether-infra/.github/workflows/security.yml, and the reason
  # to keep both honest is the same: these manifests reach real clusters.
  pipeline-audit:
    name: CI/CD Pipeline Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Deliberately no .plumber.yaml. A config file REPLACES the built-in
      # policy instead of extending it: a minimal one, measured before wiring
      # this, left 22 of the 23 controls "skipped" while the run still read as
      # normal. The policy stays the shipped default; the step below asserts it.
      #
      # branchMustBeProtected reads repository settings over the API — something
      # no pull request can change, and that the default token cannot read (the
      # run then exits 3, "incomplete data", and withholds its verdict). This
      # gate is about what a pull request CAN break: the workflow files.
      - name: Plumber
        uses: getplumber/plumber@e81ed4965fd92e0d2b63e95d399ed0419f5de2fa  # v0.4.36
        with:
          skip-controls: branchMustBeProtected
          # Publishing the score sends this repository's name to a hosted badge
          # service. That is a decision to take on purpose, not a CI default.
          score-push: false
          upload-sarif: ${{ github.event_name == 'push' }}
          upload-artifacts: false

      # A scanner that quietly stops scanning is the failure mode these
      # repositories keep meeting. Two controls stand down by design; a third
      # would mean the policy moved under us.
      - name: The audit still audits
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys

          try:
              report = json.load(open("plumber-report.json"))
          except OSError:
              sys.exit("::error::no plumber-report.json — the analysis never ran")

          controls = {k: v for k, v in report.items()
                      if k.endswith("Result") and isinstance(v, dict)}
          skipped = sorted(k for k, v in controls.items() if v.get("status") == "skipped")
          ran = [k for k, v in controls.items() if v.get("status") not in (None, "skipped")]
          expected = ["branchProtectionResult", "requiredActionsResult"]

          if report.get("dataCollectionDegraded") or skipped != expected:
              sys.exit(f"::error::{len(ran)} controls evaluated, skipped={skipped} "
                       f"(expected {expected}), "
                       f"degraded={report.get('dataCollectionDegraded')}")
          print(f"{len(ran)} controls evaluated, {len(skipped)} stood down as declared")
          PY
