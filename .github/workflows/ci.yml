name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All jobs here are read-only validation — always safe to cancel a superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint -c .yamllint apps/ scripts/ .github/workflows/

      - name: Validate Renovate config
        run: npx --yes -p renovate -- renovate-config-validator renovate.json5

      # English is canonical here too, and a French comment in a manifest reaches
      # a user's cluster. .languageignore lists what is French on purpose.
      - name: Language
        run: ./scripts/dev/check-language.sh

  dag:
    name: Flux DAG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install PyYAML
        run: pip install pyyaml

      - name: "pick.py --validate (DAG health: unknown deps, cycles, dead paths)"
        run: python3 scripts/pick.py --validate

      - name: pick.py --check (generated profiles up to date with the DAG)
        run: python3 scripts/pick.py --check

  build:
    name: Kustomize Build + Collision Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install kubectl (pinned + checksum-verified)
        env:
          # Kept at the same version as OpenAether-infra's kubernetes_version
          # so the client/server skew stays inside what upstream supports.
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: "v1.36.3"
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          expected="$(curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")"
          echo "${expected}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Cross-brick object collision check (builds every DAG path with kubectl kustomize)
        run: python3 scripts/check-object-collisions.py

      # The openbao ClusterSecretStore only serves the namespaces it lists; an
      # ExternalSecret rendered anywhere else would stay NotReady on a cluster.
      - name: External Secrets objects stay in the store's namespaces
        run: |
          set -euo pipefail
          python3 scripts/dev/test-check-externalsecret-namespaces.py
          python3 scripts/check-externalsecret-namespaces.py

  backup-checks:
    name: Backup brick checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install PyYAML
        run: pip install pyyaml

      # pg_dump cannot dump a server newer than itself: a Cluster bump that leaves
      # the backup client image behind silently stops the daily dumps.
      - name: Postgres client majors vs Cluster majors
        run: ./scripts/dev/check-pg-dump-version.sh

      # The restore-test scripts accept an intact dump / raft snapshot and reject a
      # damaged one (docker is on the runner image; the pg part pulls the CNPG image).
      - name: Test the restore-test checks
        run: |
          set -euo pipefail
          REQUIRE_PG_RESTORE=1 ./scripts/dev/test-backup-checks.sh | tee backup-checks.out
          grep -qE '^[0-9]+ passed, 0 failed$' backup-checks.out
          # The pg_restore tests are the main check: a skipped part must not pass.
          ! grep -q 'SKIPPED' backup-checks.out

  loki-render:
    name: Loki chart render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install PyYAML
        run: pip install pyyaml

      # The shipped values through the pinned chart: compactor, retention, PDB, no canary, S3 scheme, region, and
      # the Loki network policy (DNS proxy rule, ring ports, S3 FQDNs).
      # helm and kubectl are on the runner image. The script exits 2 when one is missing.
      - name: Test the Loki values
        run: |
          set -euo pipefail
          ./scripts/dev/test-loki-render.sh | tee loki-render.out
          grep -qE '^0 failed$' loki-render.out

  observability-rbac:
    name: Observability RBAC (least privilege)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install PyYAML
        run: pip install pyyaml

      # The pinned charts with the shipped values plus the kustomize build: no role of these service
      # accounts reads Secrets or nodes/proxy, and every binding points at a role that exists.
      - name: Test the observability roles
        run: |
          set -euo pipefail
          ./scripts/dev/test-observability-rbac.sh | tee observability-rbac.out
          grep -qE '^0 failed$' observability-rbac.out

  vmrules:
    name: VMRules (vmalert dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install PyYAML
        run: pip install pyyaml

      # Every VMRule through the real vmalert (pinned release, sha256 checked): a typo in an expression is
      # otherwise found when the rule fails to load on the cluster. Metric existence needs a cluster.
      - name: Test the alert rules
        run: |
          set -euo pipefail
          ./scripts/dev/test-vmrules.sh | tee vmrules.out
          grep -qE '^0 failed$' vmrules.out

  openbao-bootstrap:
    name: OpenBao bootstrap (real OpenBao)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The real entrypoint, init.sh and configure.sh against an OpenBao container (root revoked, nothing secret in any
      # output, policies enforced, break-glass, snapshot restore, key rotation). A skip is not a pass: the script exits
      # 0 when Docker or gpg is missing, so the step demands the tools and the "0 failed" line.
      - name: Test the bootstrap
        run: |
          set -euo pipefail
          command -v docker gpg jq openssl curl
          rc=0; ./scripts/dev/test-openbao-bootstrap.sh > bootstrap-test.out 2>&1 || rc=$?
          cat bootstrap-test.out
          [ "$rc" -eq 0 ] && grep -qE '^[0-9]+ passed, 0 failed$' bootstrap-test.out
